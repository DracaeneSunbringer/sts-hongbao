      else if (mv === 2) monsterAttackPlayer(state, bt, m, 6, 2, rng);
      else if (mv === 3) monsterAttackPlayer(state, bt, m, 10, 1, rng);
      break;
    case "Byrd":
      if (mv === 1) monsterAttackPlayer(state, bt, m, 1, 5, rng);
      else if (mv === 3) monsterAttackPlayer(state, bt, m, 12, 1, rng);
      else if (mv === 6) applyMonsterPower(state, bt, m, "Strength", 1);
      else if (mv === 5) monsterAttackPlayer(state, bt, m, 3, 1, rng);
      break;
    case "SnakePlant":
      if (mv === 1) monsterAttackPlayer(state, bt, m, 7, 3, rng);
      else { applyPlayerPower(state, bt, "Frail", 2); applyPlayerPower(state, bt, "Weak", 2); }
      break;
    case "Snecko":
      if (mv === 1) applyPlayerPower(state, bt, "Confusion", 1);
      else if (mv === 2) monsterAttackPlayer(state, bt, m, 15, 1, rng);
      else { monsterAttackPlayer(state, bt, m, 8, 1, rng); applyPlayerPower(state, bt, "Vulnerable", 2); }
      break;
    case "Centurion":
      if (mv === 1) monsterAttackPlayer(state, bt, m, 12, 1, rng);
      else if (mv === 2) {
        const others = bt.m.filter(x => x !== m && x.hp > 0);
        const t = rng.pick(others) || m;
        t.b += 15;
      } else monsterAttackPlayer(state, bt, m, 6, 3, rng);
      break;
    case "Healer":
      if (mv === 1) { monsterAttackPlayer(state, bt, m, 8, 1, rng); applyPlayerPower(state, bt, "Frail", 2); }
      else if (mv === 2) {
        for (const a of bt.m) { if (a.hp > 0) a.hp = Math.min(a.mhp, a.hp + 16); }
      } else {
        for (const a of bt.m) { if (a.hp > 0) applyMonsterPower(state, bt, a, "Strength", 2); }
      }
      break;
    case "GremlinLeader":
      if (mv === 2) {
        const gPool = ["GremlinWarrior", "GremlinThief", "GremlinFat", "GremlinTsundere", "GremlinWizard"];
        let aliveMinions = bt.m.filter(x => x !== m && x.hp > 0).length;
        for (let i = 0; i < 2 && aliveMinions < 3; i++) {
          const gm = makeMonster(rng.pick(gPool), rng, state, { minion: true });
          rollMonsterMove(gm, bt, state, rng);
          bt.m.unshift(gm);
          aliveMinions++;
        }
      } else if (mv === 3) {
        for (const a of bt.m) {
          if (a.hp > 0) {
            applyMonsterPower(state, bt, a, "Strength", 3);
            if (a !== m) a.b += 6;
          }
        }
      } else monsterAttackPlayer(state, bt, m, 6, 3, rng);
      break;
    case "Taskmaster":
      monsterAttackPlayer(state, bt, m, 7, 1, rng);
      bt.di.push("Wound");
      break;
    case "BookOfStabbing":
      if (mv === 1) monsterAttackPlayer(state, bt, m, 6, m.hits || 2, rng);
      else monsterAttackPlayer(state, bt, m, 21, 1, rng);
      break;
    case "BronzeAutomaton":
      m.st.turns = (m.st.turns || 0) + 1;
      if (mv === 4) {
        const o1 = makeMonster("BronzeOrb", rng, state);
        const o2 = makeMonster("BronzeOrb", rng, state);
        rollMonsterMove(o1, bt, state, rng);
        rollMonsterMove(o2, bt, state, rng);
        bt.m.unshift(o1);
        bt.m.push(o2);
      } else if (mv === 1) monsterAttackPlayer(state, bt, m, 7, 2, rng);
      else if (mv === 5) { m.b += 9; applyMonsterPower(state, bt, m, "Strength", 3); }
      else if (mv === 2) monsterAttackPlayer(state, bt, m, 45, 1, rng);
      break;
    case "BronzeOrb":
      if (mv === 1) monsterAttackPlayer(state, bt, m, 8, 1, rng);
      else {
        const boss = bt.m.find(x => x.id === "BronzeAutomaton" && x.hp > 0) || m;
        boss.b += 12;
      }
      break;
    case "TheCollector":
      m.st.turns = (m.st.turns || 0) + 1;
      if (mv === 1 || mv === 5) {
        while (bt.m.filter(x => x.id === "TorchHead" && x.hp > 0).length < 2) {
          const th = makeMonster("TorchHead", rng, state);
          rollMonsterMove(th, bt, state, rng);
          bt.m.unshift(th);
        }
      } else if (mv === 2) monsterAttackPlayer(state, bt, m, 18, 1, rng);
      else if (mv === 3) {
        m.b += 15;
        for (const a of bt.m) { if (a.hp > 0) applyMonsterPower(state, bt, a, "Strength", 3); }
      } else if (mv === 4) {
        m.st.ult = true;
        applyPlayerPower(state, bt, "Weak", 3);
        applyPlayerPower(state, bt, "Vulnerable", 3);
        applyPlayerPower(state, bt, "Frail", 3);
      }
      break;
    case "TorchHead": monsterAttackPlayer(state, bt, m, 7, 1, rng); break;
    case "Champ":
      if (mv === 1) monsterAttackPlayer(state, bt, m, 16, 1, rng);
      else if (mv === 2) { m.b += 15; m.pw.Metallicize = (m.pw.Metallicize || 0) + 5; }
      else if (mv === 3) monsterAttackPlayer(state, bt, m, 10, 2, rng);
      else if (mv === 4) { monsterAttackPlayer(state, bt, m, 12, 1, rng); applyPlayerPower(state, bt, "Frail", 2); applyPlayerPower(state, bt, "Vulnerable", 2); }
      else if (mv === 5) applyMonsterPower(state, bt, m, "Strength", 2);
      else if (mv === 6) { applyPlayerPower(state, bt, "Weak", 2); applyPlayerPower(state, bt, "Vulnerable", 2); }
      else if (mv === 7) {
        delete m.pw.Weak;
        delete m.pw.Vulnerable;
        if ((m.pw.Strength || 0) < 0) delete m.pw.Strength;
        applyMonsterPower(state, bt, m, "Strength", 6);
        addLog(state, "第一勇士暴怒！移除所有负面状态并获得 6 点力量！");
      }
      break;
    // Act 3
    case "Darkling":
      if (mv === 5) {
        m.st.halfDead = false;
        m.hp = Math.floor(m.mhp / 2);
        m.pw.Regrow = 1;
        addLog(state, "小黑重生了！");
      } else if (mv === 1) monsterAttackPlayer(state, bt, m, 8, 2, rng);
      else if (mv === 2) m.b += 12;
      else if (mv === 3) monsterAttackPlayer(state, bt, m, m.st.nip || 9, 1, rng);
      break;
    case "OrbWalker":
      if (mv === 1) { monsterAttackPlayer(state, bt, m, 10, 1, rng); bt.di.push("Burn"); }
      else monsterAttackPlayer(state, bt, m, 15, 1, rng);
      break;
    case "Repulsor":
      if (mv === 1) bt.dr.push("Dazed", "Dazed");
      else monsterAttackPlayer(state, bt, m, 11, 1, rng);
      break;
    case "Exploder":
      m.st.tc = (m.st.tc || 0) + 1;
      if (mv === 1) monsterAttackPlayer(state, bt, m, 9, 1, rng);
      else {
        const dmg = 30;
        const b = Math.min(bt.b, dmg);
        bt.b -= b;
        if (dmg - b > 0) losePlayerHp(state, bt, dmg - b, false, rng);
        m.hp = 0; m.b = 0;
        addLog(state, "爆炸机自爆造成 30 点伤害！");
      }
      break;
    case "Spiker":
      if (mv === 1) monsterAttackPlayer(state, bt, m, 7, 1, rng);
      else { m.st.tc = (m.st.tc || 0) + 1; m.pw.Thorns = (m.pw.Thorns || 0) + 2; }
      break;
    case "SpireGrowth":
      if (mv === 1) monsterAttackPlayer(state, bt, m, 16, 1, rng);
      else if (mv === 2) applyPlayerPower(state, bt, "Constricted", 10);
      else monsterAttackPlayer(state, bt, m, 22, 1, rng);
      break;
    case "Transient":
      monsterAttackPlayer(state, bt, m, 30 + (m.st.cnt || 0) * 10, 1, rng);
      m.st.cnt = (m.st.cnt || 0) + 1;
      break;
    case "Maw":
      if (mv === 2) { m.st.roared = true; applyPlayerPower(state, bt, "Weak", 3); applyPlayerPower(state, bt, "Frail", 3); }
      else if (mv === 3) monsterAttackPlayer(state, bt, m, 25, 1, rng);
      else if (mv === 4) applyMonsterPower(state, bt, m, "Strength", 3);
      else monsterAttackPlayer(state, bt, m, 5, m.hits || 2, rng);
      break;
    case "WrithingMass":
      if (mv === 0) monsterAttackPlayer(state, bt, m, 32, 1, rng);
      else if (mv === 1) monsterAttackPlayer(state, bt, m, 7, 3, rng);
      else if (mv === 2) { monsterAttackPlayer(state, bt, m, 15, 1, rng); m.b += 15; }
      else if (mv === 3) { monsterAttackPlayer(state, bt, m, 10, 1, rng); applyPlayerPower(state, bt, "Weak", 2); applyPlayerPower(state, bt, "Vulnerable", 2); }
      else if (mv === 4) { m.st.mega = true; addCardToMasterDeck(state, "Parasite"); addLog(state, "扭曲团块将一张【寄生】诅咒塞入了你的永久牌组！"); }
      break;
    case "GiantHead":
      if (mv === 1) applyPlayerPower(state, bt, "Weak", 1);
      else if (mv === 3) monsterAttackPlayer(state, bt, m, 13, 1, rng);
      else monsterAttackPlayer(state, bt, m, m.dmg || 30, 1, rng);
      break;
    case "Nemesis":
      if (mv === 2) monsterAttackPlayer(state, bt, m, 6, 3, rng);
      else if (mv === 3) monsterAttackPlayer(state, bt, m, 45, 1, rng);
      else bt.di.push("Burn", "Burn", "Burn");
      if (!m.pw.Intangible) m.pw.Intangible = 1;
      break;
    case "Reptomancer":
      if (mv === 1) { monsterAttackPlayer(state, bt, m, 13, 2, rng); applyPlayerPower(state, bt, "Weak", 1); }
      else if (mv === 2) {
        if (bt.m.filter(x => x.id === "SnakeDagger" && x.hp > 0).length < 4) {
          const dg = makeMonster("SnakeDagger", rng, state, { minion: true });
          rollMonsterMove(dg, bt, state, rng);
          bt.m.unshift(dg);
        }
      } else monsterAttackPlayer(state, bt, m, 30, 1, rng);
      break;
    case "SnakeDagger":
      if (mv === 1) { monsterAttackPlayer(state, bt, m, 9, 1, rng); bt.di.push("Wound"); }
      else { monsterAttackPlayer(state, bt, m, 25, 1, rng); m.hp = 0; m.b = 0; }
      break;
    case "AwakenedOne":
      if (mv === 3) {
        m.st.halfDead = false;
        m.hp = m.mhp = 300;
        addLog(state, "【觉醒者】重生进入第二形态（300 HP）！");
      } else if (mv === 1) monsterAttackPlayer(state, bt, m, 20, 1, rng);
      else if (mv === 2) monsterAttackPlayer(state, bt, m, 6, 4, rng);
      else if (mv === 5) monsterAttackPlayer(state, bt, m, 40, 1, rng);
      else if (mv === 6) { monsterAttackPlayer(state, bt, m, 18, 1, rng); bt.dr.push("Void"); }
      else if (mv === 8) monsterAttackPlayer(state, bt, m, 10, 3, rng);
      break;
    case "TimeEater":
      if (mv === 2) monsterAttackPlayer(state, bt, m, 7, 3, rng);
      else if (mv === 3) { m.b += 20; applyPlayerPower(state, bt, "Vulnerable", 1); applyPlayerPower(state, bt, "Weak", 1); }
      else if (mv === 4) { monsterAttackPlayer(state, bt, m, 26, 1, rng); applyPlayerPower(state, bt, "DrawReduction", 1); }
      else if (mv === 5) {
        delete m.pw.Weak;
        delete m.pw.Vulnerable;
        if ((m.pw.Strength || 0) < 0) delete m.pw.Strength;
        m.hp = Math.max(m.hp, Math.floor(m.mhp / 2));
        addLog(state, "时间吞噬者恢复至半血并清除负面状态！");
      }
      break;
    case "Deca":
      if (mv === 0) { monsterAttackPlayer(state, bt, m, 10, 2, rng); bt.di.push("Dazed", "Dazed"); m.st.atk = false; }
      else {
        for (const a of bt.m) { if (a.hp > 0) a.b += 16; }
        m.st.atk = true;
      }
      break;
    case "Donu":
      if (mv === 0) { monsterAttackPlayer(state, bt, m, 10, 2, rng); m.st.atk = false; }
      else {
        for (const a of bt.m) { if (a.hp > 0) applyMonsterPower(state, bt, a, "Strength", 3); }
        m.st.atk = true;
      }
      break;
    case "BanditPointy": monsterAttackPlayer(state, bt, m, 5, 2, rng); break;
    case "BanditRomeo":
      if (mv === 3) { monsterAttackPlayer(state, bt, m, 10, 1, rng); applyPlayerPower(state, bt, "Weak", 2); }
      else if (mv === 1) monsterAttackPlayer(state, bt, m, 15, 1, rng);
      break;
    case "BanditBear":
      if (mv === 2) applyPlayerPower(state, bt, "Dexterity", -2);
      else if (mv === 3) { monsterAttackPlayer(state, bt, m, 9, 1, rng); m.b += 9; }
      else monsterAttackPlayer(state, bt, m, 18, 1, rng);
      break;
    default:
      monsterAttackPlayer(state, bt, m, m.dmg || 8, m.hits || 1, rng);
  }
}


// ==================== 11. Start Combat & Card / Potion / Turn Logic ====================
function getMaxEnergy(state) {
  let e = 3;
  const bossEnergyRelics = ["Cursed Key", "Sozu", "Fusion Hammer", "Coffee Dripper", "Philosopher's Stone", "Velvet Choker", "Mark of Pain", "Busted Crown"];
  for (const r of bossEnergyRelics) {
    if (hasRelic(state, r)) e++;
  }
  return e;
}

function startCombat(state, encId, roomType, rng) {
  state.ph = "COMBAT";
  state.rt = roomType;
  const monsters = spawnEncounter(encId, rng, state);

  // Preserved Insect (Elites -25% HP)
  if (roomType === "E" && hasRelic(state, "PreservedInsect")) {
    for (const m of monsters) {
      m.hp = Math.max(1, Math.floor(m.mhp * 0.75));
    }
  }
  // Neow's Lament (first 3 combats enemies have 1 current HP, preserving mhp)
  let neowTriggered = false;
  if ((hasRelic(state, "NeowsBlessing") || hasRelic(state, "NeowsLament")) && state.rc && (state.rc.Neow || 0) > 0) {
    state.rc.Neow--;
    neowTriggered = true;
    for (const m of monsters) { m.hp = 1; }
  }
  // Philosopher's Stone (+1 Str to all enemies)
  if (hasRelic(state, "Philosopher's Stone")) {
    for (const m of monsters) m.pw.Strength = (m.pw.Strength || 0) + 1;
  }

  const maxE = getMaxEnergy(state);
  const bt = {
    enc: encId,
    t: 1,
    e: maxE,
    me: maxE,
    b: 0,
    pw: {},
    h: [],
    dr: [],
    di: [],
    ex: [],
    m: monsters,
    ct: 0,
    at: 0,
    sk: 0,
    po: 0,
    lh: 0
  };
  state.bt = bt;

  // Build draw pile (Innate cards on top)
  const deckCopy = rng.shuffle(state.dk.slice());
  const normal = [], innate = [];
  for (const c of deckCopy) {
    if (getCardDef(c).innate) innate.push(c);
    else normal.push(c);
  }
  if (hasRelic(state, "Mark of Pain")) {
    normal.push("Wound", "Wound");
  }
  bt.dr = rng.shuffle(normal).concat(innate);

  // Start-of-combat relics
  if (hasRelic(state, "Blood Vial")) healPlayer(state, 2, true);
  if (roomType === "B" && hasRelic(state, "Pantograph")) healPlayer(state, 25, true);
  if (hasRelic(state, "Anchor")) bt.b += 10;
  if (hasRelic(state, "Thread and Needle")) bt.pw.PlatedArmor = 4;
  if (hasRelic(state, "Bronze Scales")) bt.pw.Thorns = 3;
  if (hasRelic(state, "Vajra")) bt.pw.Strength = (bt.pw.Strength || 0) + 1;
  if (hasRelic(state, "Oddly Smooth Stone")) bt.pw.Dexterity = (bt.pw.Dexterity || 0) + 1;
  if (hasRelic(state, "ClockworkSouvenir")) bt.pw.Artifact = (bt.pw.Artifact || 0) + 1;
  if (hasRelic(state, "FossilizedHelix")) bt.pw.Buffer = (bt.pw.Buffer || 0) + 1;
  if (roomType === "E" && hasRelic(state, "Sling")) bt.pw.Strength = (bt.pw.Strength || 0) + 2;
  if (hasRelic(state, "Du-Vu Doll")) {
    const curses = state.dk.filter(c => getCardDef(c).type === "C").length;
    if (curses > 0) bt.pw.Strength = (bt.pw.Strength || 0) + curses;
  }
  if (hasRelic(state, "MutagenicStrength")) {
    bt.pw.Strength = (bt.pw.Strength || 0) + 3;
    bt.pw.LoseStrength = (bt.pw.LoseStrength || 0) + 3;
  }
  if (hasRelic(state, "Bag of Marbles")) {
    for (const m of monsters) applyMonsterPower(state, bt, m, "Vulnerable", 1);
  }
  if (hasRelic(state, "Red Mask")) {
    for (const m of monsters) applyMonsterPower(state, bt, m, "Weak", 1);
  }
  if (hasRelic(state, "Lantern")) bt.e += 1;
  if (hasRelic(state, "Ancient Tea Set") && state.rc.TeaSet) {
    bt.e += 2;
    state.rc.TeaSet = 0;
  }
  if ((roomType === "E" || roomType === "B") && hasRelic(state, "SlaversCollar")) {
    bt.e += 1;
  }
  if (hasRelic(state, "Snecko Eye")) {
    bt.pw.Confusion = 1;
  }
  if (hasRelic(state, "Mercury Hourglass")) {
    for (const m of monsters) damageMonster(state, bt, m, 3, "THORNS", rng);
  }

  // Roll initial moves for all monsters
  for (const m of bt.m) {
    rollMonsterMove(m, bt, state, rng);
  }

  // Draw initial hand
  let drawCnt = 5;
  if (hasRelic(state, "Bag of Preparation")) drawCnt += 2;
  if (hasRelic(state, "Snecko Eye")) drawCnt += 2;
  drawCards(state, bt, drawCnt, rng);
  const mNames = bt.m.map(x => x.name).join("、");
  if (neowTriggered) {
    addLog(state, "遭遇战斗：" + mNames + "（⚡涅奥的悲恸生效：敌人当前生命降为 1，剩余 " + state.rc.Neow + " 场战斗）");
  } else {
    addLog(state, "遭遇战斗：" + mNames);
  }
}

function canPlayCard(state, bt, cardStr) {
  if (!bt) return false;
  const { def, cost } = calcPlayerCardNumbers(state, bt, cardStr, null);
  if (hasRelic(state, "Velvet Choker") && (bt.ct || 0) >= 6) return false;
  if (bt.h.some(c => getCardDef(c).id === "Normality") && (bt.ct || 0) >= 3) return false;
  if (def.type === "A" && (bt.pw.Entangled || 0) > 0) return false;
  if (def.id === "Clash" && bt.h.some(c => getCardDef(c).type !== "A")) return false;
  if (def.type === "ST") {
    if (def.id === "Slimed") return bt.e >= 1;
    return hasRelic(state, "Medical Kit");
  }
  if (def.type === "C") {
    return hasRelic(state, "Blue Candle");
  }
  if (cost === -1) return true; // X-cost (Whirlwind) can be played at 0+ energy
  return cost >= 0 && bt.e >= cost;
}

function executeSingleCardEffect(state, bt, cardStr, targetIdx, xEnergy, rng) {
  const aliveTargets = bt.m.filter(x => x.hp > 0);
  if (!aliveTargets.length) return;
  let t = (targetIdx !== undefined && bt.m[targetIdx] && bt.m[targetIdx].hp > 0) ? bt.m[targetIdx] : aliveTargets[0];
  const { def, dmg, blk, mag } = calcPlayerCardNumbers(state, bt, cardStr, t);

  if (def.type === "A") {
    bt.firstAtkDone = true;
    if (hasRelic(state, "Pen Nib")) {
      state.rc.PenNib = ((state.rc.PenNib || 0) + 1) % 10;
    }
    if (hasRelic(state, "Nunchaku")) {
      state.rc.Nunchaku = (state.rc.Nunchaku || 0) + 1;
      if (state.rc.Nunchaku >= 10) { state.rc.Nunchaku = 0; bt.e += 1; }
    }
    if ((bt.pw.Rage || 0) > 0) {
      gainPlayerBlock(state, bt, bt.pw.Rage, false, rng);
    }
    // Guardian Sharp Hide
    for (const m of bt.m) {
      if (m.hp > 0 && (m.pw.SharpHide || 0) > 0) {
        const sh = m.pw.SharpHide;
        const b = Math.min(bt.b, sh);
        bt.b -= b;
        if (sh - b > 0) losePlayerHp(state, bt, sh - b, false, rng);
      }
    }
  } else if (def.type === "S") {
    // Gremlin Nob Anger & Chosen Hex
    for (const m of bt.m) {
      if (m.hp > 0 && (m.pw.Anger || 0) > 0) {
        applyMonsterPower(state, bt, m, "Strength", m.pw.Anger);
      }
    }
    if ((bt.pw.Hex || 0) > 0) {
      bt.dr.push("Dazed");
    }
  } else if (def.type === "P") {
    if (hasRelic(state, "Bird Faced Urn")) healPlayer(state, 2, true);
    if (hasRelic(state, "Mummified Hand") && bt.h.length > 0) {
      const candidates = [];
      for (let i = 0; i < bt.h.length; i++) {
        if (calcPlayerCardNumbers(state, bt, bt.h[i], null).cost > 0) candidates.push(i);
      }
      if (candidates.length > 0) {
        const pickIdx = rng.pick(candidates);
        const cd = getCardDef(bt.h[pickIdx]);
        bt.h[pickIdx] = cd.id + (cd.up > 1 ? "+" + cd.up : (cd.up ? "+" : "")) + "|c0";
      }
    }
    // Awakened One Curiosity
    for (const m of bt.m) {
      if (m.hp > 0 && (m.pw.Curiosity || 0) > 0) {
        applyMonsterPower(state, bt, m, "Strength", m.pw.Curiosity);
      }
    }
  }

  // Block gain
  if (blk > 0 && def.id !== "Second Wind") {
    gainPlayerBlock(state, bt, blk, true, rng);
  }

  // Execute card-specific logic
  switch (def.id) {
    case "Strike_R":
    case "Carnage":
    case "Clash":
    case "Bludgeon":
    case "Blood for Blood":
    case "Body Slam":
    case "Heavy Blade":
    case "Perfected Strike":
    case "Searing Blow":
    case "Mind Blast":
    case "Swift Strike":
      damageMonster(state, bt, t, dmg, "NORMAL", rng);
      break;
    case "Bash":
      damageMonster(state, bt, t, dmg, "NORMAL", rng);
      applyMonsterPower(state, bt, t, "Vulnerable", mag);
      break;
    case "Anger":
      damageMonster(state, bt, t, dmg, "NORMAL", rng);
      bt.di.push(def.up ? "Anger+" : "Anger");
      break;
    case "Cleave":
    case "Dramatic Entrance":
      for (const m of bt.m.slice()) {
        if (m.hp > 0) {
          const d = calcPlayerCardNumbers(state, bt, cardStr, m).dmg;
          damageMonster(state, bt, m, d, "NORMAL", rng);
        }
      }
      break;
    case "Clothesline":
      damageMonster(state, bt, t, dmg, "NORMAL", rng);
      applyMonsterPower(state, bt, t, "Weak", mag);
      break;
    case "Headbutt":
      damageMonster(state, bt, t, dmg, "NORMAL", rng);
      if (bt.di.length > 0) bt.dr.push(bt.di.pop());
      break;
    case "Iron Wave":
      damageMonster(state, bt, t, dmg, "NORMAL", rng);
      break;
    case "Pommel Strike":
    case "Flash of Steel":
      damageMonster(state, bt, t, dmg, "NORMAL", rng);
      drawCards(state, bt, mag, rng);
      break;
    case "Sword Boomerang":
      for (let i = 0; i < mag; i++) {
        const alive = bt.m.filter(x => x.hp > 0);
        if (!alive.length) break;
        const rm = rng.pick(alive);
        const d = calcPlayerCardNumbers(state, bt, cardStr, rm).dmg;
        damageMonster(state, bt, rm, d, "NORMAL", rng);
      }
      break;
    case "Thunderclap":
      for (const m of bt.m.slice()) {
        if (m.hp > 0) {
          const d = calcPlayerCardNumbers(state, bt, cardStr, m).dmg;
          damageMonster(state, bt, m, d, "NORMAL", rng);
          applyMonsterPower(state, bt, m, "Vulnerable", 1);
        }
      }
      break;
    case "Twin Strike":
      damageMonster(state, bt, t, dmg, "NORMAL", rng);
      if (t.hp > 0) damageMonster(state, bt, t, dmg, "NORMAL", rng);
      break;
    case "Wild Strike":
      damageMonster(state, bt, t, dmg, "NORMAL", rng);
      bt.dr.splice(rng.int(0, bt.dr.length), 0, "Wound");
      break;
    case "Armaments":
      if (def.up) {
        bt.h = bt.h.map(c => {
          const cd = getCardDef(c);
          if (cd.up === 0 && cd.type !== "ST" && cd.type !== "C") return cd.id + "+";
          return c;
        });
      } else {
        for (let i = 0; i < bt.h.length; i++) {
          const cd = getCardDef(bt.h[i]);
          if (cd.up === 0 && cd.type !== "ST" && cd.type !== "C") { bt.h[i] = cd.id + "+"; break; }
        }
      }
      break;
    case "Flex":
      applyPlayerPower(state, bt, "Strength", mag);
      applyPlayerPower(state, bt, "LoseStrength", mag);
      break;
    case "Havoc":
      if (bt.dr.length > 0) {
        const top = bt.dr.pop();
        executeSingleCardEffect(state, bt, top, targetIdx, 0, rng);
        triggerExhaustCard(state, bt, top, rng);
      }
      break;
    case "Shrug It Off":
    case "Finesse":
      drawCards(state, bt, 1, rng);
      break;
    case "True Grit":
      if (bt.h.length > 0) {
        let exIdx = def.up ? bt.h.findIndex(c => ["ST", "C"].indexOf(getCardDef(c).type) !== -1) : -1;
        if (exIdx === -1) exIdx = def.up ? bt.h.length - 1 : rng.int(0, bt.h.length - 1);
        const exC = bt.h.splice(exIdx, 1)[0];
        triggerExhaustCard(state, bt, exC, rng);
      }
      break;
    case "Warcry":
    case "Thinking Ahead":
      drawCards(state, bt, mag, rng);
      if (bt.h.length > 0) bt.dr.push(bt.h.pop());
      break;
    case "Dropkick": {
      const hadVuln = (t.pw.Vulnerable || 0) > 0;
      damageMonster(state, bt, t, dmg, "NORMAL", rng);
      if (hadVuln) { bt.e += 1; drawCards(state, bt, 1, rng); }
      break;
    }
    case "Hemokinesis":
      losePlayerHp(state, bt, mag, true, rng);
      damageMonster(state, bt, t, dmg, "NORMAL", rng);
      break;
    case "Pummel":
      for (let i = 0; i < mag; i++) {
        if (t.hp <= 0) break;
        damageMonster(state, bt, t, dmg, "NORMAL", rng);
      }
      break;
    case "Rampage":
      damageMonster(state, bt, t, dmg, "NORMAL", rng);
      break;
    case "Reckless Charge":
      damageMonster(state, bt, t, dmg, "NORMAL", rng);
      bt.dr.splice(rng.int(0, bt.dr.length), 0, "Dazed");
      break;
    case "Sever Soul":
      for (let i = bt.h.length - 1; i >= 0; i--) {
        if (getCardDef(bt.h[i]).type !== "A") {
          const exC = bt.h.splice(i, 1)[0];
          triggerExhaustCard(state, bt, exC, rng);
        }
      }
      damageMonster(state, bt, t, dmg, "NORMAL", rng);
      break;
    case "Uppercut":
      damageMonster(state, bt, t, dmg, "NORMAL", rng);
      applyMonsterPower(state, bt, t, "Weak", mag);
      applyMonsterPower(state, bt, t, "Vulnerable", mag);
      break;
    case "Whirlwind": {
      const times = xEnergy + (hasRelic(state, "Chemical X") ? 2 : 0);
      for (let i = 0; i < times; i++) {
        for (const m of bt.m.slice()) {
          if (m.hp > 0) {
            const d = calcPlayerCardNumbers(state, bt, cardStr, m).dmg;
            damageMonster(state, bt, m, d, "NORMAL", rng);
          }
        }
      }
      break;
    }
    case "Battle Trance":
      drawCards(state, bt, mag, rng);
      applyPlayerPower(state, bt, "NoDraw", 1);
      break;
    case "Bloodletting":
      losePlayerHp(state, bt, 3, true, rng);
      bt.e += mag;
      break;
    case "Burning Pact":
      if (bt.h.length > 0) {
        let exIdx = bt.h.findIndex(c => ["ST", "C"].indexOf(getCardDef(c).type) !== -1);
        if (exIdx === -1) exIdx = bt.h.length - 1;
        const exC = bt.h.splice(exIdx, 1)[0];
        triggerExhaustCard(state, bt, exC, rng);
      }
      drawCards(state, bt, mag, rng);
      break;
    case "Disarm":
      applyMonsterPower(state, bt, t, "Strength", -mag);
      break;
    case "Dual Wield": {
      const cand = bt.h.find(c => ["A", "P"].indexOf(getCardDef(c).type) !== -1);
      if (cand) {
        for (let i = 0; i < mag && bt.h.length < 10; i++) bt.h.push(cand);
      }
      break;
    }
    case "Entrench":
      if (bt.b > 0) gainPlayerBlock(state, bt, bt.b, true, rng);
      break;
    case "Flame Barrier":
      applyPlayerPower(state, bt, "FlameBarrier", mag);
      break;
    case "Infernal Blade": {
      const atkPool = Object.keys(RAW_CARDS).filter(k => RAW_CARDS[k][1] === "A" && ["C", "U", "R"].indexOf(RAW_CARDS[k][2]) !== -1);
      if (bt.h.length < 10) bt.h.push(rng.pick(atkPool) + "|c0");
      break;
    }
    case "Intimidate":
      for (const m of bt.m) { if (m.hp > 0) applyMonsterPower(state, bt, m, "Weak", mag); }
      break;
    case "Power Through":
      if (bt.h.length < 10) bt.h.push("Wound");
      if (bt.h.length < 10) bt.h.push("Wound");
      break;
    case "Rage":
      applyPlayerPower(state, bt, "Rage", mag);
      break;
    case "Second Wind": {
      let nonAtk = 0;
      for (let i = bt.h.length - 1; i >= 0; i--) {
        if (getCardDef(bt.h[i]).type !== "A") {
          const exC = bt.h.splice(i, 1)[0];
          triggerExhaustCard(state, bt, exC, rng);
          nonAtk++;
        }
      }
      if (nonAtk > 0) gainPlayerBlock(state, bt, nonAtk * blk, true, rng);
      break;
    }
    case "Seeing Red":
      bt.e += 2;
      break;
    case "Shockwave":
      for (const m of bt.m) {
        if (m.hp > 0) {
          applyMonsterPower(state, bt, m, "Weak", mag);
          applyMonsterPower(state, bt, m, "Vulnerable", mag);
        }
      }
      break;
    case "Spot Weakness":
      if (t && String(t.in).indexOf("ATTACK") !== -1) {
        applyPlayerPower(state, bt, "Strength", mag);
      }
      break;
    case "Combust": applyPlayerPower(state, bt, "Combust", mag); break;
    case "Dark Embrace": applyPlayerPower(state, bt, "DarkEmbrace", mag); break;
    case "Evolve": applyPlayerPower(state, bt, "Evolve", mag); break;
    case "Feel No Pain": applyPlayerPower(state, bt, "FeelNoPain", mag); break;
    case "Fire Breathing": applyPlayerPower(state, bt, "FireBreathing", mag); break;
    case "Inflame": applyPlayerPower(state, bt, "Strength", mag); break;
    case "Metallicize": applyPlayerPower(state, bt, "Metallicize", mag); break;
    case "Rupture": applyPlayerPower(state, bt, "Rupture", mag); break;
    case "Feed": {
      const wasAlive = t.hp > 0;
      damageMonster(state, bt, t, dmg, "NORMAL", rng);
      if (wasAlive && t.hp <= 0 && !t.st.halfDead && !t.pw.Minion) {
        state.mhp += mag;
        state.hp = Math.min(state.mhp, state.hp + mag);
        addLog(state, "【狂宴】斩杀！最大生命值 +" + mag + "！");
      }
      break;
    }
    case "Fiend Fire": {
      const toEx = bt.h.splice(0, bt.h.length);
      const cnt = toEx.length;
      for (const exC of toEx) {
        triggerExhaustCard(state, bt, exC, rng);
      }
      for (let i = 0; i < cnt; i++) {
        if (t.hp <= 0) break;
        damageMonster(state, bt, t, dmg, "NORMAL", rng);
      }
      break;
    }
    case "Immolate":
      for (const m of bt.m.slice()) {
        if (m.hp > 0) {
          const d = calcPlayerCardNumbers(state, bt, cardStr, m).dmg;
          damageMonster(state, bt, m, d, "NORMAL", rng);
        }
      }
      bt.di.push("Burn");
      break;
    case "Reaper": {
      let totalUnblocked = 0;
      for (const m of bt.m.slice()) {
        if (m.hp > 0) {
          const d = calcPlayerCardNumbers(state, bt, cardStr, m).dmg;
          totalUnblocked += damageMonster(state, bt, m, d, "NORMAL", rng);
        }
      }
      if (totalUnblocked > 0) healPlayer(state, totalUnblocked, true);
      break;
    }
    case "Double Tap": applyPlayerPower(state, bt, "DoubleTap", mag); break;
    case "Exhume":
      if (bt.ex.length > 0 && bt.h.length < 10) {
        const idx = bt.ex.findIndex(c => getCardDef(c).id !== "Exhume");
        if (idx !== -1) bt.h.push(bt.ex.splice(idx, 1)[0]);
      }
      break;
    case "Limit Break":
      if ((bt.pw.Strength || 0) > 0) applyPlayerPower(state, bt, "Strength", bt.pw.Strength);
      break;
    case "Offering":
      losePlayerHp(state, bt, 6, true, rng);
      bt.e += 2;
      drawCards(state, bt, mag, rng);
      break;
    case "Barricade": applyPlayerPower(state, bt, "Barricade", 1); break;
    case "Berserk":
      applyPlayerPower(state, bt, "Vulnerable", mag);
      applyPlayerPower(state, bt, "Berserk", 1);
      break;
    case "Brutality": applyPlayerPower(state, bt, "Brutality", 1); break;
    case "Corruption": applyPlayerPower(state, bt, "Corruption", 1); break;
    case "Demon Form": applyPlayerPower(state, bt, "DemonForm", mag); break;
    case "Juggernaut": applyPlayerPower(state, bt, "Juggernaut", mag); break;
    // Colorless
    case "Apotheosis":
      bt.h = bt.h.map(c => { const d = getCardDef(c); return (d.up === 0 && d.type !== "ST" && d.type !== "C") ? d.id + "+" : c; });
      bt.dr = bt.dr.map(c => { const d = getCardDef(c); return (d.up === 0 && d.type !== "ST" && d.type !== "C") ? d.id + "+" : c; });
      bt.di = bt.di.map(c => { const d = getCardDef(c); return (d.up === 0 && d.type !== "ST" && d.type !== "C") ? d.id + "+" : c; });
      break;
    case "Bandage Up": healPlayer(state, mag, true); break;
    case "Blind":
      if (def.up) { for (const m of bt.m) if (m.hp > 0) applyMonsterPower(state, bt, m, "Weak", mag); }
      else applyMonsterPower(state, bt, t, "Weak", mag);
      break;
    case "Dark Shackles":
      applyMonsterPower(state, bt, t, "Strength", -mag);
      break;
    case "Deep Breath":
      if (bt.di.length > 0) { bt.dr = rng.shuffle(bt.dr.concat(bt.di)); bt.di = []; }
      drawCards(state, bt, mag, rng);
      break;
    case "Discovery": {
      const pool = Object.keys(RAW_CARDS).filter(k => ["C", "U", "R"].indexOf(RAW_CARDS[k][2]) !== -1);
      if (bt.h.length < 10) bt.h.push(rng.pick(pool) + "|c0");
      break;
    }
    case "HandOfGreed": {
      const wasAlive = t.hp > 0;
      damageMonster(state, bt, t, dmg, "NORMAL", rng);
      if (wasAlive && t.hp <= 0 && !t.st.halfDead && !t.pw.Minion) addGold(state, mag);
      break;
    }
    case "Impatience":
      if (!bt.h.some(c => getCardDef(c).type === "A")) drawCards(state, bt, mag, rng);
      break;
    case "J.A.X.":
      losePlayerHp(state, bt, 3, true, rng);
      applyPlayerPower(state, bt, "Strength", mag);
      break;
    case "Madness": {
      const cand = [];
      for (let i = 0; i < bt.h.length; i++) if (calcPlayerCardNumbers(state, bt, bt.h[i], null).cost > 0) cand.push(i);
      if (cand.length > 0) {
        const idx = rng.pick(cand);
        const cd = getCardDef(bt.h[idx]);
        bt.h[idx] = cd.id + (cd.up ? "+" : "") + "|c0";
      }
      break;
    }
    case "Master of Strategy": drawCards(state, bt, mag, rng); break;
    case "Mayhem": applyPlayerPower(state, bt, "Mayhem", 1); break;
    case "Panacea": applyPlayerPower(state, bt, "Artifact", mag); break;
    case "Panache": applyPlayerPower(state, bt, "Panache", mag); break;
    case "PanicButton": applyPlayerPower(state, bt, "NoBlock", mag); break;
    case "Purity":
      for (let i = 0; i < mag && bt.h.length > 0; i++) {
        let idx = bt.h.findIndex(c => ["ST", "C"].indexOf(getCardDef(c).type) !== -1);
        if (idx === -1) break;
        triggerExhaustCard(state, bt, bt.h.splice(idx, 1)[0], rng);
      }
      break;
    case "Sadistic Nature": applyPlayerPower(state, bt, "Sadistic", mag); break;
    case "Secret Technique": {
      const idx = bt.dr.findIndex(c => getCardDef(c).type === "S");
      if (idx !== -1 && bt.h.length < 10) bt.h.push(bt.dr.splice(idx, 1)[0]);
      break;
    }
    case "Secret Weapon": {
      const idx = bt.dr.findIndex(c => getCardDef(c).type === "A");
      if (idx !== -1 && bt.h.length < 10) bt.h.push(bt.dr.splice(idx, 1)[0]);
      break;
    }
    case "The Bomb": applyPlayerPower(state, bt, "TheBomb", mag); break;
    case "Trip":
      if (def.up) { for (const m of bt.m) if (m.hp > 0) applyMonsterPower(state, bt, m, "Vulnerable", mag); }
      else applyMonsterPower(state, bt, t, "Vulnerable", mag);
      break;
    case "Violence":
      for (let i = 0; i < mag && bt.h.length < 10; i++) {
        const idx = bt.dr.findIndex(c => getCardDef(c).type === "A");
        if (idx === -1) break;
        bt.h.push(bt.dr.splice(idx, 1)[0]);
      }
      break;
    case "Bite":
      damageMonster(state, bt, t, dmg, "NORMAL", rng);
      healPlayer(state, mag, true);
      break;
    case "Ghostly":
      applyPlayerPower(state, bt, "Intangible", 1);
      break;
    case "RitualDagger": {
      const wasAlive = t.hp > 0;
      damageMonster(state, bt, t, dmg, "NORMAL", rng);
      if (wasAlive && t.hp <= 0 && !t.st.halfDead && !t.pw.Minion) {
        const dkIdx = state.dk.findIndex(c => getCardDef(c).id === "RitualDagger");
        if (dkIdx !== -1) {
          const cd = getCardDef(state.dk[dkIdx]);
          state.dk[dkIdx] = "RitualDagger" + (cd.up ? "+" : "") + "|" + (cd.dmg + cd.mag);
        }
      }
      break;
    }
  }
}

function playCardInCombat(state, cardIdx, targetIdx, rng) {
  const bt = state.bt;
  if (!bt || cardIdx < 0 || cardIdx >= bt.h.length) return false;
  const cardStr = bt.h[cardIdx];
  if (!canPlayCard(state, bt, cardStr)) return false;

  const { def, cost } = calcPlayerCardNumbers(state, bt, cardStr, null);
  let xEnergy = 0;
  if (def.type === "C" && hasRelic(state, "Blue Candle")) {
    losePlayerHp(state, bt, 1, true, rng);
  } else if (def.type === "ST" && def.id !== "Slimed" && hasRelic(state, "Medical Kit")) {
    // 0 cost
  } else if (cost === -1) {
    xEnergy = bt.e;
    bt.e = 0;
  } else {
    bt.e = Math.max(0, bt.e - cost);
  }

  // Remove from hand
  bt.h.splice(cardIdx, 1);

  // Pain curse check in hand
  for (const c of bt.h) {
    if (getCardDef(c).id === "Pain") losePlayerHp(state, bt, 1, false, rng);
  }

  // Increment counters
  bt.ct = (bt.ct || 0) + 1;
  for (const m of bt.m) {
    if (m.hp > 0 && m.pw.Slow !== undefined) m.pw.Slow = (m.pw.Slow || 0) + 1;
  }
  if (def.type === "A") {
    bt.at = (bt.at || 0) + 1;
    if (bt.at % 3 === 0) {
      if (hasRelic(state, "Shuriken")) applyPlayerPower(state, bt, "Strength", 1);
      if (hasRelic(state, "Kunai")) applyPlayerPower(state, bt, "Dexterity", 1);
      if (hasRelic(state, "Ornamental Fan")) gainPlayerBlock(state, bt, 4, false, rng);
    }
  } else if (def.type === "S") {
    bt.sk = (bt.sk || 0) + 1;
    if (bt.sk % 3 === 0 && hasRelic(state, "Letter Opener")) {
      for (const m of bt.m.slice()) if (m.hp > 0) damageMonster(state, bt, m, 5, "THORNS", rng);
    }
  } else if (def.type === "P") {
    bt.po = (bt.po || 0) + 1;
  }

  // Orange Pellets check
  if (hasRelic(state, "OrangePellets") && bt.at > 0 && bt.sk > 0 && bt.po > 0 && !bt.pelletsDone) {
    bt.pelletsDone = true;
    for (const k of Object.keys(bt.pw)) {
      if (POWERS_META[k] && POWERS_META[k].debuff) delete bt.pw[k];
    }
  }

  // Panache check
  if ((bt.pw.Panache || 0) > 0 && bt.ct % 5 === 0) {
    for (const m of bt.m.slice()) if (m.hp > 0) damageMonster(state, bt, m, bt.pw.Panache, "THORNS", rng);
  }

  // Execute effect (and Double Tap / Duplication)
  let repeats = 1;
  if ((bt.pw.Duplication || 0) > 0) {
    bt.pw.Duplication--;
    if (bt.pw.Duplication <= 0) delete bt.pw.Duplication;
    repeats++;
  } else if (def.type === "A" && (bt.pw.DoubleTap || 0) > 0) {
    bt.pw.DoubleTap--;
    if (bt.pw.DoubleTap <= 0) delete bt.pw.DoubleTap;
    repeats++;
  }

  for (let r = 0; r < repeats; r++) {
    if (state.hp <= 0 || isCombatWon(bt)) break;
    executeSingleCardEffect(state, bt, cardStr, targetIdx, xEnergy, rng);
  }

  // Destination pile
  let cleanCard = def.id + (def.up > 1 ? "+" + def.up : (def.up ? "+" : ""));
  if (def.id === "Rampage") {
    const curExtra = (def.mod && !def.mod.startsWith("c")) ? (parseInt(def.mod, 10) || 0) : 0;
    cleanCard += "|" + (curExtra + def.mag);
  }
  const shouldExhaust = def.exhaust || (def.type === "S" && (bt.pw.Corruption || 0) > 0) || def.type === "ST" || def.type === "C";
  if (def.type === "P") {
    // Power stays in play
  } else if (shouldExhaust) {
    triggerExhaustCard(state, bt, cleanCard, rng);
  } else {
    bt.di.push(cleanCard);
  }

  addLog(state, "打出【" + def.name + "】");

  // Time Eater Time Warp check (every 12 cards played ends turn)
  for (const m of bt.m) {
    if (m.hp > 0 && m.pw.TimeWarp !== undefined) {
      m.pw.TimeWarp = (m.pw.TimeWarp || 0) + 1;
      if (m.pw.TimeWarp >= 12) {
        m.pw.TimeWarp = 0;
        applyMonsterPower(state, bt, m, "Strength", 2);
        addLog(state, "【时间扭曲】触发！强制结束回合并使时间吞噬者 +2 力量！");
        if (!isCombatWon(bt) && state.hp > 0) {
          endPlayerTurn(state, rng);
          return true;
        }
      }
    }
  }

  if (state.hp <= 0) {
    onPlayerDefeat(state);
  } else if (isCombatWon(bt)) {
    onCombatVictory(state, rng);
  }
  return true;
}

function usePotion(state, potIdx, targetIdx, rng) {
  if (!state.pot || potIdx < 0 || potIdx >= state.pot.length) return false;
  const pId = state.pot[potIdx];
  if (!pId || !POTIONS[pId] || pId === "FairyPotion") return false;
  const pDef = POTIONS[pId];
  const mult = hasRelic(state, "SacredBark") ? 2 : 1;
  const val = pDef.val * mult;

  if (pId === "Fruit Juice") {
    state.pot[potIdx] = "";
    state.mhp += val;
    state.hp = Math.min(state.mhp, state.hp + val);
    if (hasRelic(state, "Toy Ornithopter")) healPlayer(state, 5, Boolean(state.bt));
    addLog(state, "饮用【果汁】，最大生命 +" + val);
    return true;
  }
  if (pId === "BloodPotion") {
    state.pot[potIdx] = "";
    healPlayer(state, Math.floor(state.mhp * val / 100), Boolean(state.bt));
    if (hasRelic(state, "Toy Ornithopter")) healPlayer(state, 5, Boolean(state.bt));
    addLog(state, "饮用【鲜血药水】恢复生命！");
    return true;
  }

  const bt = state.bt;
  if (!bt || state.ph !== "COMBAT") return false;
  state.pot[potIdx] = "";
  if (hasRelic(state, "Toy Ornithopter")) healPlayer(state, 5, true);

  const alive = bt.m.filter(x => x.hp > 0);
  const t = (targetIdx !== undefined && bt.m[targetIdx] && bt.m[targetIdx].hp > 0) ? bt.m[targetIdx] : alive[0];

  switch (pId) {
    case "Block Potion": gainPlayerBlock(state, bt, val, false, rng); break;
    case "Fire Potion": if (t) damageMonster(state, bt, t, val, "THORNS", rng); break;
    case "Explosive Potion":
      for (const m of bt.m.slice()) if (m.hp > 0) damageMonster(state, bt, m, val, "THORNS", rng);
      break;
    case "FearPotion": if (t) applyMonsterPower(state, bt, t, "Vulnerable", val); break;
    case "Weak Potion": if (t) applyMonsterPower(state, bt, t, "Weak", val); break;
    case "Strength Potion": applyPlayerPower(state, bt, "Strength", val); break;
    case "Dexterity Potion": applyPlayerPower(state, bt, "Dexterity", val); break;
    case "SpeedPotion":
      applyPlayerPower(state, bt, "Dexterity", val);
      applyPlayerPower(state, bt, "LoseDexterity", val);
      break;
    case "SteroidPotion":
      applyPlayerPower(state, bt, "Strength", val);
      applyPlayerPower(state, bt, "LoseStrength", val);
      break;
    case "Swift Potion": drawCards(state, bt, val, rng); break;
    case "Energy Potion": bt.e += val; break;
    case "BlessingOfTheForge":
      bt.h = bt.h.map(c => { const d = getCardDef(c); return (d.up === 0 && d.type !== "ST" && d.type !== "C") ? d.id + "+" : c; });
      break;
    case "AttackPotion": {
      const p = Object.keys(RAW_CARDS).filter(k => RAW_CARDS[k][1] === "A" && ["C", "U", "R"].indexOf(RAW_CARDS[k][2]) !== -1);
      for (let i = 0; i < val && bt.h.length < 10; i++) bt.h.push(rng.pick(p) + "|c0");
      break;
    }
    case "SkillPotion": {
      const p = Object.keys(RAW_CARDS).filter(k => RAW_CARDS[k][1] === "S" && ["C", "U", "R"].indexOf(RAW_CARDS[k][2]) !== -1);
      for (let i = 0; i < val && bt.h.length < 10; i++) bt.h.push(rng.pick(p) + "|c0");
      break;
    }
    case "PowerPotion": {
      const p = Object.keys(RAW_CARDS).filter(k => RAW_CARDS[k][1] === "P" && ["C", "U", "R"].indexOf(RAW_CARDS[k][2]) !== -1);
      for (let i = 0; i < val && bt.h.length < 10; i++) bt.h.push(rng.pick(p) + "|c0");
      break;
    }
    case "Regen Potion": applyPlayerPower(state, bt, "Regen", val); break;
    case "Ancient Potion": applyPlayerPower(state, bt, "Artifact", val); break;
    case "EssenceOfSteel": applyPlayerPower(state, bt, "PlatedArmor", val); break;
    case "LiquidBronze": applyPlayerPower(state, bt, "Thorns", val); break;
    case "DuplicationPotion": applyPlayerPower(state, bt, "Duplication", val); break;
    case "CultistPotion": applyPlayerPower(state, bt, "Ritual", val); break;
  }
  addLog(state, "使用【" + pDef.name + "】");
  if (isCombatWon(bt)) onCombatVictory(state, rng);
  return true;
}

function endPlayerTurn(state, rng) {
  const bt = state.bt;
  if (!bt || state.ph !== "COMBAT") return;

  // 1. Player end-of-turn relics & powers
  if (hasRelic(state, "Orichalcum") && bt.b === 0) {
    gainPlayerBlock(state, bt, 6, false, rng);
  }
  if ((bt.pw.Metallicize || 0) > 0) {
    gainPlayerBlock(state, bt, bt.pw.Metallicize, false, rng);
  }
  if ((bt.pw.PlatedArmor || 0) > 0) {
    gainPlayerBlock(state, bt, bt.pw.PlatedArmor, false, rng);
  }
  if ((bt.pw.Combust || 0) > 0) {
    losePlayerHp(state, bt, 1, false, rng);
    for (const m of bt.m.slice()) if (m.hp > 0) damageMonster(state, bt, m, bt.pw.Combust, "THORNS", rng);
  }
  if ((bt.pw.Regen || 0) > 0) {
    healPlayer(state, bt.pw.Regen, true);
    bt.pw.Regen--;
    if (bt.pw.Regen <= 0) delete bt.pw.Regen;
  }
  if ((bt.pw.Constricted || 0) > 0) {
    const cDmg = bt.pw.Constricted;
    const b = Math.min(bt.b, cDmg);
    bt.b -= b;
    if (cDmg - b > 0) losePlayerHp(state, bt, cDmg - b, false, rng);
  }
  if (bt.t === 7 && hasRelic(state, "StoneCalendar")) {
    for (const m of bt.m.slice()) if (m.hp > 0) damageMonster(state, bt, m, 52, "THORNS", rng);
  }
  if ((bt.pw.LoseStrength || 0) > 0) {
    applyPlayerPower(state, bt, "Strength", -bt.pw.LoseStrength);
    delete bt.pw.LoseStrength;
  }
  if ((bt.pw.LoseDexterity || 0) > 0) {
    applyPlayerPower(state, bt, "Dexterity", -bt.pw.LoseDexterity);
    delete bt.pw.LoseDexterity;
  }
  delete bt.pw.Rage;
  delete bt.pw.DoubleTap;
  delete bt.pw.Duplication;
  delete bt.pw.NoDraw;
  delete bt.pw.Entangled;

  // 2. End-of-turn cards in hand (Burn, Decay, Doubt, Shame, Regret, Ethereal)
  const handSnapshot = bt.h.slice();
  const keptHand = [];
  for (const c of handSnapshot) {
    const def = getCardDef(c);
    if (def.id === "Burn") {
      const bDmg = def.mag;
      const b = Math.min(bt.b, bDmg);
      bt.b -= b;
      if (bDmg - b > 0) losePlayerHp(state, bt, bDmg - b, false, rng);
    } else if (def.id === "Decay") {
      const b = Math.min(bt.b, 2);
      bt.b -= b;
      if (2 - b > 0) losePlayerHp(state, bt, 2 - b, false, rng);
    } else if (def.id === "Doubt") {
      applyPlayerPower(state, bt, "Weak", 1);
    } else if (def.id === "Shame") {
      applyPlayerPower(state, bt, "Frail", 1);
    } else if (def.id === "Regret") {
      losePlayerHp(state, bt, handSnapshot.length, false, rng);
    }
    if (def.ethereal) {
      triggerExhaustCard(state, bt, c, rng);
    } else if (hasRelic(state, "Runic Pyramid")) {
      // Strip temporary 0-cost modifier at end of turn
      keptHand.push(def.id + (def.up > 1 ? "+" + def.up : (def.up ? "+" : "")));
    } else {
      const clean = def.id + (def.up > 1 ? "+" + def.up : (def.up ? "+" : "")) + (def.id === "Rampage" && def.mod && !def.mod.startsWith("c") ? "|" + def.mod : "");
      bt.di.push(clean);
    }
  }
  bt.h = keptHand;

  if (state.hp <= 0) { onPlayerDefeat(state); return; }
  if (isCombatWon(bt)) { onCombatVictory(state, rng); return; }

  // 3. Monsters start of turn (lose block unless Barricade) & execute turns
  for (const m of bt.m) {
    if (m.hp > 0 && !m.pw.Barricade) m.b = 0;
    if (m.pw.Slow !== undefined) m.pw.Slow = 0;
  }

  const mCopy = bt.m.slice();
  for (let i = 0; i < mCopy.length; i++) {
    const m = mCopy[i];
    const curIdx = bt.m.indexOf(m);
    if (curIdx === -1) continue;
    executeMonsterTurn(m, curIdx, bt, state, rng);
    if (state.hp <= 0) { onPlayerDefeat(state); return; }
  }

  // 4. Monsters end-of-turn powers (Ritual, Metallicize, PlatedArmor, RegenerateMonster, Fading, Shifting, Weak/Vuln/Intangible tick)
  for (const m of bt.m) {
    if (m.hp <= 0 && !m.st.halfDead) continue;
    if ((m.pw.Ritual || 0) > 0) applyMonsterPower(state, bt, m, "Strength", m.pw.Ritual);
    if ((m.pw.GenericStrengthUp || 0) > 0) applyMonsterPower(state, bt, m, "Strength", m.pw.GenericStrengthUp);
    if ((m.pw.Metallicize || 0) > 0) m.b += m.pw.Metallicize;
    if ((m.pw.PlatedArmor || 0) > 0) m.b += m.pw.PlatedArmor;
    if ((m.pw.RegenerateMonster || 0) > 0 && m.hp > 0) m.hp = Math.min(m.mhp, m.hp + m.pw.RegenerateMonster);
    if (m.st.shiftLoss) {
      applyMonsterPower(state, bt, m, "Strength", m.st.shiftLoss);
      m.st.shiftLoss = 0;
    }
    if (m.st.baseMal) m.pw.Malleable = m.st.baseMal;
    if (m.id === "Byrd" && !m.st.air && m.mv === 4) {
      m.st.air = true;
      m.pw.Flight = 3;
    }
    if ((m.pw.Fading || 0) > 0) {
      m.pw.Fading--;
      if (m.pw.Fading <= 0) { m.hp = 0; m.b = 0; addLog(state, m.name + " 消逝了！"); }
    }
    for (const dKey of ["Weak", "Vulnerable", "Intangible"]) {
      if ((m.pw[dKey] || 0) > 0) {
        m.pw[dKey]--;
        if (m.pw[dKey] <= 0) delete m.pw[dKey];
      }
    }
  }

  if (isCombatWon(bt)) { onCombatVictory(state, rng); return; }

  // Roll next monster moves
  for (const m of bt.m) {
    rollMonsterMove(m, bt, state, rng);
  }

  // 5. Player start of next turn
  const prevAtks = bt.at || 0;
  const prevCards = bt.ct || 0;
  bt.t += 1;
  bt.ct = 0; bt.at = 0; bt.sk = 0; bt.po = 0; bt.pelletsDone = false;

  // Player Block decay
  if ((bt.pw.Barricade || 0) > 0) {
    // Keep all block
  } else if (hasRelic(state, "Calipers")) {
    bt.b = Math.max(0, bt.b - 15);
  } else {
    bt.b = 0;
  }
  if ((bt.pw.NextTurnBlock || 0) > 0) {
    gainPlayerBlock(state, bt, bt.pw.NextTurnBlock, false, rng);
    delete bt.pw.NextTurnBlock;
  }
  if (bt.t === 2 && hasRelic(state, "HornCleat")) gainPlayerBlock(state, bt, 14, false, rng);
  if (bt.t === 3 && hasRelic(state, "CaptainsWheel")) gainPlayerBlock(state, bt, 18, false, rng);
  delete bt.pw.FlameBarrier;

  // Player debuff ticks
  for (const dKey of ["Weak", "Vulnerable", "Frail", "Intangible", "NoBlock"]) {
    if ((bt.pw[dKey] || 0) > 0) {
      bt.pw[dKey]--;
      if (bt.pw[dKey] <= 0) delete bt.pw[dKey];
    }
  }
  if ((bt.pw.Ritual || 0) > 0) applyPlayerPower(state, bt, "Strength", bt.pw.Ritual);
  if ((bt.pw.DemonForm || 0) > 0) applyPlayerPower(state, bt, "Strength", bt.pw.DemonForm);
  if ((bt.pw.Brutality || 0) > 0) {
    losePlayerHp(state, bt, bt.pw.Brutality, false, rng);
    drawCards(state, bt, bt.pw.Brutality, rng);
  }

  // Energy replenish
  if (hasRelic(state, "Ice Cream")) bt.e += bt.me;
  else bt.e = bt.me;
  if ((bt.pw.Berserk || 0) > 0) bt.e += bt.pw.Berserk;
  if ((state.rt === "E" || state.rt === "B") && hasRelic(state, "SlaversCollar")) bt.e += 1;
  if (hasRelic(state, "Art of War") && prevAtks === 0) bt.e += 1;
  if (hasRelic(state, "Happy Flower") && bt.t % 3 === 0) bt.e += 1;
  if (hasRelic(state, "Incense Burner") && bt.t % 6 === 0) applyPlayerPower(state, bt, "Intangible", 1);
  if (hasRelic(state, "Mercury Hourglass")) {
    for (const m of bt.m.slice()) if (m.hp > 0) damageMonster(state, bt, m, 3, "THORNS", rng);
  }

  // Draw cards for turn
  let drawCnt = 5;
  if (hasRelic(state, "Snecko Eye")) drawCnt += 2;
  if (hasRelic(state, "Pocketwatch") && prevCards <= 3) drawCnt += 3;
  if ((bt.pw.DrawReduction || 0) > 0) {
    drawCnt = Math.max(0, drawCnt - 1);
    delete bt.pw.DrawReduction;
  }
  drawCards(state, bt, drawCnt, rng);

  // Mayhem power
  if ((bt.pw.Mayhem || 0) > 0 && bt.dr.length > 0) {
    const top = bt.dr.pop();
    executeSingleCardEffect(state, bt, top, 0, 0, rng);
    bt.di.push(top);
  }

  if (state.hp <= 0) onPlayerDefeat(state);
  else if (isCombatWon(bt)) onCombatVictory(state, rng);
}


function obtainRelic(state, relId, rng) {
  if (!relId || !RELICS[relId] || hasRelic(state, relId)) return false;
  if (!state.rc) state.rc = {};
  if (relId === "Black Blood") {
    const idx = state.rel.indexOf("Burning Blood");
    if (idx !== -1) state.rel.splice(idx, 1, "Black Blood");
    else state.rel.push("Black Blood");
  } else {
    state.rel.push(relId);
  }
  const rDef = RELICS[relId];
  addLog(state, "获得遗物【" + rDef.name + "】");

  switch (relId) {
    case "Strawberry": state.mhp += 7; state.hp += 7; break;
    case "Pear": state.mhp += 10; state.hp += 10; break;
    case "Mango": state.mhp += 14; state.hp += 14; break;
    case "Waffle":
    case "Lee's Waffle": state.mhp += 7; state.hp = state.mhp; break;
    case "Old Coin": addGold(state, 300); break;
    case "Potion Belt": state.pot.push("", ""); break;
    case "Omamori": state.rc.Omamori = 2; break;
    case "War Paint":
    case "Whetstone": {
      const targetType = relId === "War Paint" ? "S" : "A";
      const cands = [];
      for (let i = 0; i < state.dk.length; i++) {
        const d = getCardDef(state.dk[i]);
        if (d.up === 0 && d.type === targetType) cands.push(i);
      }
      rng.shuffle(cands);
      for (let i = 0; i < Math.min(2, cands.length); i++) {
        const idx = cands[i];
        state.dk[idx] = getCardDef(state.dk[idx]).id + "+";
      }
      break;
    }
    case "Cauldron":
      for (let i = 0; i < state.pot.length; i++) {
        if (!state.pot[i]) state.pot[i] = rollPotion(state, rng);
      }
      break;
    case "Calling Bell":
      addCardToMasterDeck(state, "CurseOfTheBell", rng);
      obtainRelic(state, rollRelic(state, rng, "C"), rng);
      obtainRelic(state, rollRelic(state, rng, "U"), rng);
      obtainRelic(state, rollRelic(state, rng, "R"), rng);
      break;
    case "Pandora's Box": {
      const pool = Object.keys(RAW_CARDS).filter(k => ["C", "U", "R"].indexOf(RAW_CARDS[k][2]) !== -1);
      for (let i = 0; i < state.dk.length; i++) {
        const id = getCardDef(state.dk[i]).id;
        if (id === "Strike_R" || id === "Defend_R") {
          state.dk[i] = rng.pick(pool);
        }
      }
      break;
    }
    case "Astrolabe": {
      const pool = Object.keys(RAW_CARDS).filter(k => ["C", "U", "R"].indexOf(RAW_CARDS[k][2]) !== -1);
      let transformed = 0;
      for (let i = 0; i < state.dk.length && transformed < 3; i++) {
        const id = getCardDef(state.dk[i]).id;
        if (id === "Strike_R" || id === "Defend_R") {
          state.dk[i] = rng.pick(pool) + "+";
          transformed++;
        }
      }
      break;
    }
    case "Tiny House": {
      addGold(state, 50);
      state.mhp += 5; state.hp += 5;
      const pSlot = state.pot.indexOf("");
      if (pSlot !== -1 && !hasRelic(state, "Sozu")) state.pot[pSlot] = rollPotion(state, rng);
      const upIdx = [];
      for (let i = 0; i < state.dk.length; i++) {
        const d = getCardDef(state.dk[i]);
        if (d.up === 0 && d.type !== "ST" && d.type !== "C") upIdx.push(i);
      }
      if (upIdx.length > 0) {
        const pick = rng.pick(upIdx);
        state.dk[pick] = getCardDef(state.dk[pick]).id + "+";
      }
      break;
    }
    case "NeowsBlessing":
    case "NeowsLament":
      state.rc.Neow = 3;
      break;
  }
  return true;
}

function rollRelic(state, rng, tier) {
  const tiers = tier ? (tier === "S" ? ["SH"] : [tier]) : ["C", "U", "R"];
  for (const t of tiers) {
    const candidates = Object.keys(RELICS).filter(k => RELICS[k].tier === t && !hasRelic(state, k));
    if (candidates.length > 0) return rng.pick(candidates);
  }
  const fallback = Object.keys(RELICS).filter(k => ["C", "U", "R"].indexOf(RELICS[k].tier) !== -1 && !hasRelic(state, k));
  return fallback.length > 0 ? rng.pick(fallback) : "Circlet";
}

function rollPotion(state, rng) {
  const keys = Object.keys(POTIONS);
  return rng.pick(keys);
}

function maybeAutoUpgradeCard(state, cardId, rng, allowRandomUp) {
  const raw = RAW_CARDS[cardId];
  if (!raw) return cardId;
  const type = raw[1];
  if (type === "A" && hasRelic(state, "Molten Egg 2")) return cardId + "+";
  if (type === "S" && hasRelic(state, "Toxic Egg 2")) return cardId + "+";
  if (type === "P" && hasRelic(state, "Frozen Egg 2")) return cardId + "+";
  if (allowRandomUp && raw[2] !== "R") {
    const upChance = state.a === 2 ? 0.25 : (state.a >= 3 ? 0.5 : 0);
    if (rng.next() < upChance) return cardId + "+";
  }
  return cardId;
}

function rollCardRewards(state, rng, roomType, countOverride) {
  let count = countOverride !== undefined ? countOverride : 3;
  if (countOverride === undefined) {
    if (hasRelic(state, "Question Card")) count += 1;
    if (hasRelic(state, "Busted Crown")) count = Math.max(1, count - 2);
  }
  const commons = IRONCLAD_POOL.filter(k => RAW_CARDS[k][2] === "C");
  const uncommons = IRONCLAD_POOL.filter(k => RAW_CARDS[k][2] === "U");
  const rares = IRONCLAD_POOL.filter(k => RAW_CARDS[k][2] === "R");

  const picked = [];
  for (let i = 0; i < count; i++) {
    let pool = commons;
    if (roomType === "B") {
      pool = rares;
    } else {
      const r = rng.next();
      const rareChance = roomType === "E" ? 0.10 : 0.03;
      const uncChance = roomType === "E" ? 0.40 : 0.37;
      if (r < rareChance) pool = rares;
      else if (r < rareChance + uncChance) pool = uncommons;
      else pool = commons;
    }
    const avail = pool.filter(k => picked.indexOf(k) === -1 && picked.indexOf(k + "+") === -1);
    const baseId = avail.length > 0 ? rng.pick(avail) : rng.pick(pool);
    picked.push(maybeAutoUpgradeCard(state, baseId, rng, roomType !== "B"));
  }
  return picked;
}

function onCombatVictory(state, rng) {
  state.bt = null;
  if (hasRelic(state, "Burning Blood")) healPlayer(state, 6, false);
  if (hasRelic(state, "Black Blood")) healPlayer(state, 12, false);
  if (hasRelic(state, "Meat on the Bone") && state.hp <= Math.floor(state.mhp * 0.5)) healPlayer(state, 12, false);
  if (hasRelic(state, "FaceOfCleric")) { state.mhp += 1; state.hp += 1; }

  if (state.rt === "E") state.ek = (state.ek || 0) + 1;
  if (state.rt === "B") state.bk = (state.bk || 0) + 1;

  // Act 3 Boss victory -> Full 3-Act Spire Cleared!
  if (state.rt === "B" && state.a >= 3) {
    state.ph = "VICTORY";
    addLog(state, "🎉 恭喜！你击败了第三幕终极首领，成功登顶杀戮尖塔！");
    return;
  }

  let gold = state.rt === "B" ? rng.range(95, 105) : (state.rt === "E" ? rng.range(25, 35) : rng.range(10, 20));
  if (hasRelic(state, "Golden Idol")) gold = Math.floor(gold * 1.25);
  if (hasRelic(state, "Ectoplasm")) gold = 0;

  let pot = "";
  if (!hasRelic(state, "Sozu")) {
    const potChance = hasRelic(state, "White Beast Statue") ? 1.0 : 0.40;
    if (rng.next() < potChance) pot = rollPotion(state, rng);
  }

  const rels = [];
  if (state.rt === "E") {
    const rTier = rng.next() < 0.25 ? "R" : (rng.next() < 0.5 ? "U" : "C");
    rels.push(rollRelic(state, rng, rTier));
    if (hasRelic(state, "Black Star")) {
      const r2 = rollRelic(state, rng, rng.next() < 0.35 ? "R" : "U");
      if (r2 && rels.indexOf(r2) === -1) rels.push(r2);
    }
  }

  const cards = rollCardRewards(state, rng, state.rt);
  state.rw = { g: gold, pot, rel: rels, cards, cp: false };
  state.ph = "REWARD";
  addLog(state, "战斗胜利！清点战利品。");
}

function onPlayerDefeat(state) {
  state.bt = null;
  state.ph = "DEFEAT";
  addLog(state, "☠️ 你在尖塔中倒下了……");
}

function calcBounty(state, args, maxReward) {
  if (!maxReward || maxReward <= 0) return 0;
  if (state.ph === "VICTORY") return maxReward;

  // Progressive bounty based on Act/Floor climbed, Elites slain, and Act Bosses defeated
  const floorPct = Math.min(48, state.fl || 0) * 0.012; // up to 57.6% across 48 floors
  const elitePct = (state.ek || 0) * 0.04;              // +4% per Elite
  const bossPct = (state.bk || 0) * 0.14;               // +14% per Act Boss
  const rawPct = Math.min(0.92, floorPct + elitePct + bossPct);
  const fullPending = Math.floor(maxReward * rawPct);

  if (state.ph === "DEFEAT") {
    const retainPct = (args && typeof args.retainPercent === "number")
      ? Math.max(0, Math.min(100, args.retainPercent))
      : 50;
    const retained = Math.floor(fullPending * retainPct / 100);
    if (retained === 0 && (state.fl || 0) >= 2 && retainPct > 0 && fullPending > 0) return 1;
    return retained;
  }
  return fullPending;
}

function startEvent(state, rng, eventIdOverride) {
  let evId = eventIdOverride;
  if (!evId) {
    const shrines = ["GoldenShrine", "Purifier", "UpgradeShrine"];
    const actPool = state.a === 1
      ? ["BigFish", "TheCleric", "GoldenIdol", "ScrapOoze", "ShiningLight", "LivingWall"].concat(shrines)
      : (state.a === 2
        ? ["Vampires", "Apparitions", "AncientWriting", "TheLibrary", "CursedTome", "LivingWall"].concat(shrines)
        : ["MindBloom", "SensoryStone", "AncientWriting", "Purifier", "UpgradeShrine", "GoldenShrine"]);
    evId = rng.pick(actPool);
  }
  state.ev = { id: evId };
  state.ph = evId === "NEOW" ? "NEOW" : "EVENT";
  addLog(state, "触发事件：【" + (EVENTS_DEF[evId] ? EVENTS_DEF[evId].title : evId) + "】");
}

function handleEventAction(state, choiceIdx, cardIdx, rng) {
  const evId = state.ev ? state.ev.id : (state.ph === "NEOW" ? "NEOW" : "BigFish");
  const cIdx = Number(choiceIdx) || 0;
  const dkIdx = (cardIdx !== undefined && cardIdx !== null) ? Number(cardIdx) : 0;

  const removePickedCard = () => {
    if (state.dk.length <= 1) return;
    const idx = (dkIdx >= 0 && dkIdx < state.dk.length) ? dkIdx : 0;
    const removed = getCardDef(state.dk[idx]);
    state.dk.splice(idx, 1);
    addLog(state, "从牌组移除了【" + removed.name + "】");
  };

  const upgradePickedCard = () => {
    let idx = (dkIdx >= 0 && dkIdx < state.dk.length) ? dkIdx : -1;
    if (idx === -1 || getCardDef(state.dk[idx]).up > 0) {
      idx = state.dk.findIndex(c => { const d = getCardDef(c); return d.up === 0 && d.type !== "ST" && d.type !== "C"; });
    }
    if (idx !== -1) {
      const d = getCardDef(state.dk[idx]);
      state.dk[idx] = d.id + "+";
      addLog(state, "升级了【" + d.name + "+】");
    }
  };

  const transformPickedCard = () => {
    const idx = (dkIdx >= 0 && dkIdx < state.dk.length) ? dkIdx : 0;
    const pool = Object.keys(RAW_CARDS).filter(k => ["C", "U", "R"].indexOf(RAW_CARDS[k][2]) !== -1);
    const newCard = rng.pick(pool);
    state.dk[idx] = newCard;
    addLog(state, "卡牌变化为【" + getCardDef(newCard).name + "】");
  };

  switch (evId) {
    case "NEOW":
      if (cIdx === 0) { state.mhp += 8; state.hp += 8; addLog(state, "涅奥赐福：最大生命 +8"); }
      else if (cIdx === 1) { obtainRelic(state, "NeowsLament", rng); }
      else if (cIdx === 2) { addGold(state, 100); addLog(state, "涅奥赐福：获得 100 金币"); }
      else {
        state.hp = Math.max(1, state.hp - 8);
        obtainRelic(state, rollRelic(state, rng, "R"), rng);
      }
      break;
    case "BigFish":
      if (cIdx === 0) healPlayer(state, Math.floor(state.mhp * 0.33), false);
      else if (cIdx === 1) { state.mhp += 5; state.hp += 5; }
      else { obtainRelic(state, rollRelic(state, rng), rng); addCardToMasterDeck(state, "Regret", rng); }
      break;
    case "TheCleric":
      if (cIdx === 0 && state.g >= 35) { state.g -= 35; healPlayer(state, Math.floor(state.mhp * 0.25), false); }
      else if (cIdx === 1 && state.g >= 50) { state.g -= 50; removePickedCard(); }
      break;
    case "GoldenIdol":
      if (cIdx === 0) {
        obtainRelic(state, "Golden Idol", rng);
        state.hp = Math.max(1, state.hp - Math.floor(state.mhp * 0.25));
      }
      break;
    case "ScrapOoze":
      if (cIdx === 0) {
        state.hp = Math.max(1, state.hp - 6);
        obtainRelic(state, rollRelic(state, rng), rng);
      }
      break;
    case "ShiningLight":
      if (cIdx === 0) {
        state.hp = Math.max(1, state.hp - Math.floor(state.mhp * 0.20));
        const upCands = [];
        for (let i = 0; i < state.dk.length; i++) {
          const d = getCardDef(state.dk[i]);
          if (d.up === 0 && d.type !== "ST" && d.type !== "C") upCands.push(i);
        }
        rng.shuffle(upCands);
        for (let i = 0; i < Math.min(2, upCands.length); i++) {
          const idx = upCands[i];
          state.dk[idx] = getCardDef(state.dk[idx]).id + "+";
        }
      }
      break;
    case "LivingWall":
      if (cIdx === 0) removePickedCard();
      else if (cIdx === 1) transformPickedCard();
      else upgradePickedCard();
      break;
    case "Vampires":
      if (cIdx === 0) {
        const loss = Math.floor(state.mhp * 0.30);
        state.mhp = Math.max(1, state.mhp - loss);
        state.hp = Math.min(state.hp, state.mhp);
        state.dk = state.dk.filter(c => getCardDef(c).id !== "Strike_R");
        for (let i = 0; i < 5; i++) addCardToMasterDeck(state, "Bite", rng);
      }
      break;
    case "Apparitions":
      if (cIdx === 0) {
        state.mhp = Math.max(1, Math.floor(state.mhp * 0.5));
        state.hp = Math.min(state.hp, state.mhp);
        for (let i = 0; i < 3; i++) addCardToMasterDeck(state, "Ghostly", rng);
      }
      break;
    case "AncientWriting":
      if (cIdx === 0) removePickedCard();
      else {
        for (let i = 0; i < state.dk.length; i++) {
          const d = getCardDef(state.dk[i]);
          if ((d.id === "Strike_R" || d.id === "Defend_R") && d.up === 0) state.dk[i] = d.id + "+";
        }
      }
      break;
    case "TheLibrary":
      if (cIdx === 0) {
        const pool = Object.keys(RAW_CARDS).filter(k => ["U", "R"].indexOf(RAW_CARDS[k][2]) !== -1);
        addCardToMasterDeck(state, rng.pick(pool) + "+", rng);
      } else {
        healPlayer(state, Math.floor(state.mhp * 0.33), false);
      }
      break;
    case "CursedTome":
      if (cIdx === 0) {
        state.hp = Math.max(1, state.hp - 16);
        obtainRelic(state, "Necronomicon", rng);
      }
      break;
    case "MindBloom":
      if (cIdx === 0) {
        obtainRelic(state, rollRelic(state, rng, "R"), rng);
        addGold(state, 100);
      } else if (cIdx === 1) {
        for (let i = 0; i < state.dk.length; i++) {
          const d = getCardDef(state.dk[i]);
          if (d.up === 0 && d.type !== "ST" && d.type !== "C") state.dk[i] = d.id + "+";
        }
        addCardToMasterDeck(state, "Normality", rng);
      } else {
        healPlayer(state, state.mhp, false);
      }
      break;
    case "SensoryStone": {
      const clPool = COLORLESS_CARDS;
      if (cIdx === 0) {
        for (let i = 0; i < 2; i++) addCardToMasterDeck(state, rng.pick(clPool), rng);
      } else {
        state.hp = Math.max(1, state.hp - 5);
        for (let i = 0; i < 3; i++) addCardToMasterDeck(state, rng.pick(clPool) + "+", rng);
      }
      break;
    }
    case "GoldenShrine":
      if (cIdx === 0) addGold(state, 100);
      else if (cIdx === 1) { addGold(state, 275); addCardToMasterDeck(state, "Regret", rng); }
      break;
    case "Purifier":
      if (cIdx === 0) removePickedCard();
      break;
    case "UpgradeShrine":
      if (cIdx === 0) upgradePickedCard();
      break;
  }

  state.ev = null;
  state.ph = "MAP";
}

// ============================================================================
// MERCHANT SHOP ($), REST SITE (R), TREASURE (T), REWARD, BOSS RELIC
// ============================================================================
function calcShopPrice(state, basePrice) {
  let mult = 1.0;
  if (hasRelic(state, "Membership Card")) mult *= 0.5;
  if (hasRelic(state, "The Courier")) mult *= 0.8;
  return Math.max(1, Math.floor(basePrice * mult));
}

function generateShop(state, rng) {
  const attacks = IRONCLAD_POOL.filter(k => RAW_CARDS[k][1] === "A");
  const skills = IRONCLAD_POOL.filter(k => RAW_CARDS[k][1] === "S");
  const powers = IRONCLAD_POOL.filter(k => RAW_CARDS[k][1] === "P");
  const colorless = COLORLESS_CARDS;

  const rawCards = [
    rng.pick(attacks), rng.pick(attacks),
    rng.pick(skills), rng.pick(skills),
    rng.pick(powers),
    rng.pick(colorless), rng.pick(colorless),
  ];
  const saleIdx = rng.range(0, 4);
  const cards = rawCards.map((cid, idx) => {
    const upCid = maybeAutoUpgradeCard(state, cid, rng, false);
    const rar = RAW_CARDS[cid][2];
    const base = rar === "R" ? rng.range(135, 165) : (rar === "U" || rar === "CL" ? rng.range(68, 82) : rng.range(45, 55));
    const price = calcShopPrice(state, idx === saleIdx ? Math.floor(base * 0.5) : base);
    return { c: upCid, p: price, sale: idx === saleIdx };
  });

  const relCands = [
    rollRelic(state, rng, rng.next() < 0.5 ? "C" : "U"),
    rollRelic(state, rng, rng.next() < 0.6 ? "U" : "R"),
    rollRelic(state, rng, "S"),
  ];
  const relics = relCands.map(rid => {
    const tier = RELICS[rid] ? RELICS[rid].tier : "C";
    const base = tier === "R" ? rng.range(285, 315) : (tier === "U" ? rng.range(235, 265) : rng.range(143, 157));
    return { r: rid, p: calcShopPrice(state, base) };
  });

  const pots = [rollPotion(state, rng), rollPotion(state, rng), rollPotion(state, rng)].map(pid => ({
    id: pid,
    p: calcShopPrice(state, rng.range(48, 58)),
  }));

  const purgeCost = hasRelic(state, "Smiling Mask") ? 50 : calcShopPrice(state, 75 + (state.pr || 0) * 25);
  state.sh = { cards, relics, pots, purge: purgeCost, purged: false };
  state.ph = "SHOP";
  addLog(state, "进入商人店铺。");
}

function handleShopAction(state, act, rng) {
  const sh = state.sh;
  if (!sh) { state.ph = "MAP"; return; }
  const type = act.type;
  const idx = Number(act.index ?? act.cardIdx ?? 0);

  if (type === "shop_buy_card") {
    const item = sh.cards[idx];
    if (item && !item.sold && state.g >= item.p) {
      state.g -= item.p;
      item.sold = true;
      addCardToMasterDeck(state, item.c, rng);
      if (hasRelic(state, "The Courier")) {
        const pool = Object.keys(RAW_CARDS).filter(k => ["C", "U", "R"].indexOf(RAW_CARDS[k][2]) !== -1);
        const nc = rng.pick(pool);
        sh.cards[idx] = { c: maybeAutoUpgradeCard(state, nc, rng, false), p: calcShopPrice(state, 65), sale: false };
      }
    }
  } else if (type === "shop_buy_relic") {
    const item = sh.relics[idx];
    if (item && !item.sold && state.g >= item.p) {
      state.g -= item.p;
      item.sold = true;
      obtainRelic(state, item.r, rng);
    }
  } else if (type === "shop_buy_potion") {
    const item = sh.pots[idx];
    const emptySlot = state.pot.indexOf("");
    if (item && !item.sold && emptySlot !== -1 && state.g >= item.p && !hasRelic(state, "Sozu")) {
      state.g -= item.p;
      item.sold = true;
      state.pot[emptySlot] = item.id;
      addLog(state, "购买了【" + POTIONS[item.id].name + "】");
    }
  } else if (type === "shop_purge") {
    if (!sh.purged && state.g >= sh.purge && state.dk.length > 1) {
      const cIdx = (idx >= 0 && idx < state.dk.length) ? idx : 0;
      const d = getCardDef(state.dk[cIdx]);
      state.g -= sh.purge;
      sh.purged = true;
      state.pr = (state.pr || 0) + 1;
      state.dk.splice(cIdx, 1);
      addLog(state, "移除卡牌【" + d.name + "】");
    }
  } else if (type === "leave_shop") {
    state.sh = null;
    state.ph = "MAP";
    addLog(state, "离开商店。");
  }
}

function handleRestAction(state, act, rng) {
  const type = act.type;
  const idx = Number(act.cardIdx ?? act.index ?? 0);

  if (type === "rest_heal") {
    if (hasRelic(state, "Coffee Dripper")) return;
    let amt = Math.floor(state.mhp * 0.30);
    if (hasRelic(state, "Regal Pillow")) amt += 15;
    healPlayer(state, amt, false);
    if (hasRelic(state, "Dream Catcher")) {
      state.rw = { g: 0, pot: "", rel: [], cards: rollCardRewards(state, rng, "M"), cp: false };
      state.ph = "REWARD";
      addLog(state, "在火堆小憩恢复生命，【捕梦网】带来了卡牌奖励！");
      return;
    }
    state.ph = "MAP";
    addLog(state, "在火堆休息，恢复了 " + amt + " 点生命。");
  } else if (type === "rest_smith") {
    if (hasRelic(state, "Fusion Hammer")) return;
    if (idx >= 0 && idx < state.dk.length) {
      const d = getCardDef(state.dk[idx]);
      if (d.type !== "ST" && d.type !== "C" && (d.up === 0 || d.id === "Searing Blow")) {
        state.dk[idx] = d.id === "Searing Blow" ? ("Searing Blow+" + (d.up + 1)) : (d.id + "+");
        addLog(state, "在火堆锻造升级了【" + getCardDef(state.dk[idx]).name + "】！");
        state.ph = "MAP";
      }
    }
  } else if (type === "rest_lift") {
    if (!state.rc) state.rc = {};
    if (hasRelic(state, "Girya") && (state.rc.Girya || 0) < 3) {
      state.rc.Girya = (state.rc.Girya || 0) + 1;
      addLog(state, "举起【壶铃】锻炼！永久力量 +1（当前 +" + state.rc.Girya + "）");
      state.ph = "MAP";
    }
  } else if (type === "rest_dig") {
    if (hasRelic(state, "Shovel")) {
      obtainRelic(state, rollRelic(state, rng), rng);
      state.ph = "MAP";
    }
  } else if (type === "rest_toke") {
    if (hasRelic(state, "Peace Pipe") && state.dk.length > 1 && idx >= 0 && idx < state.dk.length) {
      const d = getCardDef(state.dk[idx]);
      state.dk.splice(idx, 1);
      addLog(state, "抽起【宁静烟斗】，移除了【" + d.name + "】");
      state.ph = "MAP";
    }
  } else if (type === "cash_out" || type === "rest_retreat") {
    state.ph = "RETREAT";
    addLog(state, "💰 你在营火旁选择见好就收，携带当前战利品安全撤离尖塔！");
  } else if (type === "leave_rest") {
    state.ph = "MAP";
  }
}

function handleTreasureAction(state, act, rng) {
  if (act.type === "open_treasure") {
    const rTier = rng.next() < 0.15 ? "R" : (rng.next() < 0.50 ? "U" : "C");
    const rels = [rollRelic(state, rng, rTier)];
    if (hasRelic(state, "Matryoshka") && (state.mt || 0) < 2) {
      state.mt = (state.mt || 0) + 1;
      rels.push(rollRelic(state, rng, "C"));
    }
    if (hasRelic(state, "Cursed Key")) {
      const curses = ["Regret", "Pain", "Decay", "Doubt", "Shame", "Injury", "Clumsy", "Writhe"];
      addCardToMasterDeck(state, rng.pick(curses), rng);
    }
    const gold = rng.next() < 0.5 ? rng.range(25, 55) : 0;
    state.rw = { g: gold, pot: "", rel: rels, cards: [], cp: true };
    state.ph = "REWARD";
    addLog(state, "打开宝箱！");
  } else if (act.type === "leave_treasure") {
    state.ph = "MAP";
  }
}

function proceedAfterReward(state, rng) {
  state.rw = null;
  if (state.rt === "B") {
    if (state.a >= 3) {
      state.ph = "VICTORY";
      addLog(state, "🎉 恭喜登顶杀戮尖塔！");
    } else {
      // Roll 3 Boss Relics
      const bossPool = Object.keys(RELICS).filter(k => RELICS[k].tier === "B" && !hasRelic(state, k) && (k !== "Black Blood" || hasRelic(state, "Burning Blood")));
      rng.shuffle(bossPool);
      state.br = bossPool.slice(0, 3);
      state.ph = "BOSS_RELIC";
      addLog(state, "击败第 " + state.a + " 幕首领！请选择 1 件首领遗物。");
    }
  } else {
    state.ph = "MAP";
  }
}

function handleRewardAction(state, act, rng) {
  const rw = state.rw;
  if (!rw) { proceedAfterReward(state, rng); return; }
  const type = act.type;
  const idx = Number(act.index ?? act.cardIdx ?? 0);

  if (type === "claim_reward_gold" && rw.g > 0) {
    addGold(state, rw.g);
    addLog(state, "拾取了 " + rw.g + " 金币。");
    rw.g = 0;
  } else if (type === "claim_reward_potion" && rw.pot) {
    const slot = state.pot.indexOf("");
    if (slot !== -1 && !hasRelic(state, "Sozu")) {
      state.pot[slot] = rw.pot;
      addLog(state, "拾取了【" + POTIONS[rw.pot].name + "】");
      rw.pot = "";
    }
  } else if (type === "claim_reward_relic" && rw.rel && rw.rel.length > 0) {
    const rId = rw.rel.splice(idx >= 0 && idx < rw.rel.length ? idx : 0, 1)[0];
    if (rId) obtainRelic(state, rId, rng);
  } else if (type === "pick_reward_card" && !rw.cp && rw.cards && rw.cards[idx]) {
    const picked = rw.cards[idx];
    rw.cp = true;
    addCardToMasterDeck(state, picked, rng);
  } else if (type === "skip_reward_card" && !rw.cp) {
    rw.cp = true;
    if (hasRelic(state, "Singing Bowl")) {
      state.mhp += 2; state.hp += 2;
      addLog(state, "跳过卡牌奖励，【颂钵】使最大生命 +2！");
    }
  } else if (type === "proceed_from_reward") {
    // Auto-claim gold & relics if player clicks proceed directly
    if (rw.g > 0) { addGold(state, rw.g); rw.g = 0; }
    while (rw.rel && rw.rel.length > 0) {
      obtainRelic(state, rw.rel.shift(), rng);
    }
    proceedAfterReward(state, rng);
  }
}

function advanceToNextAct(state, rng) {
  state.a += 1;
  state.r = -1;
  state.c = -1;
  state.p = [];
  state.mw = 0;
  state.br = null;
  // Heal 75% of missing HP between Acts
  const healAmt = Math.floor((state.mhp - state.hp) * 0.75);
  if (healAmt > 0) healPlayer(state, healAmt, false);
  state.ph = "MAP";
  addLog(state, "🌟 踏入第 " + state.a + " 幕【" + ACT_INFO[state.a].name + "】！恢复了 " + healAmt + " 点生命。");
}

function handleBossRelicAction(state, act, rng) {
  if (act.type === "pick_boss_relic") {
    const idx = Number(act.index ?? 0);
    if (state.br && state.br[idx]) {
      obtainRelic(state, state.br[idx], rng);
    }
    advanceToNextAct(state, rng);
  } else if (act.type === "skip_boss_relic") {
    advanceToNextAct(state, rng);
  }
}

// ============================================================================
// MAP NAVIGATION & ROOM DISPATCH
// ============================================================================
function enterMapNode(state, x, y, rng) {
  if (state.ph !== "MAP") return false;
  const map = generateActMap(state.s, state.a);
  const nextRow = state.r + 1;
  if (y !== nextRow) return false;

  // Row 15 is the Act Boss
  if (y === 15) {
    if (state.r !== 14) return false;
    state.r = 15;
    state.c = 3;
    state.p.push([3, 15]);
    state.fl = (state.fl || 0) + 1;
    if (hasRelic(state, "MawBank") && !state.mbOff) addGold(state, 12);
    const bossEnc = ACT_INFO[state.a].bosses[state.s % 3];
    startCombat(state, bossEnc, "B", rng);
    return true;
  }

  if (y < 0 || y >= 15 || x < 0 || x >= 7) return false;
  const targetNode = map[y] && map[y].find(n => n.x === x);
  if (!targetNode || !targetNode.t) return false;

  // Validate edge connection from previous node (unless Row 0 or WingedGreaves)
  if (state.r >= 0) {
    const prevNode = map[state.r] && map[state.r].find(n => n.x === state.c);
    const connected = prevNode && prevNode.e && prevNode.e.indexOf(x) !== -1;
    if (!connected && !hasRelic(state, "WingedGreaves")) return false;
  }

  state.r = y;
  state.c = x;
  state.p.push([x, y]);
  state.fl = (state.fl || 0) + 1;
  if (hasRelic(state, "MawBank") && !state.mbOff) addGold(state, 12);

  let rType = targetNode.t;
  state.rt = rType;

  // Juzu Bracelet prevents monster encounters in ? rooms
  if (rType === "?") {
    const roll = rng.next();
    if (!hasRelic(state, "Juzu Bracelet") && roll < 0.10) {
      rType = "M";
    } else if (roll < 0.15) {
      rType = "T";
    } else if (roll < 0.22) {
      rType = "$";
    }
  }

  if (rType === "M") {
    const pools = ACT_POOLS[state.a];
    const weakCount = state.a === 1 ? 3 : 2;
    const encList = (state.mw || 0) < weakCount ? pools.weak : pools.strong;
    state.mw = (state.mw || 0) + 1;
    let enc = rng.pick(encList);
    if (enc === state.le && encList.length > 1) enc = rng.pick(encList.filter(e => e !== state.le));
    state.le = enc;
    startCombat(state, enc, "M", rng);
  } else if (rType === "E") {
    const elites = ACT_POOLS[state.a].elites;
    let enc = rng.pick(elites);
    if (enc === state.le && elites.length > 1) enc = rng.pick(elites.filter(e => e !== state.le));
    state.le = enc;
    startCombat(state, enc, "E", rng);
  } else if (rType === "$") {
    if (hasRelic(state, "SSSerpentHead")) addGold(state, 50);
    if (hasRelic(state, "MealTicket")) healPlayer(state, 15, false);
    generateShop(state, rng);
  } else if (rType === "R") {
    if (hasRelic(state, "Eternal Feather")) {
      healPlayer(state, Math.floor(state.dk.length / 5) * 3, false);
    }
    if (hasRelic(state, "Ancient Tea Set")) {
      if (!state.rc) state.rc = {};
      state.rc.TeaSet = 1;
    }
    state.ph = "REST";
    addLog(state, "抵达营火休息处。");
  } else if (rType === "T") {
    state.ph = "TREASURE";
    addLog(state, "发现宝箱房！");
  } else {
    if (hasRelic(state, "SSSerpentHead")) addGold(state, 50);
    startEvent(state, rng);
  }
  return true;
}
