      break;
    case "FollowUp":
      damageMonster(state, bt, t, dmg, "NORMAL", rng);
      if (bt.lt === "A") bt.e += 1;
      break;
    case "Sanctity":
      if (bt.lt === "S") drawCards(state, bt, 2, rng);
      break;
    case "CutThroughFate":
      damageMonster(state, bt, t, dmg, "NORMAL", rng);
      scryCards(state, bt, mag, rng);
      drawCards(state, bt, 1, rng);
      break;
    case "ThirdEye":
      scryCards(state, bt, mag, rng);
      break;
    case "JustLucky":
      scryCards(state, bt, mag, rng);
      damageMonster(state, bt, t, dmg, "NORMAL", rng);
      break;
    case "DevaForm": applyPlayerPower(state, bt, "DevaForm", 1); break;
    case "Devotion": applyPlayerPower(state, bt, "Devotion", mag); break;
    case "Establishment": applyPlayerPower(state, bt, "Establishment", 1); break;
    case "Evaluate":
      bt.dr.splice(rng.int(0, bt.dr.length), 0, makeTempCard(bt, "Insight"));
      break;
    case "Fasting2":
      applyPlayerPower(state, bt, "Strength", mag);
      applyPlayerPower(state, bt, "Dexterity", mag);
      applyPlayerPower(state, bt, "Fasting", 1);
      break;
    case "FearNoEvil":
      damageMonster(state, bt, t, dmg, "NORMAL", rng);
      if (t && String(t.in).indexOf("ATTACK") !== -1) changeStance(state, bt, "Calm", rng);
      break;
    case "FlyingSleeves":
      damageMonster(state, bt, t, dmg, "NORMAL", rng);
      if (t.hp > 0) damageMonster(state, bt, t, dmg, "NORMAL", rng);
      break;
    case "ForeignInfluence": {
      const aPool = Object.keys(RAW_CARDS).filter(k => RAW_CARDS[k][1] === "A" && ["C", "U", "R"].indexOf(RAW_CARDS[k][2]) !== -1);
      let c = makeTempCard(bt, rng.pick(aPool));
      if (def.up) c = modifyCardCostInCombat(c, 0);
      if (bt.h.length < 10) bt.h.push(c);
      break;
    }
    case "Halt":
      if (bt.st === "Wrath") {
        let extraB = mag + (bt.pw.Dexterity || 0);
        if ((bt.pw.Frail || 0) > 0) extraB = Math.floor(extraB * 0.75);
        if (extraB > 0) gainPlayerBlock(state, bt, extraB, true, rng);
      }
      break;
    case "Indignation":
      if (bt.st === "Wrath") {
        for (const m of bt.m) if (m.hp > 0) applyMonsterPower(state, bt, m, "Vulnerable", mag);
      } else {
        changeStance(state, bt, "Wrath", rng);
      }
      break;
    case "InnerPeace":
      if (bt.st === "Calm") drawCards(state, bt, mag, rng);
      else changeStance(state, bt, "Calm", rng);
      break;
    case "Judgement":
      if (t.hp > 0 && t.hp <= mag) {
        damageMonster(state, bt, t, 99999, "HP_LOSS", rng);
      }
      break;
    case "LessonLearned": {
      const wasAlive = t.hp > 0;
      damageMonster(state, bt, t, dmg, "NORMAL", rng);
      if (wasAlive && t.hp <= 0 && !t.st.halfDead && !t.pw.Minion) {
        const upCands = [];
        for (let i = 0; i < state.dk.length; i++) {
          const cd = getCardDef(state.dk[i]);
          if (cd.type !== "ST" && cd.type !== "C" && (cd.up === 0 || cd.id === "Searing Blow")) upCands.push(i);
        }
        if (upCands.length > 0) {
          const uIdx = rng.pick(upCands);
          state.dk[uIdx] = upgradeCardInCombat(state.dk[uIdx]);
          addLog(state, "📚【吸取教训】永久升级了【" + getCardDef(state.dk[uIdx]).name + "】！");
        }
      }
      break;
    }
    case "LikeWater": applyPlayerPower(state, bt, "LikeWater", mag); break;
    case "MasterReality": applyPlayerPower(state, bt, "MasterReality", 1); break;
    case "Meditate":
      for (let i = 0; i < mag && bt.di.length > 0 && bt.h.length < 10; i++) {
        bt.h.push(bt.di.pop());
        bt.medRetain = (bt.medRetain || 0) + 1;
      }
      changeStance(state, bt, "Calm", rng);
      bt.endTurnRequested = true;
      break;
    case "MentalFortress": applyPlayerPower(state, bt, "MentalFortress", mag); break;
    case "Nirvana": applyPlayerPower(state, bt, "Nirvana", mag); break;
    case "Omniscience":
      if (bt.dr.length > 0) {
        const picked = bt.dr.pop();
        executeSingleCardEffect(state, bt, picked, targetIdx, 0, rng);
        if (state.hp > 0 && !isCombatWon(bt)) executeSingleCardEffect(state, bt, picked, targetIdx, 0, rng);
        triggerExhaustCard(state, bt, picked, rng);
      }
      break;
    case "Pray":
      gainMantra(state, bt, mag, rng);
      bt.dr.splice(rng.int(0, bt.dr.length), 0, makeTempCard(bt, "Insight"));
      break;
    case "Prostrate":
    case "Worship":
      gainMantra(state, bt, mag, rng);
      break;
    case "PathToVictory":
      applyMonsterPower(state, bt, t, "Mark", mag);
      for (const m of bt.m.slice()) {
        if (m.hp > 0 && (m.pw.Mark || 0) > 0) {
          damageMonster(state, bt, m, m.pw.Mark, "HP_LOSS", rng);
        }
      }
      break;
    case "Ragnarok":
      for (let i = 0; i < mag; i++) {
        const alive = bt.m.filter(x => x.hp > 0);
        if (!alive.length) break;
        const rm = rng.pick(alive);
        const d = calcPlayerCardNumbers(state, bt, cardStr, rm).dmg;
        damageMonster(state, bt, rm, d, "NORMAL", rng);
      }
      break;
    case "ReachHeaven":
      damageMonster(state, bt, t, dmg, "NORMAL", rng);
      bt.dr.splice(rng.int(0, bt.dr.length), 0, makeTempCard(bt, "ThroughViolence"));
      break;
    case "Adaptation": applyPlayerPower(state, bt, "Rushdown", 2); break;
    case "Scrawl":
      if (bt.h.length < 10) drawCards(state, bt, 10 - bt.h.length, rng);
      break;
    case "Vengeance": applyPlayerPower(state, bt, "SimmeringFury", mag); break;
    case "SpiritShield":
      if (bt.h.length > 0) gainPlayerBlock(state, bt, bt.h.length * mag, true, rng);
      break;
    case "Study": applyPlayerPower(state, bt, "Study", 1); break;
    case "Swivel": applyPlayerPower(state, bt, "FreeAttackPower", 1); break;
    case "TalkToTheHand":
      damageMonster(state, bt, t, dmg, "NORMAL", rng);
      applyMonsterPower(state, bt, t, "BlockReturn", mag);
      break;
    case "Tantrum":
      for (let i = 0; i < mag; i++) {
        if (t.hp <= 0) break;
        damageMonster(state, bt, t, dmg, "NORMAL", rng);
      }
      changeStance(state, bt, "Wrath", rng);
      break;
    case "Vault":
      bt.vaultRequested = true;
      bt.endTurnRequested = true;
      break;
    case "Wallop": {
      const unb = damageMonster(state, bt, t, dmg, "NORMAL", rng);
      if (unb > 0) gainPlayerBlock(state, bt, unb, false, rng);
      break;
    }
    case "WaveOfTheHand": applyPlayerPower(state, bt, "WaveOfTheHand", mag); break;
    case "WheelKick":
      damageMonster(state, bt, t, dmg, "NORMAL", rng);
      drawCards(state, bt, 2, rng);
      break;
    case "Wireheading": applyPlayerPower(state, bt, "Foresight", mag); break;
    case "Wish":
      applyPlayerPower(state, bt, "Strength", mag);
      applyPlayerPower(state, bt, "PlatedArmor", mag * 2);
      break;
    case "WreathOfFlame": applyPlayerPower(state, bt, "Vigor", mag); break;
    case "Miracle": bt.e += mag; break;
    case "Insight": drawCards(state, bt, mag, rng); break;
  }
  bt.lt = def.type;
}

function playCardInCombat(state, cardIdx, targetIdx, rng) {
  const bt = state.bt;
  if (!bt || cardIdx < 0 || cardIdx >= bt.h.length) return false;
  const cardStr = bt.h[cardIdx];
  if (!canPlayCard(state, bt, cardStr)) return false;

  const { def, cost } = calcPlayerCardNumbers(state, bt, cardStr, null);
  let xEnergy = 0;
  if (def.type === "C" && hasRelic(state, "Blue Candle")) {
    losePlayerHp(state, bt, 1, true, rng);
  } else if (def.type === "ST" && def.id !== "Slimed" && hasRelic(state, "Medical Kit")) {
    // 0 cost
  } else if (cost === -1) {
    xEnergy = bt.e;
    bt.e = 0;
  } else {
    bt.e = Math.max(0, bt.e - cost);
  }

  // Remove from hand
  bt.h.splice(cardIdx, 1);

  // Pain curse check in hand
  for (const c of bt.h) {
    if (getCardDef(c).id === "Pain") losePlayerHp(state, bt, 1, true, rng);
  }

  // Increment counters
  bt.ct = (bt.ct || 0) + 1;
  if (hasRelic(state, "Ink Bottle")) {
    state.rc.InkBottle = ((state.rc.InkBottle || 0) + 1) % 10;
    if (state.rc.InkBottle === 0) drawCards(state, bt, 1, rng);
  }
  for (const m of bt.m) {
    if (m.hp > 0 && m.pw.Slow !== undefined) m.pw.Slow = (m.pw.Slow || 0) + 1;
  }
  if (def.type === "A") {
    bt.at = (bt.at || 0) + 1;
    if (bt.at % 3 === 0) {
      if (hasRelic(state, "Shuriken")) applyPlayerPower(state, bt, "Strength", 1);
      if (hasRelic(state, "Kunai")) applyPlayerPower(state, bt, "Dexterity", 1);
      if (hasRelic(state, "Ornamental Fan")) gainPlayerBlock(state, bt, 4, false, rng);
    }
  } else if (def.type === "S") {
    bt.sk = (bt.sk || 0) + 1;
    if (bt.sk % 3 === 0 && hasRelic(state, "Letter Opener")) {
      for (const m of bt.m.slice()) if (m.hp > 0) damageMonster(state, bt, m, 5, "THORNS", rng);
    }
  } else if (def.type === "P") {
    bt.po = (bt.po || 0) + 1;
  }

  // Orange Pellets check
  if (hasRelic(state, "OrangePellets") && bt.at > 0 && bt.sk > 0 && bt.po > 0 && !bt.pelletsDone) {
    bt.pelletsDone = true;
    for (const k of Object.keys(bt.pw)) {
      const isNegStat = (k === "Strength" || k === "Dexterity" || k === "Focus") && bt.pw[k] < 0;
      if ((POWERS_META[k] && POWERS_META[k].debuff) || isNegStat) {
        delete bt.pw[k];
        if (bt.ja) delete bt.ja[k];
      }
    }
  }

  // Panache check
  if ((bt.pw.Panache || 0) > 0 && bt.ct % 5 === 0) {
    for (const m of bt.m.slice()) if (m.hp > 0) damageMonster(state, bt, m, bt.pw.Panache, "THORNS", rng);
  }

  // Execute effect (EchoForm / Duplication / DoubleTap / Burst / Amplify / Necronomicon)
  let repeats = 1;
  if ((bt.pw.EchoForm || 0) > 0 && (bt.echoUsed || 0) < bt.pw.EchoForm) {
    bt.echoUsed = (bt.echoUsed || 0) + 1;
    repeats++;
  }
  if ((bt.pw.Duplication || 0) > 0) {
    bt.pw.Duplication--;
    if (bt.pw.Duplication <= 0) delete bt.pw.Duplication;
    repeats++;
  } else if (def.type === "A" && (bt.pw.DoubleTap || 0) > 0) {
    bt.pw.DoubleTap--;
    if (bt.pw.DoubleTap <= 0) delete bt.pw.DoubleTap;
    repeats++;
  } else if (def.type === "S" && (bt.pw.Burst || 0) > 0) {
    bt.pw.Burst--;
    if (bt.pw.Burst <= 0) delete bt.pw.Burst;
    repeats++;
  } else if (def.type === "P" && (bt.pw.Amplify || 0) > 0) {
    bt.pw.Amplify--;
    if (bt.pw.Amplify <= 0) delete bt.pw.Amplify;
    repeats++;
  }
  if (def.type === "A" && (cost >= 2 || (cost === -1 && xEnergy >= 2)) && hasRelic(state, "Necronomicon") && !bt.necroDone) {
    bt.necroDone = true;
    repeats++;
    addLog(state, "【死灵之书】触发双重攻击！");
  }

  for (let r = 0; r < repeats; r++) {
    if (state.hp <= 0 || isCombatWon(bt)) break;
    executeSingleCardEffect(state, bt, cardStr, targetIdx, xEnergy, rng);
  }

  // Destination pile
  let cleanCard = def.id + (def.up > 1 ? "+" + def.up : (def.up ? "+" : ""));
  if (def.id === "Rampage") {
    cleanCard += "|" + ((def.extra || 0) + def.mag);
  } else if (def.id === "Glass Knife") {
    cleanCard += "|" + ((def.extra || 0) - 2);
  } else if (def.id === "Steam") {
    cleanCard += "|" + ((def.extra || 0) - 1);
  } else if (def.id === "Streamline") {
    cleanCard = modifyCardCostInCombat(cleanCard, Math.max(0, def.cost - 1));
  } else if (def.extra) {
    cleanCard += "|" + def.extra;
  }
  const shouldExhaust = def.exhaust || (def.type === "S" && (bt.pw.Corruption || 0) > 0) || def.type === "ST" || def.type === "C";
  if (def.type === "P") {
    // Power stays in play
  } else if (shouldExhaust) {
    triggerExhaustCard(state, bt, cleanCard, rng);
  } else if (def.id === "Tantrum") {
    bt.dr.splice(rng.int(0, bt.dr.length), 0, cleanCard);
  } else if (def.id !== "Rebound" && (bt.pw.Rebound || 0) > 0) {
    bt.pw.Rebound--;
    if (bt.pw.Rebound <= 0) delete bt.pw.Rebound;
    bt.dr.push(cleanCard);
  } else {
    bt.di.push(cleanCard);
  }

  addLog(state, "打出【" + def.name + "】");

  // Corrupt Heart Beat of Death check
  for (const m of bt.m) {
    if (m.hp > 0 && (m.pw.BeatOfDeath || 0) > 0 && state.hp > 0 && !isCombatWon(bt)) {
      const beat = m.pw.BeatOfDeath;
      const b = Math.min(bt.b, beat);
      bt.b -= b;
      if (beat - b > 0) losePlayerHp(state, bt, beat - b, false, rng);
    }
  }

  // Time Eater Time Warp check (every 12 cards played ends turn)
  for (const m of bt.m) {
    if (m.hp > 0 && m.pw.TimeWarp !== undefined) {
      m.pw.TimeWarp = (m.pw.TimeWarp || 0) + 1;
      if (m.pw.TimeWarp >= 12) {
        m.pw.TimeWarp = 0;
        applyMonsterPower(state, bt, m, "Strength", 2);
        addLog(state, "【时间扭曲】触发！强制结束回合并使时间吞噬者 +2 力量！");
        if (!isCombatWon(bt) && state.hp > 0) {
          delete bt.endTurnRequested;
          delete bt.vaultRequested;
          endPlayerTurn(state, rng);
          return true;
        }
      }
    }
  }

  if (bt.endTurnRequested) {
    const isVault = Boolean(bt.vaultRequested);
    delete bt.endTurnRequested;
    delete bt.vaultRequested;
    if (!isCombatWon(bt) && state.hp > 0) {
      endPlayerTurn(state, rng, isVault);
      return true;
    }
  }

  if (state.hp <= 0) {
    onPlayerDefeat(state);
  } else if (isCombatWon(bt)) {
    onCombatVictory(state, rng);
  }
  return true;
}

function usePotion(state, potIdx, targetIdx, rng) {
  if (!state.pot || potIdx < 0 || potIdx >= state.pot.length) return false;
  const pId = state.pot[potIdx];
  if (!pId || !POTIONS[pId] || pId === "FairyPotion") return false;
  const pDef = POTIONS[pId];
  const mult = hasRelic(state, "SacredBark") ? 2 : 1;
  const val = pDef.val * mult;

  if (pId === "Fruit Juice") {
    state.pot[potIdx] = "";
    state.mhp += val;
    state.hp = Math.min(state.mhp, state.hp + val);
    if (hasRelic(state, "Toy Ornithopter")) healPlayer(state, 5, Boolean(state.bt));
    addLog(state, "饮用【果汁】，最大生命 +" + val);
    return true;
  }
  if (pId === "BloodPotion") {
    state.pot[potIdx] = "";
    healPlayer(state, Math.floor(state.mhp * val / 100), Boolean(state.bt));
    if (hasRelic(state, "Toy Ornithopter")) healPlayer(state, 5, Boolean(state.bt));
    addLog(state, "饮用【鲜血药水】恢复生命！");
    return true;
  }

  const bt = state.bt;
  if (!bt || state.ph !== "COMBAT") return false;
  state.pot[potIdx] = "";
  if (hasRelic(state, "Toy Ornithopter")) healPlayer(state, 5, true);

  const alive = bt.m.filter(x => x.hp > 0);
  const t = (targetIdx !== undefined && bt.m[targetIdx] && bt.m[targetIdx].hp > 0) ? bt.m[targetIdx] : alive[0];
  if (pDef.target === "E" && t && (bt.pw.Surrounded || 0) > 0 && alive.length >= 2) {
    for (const m of bt.m) {
      if (m === t || m.hp <= 0) delete m.pw.BackAttack;
      else m.pw.BackAttack = 1;
    }
  }

  switch (pId) {
    case "Block Potion": gainPlayerBlock(state, bt, val, false, rng); break;
    case "Fire Potion": if (t) damageMonster(state, bt, t, val, "THORNS", rng); break;
    case "Explosive Potion":
      for (const m of bt.m.slice()) if (m.hp > 0) damageMonster(state, bt, m, val, "THORNS", rng);
      break;
    case "Poison Potion": if (t) applyMonsterPower(state, bt, t, "Poison", val); break;
    case "FearPotion": if (t) applyMonsterPower(state, bt, t, "Vulnerable", val); break;
    case "Weak Potion": if (t) applyMonsterPower(state, bt, t, "Weak", val); break;
    case "Strength Potion": applyPlayerPower(state, bt, "Strength", val); break;
    case "Dexterity Potion": applyPlayerPower(state, bt, "Dexterity", val); break;
    case "SpeedPotion":
      applyPlayerPower(state, bt, "Dexterity", val);
      applyPlayerPower(state, bt, "LoseDexterity", val);
      break;
    case "SteroidPotion":
      applyPlayerPower(state, bt, "Strength", val);
      applyPlayerPower(state, bt, "LoseStrength", val);
      break;
    case "Swift Potion": drawCards(state, bt, val, rng); break;
    case "Energy Potion": bt.e += val; break;
    case "BlessingOfTheForge":
      bt.h = bt.h.map(c => upgradeCardInCombat(c));
      break;
    case "AttackPotion": {
      const p = getCharCardPool(state).filter(k => RAW_CARDS[k][1] === "A");
      for (let i = 0; i < val && bt.h.length < 10; i++) bt.h.push(modifyCardCostInCombat(makeTempCard(bt, rng.pick(p)), 0));
      break;
    }
    case "SkillPotion": {
      const p = getCharCardPool(state).filter(k => RAW_CARDS[k][1] === "S");
      for (let i = 0; i < val && bt.h.length < 10; i++) bt.h.push(modifyCardCostInCombat(makeTempCard(bt, rng.pick(p)), 0));
      break;
    }
    case "PowerPotion": {
      const p = getCharCardPool(state).filter(k => RAW_CARDS[k][1] === "P");
      for (let i = 0; i < val && bt.h.length < 10; i++) bt.h.push(modifyCardCostInCombat(makeTempCard(bt, rng.pick(p)), 0));
      break;
    }
    case "Regen Potion": applyPlayerPower(state, bt, "Regen", val); break;
    case "Ancient Potion": applyPlayerPower(state, bt, "Artifact", val); break;
    case "EssenceOfSteel": applyPlayerPower(state, bt, "PlatedArmor", val); break;
    case "LiquidBronze": applyPlayerPower(state, bt, "Thorns", val); break;
    case "DuplicationPotion": applyPlayerPower(state, bt, "Duplication", val); break;
    case "CultistPotion": applyPlayerPower(state, bt, "Ritual", val); break;
  }
  addLog(state, "使用【" + pDef.name + "】");
  if (isCombatWon(bt)) onCombatVictory(state, rng);
  return true;
}

function endPlayerTurn(state, rng, skipMonsters = false) {
  const bt = state.bt;
  if (!bt || state.ph !== "COMBAT") return;

  // 1. Player end-of-turn orbs, relics & powers
  if (hasRelic(state, "FrozenCore") && bt.orbs && bt.orbs.length < (bt.maxOrbs || 0)) {
    channelOrb(state, bt, "F", rng);
  }
  if (bt.orbs && bt.orbs.length > 0) {
    if (hasRelic(state, "Cables") && bt.orbs[0].t !== "P") {
      triggerSingleOrbPassive(state, bt, bt.orbs[0], rng);
    }
    for (const o of bt.orbs) {
      if (o.t !== "P") triggerSingleOrbPassive(state, bt, o, rng);
    }
  }
  if ((bt.pw.LikeWater || 0) > 0 && bt.st === "Calm") {
    gainPlayerBlock(state, bt, bt.pw.LikeWater, false, rng);
  }
  if (hasRelic(state, "CloakClasp") && bt.h.length > 0) {
    gainPlayerBlock(state, bt, bt.h.length, false, rng);
  }
  if (hasRelic(state, "Orichalcum") && bt.b === 0) {
    gainPlayerBlock(state, bt, 6, false, rng);
  }
  if ((bt.pw.Metallicize || 0) > 0) {
    gainPlayerBlock(state, bt, bt.pw.Metallicize, false, rng);
  }
  if ((bt.pw.PlatedArmor || 0) > 0) {
    gainPlayerBlock(state, bt, bt.pw.PlatedArmor, false, rng);
  }
  if ((bt.pw.Combust || 0) > 0) {
    losePlayerHp(state, bt, 1, true, rng);
    for (const m of bt.m.slice()) if (m.hp > 0) damageMonster(state, bt, m, bt.pw.Combust, "THORNS", rng);
  }
  if ((bt.pw.Omega || 0) > 0) {
    for (const m of bt.m.slice()) if (m.hp > 0) damageMonster(state, bt, m, bt.pw.Omega, "THORNS", rng);
  }
  if ((bt.pw.Study || 0) > 0) {
    for (let s = 0; s < bt.pw.Study; s++) bt.dr.splice(rng.int(0, bt.dr.length), 0, makeTempCard(bt, "Insight"));
  }
  if ((bt.pw.TheBomb || 0) > 0) {
    bt.pw.TheBomb--;
    if (bt.pw.TheBomb <= 0) {
      const bDmg = bt.bombDmg || 40;
      delete bt.pw.TheBomb;
      delete bt.bombDmg;
      for (const m of bt.m.slice()) if (m.hp > 0) damageMonster(state, bt, m, bDmg, "THORNS", rng);
      addLog(state, "【炸弹】引爆，对所有敌人造成 " + bDmg + " 点伤害！");
    }
  }
  if ((bt.pw.Regen || 0) > 0) {
    healPlayer(state, bt.pw.Regen, true);
    bt.pw.Regen--;
    if (bt.pw.Regen <= 0) delete bt.pw.Regen;
  }
  if ((bt.pw.Constricted || 0) > 0) {
    const cDmg = bt.pw.Constricted;
    const b = Math.min(bt.b, cDmg);
    bt.b -= b;
    if (cDmg - b > 0) losePlayerHp(state, bt, cDmg - b, false, rng);
  }
  if (bt.t === 7 && hasRelic(state, "StoneCalendar")) {
    for (const m of bt.m.slice()) if (m.hp > 0) damageMonster(state, bt, m, 52, "THORNS", rng);
  }
  if ((bt.pw.LoseStrength || 0) > 0) {
    applyPlayerPower(state, bt, "Strength", -bt.pw.LoseStrength);
    delete bt.pw.LoseStrength;
  }
  if ((bt.pw.LoseDexterity || 0) > 0) {
    applyPlayerPower(state, bt, "Dexterity", -bt.pw.LoseDexterity);
    delete bt.pw.LoseDexterity;
  }
  if ((bt.pw.WraithForm || 0) > 0) {
    applyPlayerPower(state, bt, "Dexterity", -bt.pw.WraithForm);
  }
  delete bt.pw.Rage;
  delete bt.pw.DoubleTap;
  delete bt.pw.Burst;
  delete bt.pw.Amplify;
  delete bt.pw.Duplication;
  delete bt.pw.DoubleDamage;
  delete bt.pw.Rebound;
  delete bt.pw.NoDraw;
  delete bt.pw.Entangled;
  delete bt.pw.WaveOfTheHand;
  for (const m of bt.m) delete m.pw.Choke;

  // Enter Monster/End-of-Turn phase: debuffs applied to player from here until player's next turn are marked justApplied (bt.ja)
  bt.inMonsterPhase = true;

  // 2. End-of-turn cards in hand (Burn, Decay, Doubt, Shame, Regret, Ethereal, Retain)
  const handSnapshot = bt.h.slice();
  const keptHand = [];
  let wlpLeft = bt.pw.WellLaidPlans || 0;
  const medCount = bt.medRetain || 0;
  delete bt.medRetain;
  const eqRetain = (bt.pw.Equilibrium || 0) > 0;
  if (eqRetain) {
    bt.pw.Equilibrium--;
    if (bt.pw.Equilibrium <= 0) delete bt.pw.Equilibrium;
  }
  for (let hi = 0; hi < handSnapshot.length; hi++) {
    const c = handSnapshot[hi];
    const isMedRetained = medCount > 0 && hi >= handSnapshot.length - medCount;
    const def = getCardDef(c);
    if (def.id === "Burn") {
      const bDmg = def.mag;
      const b = Math.min(bt.b, bDmg);
      bt.b -= b;
      if (bDmg - b > 0) losePlayerHp(state, bt, bDmg - b, true, rng);
    } else if (def.id === "Decay") {
      const b = Math.min(bt.b, 2);
      bt.b -= b;
      if (2 - b > 0) losePlayerHp(state, bt, 2 - b, true, rng);
    } else if (def.id === "Doubt") {
      applyPlayerPower(state, bt, "Weak", 1);
    } else if (def.id === "Shame") {
      applyPlayerPower(state, bt, "Frail", 1);
    } else if (def.id === "Regret") {
      losePlayerHp(state, bt, handSnapshot.length, true, rng);
    }
    if (def.ethereal) {
      triggerExhaustCard(state, bt, c, rng);
    } else if (hasRelic(state, "Runic Pyramid") || eqRetain || def.retain || isMedRetained || (wlpLeft > 0 && def.type !== "ST" && def.type !== "C")) {
      if (!hasRelic(state, "Runic Pyramid") && !eqRetain && !def.retain && !isMedRetained && wlpLeft > 0) wlpLeft--;
      let rc = c;
      if (def.id === "WindmillStrike" || def.id === "Perseverance") {
        const cMatch = def.mod ? def.mod.match(/c\d+/) : null;
        rc = def.id + (def.up ? "+" : "") + "|" + ((def.extra || 0) + def.mag) + (cMatch ? cMatch[0] : "");
      } else if (def.id === "SandsOfTime") {
        rc = modifyCardCostInCombat(rc, Math.max(0, def.cost - 1));
      }
      if ((bt.pw.Establishment || 0) > 0) {
        const curDef = getCardDef(rc);
        rc = modifyCardCostInCombat(rc, Math.max(0, curDef.cost - bt.pw.Establishment));
      }
      keptHand.push(rc);
    } else {
      const clean = def.id + (def.up > 1 ? "+" + def.up : (def.up ? "+" : "")) + (def.extra ? "|" + def.extra : "");
      bt.di.push(clean);
    }
  }
  bt.h = keptHand;

  if (state.hp <= 0) { delete bt.inMonsterPhase; onPlayerDefeat(state); return; }
  if (isCombatWon(bt)) { delete bt.inMonsterPhase; onCombatVictory(state, rng); return; }

  if (!skipMonsters) {
    // 3. Monsters start of turn (lose block unless Barricade) & execute turns
    for (const m of bt.m) {
      if (m.hp > 0 && !m.pw.Barricade) m.b = 0;
      if (m.pw.Slow !== undefined) m.pw.Slow = 0;
      if (m.hp > 0 && m.pw.Invincible !== undefined) m.pw.Invincible = 300;
    }

    const mCopy = bt.m.slice();
    for (let i = 0; i < mCopy.length; i++) {
      const m = mCopy[i];
      const curIdx = bt.m.indexOf(m);
      if (curIdx === -1) continue;
      executeMonsterTurn(m, curIdx, bt, state, rng);
      if (state.hp <= 0) { delete bt.inMonsterPhase; onPlayerDefeat(state); return; }
    }

    // 4. Monsters end-of-turn powers
    for (const m of bt.m) {
      if (m.hp <= 0 && !m.st.halfDead) continue;
      if ((m.pw.Ritual || 0) > 0) {
        if (m.st.justRitual) m.st.justRitual = false;
        else applyMonsterPower(state, bt, m, "Strength", m.pw.Ritual);
      }
      if ((m.pw.GenericStrengthUp || 0) > 0) applyMonsterPower(state, bt, m, "Strength", m.pw.GenericStrengthUp);
      if ((m.pw.Metallicize || 0) > 0) m.b += m.pw.Metallicize;
      if ((m.pw.PlatedArmor || 0) > 0) m.b += m.pw.PlatedArmor;
      if ((m.pw.RegenerateMonster || 0) > 0 && m.hp > 0) m.hp = Math.min(m.mhp, m.hp + m.pw.RegenerateMonster);
      if ((m.pw.Shackled || 0) > 0) {
        m.pw.Strength = (m.pw.Strength || 0) + m.pw.Shackled;
        if (m.pw.Strength === 0) delete m.pw.Strength;
        delete m.pw.Shackled;
      }
      if (m.st.shiftLoss) {
        applyMonsterPower(state, bt, m, "Strength", m.st.shiftLoss);
        m.st.shiftLoss = 0;
      }
      if (m.st.baseMal) m.pw.Malleable = m.st.baseMal;
      if (m.id === "Byrd" && !m.st.air && m.mv === 4) {
        m.st.air = true;
        m.pw.Flight = 3;
      }
      if ((m.pw.Fading || 0) > 0) {
        m.pw.Fading--;
        if (m.pw.Fading <= 0) { m.hp = 0; m.b = 0; addLog(state, m.name + " 消逝了！"); }
      }
      const hadIntangible = (m.pw.Intangible || 0) > 0;
      for (const dKey of ["Weak", "Vulnerable", "Intangible", "LockOn"]) {
        if ((m.pw[dKey] || 0) > 0) {
          m.pw[dKey]--;
          if (m.pw[dKey] <= 0) delete m.pw[dKey];
        }
      }
      if (m.id === "Nemesis" && m.hp > 0 && !hadIntangible) {
        m.pw.Intangible = 1;
      }
    }
    delete bt.inMonsterPhase;

    if (isCombatWon(bt)) { onCombatVictory(state, rng); return; }

    // Roll next monster moves
    for (const m of bt.m) {
      rollMonsterMove(m, bt, state, rng);
    }
  } else {
    delete bt.inMonsterPhase;
  }

  // 5. Player start of next turn
  const prevAtks = bt.at || 0;
  const prevCards = bt.ct || 0;
  const lostHpLastTurn = Boolean(bt.lostHpTurn);
  bt.lostHpTurn = false;
  bt.t += 1;
  bt.ct = 0; bt.at = 0; bt.sk = 0; bt.po = 0; bt.discTurn = 0; bt.kiteUsed = false; bt.echoUsed = 0;
  bt.pelletsDone = false; bt.necroDone = false;

  if ((bt.pw.EndTurnDeath || 0) > 0) {
    delete bt.pw.EndTurnDeath;
    losePlayerHp(state, bt, 99999, true, rng);
    if (state.hp <= 0) { onPlayerDefeat(state); return; }
  }
  if (bt.st === "Divinity") {
    changeStance(state, bt, "Neutral", rng);
  }
  if ((bt.pw.SimmeringFury || bt.pw.Vengeance || 0) > 0) {
    const vDraw = bt.pw.SimmeringFury || bt.pw.Vengeance;
    delete bt.pw.SimmeringFury;
    delete bt.pw.Vengeance;
    changeStance(state, bt, "Wrath", rng);
    drawCards(state, bt, vDraw, rng);
  }

  // Player Block decay
  if ((bt.pw.Barricade || 0) > 0) {
    // Keep all block
  } else if ((bt.pw.Blur || 0) > 0) {
    bt.pw.Blur--;
    if (bt.pw.Blur <= 0) delete bt.pw.Blur;
  } else if (hasRelic(state, "Calipers")) {
    bt.b = Math.max(0, bt.b - 15);
  } else {
    bt.b = 0;
  }
  if ((bt.pw.NextTurnBlock || 0) > 0) {
    gainPlayerBlock(state, bt, bt.pw.NextTurnBlock, false, rng);
    delete bt.pw.NextTurnBlock;
  }
  if (bt.t === 2 && hasRelic(state, "HornCleat")) gainPlayerBlock(state, bt, 14, false, rng);
  if (bt.t === 3 && hasRelic(state, "CaptainsWheel")) gainPlayerBlock(state, bt, 18, false, rng);
  delete bt.pw.FlameBarrier;

  // Player debuff ticks (skipping justApplied debuffs from monster phase)
  for (const dKey of ["Weak", "Vulnerable", "Frail", "NoBlock"]) {
    if ((bt.pw[dKey] || 0) > 0) {
      if (bt.ja && bt.ja[dKey]) {
        delete bt.ja[dKey];
      } else {
        bt.pw[dKey]--;
        if (bt.pw[dKey] <= 0) delete bt.pw[dKey];
      }
    } else if (bt.ja && bt.ja[dKey]) {
      delete bt.ja[dKey];
    }
  }
  if ((bt.pw.Intangible || 0) > 0) {
    bt.pw.Intangible--;
    if (bt.pw.Intangible <= 0) delete bt.pw.Intangible;
  }
  if ((bt.pw.Phantasmal || 0) > 0) {
    bt.pw.DoubleDamage = (bt.pw.DoubleDamage || 0) + 1;
    bt.pw.Phantasmal--;
    if (bt.pw.Phantasmal <= 0) delete bt.pw.Phantasmal;
  }
  if ((bt.pw.NoxiousFumes || 0) > 0) {
    for (const m of bt.m) if (m.hp > 0) applyMonsterPower(state, bt, m, "Poison", bt.pw.NoxiousFumes);
  }
  if ((bt.pw.InfiniteBlades || 0) > 0) addTempCardToHand(state, bt, "Shiv", bt.pw.InfiniteBlades);
  if ((bt.pw.Nightmare || 0) > 0 && bt.nightmareCard) {
    addTempCardToHand(state, bt, bt.nightmareCard, bt.pw.Nightmare);
    delete bt.pw.Nightmare;
    delete bt.nightmareCard;
  }
  if ((bt.pw.Bias || 0) > 0) applyPlayerPower(state, bt, "Focus", -bt.pw.Bias);
  if (hasRelic(state, "Inserter") && bt.t % 2 === 0) bt.maxOrbs = Math.min(10, (bt.maxOrbs || 0) + 1);
  if ((bt.pw.Ritual || 0) > 0) applyPlayerPower(state, bt, "Strength", bt.pw.Ritual);
  if ((bt.pw.DemonForm || 0) > 0) applyPlayerPower(state, bt, "Strength", bt.pw.DemonForm);
  if ((bt.pw.Brutality || 0) > 0) {
    losePlayerHp(state, bt, bt.pw.Brutality, true, rng);
    drawCards(state, bt, bt.pw.Brutality, rng);
  }

  // Energy replenish
  if (hasRelic(state, "Ice Cream")) bt.e += bt.me;
  else bt.e = bt.me;
  if ((bt.pw.Berserk || 0) > 0) bt.e += bt.pw.Berserk;
  if ((bt.pw.NextTurnEnergy || bt.pw.Energized || 0) > 0) {
    bt.e += (bt.pw.NextTurnEnergy || 0) + (bt.pw.Energized || 0);
    delete bt.pw.NextTurnEnergy;
    delete bt.pw.Energized;
  }
  if ((bt.pw.DevaForm || 0) > 0) { bt.devaE = (bt.devaE || 0) + bt.pw.DevaForm; bt.e += bt.devaE; }
  if ((bt.pw.Fasting || bt.pw.FastingEnergy || 0) > 0) bt.e = Math.max(0, bt.e - ((bt.pw.Fasting || 0) + (bt.pw.FastingEnergy || 0)));
  if (bt.orbs && bt.orbs.length > 0) {
    if (hasRelic(state, "Cables") && bt.orbs[0].t === "P") bt.e += 1;
    for (const o of bt.orbs) if (o.t === "P") bt.e += 1;
    if ((bt.pw.Loop || 0) > 0) {
      const loops = bt.pw.Loop + (hasRelic(state, "Cables") ? 1 : 0);
      for (let l = 0; l < loops; l++) triggerSingleOrbPassive(state, bt, bt.orbs[0], rng);
    }
    if (lostHpLastTurn && hasRelic(state, "Emotion Chip")) {
      for (const o of bt.orbs) triggerSingleOrbPassive(state, bt, o, rng);
    }
  }
  if ((bt.pw.HelloWorld || 0) > 0) {
    const cPool = DEFECT_POOL.filter(k => RAW_CARDS[k][2] === "C");
    for (let h = 0; h < bt.pw.HelloWorld; h++) addTempCardToHand(state, bt, rng.pick(cPool), 1);
  }
  if ((bt.pw.CreativeAI || 0) > 0) {
    const pPool = DEFECT_POOL.filter(k => RAW_CARDS[k][1] === "P");
    for (let c = 0; c < bt.pw.CreativeAI; c++) addTempCardToHand(state, bt, rng.pick(pPool), 1);
  }
  if (hasRelic(state, "Damaru")) gainMantra(state, bt, 1, rng);
  if ((bt.pw.Devotion || 0) > 0) gainMantra(state, bt, bt.pw.Devotion, rng);
  if ((bt.pw.BattleHymn || 0) > 0) addTempCardToHand(state, bt, "Smite", bt.pw.BattleHymn);
  if ((bt.pw.Collect || 0) > 0) {
    addTempCardToHand(state, bt, "Miracle+", 1);
    bt.pw.Collect--;
    if (bt.pw.Collect <= 0) delete bt.pw.Collect;
  }
  if ((state.rt === "E" || state.rt === "B") && hasRelic(state, "SlaversCollar")) bt.e += 1;
  if (hasRelic(state, "Art of War") && prevAtks === 0) bt.e += 1;
  if (hasRelic(state, "Happy Flower")) {
    state.rc.Flower = ((state.rc.Flower || 0) + 1) % 3;
    if (state.rc.Flower === 0) bt.e += 1;
  }
  if (hasRelic(state, "Incense Burner")) {
    state.rc.Burner = ((state.rc.Burner || 0) + 1) % 6;
    if (state.rc.Burner === 0) applyPlayerPower(state, bt, "Intangible", 1);
  }
  if (hasRelic(state, "Mercury Hourglass")) {
    for (const m of bt.m.slice()) if (m.hp > 0) damageMonster(state, bt, m, 3, "THORNS", rng);
  }
  if ((bt.pw.Foresight || bt.pw.Wireheading || 0) > 0) scryCards(state, bt, (bt.pw.Foresight || 0) + (bt.pw.Wireheading || 0), rng);

  // Draw cards for turn
  let drawCnt = 5;
  if (hasRelic(state, "Ring of the Serpent")) drawCnt += 1;
  if ((bt.pw.MachineLearning || 0) > 0) drawCnt += bt.pw.MachineLearning;
  if ((bt.pw.DrawCardNextTurn || 0) > 0) {
    drawCnt += bt.pw.DrawCardNextTurn;
    delete bt.pw.DrawCardNextTurn;
  }
  if (hasRelic(state, "Snecko Eye")) drawCnt += 2;
  if (hasRelic(state, "Pocketwatch") && prevCards <= 3) drawCnt += 3;
  if ((bt.pw.DrawReduction || 0) > 0) {
    drawCnt = Math.max(0, drawCnt - 1);
    delete bt.pw.DrawReduction;
  }
  drawCards(state, bt, drawCnt, rng);
  if ((bt.pw.ToolsOfTheTrade || 0) > 0) {
    drawCards(state, bt, bt.pw.ToolsOfTheTrade, rng);
    discardSmartFromHand(state, bt, bt.pw.ToolsOfTheTrade, rng);
  }

  // Mayhem power
  if ((bt.pw.Mayhem || 0) > 0 && bt.dr.length > 0) {
    const top = bt.dr.pop();
    executeSingleCardEffect(state, bt, top, 0, 0, rng);
    bt.di.push(top);
  }

  if (state.hp <= 0) onPlayerDefeat(state);
  else if (isCombatWon(bt)) onCombatVictory(state, rng);
}


function obtainRelic(state, relId, rng) {
  if (!relId || !RELICS[relId] || hasRelic(state, relId)) return false;
  if (!state.rc) state.rc = {};
  const starterReplacements = {
    "Black Blood": "Burning Blood",
    "Ring of the Serpent": "Ring of the Snake",
    "FrozenCore": "Cracked Core",
    "HolyWater": "PureWater",
  };
  if (starterReplacements[relId]) {
    const idx = state.rel.indexOf(starterReplacements[relId]);
    if (idx !== -1) state.rel.splice(idx, 1, relId);
    else state.rel.push(relId);
  } else {
    state.rel.push(relId);
  }
  const rDef = RELICS[relId];
  addLog(state, "获得遗物【" + rDef.name + "】");

  switch (relId) {
    case "Strawberry": state.mhp += 7; state.hp += 7; break;
    case "Pear": state.mhp += 10; state.hp += 10; break;
    case "Mango": state.mhp += 14; state.hp += 14; break;
    case "Waffle":
    case "Lee's Waffle": state.mhp += 7; state.hp = state.mhp; break;
    case "Old Coin": addGold(state, 300); break;
    case "Potion Belt": state.pot.push("", ""); break;
    case "Omamori": state.rc.Omamori = 2; break;
    case "War Paint":
    case "Whetstone": {
      const targetType = relId === "War Paint" ? "S" : "A";
      const cands = [];
      for (let i = 0; i < state.dk.length; i++) {
        const d = getCardDef(state.dk[i]);
        if (d.up === 0 && d.type === targetType) cands.push(i);
      }
      rng.shuffle(cands);
      for (let i = 0; i < Math.min(2, cands.length); i++) {
        const idx = cands[i];
        state.dk[idx] = getCardDef(state.dk[idx]).id + "+";
      }
      break;
    }
    case "Cauldron":
      for (let i = 0; i < state.pot.length; i++) {
        if (!state.pot[i]) state.pot[i] = rollPotion(state, rng);
      }
      break;
    case "Calling Bell":
      addCardToMasterDeck(state, "CurseOfTheBell", rng);
      obtainRelic(state, rollRelic(state, rng, "C"), rng);
      obtainRelic(state, rollRelic(state, rng, "U"), rng);
      obtainRelic(state, rollRelic(state, rng, "R"), rng);
      break;
    case "Pandora's Box": {
      const pool = getCharCardPool(state);
      for (let i = 0; i < state.dk.length; i++) {
        const id = getCardDef(state.dk[i]).id;
        if (id.startsWith("Strike_") || id.startsWith("Defend_")) {
          state.dk[i] = rng.pick(pool);
        }
      }
      break;
    }
    case "Astrolabe": {
      const pool = getCharCardPool(state);
      let transformed = 0;
      for (let i = 0; i < state.dk.length && transformed < 3; i++) {
        const id = getCardDef(state.dk[i]).id;
        if (id.startsWith("Strike_") || id.startsWith("Defend_")) {
          state.dk[i] = rng.pick(pool) + "+";
          transformed++;
        }
      }
      break;
    }
    case "Tiny House": {
      addGold(state, 50);
      state.mhp += 5; state.hp += 5;
      const pSlot = state.pot.indexOf("");
      if (pSlot !== -1 && !hasRelic(state, "Sozu")) state.pot[pSlot] = rollPotion(state, rng);
      const upIdx = [];
      for (let i = 0; i < state.dk.length; i++) {
        const d = getCardDef(state.dk[i]);
        if (d.up === 0 && d.type !== "ST" && d.type !== "C") upIdx.push(i);
      }
      if (upIdx.length > 0) {
        const pick = rng.pick(upIdx);
        state.dk[pick] = getCardDef(state.dk[pick]).id + "+";
      }
      break;
    }
    case "NeowsBlessing":
    case "NeowsLament":
      state.rc.Neow = 3;
      break;
  }
  return true;
}

function rollRelic(state, rng, tier) {
  const curChar = state.ch || "IRONCLAD";
  const tiers = tier ? (tier === "S" ? ["SH"] : [tier]) : ["C", "U", "R"];
  for (const t of tiers) {
    const candidates = Object.keys(RELICS).filter(k => RELICS[k].tier === t && !hasRelic(state, k) && (!RELICS[k].char || RELICS[k].char === curChar));
    if (candidates.length > 0) return rng.pick(candidates);
  }
  const fallback = Object.keys(RELICS).filter(k => ["C", "U", "R"].indexOf(RELICS[k].tier) !== -1 && !hasRelic(state, k) && (!RELICS[k].char || RELICS[k].char === curChar));
  return fallback.length > 0 ? rng.pick(fallback) : "Circlet";
}

function rollPotion(state, rng) {
  const keys = Object.keys(POTIONS);
  return rng.pick(keys);
}

function maybeAutoUpgradeCard(state, cardId, rng, allowRandomUp) {
  const raw = RAW_CARDS[cardId];
  if (!raw) return cardId;
  const type = raw[1];
  if (type === "A" && hasRelic(state, "Molten Egg 2")) return cardId + "+";
  if (type === "S" && hasRelic(state, "Toxic Egg 2")) return cardId + "+";
  if (type === "P" && hasRelic(state, "Frozen Egg 2")) return cardId + "+";
  if (allowRandomUp && raw[2] !== "R") {
    const upChance = state.a === 2 ? 0.25 : (state.a >= 3 ? 0.5 : 0);
    if (rng.next() < upChance) return cardId + "+";
  }
  return cardId;
}

function rollCardRewards(state, rng, roomType, countOverride) {
  let count = countOverride !== undefined ? countOverride : 3;
  if (countOverride === undefined) {
    if (hasRelic(state, "Question Card")) count += 1;
    if (hasRelic(state, "Busted Crown")) count = Math.max(1, count - 2);
  }
  const charPool = getCharCardPool(state);
  const commons = charPool.filter(k => RAW_CARDS[k][2] === "C");
  const uncommons = charPool.filter(k => RAW_CARDS[k][2] === "U");
  const rares = charPool.filter(k => RAW_CARDS[k][2] === "R");

  const picked = [];
  for (let i = 0; i < count; i++) {
    let pool = commons;
    if (roomType === "B") {
      pool = rares;
    } else {
      const r = rng.next();
      const rareChance = roomType === "E" ? 0.10 : 0.03;
      const uncChance = roomType === "E" ? 0.40 : 0.37;
      if (r < rareChance) pool = rares;
      else if (r < rareChance + uncChance) pool = uncommons;
      else pool = commons;
    }
    const avail = pool.filter(k => picked.indexOf(k) === -1 && picked.indexOf(k + "+") === -1);
    const baseId = avail.length > 0 ? rng.pick(avail) : rng.pick(pool);
    picked.push(maybeAutoUpgradeCard(state, baseId, rng, roomType !== "B"));
  }
  return picked;
}

function onCombatVictory(state, rng) {
  const selfRep = (state.bt && state.bt.pw && state.bt.pw.SelfRepair) || 0;
  delete state.bt;
  const meatTrig = hasRelic(state, "Meat on the Bone") && state.hp <= Math.floor(state.mhp * 0.5);
  if (selfRep > 0) healPlayer(state, selfRep, false);
  if (hasRelic(state, "Burning Blood")) healPlayer(state, 6, false);
  if (hasRelic(state, "Black Blood")) healPlayer(state, 12, false);
  if (meatTrig) healPlayer(state, 12, false);
  if (hasRelic(state, "FaceOfCleric")) { state.mhp += 1; state.hp += 1; }

  if (state.rt === "E") state.ek = (state.ek || 0) + 1;
  if (state.rt === "B") state.bk = (state.bk || 0) + 1;

  // Act 4 Boss (Corrupt Heart) or Act 3 Boss victory without all 3 Keys
  const hasAllKeys = Boolean(state.keys && state.keys.r && state.keys.g && state.keys.b);
  if (state.rt === "B" && state.a >= 4) {
    state.ph = "VICTORY";
    addLog(state, "👑 恭喜！你击败了【腐化之心】，达成杀戮尖塔真结局完美登顶！");
    return;
  }
  if (state.rt === "B" && state.a === 3 && !hasAllKeys) {
    state.ph = "VICTORY";
    addLog(state, "🎉 恭喜！你击败了第三幕终极首领，成功登顶杀戮尖塔！");
    return;
  }

  let gold = state.rt === "B" ? rng.range(95, 105) : (state.rt === "E" ? rng.range(25, 35) : rng.range(10, 20));
  if (hasRelic(state, "Golden Idol")) gold = Math.floor(gold * 1.25);
  if (hasRelic(state, "Ectoplasm")) gold = 0;

  let pot = "";
  if (!hasRelic(state, "Sozu")) {
    const potChance = hasRelic(state, "White Beast Statue") ? 1.0 : 0.40;
    if (rng.next() < potChance) pot = rollPotion(state, rng);
  }

  const rels = [];
  if (state.rt === "E") {
    const rTier = rng.next() < 0.25 ? "R" : (rng.next() < 0.5 ? "U" : "C");
    rels.push(rollRelic(state, rng, rTier));
    if (hasRelic(state, "Black Star")) {
      const r2 = rollRelic(state, rng, rng.next() < 0.35 ? "R" : "U");
      if (r2 && rels.indexOf(r2) === -1) rels.push(r2);
    }
  }

  const keyG = (state.rt === "E" && state.be && !(state.keys && state.keys.g)) ? 1 : 0;
  state.be = 0;
  const cards = rollCardRewards(state, rng, state.rt);
  state.rw = { g: gold, pot, rel: rels, cards, cp: false, keyG };
  state.ph = "REWARD";
  addLog(state, "战斗胜利！清点战利品。");
}

function onPlayerDefeat(state) {
  delete state.bt;
  state.ph = "DEFEAT";
  addLog(state, "☠️ 你在尖塔中倒下了……");
}

function calcBounty(state, args, maxReward) {
  if (!maxReward || maxReward <= 0) return 0;
  if (state.ph === "VICTORY") {
    return (state.a || 1) >= 4 ? Math.floor(maxReward * 1.5) : maxReward;
  }

  // Progressive bounty:
  // - Acts 1-3: floor/elite/boss progression up to 92%, reaching 100% once all 3 Act Bosses are defeated
  // - Act 4: starts at 100% (Acts 1-3 cleared), +15% after Spire Shield & Spear, and 150% on defeating Corrupt Heart
  let rawPct;
  if ((state.a || 1) >= 4 || (state.bk || 0) >= 3) {
    const beatAct4Elite = (state.a || 1) >= 4 && ((state.r || 0) > 2 || ((state.r || 0) === 2 && state.ph !== "COMBAT" && state.ph !== "DEFEAT"));
    rawPct = beatAct4Elite ? 1.15 : 1.0;
  } else {
    const floorPct = Math.min(48, state.fl || 0) * 0.012; // up to 57.6% across 48 floors
    const elitePct = (state.ek || 0) * 0.04;              // +4% per Elite
    const bossPct = (state.bk || 0) * 0.14;               // +14% per Act Boss
    rawPct = Math.min(0.92, floorPct + elitePct + bossPct);
  }
  let fullPending = Math.floor(maxReward * rawPct);
  if (fullPending === 0 && (state.fl || 0) >= 1 && rawPct > 0) fullPending = 1;

  if (state.ph === "DEFEAT") {
    const retainPct = (args && typeof args.retainPercent === "number")
      ? Math.max(0, Math.min(100, args.retainPercent))
      : 50;
    const retained = Math.floor(fullPending * retainPct / 100);
    if (retained === 0 && (state.fl || 0) >= 1 && retainPct > 0 && fullPending > 0) return 1;
    return retained;
  }
  return fullPending;
}

function startEvent(state, rng, eventIdOverride) {
  let evId = eventIdOverride;
  if (!evId) {
    const shrines = ["GoldenShrine", "Purifier", "UpgradeShrine"];
    const actPool = state.a === 1
      ? ["BigFish", "TheCleric", "GoldenIdol", "ScrapOoze", "ShiningLight", "LivingWall"].concat(shrines)
      : (state.a === 2
        ? ["Vampires", "Apparitions", "AncientWriting", "TheLibrary", "CursedTome", "LivingWall"].concat(shrines)
        : ["MindBloom", "SensoryStone", "AncientWriting", "Purifier", "UpgradeShrine", "GoldenShrine"]);
    evId = rng.pick(actPool);
  }
  state.ev = { id: evId };
  state.ph = evId === "NEOW" ? "NEOW" : "EVENT";
  addLog(state, "触发事件：【" + (EVENTS_DEF[evId] ? EVENTS_DEF[evId].title : evId) + "】");
}

function handleEventAction(state, choiceIdx, cardIdx, rng) {
  const evId = state.ev ? state.ev.id : (state.ph === "NEOW" ? "NEOW" : "BigFish");
  const cIdx = Number(choiceIdx) || 0;
  const dkIdx = (cardIdx !== undefined && cardIdx !== null) ? Number(cardIdx) : 0;

  const removePickedCard = () => {
    if (state.dk.length <= 1) return;
    const idx = (dkIdx >= 0 && dkIdx < state.dk.length) ? dkIdx : 0;
    const removed = getCardDef(state.dk[idx]);
    state.dk.splice(idx, 1);
    addLog(state, "从牌组移除了【" + removed.name + "】");
  };

  const upgradePickedCard = () => {
    let idx = (dkIdx >= 0 && dkIdx < state.dk.length) ? dkIdx : -1;
    if (idx === -1 || getCardDef(state.dk[idx]).up > 0) {
      idx = state.dk.findIndex(c => { const d = getCardDef(c); return d.up === 0 && d.type !== "ST" && d.type !== "C"; });
    }
    if (idx !== -1) {
      const d = getCardDef(state.dk[idx]);
      state.dk[idx] = d.id + "+";
      addLog(state, "升级了【" + d.name + "+】");
    }
  };

  const transformPickedCard = () => {
    const idx = (dkIdx >= 0 && dkIdx < state.dk.length) ? dkIdx : 0;
    const pool = getCharCardPool(state);
    const newCard = rng.pick(pool);
    state.dk[idx] = newCard;
    addLog(state, "卡牌变化为【" + getCardDef(newCard).name + "】");
  };

  switch (evId) {
    case "NEOW":
      if (cIdx === 0) { state.mhp += 8; state.hp += 8; addLog(state, "涅奥赐福：最大生命 +8"); }
      else if (cIdx === 1) { obtainRelic(state, "NeowsLament", rng); }
      else if (cIdx === 2) { addGold(state, 100); addLog(state, "涅奥赐福：获得 100 金币"); }
      else {
        state.hp = Math.max(1, state.hp - 8);
        obtainRelic(state, rollRelic(state, rng, "R"), rng);
      }
      break;
    case "BigFish":
      if (cIdx === 0) healPlayer(state, Math.floor(state.mhp * 0.33), false);
      else if (cIdx === 1) { state.mhp += 5; state.hp += 5; }
      else { obtainRelic(state, rollRelic(state, rng), rng); addCardToMasterDeck(state, "Regret", rng); }
      break;
    case "TheCleric":
      if (cIdx === 0 && state.g >= 35) { state.g -= 35; healPlayer(state, Math.floor(state.mhp * 0.25), false); }
      else if (cIdx === 1 && state.g >= 50) { state.g -= 50; removePickedCard(); }
      break;
    case "GoldenIdol":
      if (cIdx === 0) {
        obtainRelic(state, "Golden Idol", rng);
        state.hp = Math.max(1, state.hp - Math.floor(state.mhp * 0.25));
      }
      break;
    case "ScrapOoze":
      if (cIdx === 0) {
        state.hp = Math.max(1, state.hp - 6);
        obtainRelic(state, rollRelic(state, rng), rng);
      }
      break;
    case "ShiningLight":
      if (cIdx === 0) {
        state.hp = Math.max(1, state.hp - Math.floor(state.mhp * 0.20));
        const upCands = [];
        for (let i = 0; i < state.dk.length; i++) {
          const d = getCardDef(state.dk[i]);
          if (d.up === 0 && d.type !== "ST" && d.type !== "C") upCands.push(i);
        }
        rng.shuffle(upCands);
        for (let i = 0; i < Math.min(2, upCands.length); i++) {
          const idx = upCands[i];
          state.dk[idx] = getCardDef(state.dk[idx]).id + "+";
        }
      }
      break;
    case "LivingWall":
      if (cIdx === 0) removePickedCard();
      else if (cIdx === 1) transformPickedCard();
      else upgradePickedCard();
      break;
    case "Vampires":
      if (cIdx === 0) {
        const loss = Math.floor(state.mhp * 0.30);
        state.mhp = Math.max(1, state.mhp - loss);
        state.hp = Math.min(state.hp, state.mhp);
        state.dk = state.dk.filter(c => !getCardDef(c).id.startsWith("Strike_"));
        for (let i = 0; i < 5; i++) addCardToMasterDeck(state, "Bite", rng);
      }
      break;
    case "Apparitions":
      if (cIdx === 0) {
        state.mhp = Math.max(1, Math.floor(state.mhp * 0.5));
        state.hp = Math.min(state.hp, state.mhp);
        for (let i = 0; i < 3; i++) addCardToMasterDeck(state, "Ghostly", rng);
      }
      break;
    case "AncientWriting":
      if (cIdx === 0) removePickedCard();
      else {
        for (let i = 0; i < state.dk.length; i++) {
          const d = getCardDef(state.dk[i]);
          if ((d.id.startsWith("Strike_") || d.id.startsWith("Defend_")) && d.up === 0) state.dk[i] = d.id + "+";
        }
      }
      break;
    case "TheLibrary":
      if (cIdx === 0) {
        const pool = getCharCardPool(state).filter(k => ["U", "R"].indexOf(RAW_CARDS[k][2]) !== -1);
        addCardToMasterDeck(state, rng.pick(pool) + "+", rng);
      } else {
        healPlayer(state, Math.floor(state.mhp * 0.33), false);
      }
      break;
    case "CursedTome":
      if (cIdx === 0) {
        state.hp = Math.max(1, state.hp - 16);
        obtainRelic(state, "Necronomicon", rng);
      }
      break;
    case "MindBloom":
      if (cIdx === 0) {
        obtainRelic(state, rollRelic(state, rng, "R"), rng);
        addGold(state, 100);
      } else if (cIdx === 1) {
        for (let i = 0; i < state.dk.length; i++) {
          const d = getCardDef(state.dk[i]);
          if (d.up === 0 && d.type !== "ST" && d.type !== "C") state.dk[i] = d.id + "+";
        }
        addCardToMasterDeck(state, "Normality", rng);
      } else {
        healPlayer(state, state.mhp, false);
      }
      break;
    case "SensoryStone": {
      const clPool = COLORLESS_CARDS;
      if (cIdx === 0) {
        for (let i = 0; i < 2; i++) addCardToMasterDeck(state, rng.pick(clPool), rng);
      } else {
        state.hp = Math.max(1, state.hp - 5);
        for (let i = 0; i < 3; i++) addCardToMasterDeck(state, rng.pick(clPool) + "+", rng);
      }
      break;
    }
    case "GoldenShrine":
      if (cIdx === 0) addGold(state, 100);
      else if (cIdx === 1) { addGold(state, 275); addCardToMasterDeck(state, "Regret", rng); }
      break;
    case "Purifier":
      if (cIdx === 0) removePickedCard();
      break;
    case "UpgradeShrine":
      if (cIdx === 0) upgradePickedCard();
      break;
  }

  delete state.ev;
  state.ph = "MAP";
}

function calcShopPrice(state, basePrice) {
  let mult = 1.0;
  if (hasRelic(state, "Membership Card")) mult *= 0.5;
  if (hasRelic(state, "The Courier")) mult *= 0.8;
  return Math.max(1, Math.floor(basePrice * mult));
}

function generateShop(state, rng) {
  const charPool = getCharCardPool(state);
  const attacks = charPool.filter(k => RAW_CARDS[k][1] === "A");
  const skills = charPool.filter(k => RAW_CARDS[k][1] === "S");
  const powers = charPool.filter(k => RAW_CARDS[k][1] === "P");
  const colorless = COLORLESS_CARDS;

  const rawCards = [
    rng.pick(attacks), rng.pick(attacks),
    rng.pick(skills), rng.pick(skills),
    rng.pick(powers),
    rng.pick(colorless), rng.pick(colorless),
  ];
  const saleIdx = rng.range(0, 4);
  const cards = rawCards.map((cid, idx) => {
    const upCid = maybeAutoUpgradeCard(state, cid, rng, false);
    const rar = RAW_CARDS[cid][2];
    const base = rar === "R" ? rng.range(135, 165) : (rar === "U" || rar === "CL" ? rng.range(68, 82) : rng.range(45, 55));
    const price = calcShopPrice(state, idx === saleIdx ? Math.floor(base * 0.5) : base);
    return { c: upCid, p: price, sale: idx === saleIdx };
  });

  const relCands = [
    rollRelic(state, rng, rng.next() < 0.5 ? "C" : "U"),
    rollRelic(state, rng, rng.next() < 0.6 ? "U" : "R"),
    rollRelic(state, rng, "S"),
  ];
  const relics = relCands.map(rid => {
    const tier = RELICS[rid] ? RELICS[rid].tier : "C";
    const base = tier === "R" ? rng.range(285, 315) : (tier === "U" ? rng.range(235, 265) : rng.range(143, 157));
    return { r: rid, p: calcShopPrice(state, base) };
  });

  const pots = [rollPotion(state, rng), rollPotion(state, rng), rollPotion(state, rng)].map(pid => ({
    id: pid,
    p: calcShopPrice(state, rng.range(48, 58)),
  }));

  const purgeCost = hasRelic(state, "Smiling Mask") ? 50 : calcShopPrice(state, 75 + (state.pr || 0) * 25);
  state.sh = { cards, relics, pots, purge: purgeCost, purged: false };
  state.ph = "SHOP";
  addLog(state, "进入商人店铺。");
}

function handleShopAction(state, act, rng) {
  const sh = state.sh;
  if (!sh) { state.ph = "MAP"; return; }
  const type = act.type;
  const idx = Number(act.index ?? act.cardIdx ?? 0);

  if (type === "shop_buy_card") {
    const item = sh.cards[idx];
    if (item && !item.sold && state.g >= item.p) {
      state.g -= item.p;
      if (hasRelic(state, "MawBank")) state.mbOff = 1;
      item.sold = true;
      addCardToMasterDeck(state, item.c, rng);
      if (hasRelic(state, "The Courier")) {
        const pool = getCharCardPool(state);
        const nc = rng.pick(pool);
        sh.cards[idx] = { c: maybeAutoUpgradeCard(state, nc, rng, false), p: calcShopPrice(state, 65), sale: false };
      }
    }
  } else if (type === "shop_buy_relic") {
    const item = sh.relics[idx];
    if (item && !item.sold && state.g >= item.p) {
      state.g -= item.p;
      if (hasRelic(state, "MawBank")) state.mbOff = 1;
      item.sold = true;
      obtainRelic(state, item.r, rng);
    }
  } else if (type === "shop_buy_potion") {
    const item = sh.pots[idx];
    const emptySlot = state.pot.indexOf("");
    if (item && !item.sold && emptySlot !== -1 && state.g >= item.p && !hasRelic(state, "Sozu")) {
      state.g -= item.p;
      if (hasRelic(state, "MawBank")) state.mbOff = 1;
      item.sold = true;
      state.pot[emptySlot] = item.id;
      addLog(state, "购买了【" + POTIONS[item.id].name + "】");
    }
  } else if (type === "shop_purge") {
    if (!sh.purged && state.g >= sh.purge && state.dk.length > 1) {
      const cIdx = (idx >= 0 && idx < state.dk.length) ? idx : 0;
      const d = getCardDef(state.dk[cIdx]);
      state.g -= sh.purge;
      if (hasRelic(state, "MawBank")) state.mbOff = 1;
      sh.purged = true;
      state.pr = (state.pr || 0) + 1;
      state.dk.splice(cIdx, 1);
      addLog(state, "移除卡牌【" + d.name + "】");
    }
  } else if (type === "leave_shop") {
    delete state.sh;
    state.ph = "MAP";
    addLog(state, "离开商店。");
  }
}

function handleRestAction(state, act, rng) {
  const type = act.type;
  const idx = Number(act.cardIdx ?? act.index ?? 0);

  if (type === "rest_heal") {
    if (hasRelic(state, "Coffee Dripper")) return;
    let amt = Math.floor(state.mhp * 0.30);
    if (hasRelic(state, "Regal Pillow")) amt += 15;
    healPlayer(state, amt, false);
    if (hasRelic(state, "Dream Catcher")) {
      state.rw = { g: 0, pot: "", rel: [], cards: rollCardRewards(state, rng, "M"), cp: false };
      state.ph = "REWARD";
      addLog(state, "在火堆小憩恢复生命，【捕梦网】带来了卡牌奖励！");
      return;
    }
    state.ph = "MAP";
    addLog(state, "在火堆休息，恢复了 " + amt + " 点生命。");
  } else if (type === "rest_smith") {
    if (hasRelic(state, "Fusion Hammer")) return;
    if (idx >= 0 && idx < state.dk.length) {
      const d = getCardDef(state.dk[idx]);
      if (d.type !== "ST" && d.type !== "C" && (d.up === 0 || d.id === "Searing Blow")) {
        state.dk[idx] = d.id === "Searing Blow" ? ("Searing Blow+" + (d.up + 1)) : (d.id + "+");
        addLog(state, "在火堆锻造升级了【" + getCardDef(state.dk[idx]).name + "】！");
        state.ph = "MAP";
      }
    }
  } else if (type === "rest_lift") {
    if (!state.rc) state.rc = {};
    if (hasRelic(state, "Girya") && (state.rc.Girya || 0) < 3) {
      state.rc.Girya = (state.rc.Girya || 0) + 1;
      addLog(state, "举起【壶铃】锻炼！永久力量 +1（当前 +" + state.rc.Girya + "）");
      state.ph = "MAP";
    }
  } else if (type === "rest_dig") {
    if (hasRelic(state, "Shovel")) {
      obtainRelic(state, rollRelic(state, rng), rng);
      state.ph = "MAP";
    }
  } else if (type === "rest_toke") {
    if (hasRelic(state, "Peace Pipe") && state.dk.length > 1 && idx >= 0 && idx < state.dk.length) {
      const d = getCardDef(state.dk[idx]);
      state.dk.splice(idx, 1);
      addLog(state, "抽起【宁静烟斗】，移除了【" + d.name + "】");
      state.ph = "MAP";
    }
  } else if (type === "rest_recall") {
    if (!state.keys) state.keys = {};
    if (!state.keys.r) {
      state.keys.r = 1;
      addLog(state, "🔥 在营火旁回忆起使命，获得了【红宝石钥匙】！");
      state.ph = "MAP";
    }
  } else if (type === "cash_out" || type === "rest_retreat") {
    state.ph = "RETREAT";
    addLog(state, "💰 你在营火旁选择见好就收，携带当前战利品安全撤离尖塔！");
  } else if (type === "leave_rest") {
    state.ph = "MAP";
  }
}

function handleTreasureAction(state, act, rng) {
  if (act.type === "open_treasure") {
    const rTier = rng.next() < 0.15 ? "R" : (rng.next() < 0.50 ? "U" : "C");
    const rels = [rollRelic(state, rng, rTier)];
    if (hasRelic(state, "Matryoshka") && (state.mt || 0) < 2) {
      state.mt = (state.mt || 0) + 1;
      rels.push(rollRelic(state, rng, "C"));
    }
    if (hasRelic(state, "Cursed Key")) {
      const curses = ["Regret", "Pain", "Decay", "Doubt", "Shame", "Injury", "Clumsy", "Writhe"];
      addCardToMasterDeck(state, rng.pick(curses), rng);
    }
    const gold = rng.next() < 0.5 ? rng.range(25, 55) : 0;
    const keyB = !(state.keys && state.keys.b) ? 1 : 0;
    state.rw = { g: gold, pot: "", rel: rels, cards: [], cp: true, keyB };
    state.ph = "REWARD";
    addLog(state, "打开宝箱！");
  } else if (act.type === "leave_treasure") {
    state.ph = "MAP";
  }
}

function proceedAfterReward(state, rng) {
  delete state.rw;
  if (state.rt === "B") {
    if (state.a >= 4) {
      state.ph = "VICTORY";
      addLog(state, "👑 恭喜击败【腐化之心】，达成杀戮尖塔真结局完美登顶！");
    } else if (state.a === 3) {
      if (state.keys && state.keys.r && state.keys.g && state.keys.b) {
        advanceToNextAct(state, rng);
      } else {
        state.ph = "VICTORY";
        addLog(state, "🎉 恭喜登顶杀戮尖塔！");
      }
    } else {
      // Roll 3 Boss Relics
      const curChar = state.ch || "IRONCLAD";
      const bossPool = Object.keys(RELICS).filter(k => {
        if (RELICS[k].tier !== "B" || hasRelic(state, k)) return false;
        if (RELICS[k].char && RELICS[k].char !== curChar) return false;
        if (k === "Black Blood" && !hasRelic(state, "Burning Blood")) return false;
        if (k === "Ring of the Serpent" && !hasRelic(state, "Ring of the Snake")) return false;
        if (k === "FrozenCore" && !hasRelic(state, "Cracked Core")) return false;
        if (k === "HolyWater" && !hasRelic(state, "PureWater")) return false;
        return true;
      });
      rng.shuffle(bossPool);
      state.br = bossPool.slice(0, 3);
      state.ph = "BOSS_RELIC";
      addLog(state, "击败第 " + state.a + " 幕首领！请选择 1 件首领遗物。");
    }
  } else {
    state.ph = "MAP";
  }
}

function handleRewardAction(state, act, rng) {
  const rw = state.rw;
  if (!rw) { proceedAfterReward(state, rng); return; }
  const type = act.type;
  const idx = Number(act.index ?? act.cardIdx ?? 0);

  if (type === "claim_reward_gold" && rw.g > 0) {
    addGold(state, rw.g);
    addLog(state, "拾取了 " + rw.g + " 金币。");
    rw.g = 0;
  } else if (type === "claim_reward_potion" && rw.pot) {
    const slot = state.pot.indexOf("");
    if (slot !== -1 && !hasRelic(state, "Sozu")) {
      state.pot[slot] = rw.pot;
      addLog(state, "拾取了【" + POTIONS[rw.pot].name + "】");
      rw.pot = "";
    }
  } else if (type === "claim_reward_relic" && rw.rel && rw.rel.length > 0) {
    const rId = rw.rel.splice(idx >= 0 && idx < rw.rel.length ? idx : 0, 1)[0];
    if (rId) obtainRelic(state, rId, rng);
    if (rw.keyB && rw.rel.length === 0) rw.keyB = 0;
  } else if (type === "claim_reward_key") {
    if (!state.keys) state.keys = {};
    if (act.key === "b" && rw.keyB) {
      state.keys.b = 1;
      rw.keyB = 0;
      rw.rel = [];
      addLog(state, "💠 放弃宝箱遗物，获得了【蓝宝石钥匙】！");
    } else if (act.key === "g" && rw.keyG) {
      state.keys.g = 1;
      rw.keyG = 0;
      addLog(state, "💚 从强化精英战利品中获得了【绿宝石钥匙】！");
    }
  } else if (type === "pick_reward_card" && !rw.cp && rw.cards && rw.cards[idx]) {
    const picked = rw.cards[idx];
    rw.cp = true;
    addCardToMasterDeck(state, picked, rng);
  } else if (type === "skip_reward_card" && !rw.cp) {
    rw.cp = true;
    if (hasRelic(state, "Singing Bowl")) {
      state.mhp += 2; state.hp += 2;
      addLog(state, "跳过卡牌奖励，【颂钵】使最大生命 +2！");
    }
  } else if (type === "proceed_from_reward") {
    // Auto-claim gold & relics if player clicks proceed directly
    if (rw.g > 0) { addGold(state, rw.g); rw.g = 0; }
    if (rw.keyG) {
      if (!state.keys) state.keys = {};
      state.keys.g = 1;
      rw.keyG = 0;
      addLog(state, "💚 获得了【绿宝石钥匙】！");
    }
    while (rw.rel && rw.rel.length > 0) {
      obtainRelic(state, rw.rel.shift(), rng);
    }
    rw.keyB = 0;
    proceedAfterReward(state, rng);
  }
}

function advanceToNextAct(state, rng) {
  state.a += 1;
  state.r = -1;
  state.c = -1;
  state.p = [];
  state.mw = 0;
  delete state.br;
  delete state.rw;
  delete state.sh;
  delete state.ev;
  delete state.bt;
  // Heal 75% of missing HP between Acts
  const healAmt = Math.floor((state.mhp - state.hp) * 0.75);
  if (healAmt > 0) healPlayer(state, healAmt, false);
  state.ph = "MAP";
  addLog(state, "🌟 踏入第 " + state.a + " 幕【" + ACT_INFO[state.a].name + "】！恢复了 " + healAmt + " 点生命。");
}

function handleBossRelicAction(state, act, rng) {
  if (act.type === "pick_boss_relic") {
    const idx = Number(act.index ?? 0);
    if (state.br && state.br[idx]) {
      obtainRelic(state, state.br[idx], rng);
    }
    advanceToNextAct(state, rng);
  } else if (act.type === "skip_boss_relic") {
    advanceToNextAct(state, rng);
  }
}

// ============================================================================
// MAP NAVIGATION & ROOM DISPATCH
// ============================================================================
function enterMapNode(state, x, y, rng) {
  if (state.ph !== "MAP") return false;
  const map = generateActMap(state.s, state.a);
  const nextRow = state.r + 1;
  const preBossRow = state.a === 4 ? 2 : 14;

  // Row 15 (or Row 3 in Act 4) is the Act Boss
  if (y === 15 || (state.a === 4 && y === 3)) {
    if (state.r !== preBossRow) return false;
    state.r = 15;
    state.c = 3;
    state.p.push([3, 15]);
    state.fl = (state.fl || 0) + 1;
    if (hasRelic(state, "MawBank") && !state.mbOff) addGold(state, 12);
    const bossEnc = ACT_INFO[state.a].bosses[state.s % 3];
    startCombat(state, bossEnc, "B", rng);
    return true;
  }

  if (y !== nextRow) return false;
  if (y < 0 || y >= 15 || x < 0 || x >= 7) return false;
  let targetNode = map[y] && map[y].find(n => n.x === x);

  // Validate edge connection from previous node (unless Row 0 or WingedGreaves)
  if (state.r >= 0 && targetNode && !hasRelic(state, "WingedGreaves")) {
    const prevNode = map[state.r] && map[state.r].find(n => n.x === state.c);
    const connected = prevNode && prevNode.e && prevNode.e.indexOf(x) !== -1;
    if (!connected) targetNode = null;
  }

  // Fallback snap to nearest valid connected node on row y if client/server seed ever differed
  if ((!targetNode || !targetNode.t) && map[y] && map[y].length > 0) {
    let candidates = map[y].filter(n => n && n.t);
    if (state.r >= 0 && !hasRelic(state, "WingedGreaves")) {
      const prevNode = map[state.r] && map[state.r].find(n => n.x === state.c);
      if (prevNode && prevNode.e && prevNode.e.length > 0) {
        const conn = candidates.filter(n => prevNode.e.indexOf(n.x) !== -1);
        if (conn.length > 0) candidates = conn;
      }
    }
    if (candidates.length > 0) {
      candidates.sort((a, b) => Math.abs(a.x - x) - Math.abs(b.x - x));
      targetNode = candidates[0];
      x = targetNode.x;
    }
  }
  if (!targetNode || !targetNode.t) return false;

  state.r = y;
  state.c = x;
  state.p.push([x, y]);
  state.fl = (state.fl || 0) + 1;
  if (hasRelic(state, "MawBank") && !state.mbOff) addGold(state, 12);

  let rType = targetNode.t;
  state.rt = rType;
  state.be = (rType === "E" && targetNode.be && !(state.keys && state.keys.g)) ? 1 : 0;

  // Juzu Bracelet prevents monster encounters in ? rooms
  if (rType === "?") {
    const roll = rng.next();
    if (!hasRelic(state, "Juzu Bracelet") && roll < 0.10) {
      rType = "M";
    } else if (roll < 0.15) {
      rType = "T";
    } else if (roll < 0.22) {
      rType = "$";
    }
  }

  if (rType === "M") {
    const pools = ACT_POOLS[state.a];
    const weakCount = state.a === 1 ? 3 : 2;
    const encList = (state.mw || 0) < weakCount ? pools.weak : pools.strong;
    state.mw = (state.mw || 0) + 1;
    let enc = rng.pick(encList);
    if (enc === state.le && encList.length > 1) enc = rng.pick(encList.filter(e => e !== state.le));
    state.le = enc;
    startCombat(state, enc, "M", rng);
  } else if (rType === "E") {
    const elites = ACT_POOLS[state.a].elites;
    let enc = rng.pick(elites);
    if (enc === state.le && elites.length > 1) enc = rng.pick(elites.filter(e => e !== state.le));
    state.le = enc;
    startCombat(state, enc, "E", rng);
  } else if (rType === "$") {
    if (hasRelic(state, "SSSerpentHead")) addGold(state, 50);
    if (hasRelic(state, "MealTicket")) healPlayer(state, 15, false);
    generateShop(state, rng);
  } else if (rType === "R") {
    if (hasRelic(state, "Eternal Feather")) {
      healPlayer(state, Math.floor(state.dk.length / 5) * 3, false);
    }
    if (hasRelic(state, "Ancient Tea Set")) {
      if (!state.rc) state.rc = {};
      state.rc.TeaSet = 1;
    }
    state.ph = "REST";
    addLog(state, "抵达营火休息处。");
  } else if (rType === "T") {
    state.ph = "TREASURE";
    addLog(state, "发现宝箱房！");
  } else {
    if (hasRelic(state, "SSSerpentHead")) addGold(state, 50);
    startEvent(state, rng);
  }
  return true;
}

// ============================================================================
// INITIALIZE RUN & PROTOCOL V5 JUDGE ENTRY
// ============================================================================
function applyCharacterToInitialState(state, charId) {
  const chKey = CHAR_META[charId] ? charId : "IRONCLAD";
  const cm = CHAR_META[chKey];
  state.ch = chKey;
  state.hp = cm.hp;
  state.mhp = cm.mhp || cm.hp;
  state.rel = [cm.relic];
  state.dk = cm.deck.slice();
}

function createInitialState(seedStr, charId = "IRONCLAD") {
  const seed = hashStr(String(seedStr || "sts-default-seed"));
  const chKey = CHAR_META[charId] ? charId : "IRONCLAD";
  const cm = CHAR_META[chKey];
  return {
    s: seed,
    rs: (seed ^ 0x9e3779b9) >>> 0,
    ch: chKey,
    a: 1,       // Act 1..3
    r: -1,      // Current Row (-1 before floor 1, 0..14 map, 15 boss)
    c: -1,      // Current Col
    p: [],      // Path [[x,y], ...]
    fl: 0,      // Total floors climbed (0..48)
    ek: 0,      // Elites killed
    bk: 0,      // Bosses killed
    mw: 0,      // Weak monster counter in current Act
    pr: 0,      // Shop purges used
    ph: "NEOW", // Phase: NEOW, MAP, COMBAT, REWARD, BOSS_RELIC, EVENT, SHOP, REST, TREASURE, VICTORY, DEFEAT, RETREAT
    rt: "N",    // Current room type
    hp: cm.hp,
    mhp: cm.mhp || cm.hp,
    g: 99,
    pot: ["", "", ""],
    rel: [cm.relic],
    rc: {},
    dk: cm.deck.slice(),
    ev: { id: "NEOW" },
    lg: ["踏入杀戮尖塔第一幕【塔底】！请选择英雄并接受涅奥的赐福。"],
  };
}

function setup(submission, tools) {
  const p = (submission && (submission.params || submission.args)) || submission || {};
  const maxReward = (typeof p.maxReward === "number")
    ? p.maxReward
    : ((submission && submission.hongbao && typeof submission.hongbao.maxClaim === "number") ? submission.hongbao.maxClaim : 1000);
  const randInt = (tools && tools.random && typeof tools.random.int === "function")
    ? tools.random.int(1, 2147483647)
    : Math.floor(Math.random() * 2147483647);

  };
}

const CHAR_BY_CODE = { I: "IRONCLAD", S: "THE_SILENT", D: "DEFECT", W: "WATCHER" };
function decodeCompactToken(tok) {
  if (!tok) return null;
  if (tok === "E") return { type: "end_turn" };
  if (tok === "RG") return { type: "claim_reward_gold" };
  if (tok === "RP") return { type: "claim_reward_potion" };
  if (tok === "RS") return { type: "skip_reward_card" };
  if (tok === "RN") return { type: "proceed_from_reward" };
  if (tok === "BS") return { type: "skip_boss_relic" };
  if (tok === "SL") return { type: "leave_shop" };
  if (tok === "HH") return { type: "rest_heal" };
  if (tok === "HL") return { type: "rest_lift" };
  if (tok === "HD") return { type: "rest_dig" };
  if (tok === "HR") return { type: "rest_recall" };
  if (tok === "HC") return { type: "cash_out" };
  if (tok === "HX") return { type: "leave_rest" };
  if (tok === "TO") return { type: "open_treasure" };
  if (tok === "TL") return { type: "leave_treasure" };
  const c2 = tok.slice(0, 2);
  if (c2 === "RR") return { type: "claim_reward_relic", index: Number(tok.slice(2) || 0) };
  if (c2 === "RK") return { type: "claim_reward_key", key: tok.slice(2) || "b" };
  if (c2 === "RC") return { type: "pick_reward_card", index: Number(tok.slice(2) || 0) };
  if (c2 === "BP") return { type: "pick_boss_relic", index: Number(tok.slice(2) || 0) };
  if (c2 === "SC") return { type: "shop_buy_card", index: Number(tok.slice(2) || 0) };
  if (c2 === "SR") return { type: "shop_buy_relic", index: Number(tok.slice(2) || 0) };
  if (c2 === "SP") return { type: "shop_buy_potion", index: Number(tok.slice(2) || 0) };
  if (c2 === "SX") return { type: "shop_purge", cardIdx: Number(tok.slice(2) || 0) };
  if (c2 === "HS") return { type: "rest_smith", cardIdx: Number(tok.slice(2) || 0) };
  if (c2 === "HT") return { type: "rest_toke", cardIdx: Number(tok.slice(2) || 0) };
  const c1 = tok[0];
  const rest = tok.slice(1);
  if (c1 === "C") return { type: "select_char", char: CHAR_BY_CODE[rest] || rest || "IRONCLAD" };
  if (c1 === "N") {
    const [ci, cdi, ch] = rest.split(",");
    return { type: "neow_blessing", choiceIdx: Number(ci || 0), cardIdx: Number(cdi || 0), char: CHAR_BY_CODE[ch] || ch || "IRONCLAD" };
  }
  if (c1 === "M") {
    const [x, y] = rest.split(",").map(Number);
    return { type: "choose_node", x: x || 0, y: y || 0 };
  }
  if (c1 === "P") {
    const [ci, ti] = rest.split(",").map(Number);
    return { type: "play_card", cardIdx: ci || 0, targetIdx: ti || 0 };
  }
  if (c1 === "U") {
    const [pi, ti] = rest.split(",").map(Number);
    return { type: "use_potion", potIdx: pi || 0, targetIdx: ti || 0 };
  }
  if (c1 === "D") return { type: "discard_potion", potIdx: Number(rest || 0) };
  if (c1 === "V") {
    const [ci, cdi] = rest.split(",").map(Number);
    return { type: "event_choice", choiceIdx: ci || 0, cardIdx: cdi || 0 };
  }
  return null;
}

function parseSubmissionAction(submission) {
  if (!submission) return null;
  if (submission.action && typeof submission.action === "object") return submission.action;
  const raw = typeof submission.input === "string" ? submission.input.trim() : "";
  if (!raw) return null;
  if (raw.startsWith("{")) {
    try { return JSON.parse(raw); } catch { return null; }
  }
  if (raw.startsWith("~")) {
    const actions = raw.slice(1).split(";").map(decodeCompactToken).filter(Boolean);
    if (actions.length === 0) return null;
    return actions.length === 1 ? actions[0] : { type: "batch", actions };
  }
  const parts = raw.split(":");
  const cmd = parts[0].toUpperCase();
  if (cmd === "START" || cmd === "INIT") return { type: "init" };
  if (cmd === "CHAR") return { type: "select_char", char: parts[1] || "IRONCLAD" };
  if (cmd === "BLESS" || cmd === "NEOW") return { type: "neow_blessing", choiceIdx: Number(parts[1] || 0), char: parts[2] };
  if (cmd === "NODE") {
    const [x, y] = (parts[1] || "0,0").split(",").map(Number);
    return { type: "choose_node", x, y };
  }
  if (cmd === "PLAY") {
    const [cardIdx, targetIdx] = (parts[1] || "0,0").split(",").map(Number);
    return { type: "play_card", cardIdx, targetIdx: targetIdx || 0 };
  }
  if (cmd === "END") return { type: "end_turn" };
  if (cmd === "CASH_OUT" || cmd === "RETREAT") return { type: "cash_out" };
  return { type: raw };
}

function judge(submission, tools) {
  const p = (submission && (submission.params || submission.args)) || {};
  const maxReward = (typeof p.maxReward === "number")
    ? p.maxReward
    : ((submission && submission.hongbao && typeof submission.hongbao.maxClaim === "number") ? submission.hongbao.maxClaim : 1000);

  const userId = (submission && submission.user && submission.user.id) ? submission.user.id : 10001;
  const hasSavedState = Boolean(
    submission && submission.player && submission.player.state &&
    typeof submission.player.state === "object" && submission.player.state.dk
  );

  let st;
  if (hasSavedState) {
    st = JSON.parse(JSON.stringify(submission.player.state));
  } else {
    const seedKey = (tools && tools.userRandom && typeof tools.userRandom.int === "function")
      ? ("sts-hb-" + tools.userRandom.int(1, 2147483647) + "-" + tools.userRandom.int(1, 2147483647))
      : ("sts-spire-seed-" + userId + "-" + ((submission && submission.hongbao && submission.hongbao.openedAt) || 0));
    st = createInitialState(seedKey);
  }

  const rng = new Rng(st.rs || st.s || 123456789);
  const act = parseSubmissionAction(submission);

  let settle = false;

  function applySingleAction(subAct) {
    if (!subAct || subAct.type === "init" || st.ph === "VICTORY" || st.ph === "DEFEAT" || st.ph === "RETREAT") return;
    const t = subAct.type;
    const reqChar = subAct.char || subAct.charId;
    if (st.ph === "NEOW" && (st.fl || 0) === 0 && reqChar && CHAR_META[reqChar] && st.ch !== reqChar) {
      applyCharacterToInitialState(st, reqChar);
    }

    if (t === "select_char") {
      if (st.ph === "NEOW" && (st.fl || 0) === 0) {
        addLog(st, "已切换角色为【" + CHAR_META[st.ch].name + "】！");
      }
      return;
    }

    // Auto-complete room transition if player chooses next map node directly from Map Overlay
    if (t === "choose_node" && st.ph !== "MAP") {
      if (st.ph === "REWARD") proceedAfterReward(st, rng);
      else if (st.ph === "NEOW") handleEventAction(st, 0, 0, rng);
      else if (st.ph === "SHOP") { delete st.sh; st.ph = "MAP"; }
      else if (st.ph === "REST" || st.ph === "TREASURE") { st.ph = "MAP"; }
    }

    if (t === "use_potion") {
      usePotion(st, Number(subAct.potIdx ?? subAct.index ?? 0), Number(subAct.targetIdx ?? 0), rng);
    } else if (t === "discard_potion") {
      const pIdx = Number(subAct.potIdx ?? subAct.index ?? 0);
      if (st.pot && st.pot[pIdx]) st.pot[pIdx] = "";
    } else if (t === "cash_out" || t === "rest_retreat") {
      if (st.ph === "REST" && (st.fl || 0) >= 1) {
        st.ph = "RETREAT";
        settle = true;
        addLog(st, "💰 你在营火旁选择见好就收，携带当前战利品安全撤离尖塔！");
      } else {
        addLog(st, "⚠️ 只有在营火休息处（篝火）才能选择见好就收撤离尖塔！");
      }
    } else if (st.ph === "NEOW" || st.ph === "EVENT") {
      if (t === "event_choice" || t === "neow_blessing") {
        handleEventAction(st, subAct.choiceIdx ?? subAct.index ?? 0, subAct.cardIdx ?? 0, rng);
      }
    } else if (st.ph === "MAP") {
      if (t === "choose_node") {
        enterMapNode(st, Number(subAct.x ?? subAct.col ?? 0), Number(subAct.y ?? subAct.row ?? 0), rng);
      }
    } else if (st.ph === "COMBAT") {
      if (t === "play_card") {
        playCardInCombat(st, Number(subAct.cardIdx ?? subAct.index ?? 0), Number(subAct.targetIdx ?? 0), rng);
      } else if (t === "end_turn") {
        endPlayerTurn(st, rng);
      }
    } else if (st.ph === "REWARD") {
      handleRewardAction(st, subAct, rng);
    } else if (st.ph === "BOSS_RELIC") {
      handleBossRelicAction(st, subAct, rng);
    } else if (st.ph === "SHOP") {
      handleShopAction(st, subAct, rng);
    } else if (st.ph === "REST") {
      handleRestAction(st, subAct, rng);
    } else if (st.ph === "TREASURE") {
      handleTreasureAction(st, subAct, rng);
    }
    st.rs = rng.s;
  }

  if (act && act.type === "batch" && Array.isArray(act.actions)) {
    const list = act.actions.slice(0, 300);
    for (let i = 0; i < list.length; i++) {
      applySingleAction(list[i]);
      if (st.ph === "VICTORY" || st.ph === "DEFEAT" || st.ph === "RETREAT") break;
    }
  } else {
    applySingleAction(act);
  }

  st.rs = rng.s;

  if (st.ph === "VICTORY" || st.ph === "DEFEAT" || st.ph === "RETREAT") {
    settle = true;
  }

  const prevPending = (submission && submission.player && typeof submission.player.pending === "number")
    ? submission.player.pending
    : 0;
  const estBounty = calcBounty(st, p, maxReward);
  const targetPending = settle ? estBounty : 0;
  const add = targetPending - prevPending;
  const lastLog = (st.lg && st.lg.length > 0) ? st.lg[st.lg.length - 1] : "继续攀登尖塔";

  const viewData = Object.assign({}, st, {
    mr: maxReward,
    pd: estBounty,
  });

  return {
    add,
    settle,
    message: lastLog,
    ...(st.ph === "VICTORY" ? {
      announce: ((submission && submission.user && submission.user.username) || "勇士") +
        ((st.a || 1) >= 4 ? " 弑杀第四幕【腐化之心】达成真结局完美登顶（150% 悬赏）！" : " 击败第三幕终极首领，成功打通杀戮尖塔（100% 悬赏）！")
    } : {}),
    player: {
      state: st,
      view: {
        summary: "第" + st.a + "幕 " + (st.fl || 0) + "/" + ((st.a || 1) >= 4 || (st.fl || 0) > 48 ? 52 : 48) + "层 · ❤️" + st.hp + "/" + st.mhp + " · 💰" + st.g + " · " + lastLog,
        data: viewData,
      },
    },
  };
}

const STS_SpineEngine = (() => {
  let ready = false;
  let spineImg = null;
  let bundle = null;

  function evalCurve(curve, f) {
    if (!curve || f <= 0 || f >= 1) return f < 0 ? 0 : (f > 1 ? 1 : f);
    if (curve === "stepped") return 0;
    if (Array.isArray(curve) && curve.length === 4) {
      const cx1 = curve[0], cy1 = curve[1], cx2 = curve[2], cy2 = curve[3];
      let u = f;
      for (let i = 0; i < 4; i++) {
        const u2 = u * u, u3 = u2 * u, mu = 1 - u, mu2 = mu * mu;
        const x = 3 * mu2 * u * cx1 + 3 * mu * u2 * cx2 + u3 - f;
        const dx = 3 * mu2 * cx1 + 6 * mu * u * (cx2 - cx1) + 3 * u2 * (1 - cx2);
        if (Math.abs(dx) < 1e-5) break;
        u -= x / dx;
        if (u < 0) u = 0; else if (u > 1) u = 1;
      }
      const u2 = u * u, u3 = u2 * u, mu = 1 - u, mu2 = mu * mu;
      return 3 * mu2 * u * cy1 + 3 * mu * u2 * cy2 + u3;
    }
    return f;
  }

  function sampleTimeline2(keys, t, defX, defY, pX, pY) {
    if (!keys || keys.length === 0) return [defX, defY];
    const first = keys[0];
    if (t <= (first.time || 0)) {
      return [first[pX] !== undefined ? first[pX] : defX, first[pY] !== undefined ? first[pY] : defY];
    }
    const last = keys[keys.length - 1];
    if (t >= (last.time || 0)) {
      return [last[pX] !== undefined ? last[pX] : defX, last[pY] !== undefined ? last[pY] : defY];
    }
    let k = 0;
    while (k < keys.length - 2 && t >= (keys[k + 1].time || 0)) k++;
    const k0 = keys[k], k1 = keys[k + 1];
    const t0 = k0.time || 0, t1 = k1.time || 0;
    const f = evalCurve(k0.curve, t1 > t0 ? (t - t0) / (t1 - t0) : 0);
    const x0 = k0[pX] !== undefined ? k0[pX] : defX, x1 = k1[pX] !== undefined ? k1[pX] : defX;
    const y0 = k0[pY] !== undefined ? k0[pY] : defY, y1 = k1[pY] !== undefined ? k1[pY] : defY;
    return [x0 + (x1 - x0) * f, y0 + (y1 - y0) * f];
  }

  function sampleAngle(keys, t) {
    if (!keys || keys.length === 0) return 0;
    if (t <= (keys[0].time || 0)) return keys[0].angle || 0;
    const last = keys[keys.length - 1];
    if (t >= (last.time || 0)) return last.angle || 0;
    let k = 0;
    while (k < keys.length - 2 && t >= (keys[k + 1].time || 0)) k++;
    const k0 = keys[k], k1 = keys[k + 1];
    const t0 = k0.time || 0, t1 = k1.time || 0;
    const f = evalCurve(k0.curve, t1 > t0 ? (t - t0) / (t1 - t0) : 0);
    const v0 = k0.angle || 0, v1 = k1.angle || 0;
    const diff = ((v1 - v0) % 360 + 540) % 360 - 180;
    return v0 + diff * f;
  }

  function sampleDeform(keys, t, vCount) {
    const out = new Float32Array(vCount);
    if (!keys || keys.length === 0) return out;
    const applyKey = (kf, weight) => {
      const verts = kf.vertices;
      if (!verts) return;
      const off = kf.offset || 0;
      for (let i = 0; i < verts.length && (off + i) < vCount; i++) out[off + i] += verts[i] * weight;
    };
    if (t <= (keys[0].time || 0)) { applyKey(keys[0], 1); return out; }
    const last = keys[keys.length - 1];
    if (t >= (last.time || 0)) { applyKey(last, 1); return out; }
    let k = 0;
    while (k < keys.length - 2 && t >= (keys[k + 1].time || 0)) k++;
    const k0 = keys[k], k1 = keys[k + 1];
    const t0 = k0.time || 0, t1 = k1.time || 0;
    const f = evalCurve(k0.curve, t1 > t0 ? (t - t0) / (t1 - t0) : 0);
    applyKey(k0, 1 - f);
    applyKey(k1, f);
    return out;
  }

  function calcAnimDur(animObj) {
    if (!animObj) return 1.2;
    let maxT = 0;
    const scan = (arr) => { if (Array.isArray(arr) && arr.length > 0) maxT = Math.max(maxT, arr[arr.length - 1].time || 0); };
    if (animObj.bones) for (const b of Object.values(animObj.bones)) { scan(b.translate); scan(b.rotate); scan(b.scale); }
    if (animObj.slots) for (const s of Object.values(animObj.slots)) { scan(s.attachment); scan(s.color); }
    if (animObj.deform) for (const sl of Object.values(animObj.deform)) for (const at of Object.values(sl)) scan(at);
    return maxT > 0.05 ? maxT : 1.2;
  }
