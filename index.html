function parseSubmissionAction(submission) {
  if (!submission) return null;
  if (submission.action && typeof submission.action === "object") return submission.action;
  const raw = typeof submission.input === "string" ? submission.input.trim() : "";
  if (!raw) return null;
  if (raw.startsWith("{")) {
    try { return JSON.parse(raw); } catch { return null; }
  }
  const parts = raw.split(":");
  const cmd = parts[0].toUpperCase();
  if (cmd === "START" || cmd === "INIT") return { type: "init" };
  if (cmd === "BLESS" || cmd === "NEOW") return { type: "neow_blessing", choiceIdx: Number(parts[1] || 0) };
  if (cmd === "NODE") {
    const [x, y] = (parts[1] || "0,0").split(",").map(Number);
    return { type: "choose_node", x, y };
  }
  if (cmd === "PLAY") {
    const [cardIdx, targetIdx] = (parts[1] || "0,0").split(",").map(Number);
    return { type: "play_card", cardIdx, targetIdx: targetIdx || 0 };
  }
  if (cmd === "END") return { type: "end_turn" };
  if (cmd === "CASH_OUT" || cmd === "RETREAT") return { type: "cash_out" };
  return { type: raw };
}

function judge(submission, tools) {
  const p = (submission && (submission.params || submission.args)) || {};
  const maxReward = (typeof p.maxReward === "number")
    ? p.maxReward
    : ((submission && submission.hongbao && typeof submission.hongbao.maxClaim === "number") ? submission.hongbao.maxClaim : 1000);

  const userId = (submission && submission.user && submission.user.id) ? submission.user.id : 10001;
  const hasSavedState = Boolean(
    submission && submission.player && submission.player.state &&
    typeof submission.player.state === "object" && submission.player.state.dk
  );

  let st;
  if (hasSavedState) {
    st = JSON.parse(JSON.stringify(submission.player.state));
  } else {
    const seedKey = (tools && tools.userRandom && typeof tools.userRandom.int === "function")
      ? ("sts-hb-" + tools.userRandom.int(1, 2147483647) + "-" + tools.userRandom.int(1, 2147483647))
      : ("sts-spire-seed-" + userId + "-" + ((submission && submission.hongbao && submission.hongbao.openedAt) || 0));
    st = createInitialState(seedKey);
  }

  const rng = new Rng(st.rs || st.s || 123456789);
  const act = parseSubmissionAction(submission);

  let settle = false;

  if (act && act.type !== "init" && st.ph !== "VICTORY" && st.ph !== "DEFEAT" && st.ph !== "RETREAT") {
    const t = act.type;

    if (t === "use_potion") {
      usePotion(st, Number(act.potIdx ?? act.index ?? 0), Number(act.targetIdx ?? 0), rng);
    } else if (t === "discard_potion") {
      const pIdx = Number(act.potIdx ?? act.index ?? 0);
      if (st.pot && st.pot[pIdx]) st.pot[pIdx] = "";
    } else if (t === "cash_out" || t === "rest_retreat") {
      if (st.ph === "REST" && (st.fl || 0) >= 1) {
        st.ph = "RETREAT";
        settle = true;
        addLog(st, "💰 你在营火旁选择见好就收，携带当前战利品安全撤离尖塔！");
      } else {
        addLog(st, "⚠️ 只有在营火休息处（篝火）才能选择见好就收撤离尖塔！");
      }
    } else if (st.ph === "NEOW" || st.ph === "EVENT") {
      if (t === "event_choice" || t === "neow_blessing") {
        handleEventAction(st, act.choiceIdx ?? act.index ?? 0, act.cardIdx ?? 0, rng);
      }
    } else if (st.ph === "MAP") {
      if (t === "choose_node") {
        enterMapNode(st, Number(act.x ?? act.col ?? 0), Number(act.y ?? act.row ?? 0), rng);
      }
    } else if (st.ph === "COMBAT") {
      if (t === "play_card") {
        playCardInCombat(st, Number(act.cardIdx ?? act.index ?? 0), Number(act.targetIdx ?? 0), rng);
      } else if (t === "end_turn") {
        endPlayerTurn(st, rng);
      }
    } else if (st.ph === "REWARD") {
      handleRewardAction(st, act, rng);
    } else if (st.ph === "BOSS_RELIC") {
      handleBossRelicAction(st, act, rng);
    } else if (st.ph === "SHOP") {
      handleShopAction(st, act, rng);
    } else if (st.ph === "REST") {
      handleRestAction(st, act, rng);
    } else if (st.ph === "TREASURE") {
      handleTreasureAction(st, act, rng);
    }
  }

  st.rs = rng.s;

  if (st.ph === "VICTORY" || st.ph === "DEFEAT" || st.ph === "RETREAT") {
    settle = true;
  }

  const prevPending = (submission && submission.player && typeof submission.player.pending === "number")
    ? submission.player.pending
    : 0;
  const estBounty = calcBounty(st, p, maxReward);
  const targetPending = settle ? estBounty : 0;
  const add = targetPending - prevPending;
  const lastLog = (st.lg && st.lg.length > 0) ? st.lg[st.lg.length - 1] : "继续攀登尖塔";

  const viewData = Object.assign({}, st, {
    mr: maxReward,
    pd: estBounty,
  });

  return {
    add,
    settle,
    message: lastLog,
    ...(st.ph === "VICTORY" ? { announce: ((submission && submission.user && submission.user.username) || "勇士") + " 击败第三幕终极首领，成功登顶杀戮尖塔！" } : {}),
    player: {
      state: st,
      view: {
        summary: "第" + st.a + "幕 " + (st.fl || 0) + "/48层 · ❤️" + st.hp + "/" + st.mhp + " · 💰" + st.g + " · " + lastLog,
        data: viewData,
      },
    },
  };
}

function spIcon(cat, key, size = 18, fallback = "") {
  const map = SPRITE_MANIFEST[cat];
  const idx = map && map[key];
  if (idx === undefined) return fallback;
  const col = idx % 16, row = Math.floor(idx / 16);
  const px = (col / 15) * 100, py = (row / 15) * 100;
  return '<span class="sp-icon" style="width:' + size + 'px;height:' + size + 'px;background-position:' + px.toFixed(2) + '% ' + py.toFixed(2) + '%"></span>';
}

function spMonster(key, size = 78) {
  const map = SPRITE_MANIFEST.monsters;
  const idx = (map && map[key] !== undefined) ? map[key] : 1;
  const col = idx % 9, row = Math.floor(idx / 9);
  const px = (col / 8) * 100, py = (row / 7) * 100;
  return '<span class="sp-monster" style="width:' + size + 'px;height:' + size + 'px;background-position:' + px.toFixed(2) + '% ' + py.toFixed(2) + '%"></span>';
}

function spEventBanner(key, w = 135, h = 90) {
  const map = SPRITE_MANIFEST.events;
  const idx = (map && map[key] !== undefined) ? map[key] : 0;
  const col = idx % 5, row = Math.floor(idx / 5);
  const px = (col / 4) * 100, py = (row / 3) * 100;
  return '<span class="sp-event" style="width:' + w + 'px;height:' + h + 'px;background-position:' + px.toFixed(2) + '% ' + py.toFixed(2) + '%"></span>';
}

function spEventSquare(key, size = 240) {
  const map = SPRITE_MANIFEST.events;
  const idx = (map && map[key] !== undefined) ? map[key] : 4;
  const col = idx % 5, row = Math.floor(idx / 5);
  const px = (col / 4) * 100, py = (row / 3) * 100;
  return '<span class="sp-event" style="width:' + size + 'px;height:' + size + 'px;border-radius:4px;border:none;background-position:' + px.toFixed(2) + '% ' + py.toFixed(2) + '%"></span>';
}

function uiPanelBgStyle(panelKey) {
  const panels = SPRITE_MANIFEST.uiPanels || {};
  const p = panels[panelKey];
  if (!p) return "";
  const SW = panels.sheetW || 1032;
  const SH = panels.sheetH || 1044;
  const sx = ((SW / p.w) * 100).toFixed(3) + "%";
  const sy = ((SH / p.h) * 100).toFixed(3) + "%";
  const px = ((p.x / (SW - p.w)) * 100).toFixed(3) + "%";
  const py = ((p.y / (SH - p.h)) * 100).toFixed(3) + "%";
  return "background-image:url(assets/ui.webp);background-repeat:no-repeat;background-size:" + sx + " " + sy + ";background-position:" + px + " " + py + ";";
}

function spCardPos(cardId) {
  const map = SPRITE_MANIFEST.cards;
  const idx = (map && map[cardId] !== undefined) ? map[cardId] : 0;
  const col = idx % 12, row = Math.floor(idx / 12);
  return ((col / 11) * 100).toFixed(2) + '% ' + ((row / 10) * 100).toFixed(2) + '%';
}

function spCardFramePos(def) {
  const frames = SPRITE_MANIFEST.cardFrames || {};
  let key = "attack_common";
  if (def.type === "ST" || def.type === "C") {
    key = "status_curse";
  } else if (
    (typeof COLORLESS_CARDS !== "undefined" && COLORLESS_CARDS.indexOf(def.id) !== -1) ||
    def.rarity === "SP"
  ) {
    key = def.rarity === "R" ? "colorless_rare" : "colorless_uncommon";
  } else {
    const tKey = def.type === "A" ? "attack" : (def.type === "P" ? "power" : "skill");
    const rKey = def.rarity === "R" ? "rare" : (def.rarity === "U" ? "uncommon" : "common");
    key = tKey + "_" + rKey;
  }
  const idx = frames[key] !== undefined ? frames[key] : 0;
  const col = idx % 6, row = Math.floor(idx / 6);
  const SH = (SPRITE_MANIFEST.uiPanels && SPRITE_MANIFEST.uiPanels.sheetH) || 1044;
  const py = ((row * 222) / (SH - 222)) * 100;
  return ((col / 5) * 100).toFixed(2) + '% ' + py.toFixed(3) + '%';
}

function clearTargeting(shouldRender = true) {
  activeCardIdx = null;
  activePotionIdx = null;
  hoveredEnemyIdx = null;
  dragState = null;
  const svg = document.getElementById("sts-target-svg");
  if (svg) svg.innerHTML = "";
  if (shouldRender) renderApp();
}

function drawTargetingCurve(x1, y1, x2, y2, isLocked) {
  const svg = document.getElementById("sts-target-svg");
  if (!svg) return;
  const dx = x2 - x1;
  const dy = y2 - y1;
  const cx = (x1 + x2) * 0.5;
  const cy = Math.min(y1, y2) - Math.max(55, Math.min(150, Math.abs(dx) * 0.28 + Math.abs(dy) * 0.15));

  const mainCol = isLocked ? "#f5c451" : "#ef4444";
  const glowCol = isLocked ? "rgba(245,196,81,0.55)" : "rgba(239,68,68,0.45)";
  let html = '<path d="M ' + x1 + ' ' + y1 + ' Q ' + cx + ' ' + cy + ' ' + x2 + ' ' + y2 + '" fill="none" stroke="' + glowCol + '" stroke-width="10" stroke-linecap="round"/>';

  const N = 14;
  for (let i = 1; i < N; i++) {
    const t = i / N;
    const omt = 1 - t;
    const px = omt * omt * x1 + 2 * omt * t * cx + t * t * x2;
    const py = omt * omt * y1 + 2 * omt * t * cy + t * t * y2;
    const r = 3.2 + t * 2.6;
    html += '<circle cx="' + px.toFixed(1) + '" cy="' + py.toFixed(1) + '" r="' + r.toFixed(1) + '" fill="' + mainCol + '" stroke="#000" stroke-width="1.2"/>';
  }

  // Tangent at t=1 is (x2 - cx, y2 - cy)
  const ang = Math.atan2(y2 - cy, x2 - cx) * (180 / Math.PI);
  html +=
    '<g transform="translate(' + x2.toFixed(1) + ',' + y2.toFixed(1) + ') rotate(' + ang.toFixed(1) + ')">' +
      '<polygon points="6,0 -14,-10 -9,0 -14,10" fill="' + mainCol + '" stroke="#000" stroke-width="1.6"/>' +
      '<circle cx="0" cy="0" r="16" fill="none" stroke="' + mainCol + '" stroke-width="2" stroke-dasharray="4,3"/>' +
    '</g>';
  svg.innerHTML = html;
}

function updateLiveTargetingArrow(clientX, clientY) {
  const svg = document.getElementById("sts-target-svg");
  if (!svg) return;
  if (activeCardIdx === null && activePotionIdx === null) {
    svg.innerHTML = "";
    return;
  }

  let startEl = null;
  if (activeCardIdx !== null) {
    startEl = document.querySelector('.hand-tray .sts-card[data-hand-idx="' + activeCardIdx + '"]');
  } else if (activePotionIdx !== null) {
    startEl = document.querySelector('.potion-icon-btn[data-pot-idx="' + activePotionIdx + '"]');
  }
  if (!startEl) {
    svg.innerHTML = "";
    return;
  }

  const sRect = startEl.getBoundingClientRect();
  const x1 = sRect.left + sRect.width / 2;
  const y1 = activeCardIdx !== null ? (sRect.top + 14) : (sRect.bottom - 4);

  let x2 = clientX;
  let y2 = clientY;
  let locked = false;

  // Check if pointer is over a living enemy or snap to hoveredEnemyIdx
  const elUnder = (clientX > 0 && clientY > 0) ? document.elementFromPoint(clientX, clientY) : null;
  const enemyUnit = elUnder && elUnder.closest ? elUnder.closest('.sts-unit.enemy-unit:not(.dead)') : null;
  let hitIdx = enemyUnit ? Number(enemyUnit.getAttribute("data-enemy-idx")) : null;

  document.querySelectorAll('.sts-unit.enemy-unit').forEach(u => {
    const idx = Number(u.getAttribute("data-enemy-idx"));
    u.classList.toggle("target-locked", idx === hitIdx);
  });

  if (hitIdx !== null && !Number.isNaN(hitIdx)) {
    hoveredEnemyIdx = hitIdx;
    locked = true;
    const eRect = enemyUnit.getBoundingClientRect();
    x2 = eRect.left + eRect.width / 2;
    y2 = eRect.top + eRect.height * 0.45;
  } else if ( !(clientX > 0 && clientY > 0) ) {
    const defEnemy = document.querySelector('.sts-unit.enemy-unit[data-enemy-idx="' + selectedTargetIdx + '"]');
    if (defEnemy) {
      const eRect = defEnemy.getBoundingClientRect();
      x2 = eRect.left + eRect.width / 2;
      y2 = eRect.top + eRect.height * 0.45;
      locked = true;
    }
  } else {
    hoveredEnemyIdx = null;
  }

  drawTargetingCurve(x1, y1, x2, y2, locked);
}

window.addEventListener("pointermove", (e) => {
  lastPointerPos = { x: e.clientX, y: e.clientY };
  if (dragState && !dragState.moved) {
    const dist = Math.hypot(e.clientX - dragState.startX, e.clientY - dragState.startY);
    if (dist > 10) {
      dragState.moved = true;
      if (activeCardIdx !== dragState.cIdx) {
        activeCardIdx = dragState.cIdx;
        activePotionIdx = null;
        renderApp();
      }
    }
  }
  if (activeCardIdx !== null || activePotionIdx !== null) {
    updateLiveTargetingArrow(e.clientX, e.clientY);
  }
});

window.addEventListener("pointerup", (e) => {
  if (!dragState) return;
  const ds = dragState;
  dragState = null;
  if (!ds.moved) return; // Was a simple click; handled by click listener

  const elUnder = document.elementFromPoint(e.clientX, e.clientY);
  if (ds.def.target === "E") {
    const enemyUnit = elUnder && elUnder.closest ? elUnder.closest('.sts-unit.enemy-unit:not(.dead)') : null;
    if (enemyUnit) {
      const eIdx = Number(enemyUnit.getAttribute("data-enemy-idx"));
      selectedTargetIdx = eIdx;
      clearTargeting(false);
      sendAction({ type: "play_card", cardIdx: ds.cIdx, targetIdx: eIdx });
      return;
    }
  } else {
    const inArena = elUnder && elUnder.closest ? elUnder.closest('.arena-stage') : null;
    if (inArena || (ds.startY - e.clientY > 55)) {
      clearTargeting(false);
      sendAction({ type: "play_card", cardIdx: ds.cIdx, targetIdx: selectedTargetIdx });
      return;
    }
  }
});

window.addEventListener("contextmenu", (e) => {
  if (activeCardIdx !== null || activePotionIdx !== null) {
    e.preventDefault();
    clearTargeting(true);
  }
});

window.addEventListener("keydown", (e) => {
  if (e.key === "Escape") {
    if (activeCardIdx !== null || activePotionIdx !== null) clearTargeting(true);
    else if (mapOverlayOpen) { mapOverlayOpen = false; renderApp(); }
    else if (modalState) { modalState = null; renderApp(); }
  }
});

function runLocalJudge(payload) {
  const baseState = localPlayerState || currentData || createInitialState("sts-spire-seed-" + Date.now());
  const res = judge({
    input: typeof payload === "string" ? payload : JSON.stringify(payload),
    params: { maxReward: 1000, retainPercent: 50 },
    user: { id: 10001, username: "铁甲战士" },
    player: {
      pending: localPending,
      state: baseState,
    },
  });
  if (res && res.player && res.player.view && res.player.view.data) {
    localPlayerState = res.player.state;
    localPending = Math.max(0, localPending + (res.add || 0));
    currentData = res.player.view.data;
    try {
      sessionStorage.setItem("sts_hb_standalone", JSON.stringify({
        localPlayerState,
        localPending,
        currentData,
      }));
    } catch {}
    renderApp();
  }
}

function resetLocalRun() {
  const fresh = createInitialState("sts-spire-seed-" + Date.now() + "-" + Math.floor(Math.random() * 100000));
  localPlayerState = fresh;
  localPending = 0;
  currentData = Object.assign({}, fresh, { mr: 1000, pd: 0 });
  try {
    sessionStorage.setItem("sts_hb_standalone", JSON.stringify({
      localPlayerState,
      localPending,
      currentData,
    }));
  } catch {}
  renderApp();
}

function sendAction(payload) {
  clearTargeting(false);
  mapOverlayOpen = false;
  const str = typeof payload === "string" ? payload : JSON.stringify(payload);
  if (hbConnected && window.hb && typeof window.hb.submit === "function") {
    window.hb.submit(str).then((res) => {
      if (!res || !res.judged) {
        runLocalJudge(payload);
      }
    }).catch(() => {
      runLocalJudge(payload);
    });
  } else if (window.HB && typeof window.HB.send === "function") {
    window.HB.send(payload);
  } else {
    runLocalJudge(payload);
  }
}

function formatCardDesc(def, nums) {
  let s = def.desc || "";
  const dCls = nums.dmg > def.dmg ? "num-boost" : (nums.dmg < def.dmg ? "num-nerf" : "");
  const bCls = nums.blk > def.blk ? "num-boost" : (nums.blk < def.blk ? "num-nerf" : "");
  s = s.replace(/!D!/g, '<span class="' + dCls + '">' + nums.dmg + '</span>');
  s = s.replace(/!B!/g, '<span class="' + bCls + '">' + nums.blk + '</span>');
  s = s.replace(/!M!/g, '<b>' + nums.mag + '</b>');
  s = s.replace(/\[R\]/g, "⚡");
  s = s.replace(/ NL /g, "<br/>");
  return s;
}

function getMonsterIntentInfo(st, bt, m) {
  if (hasRelic(st, "Runic Dome")) return { cls: "deb", text: spIcon("intents", "unknown", 22, "❓"), tip: "符文圆顶：无法查看敌人意图" };
  const it = m.in || m.it || "UNKNOWN";
  let dmg = (m.dmg !== undefined ? m.dmg : m.idmg) || 0;
  if (dmg > 0) {
    let d = dmg + (m.pw.Strength || 0);
    if ((m.pw.Weak || 0) > 0) d = Math.floor(d * 0.75);
    if ((bt.pw.Vulnerable || 0) > 0) d = Math.floor(d * (hasRelic(st, "Odd Mushroom") ? 1.25 : 1.5));
    if ((bt.pw.Intangible || 0) > 0 && d > 0) d = 1;
    dmg = Math.max(0, d);
  }
  const hitCnt = m.hits || m.ihit || 1;
  const hits = hitCnt > 1 ? ("×" + hitCnt) : "";
  const totalDmg = dmg * hitCnt;
  const atkTier = totalDmg < 5 ? 1 : (totalDmg < 10 ? 2 : (totalDmg < 15 ? 3 : (totalDmg < 20 ? 4 : (totalDmg < 25 ? 5 : (totalDmg < 30 ? 6 : 7)))));
  const atkIcon = spIcon("intents", "attack_" + atkTier, 24, "⚔️");

  if (it === "ATTACK" || it === "ATK") return { cls: "atk", text: atkIcon + " " + dmg + hits, tip: "准备攻击，造成 " + dmg + hits + " 点伤害" };
  if (it === "ATTACK_DEFEND" || it === "ATK_DEF") return { cls: "atk", text: atkIcon + " " + dmg + hits + " " + spIcon("intents", "defend", 18, "🛡️"), tip: "准备攻击造成 " + dmg + hits + " 点伤害，并获得格挡" };
  if (it === "ATTACK_BUFF" || it === "ATK_BUFF") return { cls: "atk", text: atkIcon + " " + dmg + hits + " " + spIcon("intents", "buff", 18, "💪"), tip: "准备攻击造成 " + dmg + hits + " 点伤害，并强化自身" };
  if (it === "ATTACK_DEBUFF" || it === "ATK_DEB") return { cls: "atk", text: atkIcon + " " + dmg + hits + " " + spIcon("intents", "debuff1", 18, "🌀"), tip: "准备攻击造成 " + dmg + hits + " 点伤害，并施加负面效果" };
  if (it === "DEFEND" || it === "DEF") return { cls: "def", text: spIcon("intents", "defend", 22, "🛡️"), tip: "准备进行防御，获得格挡" };
  if (it === "DEFEND_BUFF" || it === "DEF_BUFF") return { cls: "def", text: spIcon("intents", "defend_buff", 22, "🛡️"), tip: "准备获得格挡并强化自身" };
  if (it === "DEFEND_DEBUFF") return { cls: "def", text: spIcon("intents", "defend", 20, "🛡️") + spIcon("intents", "debuff1", 18, "🌀"), tip: "准备防御并施加负面状态" };
  if (it === "BUFF") return { cls: "buf", text: spIcon("intents", "buff", 22, "💪"), tip: "准备使用强化效果" };
  if (it === "DEBUFF" || it === "DEB") return { cls: "deb", text: spIcon("intents", "debuff1", 22, "🌀"), tip: "准备对你施加负面状态" };
  if (it === "STRONG_DEBUFF" || it === "STRONG_DEB") return { cls: "deb", text: spIcon("intents", "debuff2", 22, "🌀"), tip: "准备对你施加极其强大的诅咒/负面效果" };
  if (it === "SLEEP") return { cls: "def", text: spIcon("intents", "sleep", 22, "💤"), tip: "正在沉睡中" };
  if (it === "STUN") return { cls: "def", text: spIcon("intents", "stun", 22, "💫"), tip: "已被眩晕，本回合无法行动" };
  if (it === "ESCAPE" || it === "ESC") return { cls: "deb", text: spIcon("intents", "escape", 22, "🏃"), tip: "准备逃跑" };
  return { cls: "buf", text: spIcon("intents", "magic", 22, "🔮"), tip: "准备发动特殊行动" };
}

function renderCardElement(cardStr, st, bt, onClick, extraBadge) {
  const effIdx = (hoveredEnemyIdx !== null && bt && bt.m && bt.m[hoveredEnemyIdx] && bt.m[hoveredEnemyIdx].hp > 0)
    ? hoveredEnemyIdx
    : selectedTargetIdx;
  const targetM = (bt && bt.m && bt.m[effIdx] && bt.m[effIdx].hp > 0)
    ? bt.m[effIdx]
    : (bt && bt.m ? bt.m.find(x => x.hp > 0) : null);
  const nums = calcPlayerCardNumbers(st, bt, cardStr, targetM);
  const def = nums.def;
  const playable = bt ? canPlayCard(st, bt, cardStr) : true;

  const el = document.createElement("div");
  el.className = "sts-card type-" + def.type + " " + (playable ? "playable" : "unplayable");
  const showOrb = !(def.type === "ST" || def.type === "C") || nums.cost >= -1;
  const costTxt = nums.cost === -1 ? "X" : (nums.cost === -2 ? "" : nums.cost);
  const costMod = (def.cost >= 0 && nums.cost >= 0 && nums.cost < def.cost) ? " cost-modified" : "";
  const typeMap = { A: "攻击", S: "技能", P: "能力", ST: "状态", C: "诅咒" };

  el.innerHTML =
    '<div class="card-art" style="background-position:' + spCardPos(def.id) + '"></div>' +
    '<div class="card-frame-overlay" style="background-position:' + spCardFramePos(def) + '"></div>' +
    (showOrb && costTxt !== "" ? '<div class="card-cost' + costMod + '">' + costTxt + '</div>' : '') +
    '<div class="card-name ' + (def.up > 0 ? "upgraded" : "") + '">' + def.name + '</div>' +
    '<div class="card-type-pill">' + (typeMap[def.type] || "卡牌") + '</div>' +
    '<div class="card-desc"><div>' + formatCardDesc(def, nums) + '</div></div>' +
    (extraBadge ? '<div class="card-extra-badge">' + extraBadge + '</div>' : '');

  if (onClick) {
    el.addEventListener("click", (ev) => onClick(def, playable, ev));
  }
  return el;
}

function renderMapStage(st) {
  const wrap = document.createElement("div");
  wrap.className = "map-wrapper";

  // Interactive Parchment Scroll
  const scroll = document.createElement("div");
  scroll.className = "map-scroll";

  const paper = document.createElement("div");
  paper.className = "sts-map-paper";
  paper.setAttribute("style", uiPanelBgStyle("mapScroll"));

  const svgBox = document.createElement("div");
  svgBox.className = "map-svg-container";

  const rows = generateActMap(st.s, st.a);
  const visitedSet = new Set((st.p || []).map(([px, py]) => px + "," + py));
  const nextRow = st.r + 1;
  const curNode = (st.r >= 0 && st.r < 15 && rows[st.r]) ? rows[st.r].find(n => n.x === st.c) : null;

  const isReachable = (x, y) => {
    if (y !== nextRow) return false;
    if (y === 15) return st.r === 14;
    if (st.r === -1) return y === 0;
    if (hasRelic(st, "WingedGreaves")) return true;
    return Boolean(curNode && curNode.e && curNode.e.indexOf(x) !== -1);
  };

  const W = 500, H = 740;
  const colX = x => 76 + x * 58;
  const rowY = y => y === 15 ? 62 : (696 - y * 39); // y=0 at 696, y=14 at 150, Boss y=15 at 62

  let edgesSvg = "";
  for (let y = 0; y < 15; y++) {
    for (const n of rows[y]) {
      const x1 = colX(n.x), y1 = rowY(y);
      if (y === 14) {
        const activeEdge = visitedSet.has(n.x + ",14") && visitedSet.has("3,15");
        const canWalk = (st.r === 14 && st.c === n.x);
        edgesSvg += '<line x1="' + x1 + '" y1="' + (y1 - 14) + '" x2="' + colX(3) + '" y2="' + (rowY(15) + 42) + '" stroke="' + (activeEdge ? "#231c18" : (canWalk ? "#8b1e1e" : "rgba(74, 58, 42, 0.55)")) + '" stroke-width="' + (activeEdge || canWalk ? 2.8 : 2) + '" stroke-dasharray="' + (activeEdge ? "none" : "5,6") + '" stroke-linecap="round"/>';
      } else {
        for (const nx of n.e) {
          const x2 = colX(nx), y2 = rowY(y + 1);
          const activeEdge = visitedSet.has(n.x + "," + y) && visitedSet.has(nx + "," + (y + 1));
          const canWalk = (st.r === y && st.c === n.x && y + 1 === nextRow);
          edgesSvg += '<line x1="' + x1 + '" y1="' + (y1 - 12) + '" x2="' + x2 + '" y2="' + (y2 + 12) + '" stroke="' + (activeEdge ? "#231c18" : (canWalk ? "#8b1e1e" : "rgba(74, 58, 42, 0.62)")) + '" stroke-width="' + (activeEdge ? 3.2 : (canWalk ? 2.8 : 2.1)) + '" stroke-dasharray="' + (activeEdge ? "none" : "5,6") + '" stroke-linecap="round"/>';
        }
      }
    }
  }

  let nodesSvg = "";
  // Large Boss Ink Sketch at Top of Parchment (y=15)
  const bossId = ACT_INFO[st.a].bosses[st.s % 3];
  const bossReach = isReachable(3, 15);
  const bossVisited = visitedSet.has("3,15");
  const bossCls = "map-node boss-node " + (bossReach ? "reachable" : (bossVisited ? "visited" : "unvisited"));
  nodesSvg +=
    '<g class="' + bossCls + '" data-x="3" data-y="15" data-node-type="BOSS">' +
      '<circle cx="' + colX(3) + '" cy="' + rowY(15) + '" r="42" fill="transparent"/>' +
      svgBossMapIcon(bossId, colX(3), rowY(15), 114, 88) +
      (bossVisited ? svgMapCircle(colX(3), rowY(15), 108) : (bossReach ? svgMapCircle(colX(3), rowY(15), 108, "hover-circle") : '')) +
      '<text x="' + colX(3) + '" y="' + (rowY(15) + 52) + '" text-anchor="middle" fill="#261e18" font-size="12" font-weight="900">' + (MONSTER_META[bossId] || bossId) + '</text>' +
    '</g>';

  for (let y = 0; y < 15; y++) {
    nodesSvg += '<text x="28" y="' + (rowY(y) + 4) + '" fill="rgba(68, 52, 38, 0.55)" font-size="10" font-weight="800">' + ((st.a - 1) * 16 + y + 1) + 'F</text>';
    for (const n of rows[y]) {
      const cx = colX(n.x), cy = rowY(y);
      const reach = isReachable(n.x, y);
      const visited = visitedSet.has(n.x + "," + y);
      const isCur = (st.r === y && st.c === n.x);
      const stateCls = reach ? "reachable" : (isCur ? "current" : (visited ? "visited" : "unvisited"));
      nodesSvg +=
        '<g class="map-node ' + stateCls + '" data-x="' + n.x + '" data-y="' + y + '" data-node-type="' + n.t + '">' +
          '<circle cx="' + cx + '" cy="' + cy + '" r="18" fill="transparent"/>' +
          svgMapIcon(n.t, cx, cy, reach ? 32 : 29) +
          (visited || isCur ? svgMapCircle(cx, cy, 44) : '') +
          (reach ? svgMapCircle(cx, cy, 44, "hover-circle") : '') +
        '</g>';
    }
  }

  svgBox.innerHTML = '<svg viewBox="0 0 ' + W + ' ' + H + '" style="display:block;width:100%;height:auto">' + edgesSvg + nodesSvg + '</svg>';
  svgBox.querySelectorAll(".map-node").forEach(g => {
    const x = Number(g.getAttribute("data-x"));
    const y = Number(g.getAttribute("data-y"));
    if (isReachable(x, y)) {
      g.addEventListener("click", () => sendAction({ type: "choose_node", x, y }));
    }
  });

  paper.appendChild(svgBox);
  scroll.appendChild(paper);
  wrap.appendChild(scroll);

  // Right-side Authentic Parchment Legend Card (legend2.png)
  const legend = document.createElement("div");
  legend.className = "sts-legend-card";
  legend.setAttribute("style", uiPanelBgStyle("mapLegend"));
  const actInfo = ACT_INFO[st.a] || ACT_INFO[1];
  const legendRows = [
    { t: "?", label: "未知" },
    { t: "$", label: "商人" },
    { t: "T", label: "财宝" },
    { t: "R", label: "休息" },
    { t: "M", label: "敌人" },
    { t: "E", label: "精英" },
  ];
  legend.innerHTML =
    '<div class="sts-legend-title">图例</div>' +
    '<div class="sts-legend-sub">' + actInfo.name + '</div>' +
    legendRows.map(item =>
      '<div class="sts-legend-item" data-leg-type="' + item.t + '">' +
        spIcon("map", item.t, 24) +
        '<span>' + item.label + '</span>' +
      '</div>'
    ).join("") +
    '<div class="sts-legend-tip">点击闪烁红圈节点前进</div>';

  legend.querySelectorAll(".sts-legend-item").forEach(el => {
    const t = el.getAttribute("data-leg-type");
    el.addEventListener("pointerenter", () => {
      svgBox.querySelectorAll('.map-node[data-node-type="' + t + '"]').forEach(n => n.classList.add("legend-hi"));
    });
    el.addEventListener("pointerleave", () => {
      svgBox.querySelectorAll('.map-node.legend-hi').forEach(n => n.classList.remove("legend-hi"));
    });
  });
  wrap.appendChild(legend);

  const syncMapScroll = () => {
    const targetRow = Math.max(0, Math.min(15, nextRow));
    const ratio = 1 - (targetRow / 15);
    const maxScroll = Math.max(0, scroll.scrollHeight - scroll.clientHeight);
    scroll.scrollTop = Math.max(0, Math.min(maxScroll, maxScroll * ratio + 40));
  };
  requestAnimationFrame(syncMapScroll);
  setTimeout(syncMapScroll, 50);

  return wrap;
}

// ==================== COMBAT RENDERER ====================
function renderCombatStage(st) {
  const bt = st.bt;
  const layout = document.createElement("div");
  layout.className = "combat-layout";

  if (!bt.m[selectedTargetIdx] || bt.m[selectedTargetIdx].hp <= 0) {
    const firstAlive = bt.m.findIndex(m => m.hp > 0);
    selectedTargetIdx = firstAlive !== -1 ? firstAlive : 0;
  }

  // Full-stage Scene Backdrop & Vignette
  const actSceneKey = st.a === 2 ? "TheCity" : (st.a >= 3 ? "TheBeyond" : "Exordium");
  const sceneIdx = SPRITE_MANIFEST.events[actSceneKey] || 0;
  const sCol = sceneIdx % 5, sRow = Math.floor(sceneIdx / 5);
  const bgDecor = document.createElement("div");
  bgDecor.className = "arena-bg-decor";
  bgDecor.style.backgroundPosition = ((sCol / 4) * 100).toFixed(2) + "% " + ((sRow / 3) * 100).toFixed(2) + "%";
  layout.appendChild(bgDecor);

  const vignette = document.createElement("div");
  vignette.className = "arena-vignette";
  layout.appendChild(vignette);

  const selCardStr = (activeCardIdx !== null && bt.h && bt.h[activeCardIdx]) ? bt.h[activeCardIdx] : null;
  const selCardDef = selCardStr ? getCardDef(selCardStr) : null;
  const selPotId = (activePotionIdx !== null && st.pot && st.pot[activePotionIdx]) ? st.pot[activePotionIdx] : null;
  const selPotDef = selPotId ? POTIONS[selPotId] : null;
  const isTargetingEnemy = Boolean((selCardDef && selCardDef.target === "E") || (selPotDef && selPotDef.target === "E"));

  // 1. Arena Stage (Floor-Standing Hero + Monsters)
  const arena = document.createElement("div");
  arena.className = "arena-stage" + (selCardDef && selCardDef.target !== "E" ? " drop-ready" : "");

  if (selCardDef || selPotDef) {
    const banner = document.createElement("div");
    banner.className = "targeting-banner";
    const itemName = selCardDef ? selCardDef.name : selPotDef.name;
    banner.innerHTML =
      '<span>🎯 已选定【' + itemName + '】：请点击目标敌人释放（再次点击卡牌攻击当前锁定目标，右键取消）</span>' +
      '<button class="targeting-cancel-btn" id="btn-cancel-target">取消 ✖</button>';
    banner.querySelector("#btn-cancel-target").addEventListener("click", (ev) => {
      ev.stopPropagation();
      clearTargeting(true);
    });
    arena.appendChild(banner);
  }

  arena.addEventListener("click", (ev) => {
    if (ev.target === arena || ev.target.classList.contains("enemies-column")) {
      if (selCardDef && selCardDef.target !== "E") {
        const cIdx = activeCardIdx;
        clearTargeting(false);
        sendAction({ type: "play_card", cardIdx: cIdx, targetIdx: selectedTargetIdx });
      } else if (activeCardIdx !== null || activePotionIdx !== null) {
        clearTargeting(true);
      }
    }
  });

  // Hero Floor-standing Unit
  const hero = document.createElement("div");
  hero.className = "sts-unit hero-unit";
  const heroPws = Object.keys(bt.pw || {}).map(k => {
    const meta = POWERS_META[k] || { name: k, icon: "✨" };
    return '<span class="pw-chip ' + (meta.debuff ? "debuff" : "") + '" title="' + meta.name + '：' + (meta.desc || "") + '">' +
      spIcon("powers", k, 15, meta.icon) + bt.pw[k] + '</span>';
  }).join("");

  hero.innerHTML =
    '<div class="sts-intent def" style="animation:none;font-size:11px;padding:1px 8px">第 ' + bt.t + ' 回合</div>' +
    '<div class="sprite-stage-box">' +
      '<div class="unit-shadow"></div>' +
      spMonster("Ironclad", 110) +
    '</div>' +
    '<div class="sts-hp-wrap">' +
      (bt.b > 0 ? '<div class="sts-block-badge">' + spIcon("hud", "block", 26, "🛡️") + '<span class="blk-num">' + bt.b + '</span></div>' : '') +
      '<div class="hp-bar-outer">' +
        '<div class="hp-bar-inner ' + (bt.b > 0 ? "block-on" : "") + '" style="width:' + Math.max(0, Math.min(100, (st.hp / st.mhp) * 100)) + '%"></div>' +
        '<div class="hp-bar-text">' + st.hp + '/' + st.mhp + '</div>' +
      '</div>' +
    '</div>' +
    '<div class="power-row">' + heroPws + '</div>' +
    '<div class="unit-name">铁甲战士</div>';
  arena.appendChild(hero);

  // Enemies Floor-standing Column
  const enemiesCol = document.createElement("div");
  enemiesCol.className = "enemies-column";

  bt.m.forEach((m, idx) => {
    const unit = document.createElement("div");
    const isAlive = m.hp > 0;
    const isSel = isAlive && idx === selectedTargetIdx;
    unit.className = "sts-unit enemy-unit" +
      (isSel ? " selected" : "") +
      (isAlive && isTargetingEnemy ? " target-candidate" : "") +
      (isAlive && hoveredEnemyIdx === idx ? " target-locked" : "") +
      (!isAlive && !m.st.halfDead ? " dead" : "");
    unit.setAttribute("data-enemy-idx", String(idx));

    const intent = isAlive ? getMonsterIntentInfo(st, bt, m) : { cls: "def", text: m.st.halfDead ? "🌑 重生中" : "💀 已击败", tip: "" };
    const mPws = Object.keys(m.pw || {}).map(k => {
      const meta = POWERS_META[k] || { name: k, icon: "✨" };
      return '<span class="pw-chip ' + (meta.debuff ? "debuff" : "") + '" title="' + meta.name + '：' + (meta.desc || "") + '">' +
        spIcon("powers", k, 15, meta.icon) + bt.m[idx].pw[k] + '</span>';
    }).join("");

    unit.innerHTML =
      '<div class="sts-intent ' + intent.cls + '" title="' + (intent.tip || "") + '">' + intent.text + '</div>' +
      '<div class="sprite-stage-box">' +
        '<div class="unit-shadow"></div>' +
        spMonster(m.id, 108) +
        (isAlive ? renderReticleCorners() : '') +
      '</div>' +
      '<div class="sts-hp-wrap">' +
        (m.b > 0 ? '<div class="sts-block-badge">' + spIcon("hud", "block", 26, "🛡️") + '<span class="blk-num">' + m.b + '</span></div>' : '') +
        '<div class="hp-bar-outer">' +
          '<div class="hp-bar-inner ' + (m.b > 0 ? "block-on" : "") + '" style="width:' + Math.max(0, Math.min(100, (m.hp / m.mhp) * 100)) + '%"></div>' +
          '<div class="hp-bar-text">' + m.hp + '/' + m.mhp + '</div>' +
        '</div>' +
      '</div>' +
      '<div class="power-row">' + mPws + '</div>' +
      '<div class="unit-name">' + m.name + '</div>';

    if (isAlive) {
      unit.addEventListener("click", (ev) => {
        ev.stopPropagation();
        selectedTargetIdx = idx;
        if (activeCardIdx !== null && selCardDef) {
          const cIdx = activeCardIdx;
          clearTargeting(false);
          sendAction({ type: "play_card", cardIdx: cIdx, targetIdx: idx });
        } else if (activePotionIdx !== null && selPotDef) {
          const pIdx = activePotionIdx;
          clearTargeting(false);
          sendAction({ type: "use_potion", potIdx: pIdx, targetIdx: idx });
        } else {
          renderApp();
        }
      });
    }
    enemiesCol.appendChild(unit);
  });
  arena.appendChild(enemiesCol);
  layout.appendChild(arena);

  // 2. Original STS Bottom Dock (Left: Energy Orb + Draw Pile | Center: Fanned Hand | Right: End Turn + Discard/Exhaust Piles)
  const dock = document.createElement("div");
  dock.className = "combat-bottom-dock";

  // Left Dock: Energy Orb + Draw Pile
  const leftDock = document.createElement("div");
  leftDock.className = "dock-side";
  leftDock.innerHTML =
    '<div class="sts-energy-orb ' + (bt.e <= 0 ? "empty-energy" : "") + '" title="当前能量 ' + bt.e + ' / ' + bt.me + '">' +
      spIcon("hud", "energyRed", 58, "⚡") +
      '<div class="sts-energy-text">' + bt.e + '/' + bt.me + '</div>' +
    '</div>' +
    '<button class="sts-pile-btn" id="btn-draw-pile" title="点击查看抽牌堆（已打乱顺序）">' +
      spIcon("hud", "drawPile", 46, "📘") +
      '<span class="sts-pile-count">' + (bt.dr ? bt.dr.length : 0) + '</span>' +
      '<span class="sts-pile-label">抽牌堆</span>' +
    '</button>';
  leftDock.querySelector("#btn-draw-pile").addEventListener("click", () => {
    openCardPickerModal("📘 抽牌堆（共 " + (bt.dr ? bt.dr.length : 0) + " 张，顺序已打乱）", (bt.dr || []).slice().sort(), st, null);
  });
  dock.appendChild(leftDock);

  // Center Dock: Fanned Hand of Cards
  const tray = document.createElement("div");
  tray.className = "hand-tray";
  const handArr = bt.h || [];
  const totalCards = handArr.length;
  const midIdx = (totalCards - 1) / 2;

  handArr.forEach((cStr, cIdx) => {
    const offset = cIdx - midIdx;
    const rotDeg = totalCards > 1 ? (offset * Math.min(4.2, 22 / totalCards)) : 0;
    const dropY = Math.abs(offset) * Math.abs(offset) * 1.8;

    const cardEl = renderCardElement(cStr, st, bt, (def, playable, ev) => {
      if (ev) ev.stopPropagation();
      if (!playable) return;
      if (def.target === "E") {
        if (activeCardIdx === cIdx) {
          // Clicking the already-selected card again attacks the currently locked target
          clearTargeting(false);
          sendAction({ type: "play_card", cardIdx: cIdx, targetIdx: selectedTargetIdx });
        } else {
          activeCardIdx = cIdx;
          activePotionIdx = null;
          renderApp();
        }
      } else {
        clearTargeting(false);
        sendAction({ type: "play_card", cardIdx: cIdx, targetIdx: selectedTargetIdx });
      }
    });

    cardEl.setAttribute("data-hand-idx", String(cIdx));
    cardEl.style.setProperty("--fan-rot", rotDeg.toFixed(2) + "deg");
    cardEl.style.setProperty("--fan-y", dropY.toFixed(1) + "px");
    cardEl.style.zIndex = String(10 + cIdx);
    if (activeCardIdx === cIdx) {
      cardEl.classList.add("selected-card");
    }

    const def = getCardDef(cStr);
    const playable = canPlayCard(st, bt, cStr);
    if (playable) {
      cardEl.addEventListener("pointerdown", (e) => {
        if (e.button !== undefined && e.button !== 0) return;
        dragState = { cIdx, def, startX: e.clientX, startY: e.clientY, moved: false };
      });
    }

    tray.appendChild(cardEl);
  });
  dock.appendChild(tray);

  // Right Dock: End Turn Button + Exhaust Pile + Discard Pile
  const rightDock = document.createElement("div");
  rightDock.className = "dock-side";
  rightDock.innerHTML =
    '<button class="end-turn-btn" id="btn-end-turn">结束回合 (' + bt.t + ')</button>' +
    '<div style="display:flex;align-items:flex-end;gap:8px">' +
      (bt.ex && bt.ex.length > 0
        ? '<button class="sts-pile-btn" id="btn-exhaust-pile" title="点击查看消耗堆" style="width:38px;height:38px">' +
            spIcon("powers", "DarkEmbrace", 34, "💀") +
            '<span class="sts-pile-count" style="background:#581c87;border-color:#c084fc">' + bt.ex.length + '</span>' +
            '<span class="sts-pile-label">消耗</span>' +
          '</button>'
        : '') +
      '<button class="sts-pile-btn" id="btn-discard-pile" title="点击查看弃牌堆">' +
        spIcon("hud", "discardPile", 46, "📕") +
        '<span class="sts-pile-count">' + (bt.di ? bt.di.length : 0) + '</span>' +
        '<span class="sts-pile-label">弃牌堆</span>' +
      '</button>' +
    '</div>';

  rightDock.querySelector("#btn-end-turn").addEventListener("click", () => sendAction({ type: "end_turn" }));
  rightDock.querySelector("#btn-discard-pile").addEventListener("click", () => {
    openCardPickerModal("📕 弃牌堆（共 " + (bt.di ? bt.di.length : 0) + " 张）", bt.di || [], st, null);
  });
  const exBtn = rightDock.querySelector("#btn-exhaust-pile");
  if (exBtn) {
    exBtn.addEventListener("click", () => {
      openCardPickerModal("💀 消耗堆（共 " + (bt.ex ? bt.ex.length : 0) + " 张）", bt.ex || [], st, null);
    });
  }
  dock.appendChild(rightDock);
  layout.appendChild(dock);

  if (activeCardIdx !== null || activePotionIdx !== null) {
    requestAnimationFrame(() => updateLiveTargetingArrow(lastPointerPos.x, lastPointerPos.y));
  } else {
    const svg = document.getElementById("sts-target-svg");
    if (svg) svg.innerHTML = "";
  }

  return layout;
}

// ==================== NON-COMBAT ROOM RENDERERS ====================
function formatStsEventOptionLabel(raw) {
  let s = raw.replace(/^【([^】]+)】s*/, '<span class="sts-opt-bracket">[$1]</span>');
  s = s.replace(/(失去s*d+%?s*最大?生命[值上限]*|被诅咒【[^】]+】|获得【[^】]+】诅咒|触发滚石失去s*d+%?s*生命)/g, '<span class="sts-opt-neg">$1</span>');
  s = s.replace(/(恢复s*d+%?s*最大生命值?|完全恢复所有生命值|最大生命[值上限]*s*[+提升]+s*d+s*点?|获得s*d+s*金币|从牌组中移除s*1s*张牌|将牌组中s*1s*张牌变化为随机新牌|升级牌组中[^，。！]+|获得[^，。]*遗物[^，。]*|前s*3s*场战斗敌人只有s*1s*点生命)/g, '<span class="sts-opt-pos">$1</span>');
  return s;
}

function renderEventStage(st) {
  const evId = (st.ev && st.ev.id) ? st.ev.id : (st.ph === "NEOW" ? "NEOW" : "BigFish");
  const def = UI_EVENTS_DEF[evId] || UI_EVENTS_DEF.BigFish;

  const stageWrap = document.createElement("div");

  const sceneIdx = SPRITE_MANIFEST.events[actSceneKey] || 0;
  const sCol = sceneIdx % 5, sRow = Math.floor(sceneIdx / 5);
  const bgDecor = document.createElement("div");
  bgDecor.className = "arena-bg-decor";
  bgDecor.style.backgroundPosition = ((sCol / 4) * 100).toFixed(2) + "% " + ((sRow / 3) * 100).toFixed(2) + "%";
  stageWrap.appendChild(bgDecor);

  const vignette = document.createElement("div");
  vignette.className = "arena-vignette";
  stageWrap.appendChild(vignette);

  // Authentic STS Event Dialog Panel (images/ui/event/panel.png)
  const dialog = document.createElement("div");
  dialog.className = "sts-event-dialog";
  dialog.setAttribute("style", uiPanelBgStyle("eventPanel"));

  const formattedDesc = (def.desc || "").replace(/「([^」]+)」/g, '<span class="quote-hi">「$1」</span>');

  dialog.innerHTML =
    '<div class="sts-event-ribbon-title">' + def.title + '</div>' +
    '<div class="sts-event-body">' +
      '<div class="sts-event-portrait-wrap">' + spEventSquare(evId, 244) + '</div>' +
      '<div class="sts-event-right-col">' +
        '<div class="sts-event-narrative">' + formattedDesc + '</div>' +
        '<div class="sts-event-choices" id="ev-choices"></div>' +
      '</div>' +
    '</div>';

  const list = dialog.querySelector("#ev-choices");
  const btnBgStyle = uiPanelBgStyle("eventBtnEnabled");
  def.opts.forEach((opt, idx) => {
    const btn = document.createElement("button");
    btn.className = "sts-event-opt-btn";
    btn.setAttribute("style", btnBgStyle);
    btn.innerHTML = '<span>' + formatStsEventOptionLabel(opt.label) + '</span>';
    btn.addEventListener("click", () => {
      const actType = st.ph === "NEOW" ? "neow_blessing" : "event_choice";
      if (opt.needCard) {
        openCardPickerModal("选择 1 张牌执行【" + opt.tag + "】", st.dk, st, (cardIdx) => {
          sendAction({ type: actType, choiceIdx: idx, cardIdx });
        });
      } else {
        sendAction({ type: actType, choiceIdx: idx, cardIdx: 0 });
      }
    });
    list.appendChild(btn);
  });

  stageWrap.appendChild(dialog);
  return stageWrap;
}

let rewardCardModalOpen = false;

function appendStageSceneBackdrop(container, st) {

  const sceneIdx = SPRITE_MANIFEST.events[actSceneKey] || 0;
  const sCol = sceneIdx % 5, sRow = Math.floor(sceneIdx / 5);
  const bgDecor = document.createElement("div");
  bgDecor.className = "arena-bg-decor";
  bgDecor.style.backgroundPosition = ((sCol / 4) * 100).toFixed(2) + "% " + ((sRow / 3) * 100).toFixed(2) + "%";
  container.appendChild(bgDecor);

  const vignette = document.createElement("div");
  vignette.className = "arena-vignette";
  container.appendChild(vignette);

  const dim = document.createElement("div");

}

function renderRewardStage(st) {
  const rw = st.rw || { g: 0, pot: "", rel: [], cards: [], cp: true };
  if (rw.cp || !rw.cards || rw.cards.length === 0) {
    rewardCardModalOpen = false;
  }

  const stageWrap = document.createElement("div");
  stageWrap.className = "sts-reward-stage";
  appendStageSceneBackdrop(stageWrap, st);

  // Ironclad standing in background on the left (just like original CombatRewardScreen)
  const heroBg = document.createElement("div");
  heroBg.className = "sts-stage-hero-bg";
  heroBg.innerHTML =
    '<div class="sprite-stage-box">' +
      '<div class="unit-shadow"></div>' +
      spMonster("Ironclad", 112) +
    '</div>' +
    '<div class="sts-hp-wrap" style="width:128px">' +
      '<div class="hp-bar-outer">' +

    b.className = "sts-reward-item";
    b.id = "btn-claim-potion";
    b.setAttribute("style", itemBg);

      '<div class="sts-reward-item-text">' +

    b.addEventListener("click", () => sendAction({ type: "claim_reward_potion" }));
    scroll.appendChild(b);
  }

  (rw.rel || []).forEach((rId, rIdx) => {
    itemCount++;
    const r = RELICS[rId] || { name: rId, desc: "" };
    const b = document.createElement("button");
    b.className = "sts-reward-item";
    b.setAttribute("style", itemBg);
    b.title = r.desc.replace(/\[R\]/g, "⚡");
    b.innerHTML =
      '<div class="sts-reward-item-icon">' + spIcon("relics", rId, 32, "👑") + '</div>' +
      '<div class="sts-reward-item-text">' +
        '<div>' + r.name + '</div>' +
        '<div class="sts-reward-item-sub">' + r.desc.replace(/\[R\]/g, "⚡") + '</div>' +
      '</div>';
    b.addEventListener("click", () => sendAction({ type: "claim_reward_relic", index: rIdx }));
    scroll.appendChild(b);
  });

  if (!rw.cp && rw.cards && rw.cards.length > 0) {
    itemCount++;
    const b = document.createElement("button");
    b.className = "sts-reward-item";
    b.id = "btn-open-card-reward";
    b.setAttribute("style", itemBg);

function renderShopStage(st) {
  const sh = st.sh || { cards: [], relics: [], pots: [], purge: 75, purged: false };
  const stageWrap = document.createElement("div");
  stageWrap.className = "sts-shop-stage";
  appendStageSceneBackdrop(stageWrap, st);

  const rug = document.createElement("div");
  rug.className = "sts-shop-rug";
  rug.setAttribute("style", uiPanelBgStyle("shopRug"));

  // Top Row: 5 Class Cards
  const topRow = document.createElement("div");
  topRow.className = "sts-shop-top-row";
  const allCards = sh.cards || [];
  const saleTagBg = uiPanelBgStyle("shopSaleTag");

  function createShopCardSlot(item, idx) {
    const slot = document.createElement("div");
    slot.className = "sts-shop-slot" + (item.sold ? " sold-out" : "");
    const el = renderCardElement(item.c, st, null, () => {
      if (!item.sold && st.g >= item.p) sendAction({ type: "shop_buy_card", index: idx });
    });
    if (st.g < item.p) el.classList.add("unplayable");
    slot.appendChild(el);

    if (item.sale && !item.sold) {
      const tag = document.createElement("div");
      tag.className = "sts-shop-sale-tag";
      tag.setAttribute("style", saleTagBg);
      slot.appendChild(tag);
    }

    const price = document.createElement("div");
    price.className = "sts-shop-price" + (st.g < item.p ? " unaffordable" : "");
    price.innerHTML = spIcon("hud", "gold", 16, "💰") + '<span>' + (item.sold ? "售罄" : item.p) + '</span>';
    slot.appendChild(price);
    return slot;
  }

  allCards.slice(0, 5).forEach((item, idx) => {
    topRow.appendChild(createShopCardSlot(item, idx));
  });
  rug.appendChild(topRow);

  // Bottom Row: 2 Colorless Cards (Left) + 3 Relics & 3 Potions (Center) + Card Removal Plaque (Right)
  const botRow = document.createElement("div");
  botRow.className = "sts-shop-bot-row";

  const colorlessPair = document.createElement("div");
  colorlessPair.className = "sts-shop-colorless-pair";
  allCards.slice(5, 7).forEach((item, offset) => {
    colorlessPair.appendChild(createShopCardSlot(item, 5 + offset));
  });
  botRow.appendChild(colorlessPair);

  const midRack = document.createElement("div");
  midRack.className = "sts-shop-mid-rack";

  const relicRow = document.createElement("div");
  relicRow.className = "sts-shop-subrow";
  (sh.relics || []).forEach((item, idx) => {
    const r = RELICS[item.r] || { name: item.r, desc: "" };
    const slot = document.createElement("div");
    slot.className = "sts-shop-slot" + (item.sold ? " sold-out" : "");
    slot.title = "【" + r.name + "】" + r.desc.replace(/\[R\]/g, "⚡");
    slot.innerHTML =
      '<div class="sts-shop-icon-box">' + spIcon("relics", item.r, 40, "👑") + '</div>' +
      '<div class="sts-shop-item-label">' + r.name + '</div>' +
      '<div class="sts-shop-price' + (st.g < item.p ? " unaffordable" : "") + '">' +
        spIcon("hud", "gold", 15, "💰") + '<span>' + item.p + '</span>' +
      '</div>';
    slot.addEventListener("click", () => {
      if (!item.sold && st.g >= item.p) sendAction({ type: "shop_buy_relic", index: idx });
    });
    relicRow.appendChild(slot);
  });
  midRack.appendChild(relicRow);

  const potRow = document.createElement("div");
  potRow.className = "sts-shop-subrow";
  (sh.pots || []).forEach((item, idx) => {
    const p = POTIONS[item.id] || { name: item.id, desc: "" };
    const slot = document.createElement("div");
    slot.className = "sts-shop-slot" + (item.sold ? " sold-out" : "");
    slot.title = "【" + p.name + "】" + p.desc.replace(/!V!/g, p.val);
    slot.innerHTML =
      '<div class="sts-shop-icon-box">' + spIcon("potions", item.id, 36, "🧪") + '</div>' +
      '<div class="sts-shop-item-label">' + p.name + '</div>' +
      '<div class="sts-shop-price' + (st.g < item.p ? " unaffordable" : "") + '">' +
        spIcon("hud", "gold", 15, "💰") + '<span>' + item.p + '</span>' +
      '</div>';
    slot.addEventListener("click", () => {
      if (!item.sold && st.g >= item.p) sendAction({ type: "shop_buy_potion", index: idx });
    });
    potRow.appendChild(slot);
  });
  midRack.appendChild(potRow);
  botRow.appendChild(midRack);

  // Original Chinese Card Removal Service Plaque (images/npcs/purge/zhs.png)
  const purgeSlot = document.createElement("div");
  purgeSlot.className = "sts-shop-slot" + (sh.purged ? " sold-out" : "");
  purgeSlot.id = "btn-shop-purge";
  purgeSlot.title = "从你的牌组中永久移除 1 张卡牌（每次商店限用 1 次）";
  purgeSlot.innerHTML =
    '<div class="sts-shop-purge-plaque" style="' + uiPanelBgStyle("shopPurge") + '"></div>' +
    '<div class="sts-shop-price' + (st.g < sh.purge ? " unaffordable" : "") + '">' +
      spIcon("hud", "gold", 16, "💰") + '<span>' + (sh.purged ? "已用" : sh.purge) + '</span>' +
    '</div>';
  purgeSlot.addEventListener("click", () => {
    if (sh.purged || st.g < sh.purge) return;
    openCardPickerModal("选择要移除的卡牌（花费 " + sh.purge + " 金币）", st.dk, st, (cardIdx) => {
      sendAction({ type: "shop_purge", cardIdx });
    });
  });
  botRow.appendChild(purgeSlot);

  rug.appendChild(botRow);
  stageWrap.appendChild(rug);

  const leaveBtn = document.createElement("button");
  leaveBtn.className = "sts-cancel-btn";
  leaveBtn.id = "btn-leave-shop";
  leaveBtn.setAttribute("style", uiPanelBgStyle("cancelBtn"));
  leaveBtn.textContent = "离开";
  leaveBtn.addEventListener("click", () => sendAction({ type: "leave_shop" }));
  stageWrap.appendChild(leaveBtn);

  const proceedBtn = document.createElement("button");
  proceedBtn.className = "sts-proceed-btn";
  proceedBtn.id = "btn-proceed-shop";
  proceedBtn.setAttribute("style", uiPanelBgStyle("proceedBtn"));
  proceedBtn.textContent = "前进";
  proceedBtn.addEventListener("click", () => sendAction({ type: "leave_shop" }));
  stageWrap.appendChild(proceedBtn);

  return stageWrap;
}

      "休息",
      "恢复最大生命的30% (" + healAmt + ")",
      () => sendAction({ type: "rest_heal" })
    );

    addCampOption(
      "btn-camp-smith",
      "camp_smith",

      "btn-camp-toke",
      "camp_toke",
      "抽烟斗",
      "移除牌组中的一张牌",

          sendAction({ type: "rest_toke", cardIdx });
        });
      }
    );

      '<div style="width:100%;display:flex;flex-direction:column;gap:6px;font-size:12.5px;color:#e2e8f0;background:rgba(9,13,22,0.55);padding:10px 14px;border-radius:8px;border:1px solid rgba(255,255,255,0.08)">' +
        '<div style="display:flex;justify-content:space-between"><span>攀登进度</span><b>第 ' + st.a + ' 幕 · ' + (st.fl || 0) + ' / 48 层</b></div>' +
        '<div style="display:flex;justify-content:space-between"><span>击败精英 / 首领</span><b>' + (st.ek || 0) + ' 精英 / ' + (st.bk || 0) + ' 首领</b></div>' +
        '<div style="display:flex;justify-content:space-between"><span>收集遗物 / 主牌组</span><b>' + (st.rel ? st.rel.length : 1) + ' 遗物 / ' + (st.dk ? st.dk.length : 10) + ' 张牌</b></div>' +
      '</div>' +
      '<button class="end-turn-btn" id="btn-restart-run" style="width:100%">🔄 重新开启新一局尖塔</button>' +
    '</div>';

  center.querySelector("#btn-restart-run").addEventListener("click", () => resetLocalRun());
  stageWrap.appendChild(center);
  return stageWrap;
}

// ==================== MASTER RENDER ====================
function renderApp() {
  const root = document.getElementById("app");
  if (!root || !currentData) return;
  const st = currentData;
  root.innerHTML = "";

  // 1. Original STS Top Bar
  const top = document.createElement("div");
  top.className = "top-hud";
  const actInfo = ACT_INFO[st.a] || ACT_INFO[1];
  const yuan = ((st.pd || 0) / 100).toFixed(2);

  top.innerHTML =
    '<div class="hud-left">' +
      '<span class="sts-stat hero-stat">铁甲战士</span>' +
      '<span class="sts-stat hp-stat" title="生命值">' + spIcon("hud", "heart", 22, "❤️") + ' ' + st.hp + '/' + st.mhp + '</span>' +
      '<span class="sts-stat gold-stat" title="持有金币">' + spIcon("hud", "gold", 22, "💰") + ' ' + st.g + '</span>' +
      '<div class="potion-belt" id="hud-potions" title="药水栏（战斗中点击饮用或投掷）"></div>' +
    '</div>' +
    '<div class="hud-center">' +
      '<span class="sts-stat floor-stat" title="当前攀登层数">' + spIcon("hud", "floor", 22, "🏰") + ' ' + actInfo.name + ' · ' + (st.fl || 0) + '/48层</span>' +
      '<span class="sts-stat bounty-stat" title="随着攀爬层数、击败精英和首领不断累积（仅可在篝火休息处主动撤离或通关三幕带走100%）">🧧 赏金 ' + yuan + '</span>' +
    '</div>' +
    '<div class="hud-right">' +
      (st.ph !== "MAP" ? '<button class="hud-icon-btn" id="btn-toggle-map" title="随时打开/关闭高塔地图">' + spIcon("hud", "map", 20, "🗺️") + ' ' + (mapOverlayOpen ? "返回房间" : "地图") + '</button>' : '') +
      '<button class="hud-icon-btn" id="btn-master-deck" title="查看主牌组">' + spIcon("hud", "deck", 20, "🎴") + ' ' + (st.dk ? st.dk.length : 0) + '</button>' +
      (!hbConnected ? '<button class="hud-icon-btn" id="btn-reset-local" title="重新开始新的一局">🔄 重开</button>' : '') +
    '</div>';

  const mapBtn = top.querySelector("#btn-toggle-map");
  if (mapBtn) {
    mapBtn.addEventListener("click", () => {
      mapOverlayOpen = !mapOverlayOpen;
      clearTargeting(false);
      renderApp();
    });
  }
  top.querySelector("#btn-master-deck").addEventListener("click", () => {
    openCardPickerModal("🎴 主牌组 (" + st.dk.length + " 张)", st.dk, st, null);
  });
  const rstBtn = top.querySelector("#btn-reset-local");
  if (rstBtn) rstBtn.addEventListener("click", () => resetLocalRun());

  const potBar = top.querySelector("#hud-potions");
  (st.pot || []).forEach((pId, pIdx) => {
    const slot = document.createElement("span");
    slot.setAttribute("data-pot-idx", String(pIdx));
    if (pId && POTIONS[pId]) {
      const p = POTIONS[pId];
      slot.className = "potion-icon-btn has-pot" + (activePotionIdx === pIdx ? " active-aim" : "");
      slot.title = "【" + p.name + "】" + p.desc.replace(/!V!/g, p.val) + (p.target === "E" ? "（点击瞄准敌人投掷）" : "（点击饮用）");
      slot.innerHTML = spIcon("potions", pId, 24, "🧪");
      slot.addEventListener("click", (ev) => {
        ev.stopPropagation();
        if (st.ph === "COMBAT" && p.target === "E") {
          if (activePotionIdx === pIdx) {
            clearTargeting(false);
            sendAction({ type: "use_potion", potIdx: pIdx, targetIdx: selectedTargetIdx });
          } else {
            activePotionIdx = pIdx;
            activeCardIdx = null;
            renderApp();
          }
        } else {
          sendAction({ type: "use_potion", potIdx: pIdx, targetIdx: selectedTargetIdx });
        }
      });
    } else {
      slot.className = "potion-icon-btn empty";
      slot.title = "空药水槽";
      slot.innerHTML = spIcon("hud", "potionSlot", 22, "🧪");
    }
    potBar.appendChild(slot);
  });
  root.appendChild(top);

  // 1b. Original STS Relic Icon Strip (Directly below top bar)
  const relStrip = document.createElement("div");
  relStrip.className = "sts-relic-strip";
  (st.rel || []).forEach(rId => {
    const r = RELICS[rId] || { name: rId, desc: "" };
    const wrap = document.createElement("div");
    wrap.className = "relic-icon-wrap";
    let cntText = "";
    let cntUsed = false;
    let tipExtra = "";
    const rc = st.rc || {};
    if (rId === "NeowsLament" || rId === "NeowsBlessing") {
      cntText = rc.Neow > 0 ? String(rc.Neow) : "0";
      cntUsed = !(rc.Neow > 0);
      tipExtra = rc.Neow > 0 ? ("（剩余 " + rc.Neow + " 场战斗）") : "（已耗尽）";
    } else if (rId === "Girya" && rc.Girya !== undefined) {
      cntText = String(rc.Girya);
    } else if (rId === "Omamori" && rc.Omamori !== undefined) {
      cntText = String(rc.Omamori);
      cntUsed = rc.Omamori <= 0;
    } else if (rId === "Matryoshka" && rc.Matryoshka !== undefined) {
      cntText = String(rc.Matryoshka);
      cntUsed = rc.Matryoshka <= 0;
    } else if (rId === "Pen Nib" && rc.PenNib !== undefined) {
      cntText = String(rc.PenNib);
    } else if (rId === "Nunchaku" && rc.Nunchaku !== undefined) {
      cntText = String(rc.Nunchaku);
    } else if (rId === "Ink Bottle" && rc.InkBottle !== undefined) {
      cntText = String(rc.InkBottle);
    } else if (rId === "Happy Flower" && rc.Flower !== undefined) {
      cntText = String(rc.Flower);
    } else if (rId === "Incense Burner" && rc.Burner !== undefined) {
      cntText = String(rc.Burner);
    } else if (rId === "Sundial" && rc.Sundial !== undefined) {
      cntText = String(rc.Sundial);
    }
    wrap.title = "【" + r.name + "】" + tipExtra + " — " + r.desc.replace(/\[R\]/g, "⚡");
    wrap.innerHTML =
      spIcon("relics", rId, 32, "👑") +
      (cntText !== "" ? '<span class="relic-counter' + (cntUsed ? " used" : "") + '">' + cntText + '</span>' : '');
    relStrip.appendChild(wrap);
  });
  root.appendChild(relStrip);

  // 2. Main Stage
  if (st.ph !== "REWARD") {
    rewardCardModalOpen = false;
  }
  const stage = document.createElement("div");
  stage.className = "main-stage";
  if (st.ph === "MAP" || mapOverlayOpen) stage.appendChild(renderMapStage(st));
  else if (st.ph === "COMBAT") stage.appendChild(renderCombatStage(st));
  else if (st.ph === "NEOW" || st.ph === "EVENT") stage.appendChild(renderEventStage(st));
  else if (st.ph === "REWARD") stage.appendChild(renderRewardStage(st));
  else if (st.ph === "BOSS_RELIC") stage.appendChild(renderBossRelicStage(st));
  else if (st.ph === "SHOP") stage.appendChild(renderShopStage(st));
  else if (st.ph === "REST") stage.appendChild(renderRestStage(st));
  else if (st.ph === "TREASURE") stage.appendChild(renderTreasureStage(st));
  else stage.appendChild(renderSettlementStage(st));
  root.appendChild(stage);

  if (st.ph !== "COMBAT" || mapOverlayOpen) {
    const svg = document.getElementById("sts-target-svg");
    if (svg) svg.innerHTML = "";
  }

  // 3. Log Bar
  const logBar = document.createElement("div");
  logBar.className = "log-bar";
  const lastLog = (st.lg && st.lg.length > 0) ? st.lg[st.lg.length - 1] : "准备攀登杀戮尖塔……";
  logBar.textContent = "📜 " + lastLog;
  root.appendChild(logBar);

  // 4. Original STS Full-Screen Card Grid Modal Overlay (if active)
  if (modalState) {
    const back = document.createElement("div");
    back.className = "modal-backdrop";
    back.innerHTML =
      '<div class="sts-select-banner" style="' + uiPanelBgStyle("selectBanner") + ';font-size:17px">' + modalState.title + '</div>' +
      '<div class="sts-modal-scroll" id="modal-cards-body"></div>' +
      '<button class="sts-cancel-btn" id="btn-close-modal" style="' + uiPanelBgStyle("cancelBtn") + '">返回</button>';
    back.querySelector("#btn-close-modal").addEventListener("click", () => {
      modalState = null;
      renderApp();
    });
    const body = back.querySelector("#modal-cards-body");
    (modalState.cards || []).forEach((cStr, idx) => {
      const el = renderCardElement(cStr, st, null, () => {
        if (modalState.onPick) {
          const cb = modalState.onPick;
          modalState = null;
          cb(idx);
        }
      });
      body.appendChild(el);
    });
    root.appendChild(back);
  }
}

const defaultPreview = Object.assign(createInitialState("sts-spire-seed-10001"), { mr: 1000, pd: 0 });
try {
  const saved = sessionStorage.getItem("sts_hb_standalone");
  if (saved) {
    const parsed = JSON.parse(saved);
    if (parsed && parsed.currentData && parsed.currentData.dk) {
      localPlayerState = parsed.localPlayerState || parsed.currentData;
      localPending = parsed.localPending || 0;
      currentData = parsed.currentData;
    }
  }
} catch {}
if (!currentData) {
  localPlayerState = JSON.parse(JSON.stringify(defaultPreview));
  currentData = defaultPreview;
}
renderApp();

if (window.hb) {
  if (typeof window.hb.ready === "function") {
    window.hb.ready().then(() => { hbConnected = true; }).catch(() => {});
  }
  window.hb.on("myView", (v) => {
    hbConnected = true;
    if (v && v.data) {
      currentData = v.data;
      localPlayerState = v.data;
      localPending = v.data.pd || 0;
      renderApp();
    }
  });
  window.hb.on("view", (v) => {
    hbConnected = true;
    if ((!currentData || currentData === defaultPreview) && v && v.data) {
      currentData = v.data;
      localPlayerState = v.data;
      renderApp();
    }
  });
  (async () => {
    try {
      const myV = await window.hb.myView();
      hbConnected = true;
      if (myV && myV.data) {
        currentData = myV.data;
        localPlayerState = myV.data;
        localPending = myV.data.pd || 0;
        renderApp();
        return;
      }
      const pubV = await window.hb.view();
      if (pubV && pubV.data) {
        currentData = pubV.data;
        localPlayerState = pubV.data;
        renderApp();
      }
    } catch {}
  })();
}
</script>
</body>
</html>
