<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>杀戮尖塔 · 完整三幕高塔红包版</title>
<script src="https://hb.lafi.sh/sdk/v1.js"></script>
<script src="assets/spine.js"></script>
<style>
  :root {
    --bg-deep: #0b0e17;
    --bg-panel: #151b2b;
    --bg-card: #1e263b;
    --gold: #f5c451;
    --gold-dim: #b5892e;
    --crimson: #d94343;
    --jade: #38b87c;
    --azure: #4895ef;
    --purple: #9d4edd;
    --text-main: #f1f5f9;
    --text-muted: #94a3b8;
    --border-subtle: rgba(245, 196, 81, 0.24);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-tap-highlight-color: transparent; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    background: radial-gradient(circle at 50% 15%, #1d253a 0%, #090c14 100%);
    color: var(--text-main);
    font-family: "PingFang SC", "Microsoft YaHei", system-ui, -apple-system, sans-serif;
    font-size: 13px;
  }
  #app {
    display: flex; flex-direction: column;
    width: 100%; height: 100%; max-width: 1120px; margin: 0 auto;
    position: relative; overflow: hidden;
    border-left: 1px solid rgba(255,255,255,0.06);
    border-right: 1px solid rgba(255,255,255,0.06);
  }

  /* ==================== SPRITE SHEET UTILITIES ==================== */
  .sp-icon {
    display: inline-block; vertical-align: middle; flex-shrink: 0;
    background-image: url("assets/icons.webp");
    background-repeat: no-repeat;
    background-size: 2000% 2000%;
  }
  .sp-monster-wrap {
    position: relative; display: inline-flex; align-items: flex-end; justify-content: center;
    flex-shrink: 0; pointer-events: none;
    transition: filter 0.25s, opacity 0.25s, transform 0.25s;
  }
  .sp-monster {
    display: inline-block; flex-shrink: 0;
    background-image: url("assets/monsters.webp");
    background-repeat: no-repeat;
    background-size: 900% 900%;
    filter: drop-shadow(0 6px 10px rgba(0,0,0,0.75));
    position: relative; z-index: 1;
  }
  .sts-spine-canvas {
    position: absolute; inset: 0; z-index: 2;
    opacity: 0; pointer-events: none;
    filter: drop-shadow(0 6px 10px rgba(0,0,0,0.75));
  }
  .sp-monster-wrap.spine-ready .sp-monster {
    opacity: 0 !important;
  }
  .sp-monster-wrap.spine-ready .sts-spine-canvas {
    opacity: 1;
  }
  .sp-event {
    display: inline-block; flex-shrink: 0;
    background-image: url("assets/events.webp");
    background-repeat: no-repeat;
    background-size: 500% 1832%;
    border-radius: 8px;
    border: 1px solid rgba(245, 196, 81, 0.4);
    box-shadow: 0 4px 14px rgba(0,0,0,0.6);
  }

  /* ==================== ORIGINAL STS TOP BAR & RELIC STRIP ==================== */
  .top-hud {
    background: linear-gradient(180deg, #222938 0%, #141923 85%, #0d1118 100%);
    border-bottom: 2px solid #3d352e;
    box-shadow: 0 3px 12px rgba(0,0,0,0.75);
    padding: 4px 12px;
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    min-height: 44px; flex-shrink: 0; z-index: 40; flex-wrap: wrap;
  }
  .hud-left, .hud-center, .hud-right {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  }
  .sts-stat {
    display: inline-flex; align-items: center; gap: 4px;
    font-weight: 800; font-size: 14px; text-shadow: 0 2px 3px #000;
    white-space: nowrap;
  }
  .sts-stat.hero-stat { color: #f8fafc; font-size: 13px; margin-right: 2px; }
  .sts-stat.hp-stat { color: #ff6b6b; }
  .sts-stat.gold-stat { color: #fbbf24; }
  .sts-stat.floor-stat { color: #e2e8f0; font-size: 13px; }
  .sts-stat.bounty-stat {
    color: #6ee7b7; font-size: 12px;
    background: rgba(16, 185, 129, 0.16); border: 1px solid rgba(52, 211, 153, 0.4);
    padding: 2px 8px; border-radius: 12px;
  }

  .potion-belt {
    display: inline-flex; align-items: center; gap: 4px;
    padding: 2px 6px; border-radius: 16px;
    background: rgba(0,0,0,0.35); border: 1px solid rgba(255,255,255,0.08);
  }
  .potion-icon-btn {
    width: 28px; height: 28px; border-radius: 50%;
    display: inline-flex; align-items: center; justify-content: center;
    position: relative; cursor: pointer; transition: transform 0.15s;
  }
  .potion-icon-btn.has-pot:hover { transform: scale(1.18); filter: drop-shadow(0 0 6px var(--gold)); }
  .potion-icon-btn.active-aim {
    transform: scale(1.22);
    box-shadow: 0 0 0 2px #ef4444, 0 0 12px #ef4444;
    background: rgba(239, 68, 68, 0.25);
  }
  .potion-icon-btn.empty { opacity: 0.35; cursor: default; }

  .hud-icon-btn {
    display: inline-flex; align-items: center; gap: 4px;
    padding: 3px 8px; border-radius: 6px; cursor: pointer;
    background: rgba(255,255,255,0.06); border: 1px solid rgba(245, 196, 81, 0.32);
    color: #f8fafc; font-weight: 800; font-size: 12px;
    text-shadow: 0 1px 2px #000; transition: all 0.15s; position: relative;
  }
  .hud-icon-btn:hover { background: rgba(245, 196, 81, 0.2); border-color: var(--gold); transform: translateY(-1px); }
  .hud-icon-btn.retreat-btn {
    background: rgba(245, 196, 81, 0.18); border-color: rgba(245, 196, 81, 0.55); color: var(--gold);
  }

  /* Relic Icon Row directly under Top Bar */
  .sts-relic-strip {
    display: flex; align-items: center; gap: 6px;
    padding: 4px 12px; min-height: 38px;
    background: linear-gradient(180deg, rgba(9, 13, 22, 0.82) 0%, rgba(9, 13, 22, 0.2) 100%);
    overflow-x: auto; scrollbar-width: none; flex-shrink: 0; z-index: 35;
  }
  .sts-relic-strip::-webkit-scrollbar { display: none; }
  .relic-icon-wrap {
    position: relative; width: 34px; height: 34px;
    display: inline-flex; align-items: center; justify-content: center;
    cursor: help; flex-shrink: 0; transition: transform 0.15s;
  }
  .relic-icon-wrap:hover { transform: scale(1.18); z-index: 10; }
  .relic-counter {
    position: absolute; right: -2px; bottom: -2px;
    font-size: 10px; font-weight: 900; color: #fff;
    text-shadow: -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000, 0 1px 3px #000;
    pointer-events: none;
  }
  .relic-counter.used { color: #94a3b8; }

  .btn-sm {
    padding: 4px 10px; border-radius: 6px; cursor: pointer;
    background: rgba(72, 149, 239, 0.2); border: 1px solid rgba(72, 149, 239, 0.45);
    color: #93c5fd; font-weight: 700; font-size: 11px; transition: all 0.15s;
  }
  .btn-sm:hover { background: rgba(72, 149, 239, 0.35); transform: translateY(-1px); }

  /* ==================== MAIN STAGE ==================== */
  .main-stage {
    flex: 1 1 0%; height: 0; min-height: 0; position: relative; overflow-y: auto; overflow-x: hidden;
    display: flex; flex-direction: column;
    padding: 0;
  }

  /* ==================== ORIGINAL STS PARCHMENT MAP VIEW ==================== */
  .map-wrapper {
    position: relative; width: 100%; height: 100%; flex: 1; min-height: 0;
    display: flex; align-items: stretch; justify-content: center;
    background: radial-gradient(ellipse at 50% 45%, #1c2230 0%, #090c14 100%);
    overflow: hidden;
  }
  .map-scroll {
    flex: 1; height: 100%; min-height: 0; overflow-y: auto; overflow-x: hidden;
    display: flex; justify-content: center; align-items: flex-start;
    padding: 10px 180px 24px 16px;
    scrollbar-width: thin;
  }
  .sts-map-paper {
    width: 100%; max-width: 500px; position: relative;
    filter: drop-shadow(0 14px 36px rgba(0,0,0,0.92));
    padding: 18px 22px 28px;
  }
  .map-svg-container {
    width: 100%; position: relative;
  }
  @keyframes stsMapNodePulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.22); }
  }
  .map-node {
    transition: transform 0.15s, opacity 0.15s, filter 0.15s;
    transform-origin: center;
    transform-box: fill-box;
  }
  .map-node.unvisited {
    opacity: 0.72;
  }
  .map-node.visited,
  .map-node.current {
    opacity: 1;
  }
  .map-node.reachable {
    opacity: 1;
    cursor: pointer;
    filter: drop-shadow(0 0 5px rgba(139, 29, 29, 0.55));
  }
  .map-node.reachable .sp-icon,
  .map-node.reachable .boss-map-icon {
    animation: stsMapNodePulse 1.45s ease-in-out infinite;
  }
  .map-node.reachable:hover,
  .map-node.legend-hi {
    transform: scale(1.28) !important;
    filter: drop-shadow(0 0 8px rgba(185, 28, 28, 0.9));
    opacity: 1 !important;
  }
  .map-node .hover-circle {
    opacity: 0; transition: opacity 0.15s;
  }
  .map-node.reachable .hover-circle {
    opacity: 0.48;
  }
  .map-node.reachable:hover .hover-circle {
    opacity: 0.95;
  }

  /* Right-side Authentic Parchment Legend Card (legend2.png) */
  .sts-legend-card {
    position: absolute; right: 22px; top: 50%; transform: translateY(-50%);
    width: 164px; min-height: 248px;
    padding: 26px 22px 26px 24px;
    display: flex; flex-direction: column; justify-content: center; gap: 5px;
    filter: drop-shadow(0 10px 24px rgba(0,0,0,0.88));
    z-index: 20; user-select: none;
  }
  .sts-legend-title {
    font-size: 17px; font-weight: 900; color: #261e18;
    text-align: center; letter-spacing: 3px;
    border-bottom: 1.5px solid rgba(58, 44, 32, 0.35);
    padding-bottom: 3px; margin-bottom: 2px;
  }
  .sts-legend-sub {
    font-size: 10.5px; font-weight: 800; color: #574536;
    text-align: center; margin-bottom: 4px;
  }
  .sts-legend-item {
    display: flex; align-items: center; gap: 8px;
    padding: 2px 6px; border-radius: 4px;
    font-size: 13px; font-weight: 800; color: #2a211b;
    cursor: pointer; transition: transform 0.12s, background 0.12s;
  }
  .sts-legend-item:hover {
    background: rgba(127, 29, 29, 0.12);
    transform: translateX(3px);
    color: #7f1d1d;
  }
  .sts-legend-tip {
    margin-top: 6px; padding-top: 4px;
    border-top: 1px dashed rgba(58, 44, 32, 0.3);
    font-size: 10px; font-weight: 800; color: #7f1d1d;
    text-align: center;
  }

  /* ==================== ORIGINAL STS COMBAT VIEW (1920x1080 COORDINATE SYSTEM) ==================== */
  .combat-layout {
    width: 100%; height: 100%; position: relative; overflow: hidden;
    --sts-floor-y: max(33.5%, 205px);
  }
  .arena-bg-decor {
    position: absolute; inset: 0; opacity: 0.92; pointer-events: none;
    background-image: url("assets/events.webp");
    background-repeat: no-repeat;
    filter: saturate(1.16) contrast(1.06);
    z-index: 0;
  }
  .arena-vignette {
    position: absolute; inset: 0; pointer-events: none; z-index: 1;
    background:
      radial-gradient(ellipse at 50% 38%, transparent 42%, rgba(6, 9, 15, 0.58) 100%),
      linear-gradient(180deg, rgba(8, 11, 18, 0.34) 0%, transparent 20%, transparent 58%, rgba(8, 11, 18, 0.66) 80%, rgba(7, 10, 16, 0.93) 100%);
  }

  .arena-stage {
    position: absolute; inset: 0;
    z-index: 5; pointer-events: auto;
  }
  .arena-stage.drop-ready {
    box-shadow: inset 0 0 36px rgba(56, 189, 248, 0.28);
  }
  .targeting-banner {
    position: absolute; top: 8px; left: 50%; transform: translateX(-50%);
    background: rgba(15, 23, 42, 0.92); border: 1px solid var(--gold);
    color: #fde047; font-weight: 800; font-size: 12px;
    padding: 4px 14px; border-radius: 16px; z-index: 55;
    box-shadow: 0 4px 14px rgba(0,0,0,0.65);
    pointer-events: auto; display: flex; align-items: center; gap: 8px;
  }
  .targeting-cancel-btn {
    padding: 1px 7px; border-radius: 10px; background: rgba(239,68,68,0.28);
    border: 1px solid rgba(239,68,68,0.6); color: #fca5a5; font-size: 11px; cursor: pointer;
  }

  /* Authentic STS Floor-Anchored Hero & Monster Units:
     Hero: drawX = 1920 * 0.25 (25%), drawY = floorY
     Monster: drawX = 1920 * 0.75 + offsetX, drawY = floorY + offsetY */
  .sts-unit {
    position: absolute;
    left: var(--unit-x, 75%);
    bottom: calc(var(--sts-floor-y) + var(--unit-off-y, 0%));
    transform: translateX(-50%);
    display: flex; flex-direction: column; align-items: center; justify-content: flex-end;
    z-index: 10;
    padding: 0;
    pointer-events: auto;
  }
  .sts-unit:hover {
    z-index: 45 !important;
  }
  .sts-unit.hero-unit {
    --unit-x: 25%;
    --unit-off-y: 0%;
  }
  .sts-unit.enemy-unit {
    cursor: pointer; transition: filter 0.15s;
  }
  .sts-unit.enemy-unit.dead {
    opacity: 0; pointer-events: none; visibility: hidden;
  }
  /* Under-Foot HUD (HP Bar + Bare Power Icons + Hover Name) hangs downward below drawY
     so buffs/debuffs NEVER shift the creature's feet vertically! */
  .sts-under-foot {
    position: absolute;
    top: calc(100% + 2px);
    left: 50%;
    transform: translateX(-50%);
    display: flex; flex-direction: column; align-items: center;
    pointer-events: auto;
    z-index: 12;
  }

  /* Free-Floating Bobbing Intent Above Monster (Original STS AbstractMonster.renderIntent — No Pill Box!) */
  @keyframes intentBob {
    0%, 100% { transform: translateY(0px); }
    50% { transform: translateY(-5px); }
  }
  .sts-intent {
    position: relative;
    display: inline-flex; align-items: center; justify-content: center;
    min-width: 42px; height: 42px; padding: 0;
    background: none; border: none; box-shadow: none;
    font-weight: 900; font-size: 14px; color: #fff;
    text-shadow:
      -1.5px -1.5px 0 #000, 1.5px -1.5px 0 #000,
      -1.5px 1.5px 0 #000, 1.5px 1.5px 0 #000,
      0 2px 4px rgba(0,0,0,0.9);
    margin-bottom: 2px; animation: intentBob 2.2s ease-in-out infinite;
    white-space: nowrap; pointer-events: auto;
    filter: drop-shadow(0 3px 5px rgba(0,0,0,0.72));
  }
  .sts-intent .intent-main-ico {
    position: relative; z-index: 2; display: inline-flex;
  }
  .sts-intent .intent-sub-ico {
    position: absolute; right: -9px; top: -4px; z-index: 1;
    display: inline-flex; opacity: 0.96;
    filter: drop-shadow(0 2px 4px rgba(0,0,0,0.85));
  }
  .sts-intent .intent-dmg-num {
    position: absolute; left: -2px; bottom: -2px; z-index: 3;
    font-size: 15.5px; font-weight: 900; line-height: 1; color: #fff;
    letter-spacing: -0.3px;
    text-shadow:
      -1.6px -1.6px 0 #000, 1.6px -1.6px 0 #000,
      -1.6px 1.6px 0 #000, 1.6px 1.6px 0 #000,
      0 2px 4px #000;
  }

  @keyframes flyHover {
    0%, 100% { transform: translateY(-5px); }
    50% { transform: translateY(-12px); }
  }
  .sprite-stage-box {
    position: relative; display: flex; align-items: flex-end; justify-content: center;
    width: 120px; height: 120px; margin-bottom: 1px;
  }
  .sprite-stage-box.is-flying .sp-monster-wrap {
    animation: flyHover 2.4s ease-in-out infinite;
  }
  .unit-shadow {
    position: absolute; bottom: 1px; left: 50%; transform: translateX(-50%);
    width: 82%; height: 14px; border-radius: 50%;
    background: radial-gradient(ellipse at center, rgba(0,0,0,0.76) 0%, rgba(0,0,0,0) 74%);
    pointer-events: none; z-index: 0;
  }
  .sprite-stage-box .sp-monster { position: relative; z-index: 2; transition: filter 0.25s, opacity 0.25s, transform 0.25s; }
  .sprite-stage-box.is-intangible .sp-monster-wrap {
    opacity: 0.62;
    filter: drop-shadow(0 0 12px rgba(125, 211, 252, 0.9)) brightness(1.25);
  }
  .sprite-stage-box.is-half-dead .sp-monster-wrap {
    opacity: 0.58;
    filter: brightness(0.28) drop-shadow(0 0 10px #7e22ce);
    transform: scaleY(0.68) translateY(14px);
  }
  @keyframes stsLungeRight {
    0% { transform: translateX(0) scale(1); }
    28% { transform: translateX(56px) translateY(-6px) scale(1.06); }
    100% { transform: translateX(0) scale(1); }
  }
  @keyframes stsLungeLeft {
    0% { transform: translateX(0) scale(1); }
    28% { transform: translateX(-54px) translateY(-5px) scale(1.06); }
    100% { transform: translateX(0) scale(1); }
  }
  @keyframes stsHitShake {
    0% { transform: translateX(0); filter: brightness(1); }
    18% { transform: translateX(13px) rotate(3deg); filter: brightness(2.3) drop-shadow(0 0 14px #ef4444); }
    38% { transform: translateX(-11px) rotate(-2.5deg); filter: brightness(1.85) drop-shadow(0 0 12px #f87171); }
    62% { transform: translateX(7px) rotate(1.5deg); filter: brightness(1.3); }
    82% { transform: translateX(-4px); }
    100% { transform: translateX(0); filter: brightness(1); }
  }
  @keyframes stsBlockPulse {
    0% { filter: drop-shadow(0 0 0 rgba(56, 189, 248, 0)); }
    35% { filter: drop-shadow(0 0 18px rgba(56, 189, 248, 0.95)) brightness(1.22); }
    100% { filter: drop-shadow(0 0 0 rgba(56, 189, 248, 0)); }
  }
  .sprite-stage-box.unit-lunge-right { animation: stsLungeRight 0.38s cubic-bezier(0.2, 0.85, 0.35, 1); }
  .sprite-stage-box.unit-lunge-left { animation: stsLungeLeft 0.40s cubic-bezier(0.2, 0.85, 0.35, 1); }
  .sprite-stage-box.unit-hit-shake { animation: stsHitShake 0.42s ease-out; }
  .sprite-stage-box.unit-block-pulse { animation: stsBlockPulse 0.46s ease-out; }
  .hexa-orb-ring {
    position: absolute; inset: 0; pointer-events: none; z-index: 4;
  }
  .hexa-orb {
    position: absolute; width: 13px; height: 13px; border-radius: 50%;
    transform: translate(-50%, -50%);
    background: radial-gradient(circle, rgba(30, 41, 59, 0.85) 0%, rgba(15, 23, 42, 0.4) 100%);
    border: 1.5px solid rgba(52, 211, 153, 0.35);
    transition: all 0.25s;
  }
  .hexa-orb.lit {
    background: radial-gradient(circle, #ecfdf5 0%, #34d399 45%, #059669 100%);
    border-color: #a7f3d0;
    box-shadow: 0 0 10px #34d399, 0 0 18px #10b981;
  }

  /* 4-Corner STS Targeting Reticle (Only Shown When Aiming Single-Target Cards/Potions) */
  .sts-reticle {
    position: absolute; inset: -4px; pointer-events: none; z-index: 10;
    opacity: 0; transition: opacity 0.12s, transform 0.12s;
    transform: scale(1.08);
  }
  .sts-unit.enemy-unit.target-candidate .sts-reticle {
    opacity: 0.68; transform: scale(1.02);
    filter: drop-shadow(0 0 6px #f59e0b);
  }
  .sts-unit.enemy-unit.target-locked .sts-reticle {
    opacity: 1; transform: scale(0.95);
    filter: drop-shadow(0 0 8px #ef4444);
  }
  .ret-c { position: absolute; width: 18px; height: 18px; }
  .ret-tl { top: 0; left: 0; }
  .ret-tr { top: 0; right: 0; transform: scaleX(-1); }
  .ret-bl { bottom: 0; left: 0; transform: scaleY(-1); }
  .ret-br { bottom: 0; right: 0; transform: scale(-1, -1); }

  /* Original STS HP Bar + Shield Icon */
  .sts-hp-wrap {
    width: 108px; position: relative;
    display: flex; align-items: center; margin-top: 2px; margin-bottom: 2px;
  }
  .sts-block-badge {
    position: absolute; left: -11px; top: 50%; transform: translateY(-50%);
    width: 26px; height: 26px; z-index: 6;
    display: flex; align-items: center; justify-content: center;
  }
  .sts-block-badge .blk-num {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    font-weight: 900; font-size: 11px; color: #fff;
    text-shadow: -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000;
  }
  .hp-bar-outer {
    width: 100%; height: 12px; background: #1a0f12;
    border-radius: 6px; border: 1.5px solid rgba(0,0,0,0.88);
    box-shadow: 0 1px 4px rgba(0,0,0,0.75), inset 0 1px 3px rgba(0,0,0,0.85);
    position: relative; overflow: hidden;
  }
  .hp-bar-inner {
    height: 100%; background: linear-gradient(180deg, #ef4444 0%, #b91c1c 100%);
    transition: width 0.2s;
  }
  .hp-bar-inner.block-on {
    background: linear-gradient(180deg, #38bdf8 0%, #0284c7 100%);
  }
  .hp-bar-text {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    font-size: 10px; font-weight: 900; color: #fff;
    text-shadow: -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000;
  }
  .unit-name {
    font-weight: 800; font-size: 11.5px; color: #e2e8f0;
    text-shadow: -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000, 0 1px 3px #000;
    margin-top: 1px; text-align: center;
    opacity: 0; transition: opacity 0.14s; pointer-events: none;
  }
  .sts-unit:hover .unit-name,
  .sts-unit.target-candidate .unit-name,
  .sts-unit.target-locked .unit-name {
    opacity: 1;
  }
  /* Bare Power Icons Directly Under HP Bar (Original STS AbstractCreature.renderPowerIcons) */
  .power-row {
    display: flex; align-items: center; justify-content: center; gap: 5px; flex-wrap: wrap;
    min-height: 22px; margin-top: 1px;
  }
  .pw-chip {
    position: relative; width: 22px; height: 22px;
    display: inline-flex; align-items: center; justify-content: center;
    padding: 0; background: none; border: none;
    cursor: help; filter: drop-shadow(0 2px 3px rgba(0,0,0,0.88));
    transition: transform 0.12s;
  }
  .pw-chip:hover {
    transform: scale(1.22);
    z-index: 25;
  }
  .pw-chip .pw-num {
    position: absolute; right: -3px; bottom: -4px;
    font-size: 11px; font-weight: 900; line-height: 1;
    color: #fff;
    text-shadow:
      -1.2px -1.2px 0 #000, 1.2px -1.2px 0 #000,
      -1.2px 1.2px 0 #000, 1.2px 1.2px 0 #000,
      0 1px 2px #000;
    pointer-events: none;
  }
  .pw-chip.debuff .pw-num {
    color: #fda4af;
  }
  .sts-power-tip {
    position: fixed; z-index: 150; pointer-events: none;
    max-width: 240px; padding: 8px 11px; border-radius: 8px;
    background: rgba(12, 18, 30, 0.96);
    border: 1.5px solid rgba(245, 196, 81, 0.65);
    box-shadow: 0 8px 24px rgba(0,0,0,0.85);
    color: #f1f5f9; font-size: 11.5px; line-height: 1.45;
    display: none;
  }
  .sts-power-tip.debuff {
    border-color: rgba(244, 63, 94, 0.72);
  }
  .sts-power-tip-head {
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    font-weight: 900; font-size: 12.5px; color: #fef08a; margin-bottom: 3px;
  }
  .sts-power-tip.debuff .sts-power-tip-head {
    color: #fda4af;
  }
  .sts-power-tip-tag {
    font-size: 10px; padding: 1px 5px; border-radius: 4px;
    background: rgba(56, 189, 248, 0.2); color: #7dd3fc;
  }
  .sts-power-tip.debuff .sts-power-tip-tag {
    background: rgba(244, 63, 94, 0.25); color: #fda4af;
  }

  /* ==================== ORIGINAL STS LOWER COMBAT HUD (ORB / PILES / FANNED HAND / END TURN) ==================== */
  .combat-bottom-dock {
    position: absolute; left: 0; right: 0; bottom: 0; z-index: 20;
    display: flex; align-items: flex-end; justify-content: space-between;
    padding: 0 14px 6px; min-height: 196px; pointer-events: none;
  }
  .combat-bottom-dock .dock-side,
  .combat-bottom-dock .hand-tray {
    pointer-events: auto;
  }
  .dock-side {
    display: flex; flex-direction: column; align-items: center; justify-content: flex-end;
    gap: 8px; z-index: 25; flex-shrink: 0; padding-bottom: 4px;
  }
  .sts-energy-orb {
    position: relative; width: 68px; height: 68px;
    display: flex; align-items: center; justify-content: center;
    filter: drop-shadow(0 0 10px rgba(239, 68, 68, 0.65));
  }
  .sts-energy-orb > .sp-icon {
    width: 100% !important; height: 100% !important;
  }
  .sts-energy-orb.empty-energy {
    filter: grayscale(0.65) brightness(0.75);
  }
  .sts-energy-text {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    font-size: 18px; font-weight: 900; color: #fff;
    text-shadow: -1.5px -1.5px 0 #000, 1.5px -1.5px 0 #000, -1.5px 1.5px 0 #000, 1.5px 1.5px 0 #000, 0 0 8px #f59e0b;
  }

  .sts-pile-btn {
    position: relative; width: 54px; height: 54px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; transition: transform 0.15s;
    background: transparent; border: none;
    filter: drop-shadow(0 4px 8px rgba(0,0,0,0.75));
  }
  .sts-pile-btn > .sp-icon {
    width: 92% !important; height: 92% !important;
  }
  .sts-pile-btn:hover { transform: scale(1.12); }
  .sts-pile-count {
    position: absolute; bottom: -3px; right: -4px;
    width: 24px; height: 24px;
    display: flex; align-items: center; justify-content: center;
    color: #fff; font-size: 11px; font-weight: 900;
    text-shadow: -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000;
  }
  .sts-pile-count .sp-icon {
    position: absolute; inset: 0; z-index: 0;
  }
  .sts-pile-count .cnt-txt {
    position: relative; z-index: 1;
  }

  .end-turn-btn {
    min-width: 122px; min-height: 54px; padding: 8px 18px;
    border-radius: 8px; cursor: pointer;
    background-color: transparent; border: none;
    color: #fef08a; font-weight: 900; font-size: 14px; letter-spacing: 1px;
    text-shadow: -1.5px -1.5px 0 #000, 1.5px -1.5px 0 #000, -1.5px 1.5px 0 #000, 1.5px 1.5px 0 #000, 0 1px 4px #000;
    filter: drop-shadow(0 4px 10px rgba(0, 0, 0, 0.85));
    transition: transform 0.15s, filter 0.15s; white-space: nowrap;
    display: inline-flex; align-items: center; justify-content: center;
  }
  .end-turn-btn:hover { transform: translateY(-2px) scale(1.05); filter: brightness(1.15) drop-shadow(0 0 12px rgba(245, 196, 81, 0.7)); }

  /* Fanned Hand Tray & Genuine STS Card Template (ui.webp) */
  .hand-tray {
    flex: 1; display: flex; align-items: flex-end; justify-content: center;
    padding: 18px 8px 4px; min-height: 188px; position: relative; z-index: 22;
    overflow: visible;
  }
  .sts-card {
    width: 128px; height: 165px; min-width: 116px;
    position: relative; cursor: pointer; flex-shrink: 0;
    transition: transform 0.16s cubic-bezier(0.2, 0.8, 0.2, 1), filter 0.16s;
    transform-origin: 50% 120%;
    filter: drop-shadow(0 6px 10px rgba(0,0,0,0.75));
  }
  .hand-tray .sts-card {
    margin: 0 -6px;
    transform: translateY(var(--fan-y, 0px)) rotate(var(--fan-rot, 0deg));
  }
  .sts-card.playable {
    filter: drop-shadow(0 0 5px rgba(56, 189, 248, 0.45)) drop-shadow(0 6px 10px rgba(0,0,0,0.75));
  }
  .sts-card.playable:hover,
  .sts-card.selected-card {
    transform: translateY(-28px) scale(1.16) rotate(0deg) !important;
    filter: drop-shadow(0 0 12px rgba(245, 196, 81, 0.9)) drop-shadow(0 10px 18px rgba(0,0,0,0.85));
    z-index: 50 !important;
  }
  .sts-card.selected-card {
    transform: translateY(-36px) scale(1.2) rotate(0deg) !important;
    filter: drop-shadow(0 0 16px #ef4444) drop-shadow(0 10px 20px rgba(0,0,0,0.9));
  }
  .sts-card.unplayable {
    opacity: 0.68; cursor: not-allowed; filter: saturate(0.55) brightness(0.85) drop-shadow(0 4px 8px rgba(0,0,0,0.7));
  }
  .sts-card.unplayable:hover {
    transform: translateY(-10px) scale(1.06) rotate(0deg) !important;
    z-index: 40 !important;
  }

  .card-art {
    position: absolute;
    left: 14.5%; top: 19.6%; width: 71.0%; height: 36.6%;
    background-color: #141824;
    background-image: url("assets/cards.webp");
    background-repeat: no-repeat;
    background-size: 1900% 1900%;
    z-index: 1;
    overflow: hidden;
  }
  .sts-card.type-A .card-art {
    clip-path: polygon(0% 0%, 100% 0%, 100% 84%, 50% 100%, 0% 84%);
  }
  .sts-card.type-P .card-art {
    border-radius: 50%;
  }
  .card-frame-overlay {
    position: absolute; inset: 0;
    background-image: url("assets/ui.webp");
    background-repeat: no-repeat;
    background-size: 600% 1306.306%;
    z-index: 2; pointer-events: none;
  }
  .card-cost {
    position: absolute;
    left: 0.9%; top: 0.5%; width: 20.9%; height: 15.6%;
    display: flex; align-items: center; justify-content: center;
    font-weight: 900; font-size: 14.5px; color: #fff;
    text-shadow: -1.5px -1.5px 0 #000, 1.5px -1.5px 0 #000, -1.5px 1.5px 0 #000, 1.5px 1.5px 0 #000;
    z-index: 3; pointer-events: none;
  }
  .card-cost.cost-modified { color: #4ade80; }
  .card-name {
    position: absolute;
    left: 12%; right: 12%; top: 6.7%; height: 10.2%;
    display: flex; align-items: center; justify-content: center;
    font-weight: 900; font-size: 11px; color: #f8fafc;
    text-shadow: -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    z-index: 3; pointer-events: none;
  }
  .card-name.upgraded { color: #7fff00; }
  .card-type-pill {
    position: absolute;
    left: 22%; right: 22%; top: 54.0%; height: 5.6%;
    display: flex; align-items: center; justify-content: center;
    font-size: 8.5px; font-weight: 800; color: #d6d3d1;
    text-shadow: 0 1px 2px #000;
    z-index: 3; pointer-events: none;
  }
  .card-desc {
    position: absolute;
    left: 13%; right: 13%; top: 60.5%; bottom: 9.5%;
    font-size: 9.5px; line-height: 1.24; color: #f1f5f9;
    text-shadow: 0 1px 2px #000;
    text-align: center; display: flex; align-items: center; justify-content: center;
    z-index: 3; pointer-events: none; overflow: hidden;
  }
  .card-extra-badge {
    position: absolute; bottom: -8px; left: 50%; transform: translateX(-50%);
    background: #0f172a; border: 1px solid var(--gold); color: var(--gold);
    font-size: 10px; font-weight: 800; padding: 1px 6px; border-radius: 8px;
    white-space: nowrap; z-index: 5;
  }
  .num-boost { color: #4ade80; font-weight: 900; }
  .num-nerf { color: #f87171; font-weight: 900; }

  /* Curved Targeting Arrow SVG Overlay */
  #sts-target-svg {
    position: fixed; inset: 0; width: 100vw; height: 100vh;
    pointer-events: none; z-index: 90;
  }

  /* ==================== ORIGINAL STS EVENT DIALOG & NON-COMBAT PANELS ==================== */
  .sts-event-stage {
    position: relative; width: 100%; height: 100%; min-height: 0;
    display: flex; align-items: center; justify-content: center;
    padding: 12px 18px; overflow-y: auto; overflow-x: hidden;
  }
  .sts-event-dialog {
    position: relative; z-index: 10;
    width: 100%; max-width: 820px; min-height: 382px;
    padding: 58px 38px 28px 38px;
    display: flex; flex-direction: column;
    filter: drop-shadow(0 18px 40px rgba(0,0,0,0.92));
    margin: auto;
  }
  .sts-event-ribbon-title {
    position: absolute; top: 3.2%; left: 5.4%; width: 42%; height: 11.5%;
    display: flex; align-items: center;
    font-size: 20px; font-weight: 900; color: #fef08a; letter-spacing: 1.5px;
    text-shadow: -1.5px -1.5px 0 #1c1309, 1.5px -1.5px 0 #1c1309, -1.5px 1.5px 0 #1c1309, 1.5px 1.5px 0 #1c1309, 0 2px 6px rgba(0,0,0,0.85);
    pointer-events: none;
  }
  .sts-event-body {
    flex: 1; display: flex; align-items: center; gap: 28px;
    min-height: 276px;
  }
  .sts-event-portrait-wrap {
    width: 244px; height: 244px; flex-shrink: 0;
    position: relative; border-radius: 6px;
    filter: drop-shadow(0 8px 20px rgba(0,0,0,0.85));
  }
  .sts-event-right-col {
    flex: 1; min-height: 248px;
    display: flex; flex-direction: column; justify-content: space-between;
    gap: 16px; padding: 6px 4px 2px 0;
  }
  .sts-event-narrative {
    font-size: 15px; line-height: 1.72; color: #e2e8f0;
    text-shadow: 0 2px 4px #000;
    padding: 4px 6px;
  }
  .sts-event-narrative .quote-hi {
    color: #fde68a; font-weight: 700;
  }
  .sts-event-choices {
    display: flex; flex-direction: column; gap: 8px;
    margin-top: auto;
  }
  .sts-event-opt-btn {
    width: 100%; min-height: 44px;
    padding: 8px 22px; border: none; background-color: transparent;
    cursor: pointer; display: flex; align-items: center; justify-content: flex-start;
    text-align: left; color: #f8fafc; font-size: 13.5px; font-weight: 700;
    text-shadow: -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000;
    transition: transform 0.12s, filter 0.12s;
  }
  .sts-event-opt-btn:hover {
    filter: brightness(1.22) drop-shadow(0 0 8px rgba(245, 196, 81, 0.55));
    transform: translateX(4px);
  }
  .sts-opt-bracket {
    color: #fde047; font-weight: 900; margin-right: 6px;
  }
  .sts-opt-pos { color: #4ade80; font-weight: 800; }
  .sts-opt-neg { color: #f87171; font-weight: 800; }

  /* ==================== ORIGINAL STS NEOW ROOM (NeowRoom / NeowEvent / SpeechBubble) ==================== */
  .sts-neow-stage {
    position: relative; width: 100%; height: 100%; min-height: 0;
    overflow: hidden;
    --sts-floor-y: max(33.5%, 205px);
  }
  .sts-neow-ambient {
    position: absolute; inset: 0; pointer-events: none; z-index: 2;
    background:
      radial-gradient(ellipse at 76% 48%, rgba(56, 189, 248, 0.14) 0%, transparent 52%),
      radial-gradient(ellipse at 25% 55%, rgba(245, 196, 81, 0.08) 0%, transparent 45%);
  }
  .sts-neow-hero {
    position: absolute;
    left: 25%;
    bottom: var(--sts-floor-y);
    transform: translateX(-50%);
    z-index: 8;
    display: flex; flex-direction: column; align-items: center; justify-content: flex-end;
  }
  /* ==================== ORIGINAL STS CHARACTER SELECT SCREEN (CharacterSelectScreen / CharacterOption) ==================== */
  .sts-key-triangle {
    position: relative; width: 24px; height: 24px;
    display: inline-flex; align-items: center; justify-content: center;
    cursor: help; flex-shrink: 0;
  }
  .sts-key-triangle .sp-icon {
    position: absolute; inset: 0;
  }
  .sts-char-select-stage {
    position: relative; width: 100%; height: 100%; min-height: 0;
    overflow: hidden;
  }
  .sts-char-splash-bg {
    position: absolute; inset: 0; z-index: 1;
    transition: opacity 0.25s ease;
  }
  .sts-char-splash-vignette {
    position: absolute; inset: 0; z-index: 2; pointer-events: none;
    background:
      linear-gradient(90deg, rgba(6, 9, 16, 0.88) 0%, rgba(6, 9, 16, 0.58) 38%, rgba(6, 9, 16, 0.08) 72%, rgba(6, 9, 16, 0.45) 100%),
      linear-gradient(180deg, rgba(6, 9, 16, 0.45) 0%, transparent 25%, transparent 68%, rgba(6, 9, 16, 0.88) 100%);
  }
  .sts-char-info-panel {
    position: absolute; left: 6%; top: 13%; z-index: 10;
    max-width: 430px;
    display: flex; flex-direction: column; gap: 12px;
    pointer-events: auto;
  }
  .sts-char-title {
    font-size: 42px; font-weight: 900; color: #f5d08a;
    letter-spacing: 2px;
    text-shadow: 0 4px 12px rgba(0,0,0,0.95), -1.5px -1.5px 0 #000, 1.5px -1.5px 0 #000, -1.5px 1.5px 0 #000, 1.5px 1.5px 0 #000;
  }
  .sts-char-stats-row {
    display: flex; align-items: center; gap: 22px;
    font-size: 16px; font-weight: 900;
    text-shadow: 0 2px 6px #000, -1px -1px 0 #000, 1px 1px 0 #000;
  }
  .sts-char-stat-item {
    display: inline-flex; align-items: center; gap: 6px;
  }
  .sts-char-flavor {
    font-size: 15px; line-height: 1.65; color: #e2e8f0;
    text-shadow: 0 2px 6px #000, -1px -1px 0 #000, 1px 1px 0 #000;
  }
  .sts-char-relic-box {
    display: flex; align-items: flex-start; gap: 12px;
    margin-top: 4px; padding: 10px 14px;
    background: rgba(9, 13, 22, 0.68);
    border: 1px solid rgba(245, 196, 81, 0.35);
    border-radius: 10px;
    backdrop-filter: blur(4px);
    box-shadow: 0 6px 18px rgba(0,0,0,0.65);
  }
  .sts-char-relic-info {
    display: flex; flex-direction: column; gap: 3px;
  }
  .sts-char-relic-name {
    font-size: 15px; font-weight: 900; color: #fde047;
    text-shadow: 0 1px 3px #000;
  }
  .sts-char-relic-desc {
    font-size: 13px; line-height: 1.48; color: #cbd5e1;
    text-shadow: 0 1px 2px #000;
  }
  .sts-char-options-dock {
    position: absolute; bottom: 24px; left: 50%; transform: translateX(-50%);
    z-index: 15;
    display: flex; align-items: center; gap: 22px;
  }
  .sts-char-opt-btn {
    position: relative; width: 84px; height: 84px;
    border: none; background-color: transparent; padding: 0;
    cursor: pointer; border-radius: 10px;
    filter: drop-shadow(0 6px 14px rgba(0,0,0,0.85));
    transition: transform 0.16s cubic-bezier(0.2, 0.9, 0.3, 1), filter 0.16s;
  }
  .sts-char-opt-btn:hover {
    transform: scale(1.08);
    filter: brightness(1.15) drop-shadow(0 8px 18px rgba(0,0,0,0.9));
  }
  .sts-char-opt-btn.active {
    transform: scale(1.1);
    filter: drop-shadow(0 0 16px rgba(251, 191, 36, 0.65));
  }
  .sts-char-opt-art {
    position: absolute; inset: 4px; border-radius: 8px; z-index: 2;
  }
  @keyframes stsCharHiPulse {
    0%, 100% { transform: scale(1.06); opacity: 0.92; }
    50% { transform: scale(1.13); opacity: 1; }
  }
  .sts-char-opt-hi {
    position: absolute; inset: -10px; pointer-events: none; z-index: 1;
    animation: stsCharHiPulse 1.8s ease-in-out infinite;
  }

  /* Defect Orb Slots Arc & Watcher Stance Aura */
  @keyframes stsOrbFloat {
    0%, 100% { transform: translate(-50%, -50%) translateY(0px); }
    50% { transform: translate(-50%, -50%) translateY(-4px); }
  }
  .sts-orb-arc {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 15;
  }
  .sts-orb-slot {
    position: absolute;
    width: 38px; height: 38px;
    display: flex; align-items: center; justify-content: center;
    pointer-events: auto; cursor: help;
    animation: stsOrbFloat 2.6s ease-in-out infinite;
    filter: drop-shadow(0 3px 6px rgba(0,0,0,0.88));
  }
  .sts-orb-slot.next-evoke::after {
    content: "";
    position: absolute; inset: -2px;
    border-radius: 50%;
    border: 1.5px dashed rgba(253, 224, 71, 0.75);
    pointer-events: none;
  }
  .sts-orb-val {
    position: absolute; right: -4px; bottom: -4px;
    font-size: 11px; font-weight: 900; color: #fff;
    text-shadow: -1.2px -1.2px 0 #000, 1.2px -1.2px 0 #000, -1.2px 1.2px 0 #000, 1.2px 1.2px 0 #000, 0 0 4px #38bdf8;
    pointer-events: none;
  }
  .sts-orb-val.dark-evoke {
    left: -4px; right: auto; top: -4px; bottom: auto;
    color: #d8b4fe;
    font-size: 10px;
  }
  @keyframes stsStancePulse {
    0%, 100% { transform: translate(-50%, -50%) scale(0.96); opacity: 0.72; }
    50% { transform: translate(-50%, -50%) scale(1.06); opacity: 0.96; }
  }
  .sts-stance-aura {
    position: absolute;
    left: 50%; top: 52%;
    width: 136px; height: 136px;
    border-radius: 50%;
    pointer-events: none;
    z-index: 0;
    animation: stsStancePulse 2.1s ease-in-out infinite;

  .sts-stance-aura.stance-Calm {
    background: radial-gradient(circle, rgba(56, 189, 248, 0.42) 0%, rgba(14, 165, 233, 0.16) 52%, transparent 74%);
    box-shadow: 0 0 24px rgba(56, 189, 248, 0.45);
  }
  .sts-stance-aura.stance-Wrath {
    background: radial-gradient(circle, rgba(239, 68, 68, 0.48) 0%, rgba(220, 38, 38, 0.2) 52%, transparent 74%);
    box-shadow: 0 0 28px rgba(239, 68, 68, 0.55);
  }
  .sts-stance-aura.stance-Divinity {
    background: radial-gradient(circle, rgba(216, 180, 254, 0.52) 0%, rgba(245, 196, 81, 0.26) 54%, transparent 76%);
    box-shadow: 0 0 32px rgba(192, 132, 252, 0.68);
  }
  .sts-stance-badge {
    position: absolute;
    top: -22px; left: 50%; transform: translateX(-50%);
    white-space: nowrap;
    padding: 2px 8px;
    border-radius: 10px;
    font-size: 10.5px; font-weight: 900;
    z-index: 16;
    text-shadow: 0 1px 2px #000;
    box-shadow: 0 2px 6px rgba(0,0,0,0.85);
    pointer-events: auto; cursor: help;
  }
  .sts-stance-badge.stance-Calm {
    background: rgba(12, 74, 110, 0.9); border: 1px solid #38bdf8; color: #bae6fd;
  }
  .sts-stance-badge.stance-Wrath {
    background: rgba(127, 29, 29, 0.92); border: 1px solid #f87171; color: #fecaca;
  }
  .sts-stance-badge.stance-Divinity {
    background: rgba(88, 28, 135, 0.92); border: 1px solid #fde047; color: #fef08a;
  }
  .sts-neow-boss {
    position: absolute;
    right: -18px;
    bottom: calc(var(--sts-floor-y) - 6%);
    z-index: 7;
    display: flex; flex-direction: column; align-items: center; justify-content: flex-end;
    pointer-events: none;
  }
  @keyframes stsSpeechPop {
    0% { transform: scale(0.4) translate(20px, 15px); opacity: 0; }
    65% { transform: scale(1.05) translate(0, 0); opacity: 1; }
    100% { transform: scale(1) translate(0, 0); opacity: 1; }
  }
  @keyframes stsSpeechFloat {
    0%, 100% { transform: translateY(0px); }
    50% { transform: translateY(-4px); }
  }
  @keyframes stsWaveChar {
    0%, 100% { transform: translateY(0px); }
    50% { transform: translateY(-2.6px); }
  }
  .sts-neow-speech {
    position: absolute;

  .vfx-dmg-num {

    color: #ef4444;
    text-shadow:
      -2px -2px 0 #000, 2px -2px 0 #000,
      -2px 2px 0 #000, 2px 2px 0 #000,

  @keyframes vfxTurnBannerAnim {

// ==================== 1. Deterministic PRNG ====================
function Rng(seed) {
  let s = (seed >>> 0) || 1;
  return {
    get s() { return s >>> 0; },
    set s(v) { s = (v >>> 0) || 1; },
    get state() { return s >>> 0; },
    next() {
      s = (s + 0x6D2B79F5) >>> 0;
      let t = Math.imul(s ^ (s >>> 15), 1 | s);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    },
    int(min, max) {
      if (max <= min) return min;
      return min + Math.floor(this.next() * (max - min + 1));
    },
    range(min, max) {
      return this.int(min, max);
    },
    bool(chance = 0.5) {
      return this.next() < chance;
    },
    pick(arr) {
      if (!arr || !arr.length) return null;
      return arr[Math.floor(this.next() * arr.length)];
    },
    shuffle(arr) {
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(this.next() * (i + 1));
        const tmp = arr[i]; arr[i] = arr[j]; arr[j] = tmp;
      }
      return arr;
    }
  };
}

function hashStr(str) {
  let h = 2166136261 >>> 0;
  const s = String(str || "");
  for (let i = 0; i < s.length; i++) {
    h ^= s.charCodeAt(i);
    h = Math.imul(h, 16777619) >>> 0;
  }
  return h || 1;
}

// ==================== 2. Authentic 15x7 MapGenerator + RoomTypeAssigner ====================
function generateActMap(seed, act) {
  if (act === 4) {
    const rows4 = [];
    for (let y = 0; y < 15; y++) rows4.push([]);
    rows4[0] = [{ x: 3, y: 0, t: "R", e: [3] }];
    rows4[1] = [{ x: 3, y: 1, t: "$", e: [3] }];
    rows4[2] = [{ x: 3, y: 2, t: "E", e: [3] }];
    return rows4;
  }
  const rng = Rng((seed ^ Math.imul(act || 1, 0x9E3779B9)) >>> 0);
  const H = 15, W = 7, density = 6;
  const grid = [];
  for (let y = 0; y < H; y++) {
    const row = [];
    for (let x = 0; x < W; x++) {
      row.push({ x, y, edges: [], parents: [], type: null });
    }
    grid.push(row);
  }

  let firstStart = -1;
  for (let p = 0; p < density; p++) {
    let curX = rng.int(0, W - 1);
    if (p === 0) firstStart = curX;
    while (p === 1 && curX === firstStart) {
      curX = rng.int(0, W - 1);
    }
    for (let y = 0; y < H - 1; y++) {
      const node = grid[y][curX];
      let minD = -1, maxD = 1;
      if (curX === 0) minD = 0;
      if (curX === W - 1) maxD = 0;
      if (curX > 0) {
        const left = grid[y][curX - 1];
        for (let i = 0; i < left.edges.length; i++) {
          if (left.edges[i] > curX - 1) minD = Math.max(minD, left.edges[i] - curX);
        }
      }
      if (curX < W - 1) {
        const right = grid[y][curX + 1];
        for (let i = 0; i < right.edges.length; i++) {
          if (right.edges[i] < curX + 1) maxD = Math.min(maxD, right.edges[i] - curX);
        }
      }
      if (minD > maxD) minD = maxD = 0;
      const nextX = Math.max(0, Math.min(W - 1, curX + rng.int(minD, maxD)));
      if (node.edges.indexOf(nextX) === -1) {
        node.edges.push(nextX);
        node.edges.sort((a, b) => a - b);
        grid[y + 1][nextX].parents.push(curX);
      }
      curX = nextX;
    }
  }

  // Trim redundant row 0 edges sharing same row 1 target
  const usedCols = new Set();
  for (let x = 0; x < W; x++) {
    if (grid[0][x].edges.length > 0) usedCols.add(x);
  }
  if (usedCols.size > 1) {
    const seenRow1 = new Set();
    for (let x = 0; x < W; x++) {
      const n = grid[0][x];
      if (!n.edges.length) continue;
      for (let i = n.edges.length - 1; i >= 0; i--) {
        const dst = n.edges[i];
        if (seenRow1.has(dst) && (n.edges.length > 1 || usedCols.size > 2)) {
          n.edges.splice(i, 1);
          const pArr = grid[1][dst].parents;
          const idx = pArr.indexOf(x);
          if (idx !== -1) pArr.splice(idx, 1);
          if (!n.edges.length) usedCols.delete(x);
        } else {
          seenRow1.add(dst);
        }
      }
    }
  }

  // Fixed rows: Row 0 = M, Row 8 = T, Row 14 = R
  for (let x = 0; x < W; x++) {
    grid[0][x].type = "M";
    grid[8][x].type = "T";
    grid[14][x].type = "R";
  }

  const unassigned = [];
  for (let y = 1; y < H - 1; y++) {
    if (y === 8) continue;
    for (let x = 0; x < W; x++) {
      const n = grid[y][x];
      if (n.edges.length > 0 || n.parents.length > 0) unassigned.push(n);
    }
  }

  const total = unassigned.length;
  const nShop = Math.round(total * 0.05);
  const nRest = Math.round(total * 0.12);
  const nElite = Math.round(total * 0.08);
  const nEvent = Math.round(total * 0.22);
  const deck = [];
  for (let i = 0; i < nShop; i++) deck.push("$");
  for (let i = 0; i < nRest; i++) deck.push("R");
  for (let i = 0; i < nElite; i++) deck.push("E");
  for (let i = 0; i < nEvent; i++) deck.push("?");
  while (deck.length < total) deck.push("M");
  const pool = rng.shuffle(deck);

  function canAssign(n, tp) {
    if ((tp === "R" || tp === "E") && n.y <= 4) return false;
    if (tp === "R" && n.y >= 13) return false;
    if (tp === "R" || tp === "E" || tp === "$") {
      for (let i = 0; i < n.parents.length; i++) {
        const pNode = grid[n.y - 1][n.parents[i]];
        if (pNode && pNode.type === tp) return false;
        for (let j = 0; j < pNode.edges.length; j++) {
          const sib = grid[n.y][pNode.edges[j]];
          if (sib && sib !== n && sib.type === tp) return false;
        }
      }
    }
    return true;
  }

  for (let i = 0; i < unassigned.length; i++) {
    const n = unassigned[i];
    let picked = -1;
    for (let j = 0; j < pool.length; j++) {
      if (canAssign(n, pool[j])) { picked = j; break; }
    }
    n.type = picked !== -1 ? pool.splice(picked, 1)[0] : "M";
  }

  const rows = [];
  const eliteNodes = [];
  for (let y = 0; y < H; y++) {
    const r = [];
    for (let x = 0; x < W; x++) {
      const n = grid[y][x];
      const active = y === 0 ? n.edges.length > 0 : n.parents.length > 0;
      if (active) {
        const item = { x, y, t: n.type || "M", e: n.edges };
        if (item.t === "E") eliteNodes.push(item);
        r.push(item);
      }
    }
    rows.push(r);
  }
  if (eliteNodes.length > 0) {
    rng.pick(eliteNodes).be = 1;
  } else if (rows[6] && rows[6][0]) {
    rows[6][0].t = "E";
    rows[6][0].be = 1;
  }
  return rows;
}

const COLORLESS_CARDS = [
  "Apotheosis", "Bandage Up", "Blind", "Dark Shackles", "Deep Breath", "Discovery",
  "Dramatic Entrance", "Finesse", "Flash of Steel", "Good Instincts", "HandOfGreed",
  "Impatience", "Madness", "Master of Strategy", "Mayhem", "Mind Blast", "Panacea",
  "Panache", "PanicButton", "Purity", "Sadistic Nature", "Secret Technique",
  "Secret Weapon", "Swift Strike", "The Bomb", "Thinking Ahead", "Trip", "Violence"
];
const IRONCLAD_POOL = Object.keys(RAW_CARDS).filter(k => (!RAW_CARDS[k][15] || RAW_CARDS[k][15] === "R") && ["C", "U", "R"].indexOf(RAW_CARDS[k][2]) !== -1 && COLORLESS_CARDS.indexOf(k) === -1);
const SILENT_POOL = Object.keys(RAW_CARDS).filter(k => RAW_CARDS[k][15] === "G" && ["C", "U", "R"].indexOf(RAW_CARDS[k][2]) !== -1);
const DEFECT_POOL = Object.keys(RAW_CARDS).filter(k => RAW_CARDS[k][15] === "B" && ["C", "U", "R"].indexOf(RAW_CARDS[k][2]) !== -1);
const WATCHER_POOL = Object.keys(RAW_CARDS).filter(k => RAW_CARDS[k][15] === "P" && ["C", "U", "R"].indexOf(RAW_CARDS[k][2]) !== -1);

function getCharCardPool(state) {
  const ch = state && state.ch;
  if (ch === "THE_SILENT") return SILENT_POOL;
  if (ch === "DEFECT") return DEFECT_POOL;
  if (ch === "WATCHER") return WATCHER_POOL;
  return IRONCLAD_POOL;
}

function parseCard(cardStr) {
  const s = String(cardStr || "Strike_R");
  const pipeIdx = s.indexOf("|");
  const core = pipeIdx !== -1 ? s.slice(0, pipeIdx) : s;
  const mod = pipeIdx !== -1 ? s.slice(pipeIdx + 1) : "";
  const plusIdx = core.indexOf("+");
  const id = plusIdx !== -1 ? core.slice(0, plusIdx) : core;
  let up = 0;
  if (plusIdx !== -1) {
    const num = parseInt(core.slice(plusIdx + 1), 10);
    up = Number.isFinite(num) ? num : 1;
  }
  return { id, up, mod, raw: s };
}

function getCardDef(cardStr) {
  const { id, up, mod } = parseCard(cardStr);
  const r = RAW_CARDS[id] || RAW_CARDS["Strike_R"];
  const isUp = up > 0;
  let dmg = isUp ? r[7] : r[6];
  if (id === "Searing Blow" && up > 0) {
    dmg = 12 + Math.floor((up * (up + 7)) / 2);
  }
  let cost = isUp ? r[5] : r[4];
  let blk = isUp ? r[9] : r[8];
  let mag = isUp ? r[11] : r[10];
  let extra = 0;
  if (mod !== "") {
    const cMatch = mod.match(/c(\d+)/);
    if (cMatch) cost = parseInt(cMatch[1], 10);
    const nMatch = mod.replace(/c\d+/g, "").match(/-?\d+/);
    if (nMatch) {
      extra = parseInt(nMatch[0], 10) || 0;
      if (id === "Rampage" || id === "Glass Knife" || id === "WindmillStrike") {
        dmg = Math.max(0, dmg + extra);
      } else if (id === "RitualDagger") {
        dmg = extra || dmg;
      } else if (id === "Genetic Algorithm" || id === "Steam" || id === "Perseverance") {
        blk = Math.max(0, blk + extra);
      } else if (id === "Expunger") {
        mag = extra || 1;
      }
    }
  }
  const flags = r[12];
  const exhaust = Boolean(((flags & 1) && !(isUp && (flags & 2))) || (isUp && (flags & 512)));
  const ethereal = (flags & 4) ? !(isUp && (flags & 8)) : false;
  const innate = Boolean((flags & 16) || (isUp && (flags & 32)));
  const isStrike = Boolean(flags & 64);
  const retain = Boolean((flags & 128) || (isUp && (flags & 256)));
  const name = r[0] + (up > 1 ? "+" + up : (isUp ? "+" : ""));
  const desc = (isUp && r[14]) ? r[14] : r[13];
  const target = (isUp && (id === "Blind" || id === "Trip")) ? "A" : r[3];
  const color = r[15] || (r[1] === "ST" ? "ST" : (r[1] === "C" ? "CU" : (COLORLESS_CARDS.indexOf(id) !== -1 || r[2] === "SP" ? "CL" : "R")));
  return { id, up, mod, extra, name, type: r[1], rarity: r[2], target, cost, dmg, blk, mag, exhaust, ethereal, innate, isStrike, retain, color, desc };
}

function makeMonster(id, rng, state, arg) {
  let hp = 30;
  const pw = {};
  const st = { first: true };
  switch (id) {
    // Act 1
    case "Cultist": hp = rng.int(48, 54); break;
    case "JawWorm":
      hp = rng.int(40, 44);
      if (arg && arg.hard) { pw.Strength = 3; st.initBlk = 6; st.first = false; }
      break;
    case "FuzzyLouseNormal":
    case "FuzzyLouseDefensive":
      hp = rng.int(10, 15);
      pw.CurlUp = rng.int(3, 7);
      st.biteDmg = rng.int(5, 7);
      break;
    case "AcidSlime_S": hp = rng.int(8, 12); st.alt = false; break;
    case "AcidSlime_M": hp = arg && arg.hp ? arg.hp : rng.int(28, 32); break;
    case "AcidSlime_L": hp = rng.int(65, 69); pw.Split = 1; break;
    case "SpikeSlime_S": hp = rng.int(10, 14); break;
    case "SpikeSlime_M": hp = arg && arg.hp ? arg.hp : rng.int(28, 32); break;
    case "SpikeSlime_L": hp = rng.int(64, 70); pw.Split = 1; break;
    case "SlaverBlue": hp = rng.int(46, 50); break;
    case "SlaverRed": hp = rng.int(46, 50); break;
    case "Looter": hp = rng.int(44, 48); pw.Thievery = 15; st.sc = 0; break;
    case "FungiBeast": hp = rng.int(22, 28); pw.SporeCloud = 2; break;
    case "GremlinWarrior": hp = rng.int(20, 24); pw.Anger = 1; break;
    case "GremlinThief": hp = rng.int(10, 14); break;
    case "GremlinFat": hp = rng.int(13, 17); break;
    case "GremlinTsundere": hp = rng.int(12, 15); break;
    case "GremlinWizard": hp = rng.int(21, 25); st.charge = 0; break;
    case "GremlinNob": hp = rng.int(82, 86); break;
    case "Lagavulin":
      hp = rng.int(109, 111);
      pw.Metallicize = 8;
      st.initBlk = 8;
      st.asleep = true;
      st.idle = 0;
      st.debuff = 0;
      break;
    case "Sentry":
      hp = rng.int(38, 42);
      pw.Artifact = 1;
      st.idx = (arg && arg.idx) || 0;
      break;
    case "TheGuardian":
      hp = 240;
      pw.ModeShift = 30;
      st.dmgThr = 30;
      st.dmgTaken = 0;
      st.open = true;
      break;
    case "Hexaghost":
      hp = 250;
      st.activated = false;
      st.orb = 0;
      break;
    case "SlimeBoss":
      hp = 140;
      pw.Split = 1;
      break;
    // Act 2
    case "SphericGuardian":
      hp = 20;
      pw.Barricade = 1;
      pw.Artifact = 3;
      st.initBlk = 40;
      st.second = true;
      break;
    case "Chosen": hp = rng.int(95, 99); st.usedHex = false; break;
    case "ShelledParasite":
      hp = rng.int(68, 72);
      pw.PlatedArmor = 14;
      st.initBlk = 14;
      break;
    case "Byrd":
      hp = rng.int(25, 31);
      pw.Flight = 3;
      st.air = true;
      break;
    case "Mugger": hp = rng.int(48, 52); pw.Thievery = 15; st.sc = 0; break;
    case "SnakePlant": hp = rng.int(75, 79); pw.Malleable = 3; st.baseMal = 3; break;
    case "Snecko": hp = rng.int(114, 120); break;
    case "Centurion": hp = rng.int(76, 80); break;
    case "Healer": hp = rng.int(48, 56); break;
    case "GremlinLeader": hp = rng.int(140, 148); break;
    case "Taskmaster": hp = rng.int(54, 60); break;
    case "BookOfStabbing": hp = rng.int(160, 164); pw.PainfulStabs = 1; st.stab = 1; break;
    case "BronzeAutomaton": hp = 300; pw.Artifact = 3; st.turns = 0; break;
    case "BronzeOrb": hp = rng.int(52, 58); pw.Minion = 1; st.stasis = false; break;
    case "TheCollector": hp = 282; st.turns = 0; st.ult = false; break;
    case "TorchHead": hp = rng.int(38, 40); pw.Minion = 1; break;
    case "Champ": hp = 420; st.turns = 0; st.forge = 0; st.p2 = false; break;
    // Act 3
    case "Darkling": hp = rng.int(48, 56); pw.Regrow = 1; st.nip = rng.int(7, 11); st.idx = (arg && arg.idx) || 0; break;
    case "OrbWalker": hp = rng.int(90, 96); pw.GenericStrengthUp = 3; break;
    case "Repulsor": hp = rng.int(29, 35); break;
    case "Exploder": hp = 30; pw.Explosive = 3; st.tc = 0; break;
    case "Spiker": hp = rng.int(42, 56); pw.Thorns = 3; st.tc = 0; break;
    case "SpireGrowth": hp = 170; break;
    case "Transient": hp = 999; pw.Fading = 5; pw.Shifting = 1; st.cnt = 0; break;
    case "Maw": hp = 300; st.roared = false; st.tc = 1; break;
    case "WrithingMass": hp = 160; pw.Reactive = 1; pw.Malleable = 3; st.baseMal = 3; st.mega = false; break;
    case "GiantHead": hp = 500; pw.Slow = 0; st.cnt = 5; break;
    case "Nemesis": hp = 185; st.cd = 0; break;
    case "Reptomancer": hp = rng.int(180, 190); break;
    case "SnakeDagger": hp = rng.int(20, 25); pw.Minion = 1; break;
    case "AwakenedOne":
      hp = 300;
      pw.RegenerateMonster = 10;
      pw.Curiosity = 1;
      pw.Unawakened = 1;
      st.form1 = true;
      break;
    case "TimeEater":
      hp = 456;
      pw.TimeWarp = 0;
      st.haste = false;
      break;
    case "Deca":
      hp = 250;
      pw.Artifact = 2;
      st.atk = true;
      break;
    case "Donu":
      hp = 250;
      pw.Artifact = 2;
      st.atk = false;
      break;
    // Event bandits
    case "BanditPointy": hp = 30; break;
    case "BanditRomeo": hp = rng.int(35, 39); break;
    case "BanditBear": hp = rng.int(38, 42); break;
    // Act 4: The Ending
    case "SpireShield":
      hp = 110;
      pw.Artifact = 1;
      st.tc = 0;
      break;
    case "SpireSpear":
      hp = 160;
      pw.Artifact = 1;
      st.tc = 0;
      break;
    case "CorruptHeart":
      hp = 750;
      pw.Invincible = 300;
      pw.BeatOfDeath = 1;
      st.tc = 0;
      st.buffs = 0;
      break;
  }
  if (arg && arg.minion) pw.Minion = 1;
  return {
    id,
    name: MONSTER_META[id] || id,
    hp,
    mhp: hp,
    b: st.initBlk || 0,
    mv: 0,
    in: "UNKNOWN",
    dmg: 0,
    hits: 1,
    pw,
    h: [],
    st
  };
}

function getLouseId(rng) {
  return rng.bool(0.5) ? "FuzzyLouseNormal" : "FuzzyLouseDefensive";
}
function getShapePool(rng, count) {
  const pool = ["Repulsor", "Repulsor", "Exploder", "Exploder", "Spiker", "Spiker"];
  const sh = rng.shuffle(pool);
  return sh.slice(0, count);
}

function spawnEncounter(encId, rng, state) {
  const list = [];
  const add = (id, arg) => list.push(makeMonster(id, rng, state, arg));
  switch (encId) {
    // Act 1 Weak
    case "Cultist": add("Cultist"); break;
    case "Jaw Worm": add("JawWorm"); break;
    case "2 Louse": add(getLouseId(rng)); add(getLouseId(rng)); break;
    case "Small Slimes":
      if (rng.bool(0.5)) { add("SpikeSlime_S"); add("AcidSlime_M"); }
      else { add("AcidSlime_S"); add("SpikeSlime_M"); }
      break;
    // Act 1 Strong
    case "Blue Slaver": add("SlaverBlue"); break;
    case "Red Slaver": add("SlaverRed"); break;
    case "Looter": add("Looter"); break;
    case "Large Slime": add(rng.bool(0.5) ? "AcidSlime_L" : "SpikeSlime_L"); break;
    case "Lots of Slimes":
      add("SpikeSlime_S"); add("SpikeSlime_S"); add("SpikeSlime_S");
      add("AcidSlime_S"); add("AcidSlime_S");
      break;
    case "Gremlin Gang": {
      const gPool = rng.shuffle(["GremlinWarrior", "GremlinWarrior", "GremlinThief", "GremlinThief", "GremlinFat", "GremlinFat", "GremlinTsundere", "GremlinWizard"]);
      for (let i = 0; i < 4; i++) add(gPool[i]);
      break;
    }
    case "Exordium Thugs": {
      const w1 = rng.pick([getLouseId(rng), "SpikeSlime_M", "AcidSlime_M"]);
      const s1 = rng.pick(["Cultist", "SlaverBlue", "SlaverRed", "Looter"]);
      add(w1); add(s1);
      break;
    }
    case "Exordium Wildlife": {
      const s2 = rng.pick(["FungiBeast", "JawWorm"]);
      const w2 = rng.pick([getLouseId(rng), "SpikeSlime_M", "AcidSlime_M"]);
      add(s2); add(w2);
      break;
    }
    case "3 Louse": add(getLouseId(rng)); add(getLouseId(rng)); add(getLouseId(rng)); break;
    case "2 Fungi Beasts": add("FungiBeast"); add("FungiBeast"); break;
    case "3 Fungi Beasts": add("FungiBeast"); add("FungiBeast"); add("FungiBeast"); break;
    // Act 1 Elites & Bosses
    case "Gremlin Nob": add("GremlinNob"); break;
    case "Lagavulin": add("Lagavulin"); break;
    case "3 Sentries": add("Sentry", { idx: 0 }); add("Sentry", { idx: 1 }); add("Sentry", { idx: 2 }); break;
    case "TheGuardian": add("TheGuardian"); break;
    case "Hexaghost": add("Hexaghost"); break;
    case "SlimeBoss": add("SlimeBoss"); break;
    // Act 2 Weak & Strong
    case "Spheric Guardian": add("SphericGuardian"); break;
    case "Chosen": add("Chosen"); break;
    case "Shell Parasite": add("ShelledParasite"); break;
    case "3 Byrds": add("Byrd"); add("Byrd"); add("Byrd"); break;
    case "2 Thieves": add("Looter"); add("Mugger"); break;
    case "Chosen and Byrds": add("Byrd"); add("Chosen"); break;
    case "Sentry and Sphere": add("Sentry", { idx: 0 }); add("SphericGuardian"); break;
    case "Snake Plant": add("SnakePlant"); break;
    case "Snecko": add("Snecko"); break;
    case "Centurion and Healer": add("Centurion"); add("Healer"); break;
    case "Cultist and Chosen": add("Cultist"); add("Chosen"); break;
    case "3 Cultists": add("Cultist"); add("Cultist"); add("Cultist"); break;
    case "Shelled Parasite and Fungi": add("ShelledParasite"); add("FungiBeast"); break;
    // Act 2 Elites & Bosses
    case "Gremlin Leader": {
      const gPool = ["GremlinWarrior", "GremlinThief", "GremlinFat", "GremlinTsundere", "GremlinWizard"];
      add(rng.pick(gPool), { minion: true });
      add(rng.pick(gPool), { minion: true });
      add("GremlinLeader");
      break;
    }
    case "Slavers": add("SlaverBlue"); add("Taskmaster"); add("SlaverRed"); break;
    case "Book of Stabbing": add("BookOfStabbing"); break;
    case "BronzeAutomaton": add("BronzeAutomaton"); break;
    case "TheCollector": add("TheCollector"); break;
    case "Champ": add("Champ"); break;
    case "Masked Bandits": add("BanditPointy"); add("BanditRomeo"); add("BanditBear"); break;
    // Act 3 Weak & Strong
    case "3 Darklings": add("Darkling", { idx: 0 }); add("Darkling", { idx: 1 }); add("Darkling", { idx: 2 }); break;
    case "Orb Walker": add("OrbWalker"); break;
    case "3 Shapes": for (const s of getShapePool(rng, 3)) add(s); break;
    case "4 Shapes": for (const s of getShapePool(rng, 4)) add(s); break;
    case "Spire Growth": add("SpireGrowth"); break;
    case "Transient": add("Transient"); break;
    case "Maw": add("Maw"); break;
    case "Sphere and 2 Shapes": add("SphericGuardian"); for (const s of getShapePool(rng, 2)) add(s); break;
    case "Jaw Worm Horde": add("JawWorm", { hard: true }); add("JawWorm", { hard: true }); add("JawWorm", { hard: true }); break;
    case "Writhing Mass": add("WrithingMass"); break;
    // Act 3 Elites & Bosses
    case "Giant Head": add("GiantHead"); break;
    case "Nemesis": add("Nemesis"); break;
    case "Reptomancer": add("SnakeDagger", { minion: true }); add("Reptomancer"); add("SnakeDagger", { minion: true }); break;
    case "AwakenedOne": add("Cultist"); add("Cultist"); add("AwakenedOne"); break;
    case "TimeEater": add("TimeEater"); break;
    case "Donu and Deca": add("Deca"); add("Donu"); break;
    // Act 4 Elites & Boss
    case "Shield and Spear": add("SpireShield"); add("SpireSpear"); break;
    case "CorruptHeart":
    case "The Heart": add("CorruptHeart"); break;
    default: add("Cultist"); break;
  }
  return list;
}

function lastMove(m, mv) {
  return m.h.length > 0 && m.h[m.h.length - 1] === mv;
}
function lastTwoMoves(m, mv) {
  return m.h.length >= 2 && m.h[m.h.length - 1] === mv && m.h[m.h.length - 2] === mv;
}
function setIntent(m, mv, intent, dmg = 0, hits = 1) {
  m.mv = mv;
  m.in = intent;
  m.dmg = dmg;
  m.hits = hits;
  m.h.push(mv);
  if (m.h.length > 3) m.h.shift();
}

function rollMonsterMove(m, bt, state, rng) {
  if (m.hp <= 0 && !m.st.halfDead) return;
  const num = rng.int(0, 99);
  const f = m.st.first;
  m.st.first = false;
  switch (m.id) {
    case "Cultist":
      if (f) setIntent(m, 3, "BUFF");
      else setIntent(m, 1, "ATTACK", 6);
      break;
    case "JawWorm":
      if (f) setIntent(m, 1, "ATTACK", 11);
      else if (num < 25) {
        if (lastMove(m, 2)) setIntent(m, rng.bool(0.56) ? 3 : 1, rng.bool(0.56) ? "ATTACK_DEFEND" : "ATTACK", rng.bool(0.56) ? 7 : 11);
        else setIntent(m, 2, "DEFEND_BUFF");
      } else if (num < 55) {
        if (lastTwoMoves(m, 3)) setIntent(m, 1, "ATTACK", 11);
        else setIntent(m, 3, "ATTACK_DEFEND", 7);
      } else {
        if (lastMove(m, 1)) setIntent(m, 3, "ATTACK_DEFEND", 7);
        else setIntent(m, 1, "ATTACK", 11);
      }
      break;
    case "FuzzyLouseNormal":
      if (num < 25) {
        if (lastTwoMoves(m, 4)) setIntent(m, 3, "ATTACK", m.st.biteDmg || 6);
        else setIntent(m, 4, "BUFF");
      } else {
        if (lastTwoMoves(m, 3)) setIntent(m, 4, "BUFF");
        else setIntent(m, 3, "ATTACK", m.st.biteDmg || 6);
      }
      break;
    case "FuzzyLouseDefensive":
      if (num < 25) {
        if (lastTwoMoves(m, 4)) setIntent(m, 3, "ATTACK", m.st.biteDmg || 6);
        else setIntent(m, 4, "DEBUFF");
      } else {
        if (lastTwoMoves(m, 3)) setIntent(m, 4, "DEBUFF");
        else setIntent(m, 3, "ATTACK", m.st.biteDmg || 6);
      }
      break;
    case "AcidSlime_S":
      if (m.st.alt) { m.st.alt = false; setIntent(m, 1, "ATTACK", 3); }
      else { m.st.alt = true; setIntent(m, 2, "DEBUFF"); }
      break;
    case "AcidSlime_M":
      if (num < 30 && !lastTwoMoves(m, 1)) setIntent(m, 1, "ATTACK_DEBUFF", 7);
      else if (num < 70 && !lastTwoMoves(m, 2)) setIntent(m, 2, "ATTACK", 10);
      else if (!lastMove(m, 4)) setIntent(m, 4, "DEBUFF");
      else setIntent(m, 2, "ATTACK", 10);
      break;
    case "AcidSlime_L":
      if (m.hp <= Math.floor(m.mhp / 2)) setIntent(m, 3, "UNKNOWN");
      else if (num < 30 && !lastTwoMoves(m, 1)) setIntent(m, 1, "ATTACK_DEBUFF", 11);
      else if (num < 70 && !lastMove(m, 2)) setIntent(m, 2, "ATTACK", 16);
      else if (!lastTwoMoves(m, 4)) setIntent(m, 4, "DEBUFF");
      else setIntent(m, 2, "ATTACK", 16);
      break;
    case "SpikeSlime_S":
      setIntent(m, 1, "ATTACK", 5);
      break;
    case "SpikeSlime_M":
      if (num < 30 && !lastTwoMoves(m, 1)) setIntent(m, 1, "ATTACK_DEBUFF", 8);
      else if (!lastTwoMoves(m, 4)) setIntent(m, 4, "DEBUFF");
      else setIntent(m, 1, "ATTACK_DEBUFF", 8);
      break;
    case "SpikeSlime_L":
      if (m.hp <= Math.floor(m.mhp / 2)) setIntent(m, 3, "UNKNOWN");
      else if (num < 30 && !lastTwoMoves(m, 1)) setIntent(m, 1, "ATTACK_DEBUFF", 16);
      else if (!lastTwoMoves(m, 4)) setIntent(m, 4, "DEBUFF");
      else setIntent(m, 1, "ATTACK_DEBUFF", 16);
      break;
    case "SlaverBlue":
      if (num >= 40 && !lastTwoMoves(m, 1)) setIntent(m, 1, "ATTACK", 12);
      else if (!lastMove(m, 4)) setIntent(m, 4, "ATTACK_DEBUFF", 7);
      else setIntent(m, 1, "ATTACK", 12);
      break;
    case "SlaverRed":
      if (f) setIntent(m, 1, "ATTACK", 13);
      else if (num >= 75 && !m.st.usedNet) setIntent(m, 2, "STRONG_DEBUFF");
      else if (num >= 20 && !lastTwoMoves(m, 3)) setIntent(m, 3, "ATTACK_DEBUFF", 8);
      else setIntent(m, 1, "ATTACK", 13);
      break;
    case "Looter":
    case "Mugger":
      if (m.st.sc < 2) setIntent(m, 1, "ATTACK", 10);
      else if (m.st.sc === 2) {
        if (rng.bool(0.5)) setIntent(m, 4, "ATTACK", 12);
        else setIntent(m, 2, "DEFEND");
      } else setIntent(m, 3, "ESCAPE");
      break;
    case "FungiBeast":
      if (num < 60 && !lastTwoMoves(m, 1)) setIntent(m, 1, "ATTACK", 6);
      else if (!lastMove(m, 2)) setIntent(m, 2, "BUFF");
      else setIntent(m, 1, "ATTACK", 6);
      break;
    case "GremlinWarrior": setIntent(m, 1, "ATTACK", 4); break;
    case "GremlinThief": setIntent(m, 1, "ATTACK", 9); break;
    case "GremlinFat": setIntent(m, 2, "ATTACK_DEBUFF", 4); break;
    case "GremlinTsundere": {
      const aliveOthers = bt.m.filter(x => x !== m && x.hp > 0).length;
      if (aliveOthers > 0) setIntent(m, 1, "DEFEND");
      else setIntent(m, 2, "ATTACK", 6);
      break;
    }
    case "GremlinWizard":
      m.st.charge = (m.st.charge || 0) + 1;
      if (m.st.charge >= 3) { m.st.charge = 0; setIntent(m, 1, "ATTACK", 25); }
      else setIntent(m, 2, "UNKNOWN");

    case "GremlinNob":
      if (f) setIntent(m, 3, "BUFF");
      else if (num < 33) setIntent(m, 2, "ATTACK_DEBUFF", 6);
      else if (lastTwoMoves(m, 1)) setIntent(m, 2, "ATTACK_DEBUFF", 6);
      else setIntent(m, 1, "ATTACK", 14);
      break;
    case "Lagavulin":
      if (m.st.asleep) setIntent(m, 4, "SLEEP");
      else if (m.st.debuff >= 2) setIntent(m, 1, "DEBUFF");
      else setIntent(m, 3, "ATTACK", 18);
      break;
    case "Sentry":
      if (f) {
        if (m.st.idx % 2 === 0) setIntent(m, 3, "DEBUFF");
        else setIntent(m, 4, "ATTACK", 9);
      } else if (lastMove(m, 4)) setIntent(m, 3, "DEBUFF");
      else setIntent(m, 4, "ATTACK", 9);
      break;
    case "TheGuardian":
      if (m.st.open) {
        if (f) setIntent(m, 6, "DEFEND");
        else if (lastMove(m, 6)) setIntent(m, 2, "ATTACK", 32);
        else if (lastMove(m, 2)) setIntent(m, 7, "STRONG_DEBUFF");
        else if (lastMove(m, 7)) setIntent(m, 5, "ATTACK", 5, 4);
        else setIntent(m, 6, "DEFEND");
      } else {
        if (lastMove(m, 1)) setIntent(m, 3, "ATTACK", 9);
        else setIntent(m, 4, "ATTACK_BUFF", 8, 2);
      }
      break;
    case "Hexaghost":
      if (!m.st.activated) setIntent(m, 5, "UNKNOWN");
      else if (!m.st.divDone) {
        m.st.divDone = true;
        const d = Math.floor(state.hp / 12) + 1;
        setIntent(m, 1, "ATTACK", d, 6);
      } else {
        switch (m.st.orb) {
          case 0: case 2: case 5: setIntent(m, 4, "ATTACK_DEBUFF", 6); break;
          case 1: case 4: setIntent(m, 2, "ATTACK", 5, 2); break;
          case 3: setIntent(m, 3, "DEFEND_BUFF"); break;
          case 6: setIntent(m, 6, "ATTACK_DEBUFF", 2, 6); break;
        }
      }
      break;
    case "SlimeBoss":
      if (m.hp <= Math.floor(m.mhp / 2)) setIntent(m, 3, "UNKNOWN");
      else if (f || lastMove(m, 1)) setIntent(m, 4, "STRONG_DEBUFF");
      else if (lastMove(m, 4)) setIntent(m, 2, "UNKNOWN");
      else setIntent(m, 1, "ATTACK", 35);
      break;
    // Act 2
    case "SphericGuardian":
      if (f) setIntent(m, 2, "DEFEND");
      else if (m.st.second) { m.st.second = false; setIntent(m, 4, "ATTACK_DEBUFF", 10); }
      else if (lastMove(m, 1)) setIntent(m, 3, "ATTACK_DEFEND", 10);
      else setIntent(m, 1, "ATTACK", 10, 2);
      break;
    case "Chosen":
      if (f) setIntent(m, 5, "ATTACK", 5, 2);
      else if (!m.st.usedHex) { m.st.usedHex = true; setIntent(m, 4, "STRONG_DEBUFF"); }
      else if (!lastMove(m, 3) && !lastMove(m, 2)) {
        if (num < 50) setIntent(m, 3, "ATTACK_DEBUFF", 10);
        else setIntent(m, 2, "DEBUFF");
      } else if (num < 40) setIntent(m, 1, "ATTACK", 18);
      else setIntent(m, 5, "ATTACK", 5, 2);
      break;
    case "ShelledParasite":
      if (f) setIntent(m, rng.bool(0.5) ? 2 : 3, rng.bool(0.5) ? "ATTACK" : "ATTACK_BUFF", rng.bool(0.5) ? 6 : 10, rng.bool(0.5) ? 2 : 1);
      else if (num < 20 && !lastMove(m, 1)) setIntent(m, 1, "ATTACK_DEBUFF", 18);
      else if (num < 60 && !lastTwoMoves(m, 2)) setIntent(m, 2, "ATTACK", 6, 2);
      else setIntent(m, 3, "ATTACK_BUFF", 10);
      break;
    case "Byrd":
      if (!m.st.air) setIntent(m, 5, "ATTACK", 3);
      else if (f) setIntent(m, rng.bool(0.625) ? 1 : 6, rng.bool(0.625) ? "ATTACK" : "BUFF", rng.bool(0.625) ? 1 : 0, rng.bool(0.625) ? 5 : 1);
      else if (num < 50 && !lastTwoMoves(m, 1)) setIntent(m, 1, "ATTACK", 1, 5);
      else if (num < 70 && !lastMove(m, 3)) setIntent(m, 3, "ATTACK", 12);
      else if (!lastMove(m, 6)) setIntent(m, 6, "BUFF");
      else setIntent(m, 1, "ATTACK", 1, 5);

    case "SnakePlant":
      if (num < 65 && !lastTwoMoves(m, 1)) setIntent(m, 1, "ATTACK", 7, 3);

      else setIntent(m, 1, "ATTACK", 7, 3);
      break;
    case "Snecko":
      if (f) setIntent(m, 1, "STRONG_DEBUFF");
      else if (num < 40 || lastTwoMoves(m, 2)) setIntent(m, 3, "ATTACK_DEBUFF", 8);
      else setIntent(m, 2, "ATTACK", 15);
      break;
    case "Centurion": {
      const aliveAllies = bt.m.filter(x => x !== m && x.hp > 0).length;
      if (num >= 65 && !lastTwoMoves(m, 2) && !lastTwoMoves(m, 3)) {
        if (aliveAllies > 0) setIntent(m, 2, "DEFEND");
        else setIntent(m, 3, "ATTACK", 6, 3);
      } else if (!lastTwoMoves(m, 1)) setIntent(m, 1, "ATTACK", 12);
      else setIntent(m, aliveAllies > 0 ? 2 : 3, aliveAllies > 0 ? "DEFEND" : "ATTACK", aliveAllies > 0 ? 0 : 6, aliveAllies > 0 ? 1 : 3);
      break;
    }
    case "Healer": {
      let needHeal = 0;
      for (const a of bt.m) { if (a.hp > 0 && a.mhp - a.hp > 15) needHeal++; }
      if (needHeal > 0 && !lastTwoMoves(m, 2)) setIntent(m, 2, "BUFF");
      else if (num >= 40 && !lastMove(m, 1)) setIntent(m, 1, "ATTACK_DEBUFF", 8);
      else if (!lastTwoMoves(m, 3)) setIntent(m, 3, "BUFF");
      else setIntent(m, 1, "ATTACK_DEBUFF", 8);
      break;
    }
    case "GremlinLeader": {
      const minions = bt.m.filter(x => x !== m && x.hp > 0).length;
      if (minions === 0) {
        if (num < 75 && !lastMove(m, 2)) setIntent(m, 2, "UNKNOWN");
        else setIntent(m, 4, "ATTACK", 6, 3);
      } else if (minions === 1) {
        if (num < 50 && !lastMove(m, 2)) setIntent(m, 2, "UNKNOWN");
        else if (num < 80 && !lastMove(m, 3)) setIntent(m, 3, "DEFEND_BUFF");
        else setIntent(m, 4, "ATTACK", 6, 3);
      } else {
        if (num < 66 && !lastMove(m, 3)) setIntent(m, 3, "DEFEND_BUFF");
        else setIntent(m, 4, "ATTACK", 6, 3);
      }
      break;
    }
    case "Taskmaster": setIntent(m, 2, "ATTACK_DEBUFF", 7); break;
    case "BookOfStabbing":
      if (num < 15 && !lastMove(m, 2)) setIntent(m, 2, "ATTACK", 21);
      else { m.st.stab = (m.st.stab || 1) + 1; setIntent(m, 1, "ATTACK", 6, m.st.stab); }

    case "BronzeAutomaton":
      if (f) setIntent(m, 4, "UNKNOWN");
      else if (m.st.turns === 4) { m.st.turns = 0; setIntent(m, 2, "ATTACK", 45); }
      else if (lastMove(m, 2)) setIntent(m, 3, "STUN");
      else if (lastMove(m, 5) || lastMove(m, 3) || lastMove(m, 4)) setIntent(m, 1, "ATTACK", 7, 2);
      else setIntent(m, 5, "DEFEND_BUFF");
      break;
    case "BronzeOrb":
      if (!m.st.stasis && (bt.dr.length > 0 || bt.di.length > 0) && (f || num < 75)) {
        setIntent(m, 3, "STRONG_DEBUFF");

        setIntent(m, 1, "ATTACK", 8);
      } else {
        setIntent(m, 2, "DEFEND");

      break;

      if (f) setIntent(m, 1, "UNKNOWN");

      else if (num <= 70 && !lastTwoMoves(m, 2)) setIntent(m, 2, "ATTACK", 18);
      else if (!lastMove(m, 3)) setIntent(m, 3, "DEFEND_BUFF");

    case "TorchHead": setIntent(m, 1, "ATTACK", 7); break;
    case "Champ":
      m.st.turns = (m.st.turns || 0) + 1;
      if (m.hp < Math.floor(m.mhp / 2) && !m.st.p2) {
        m.st.p2 = true;
        setIntent(m, 7, "BUFF");
      } else if (m.st.p2 && !lastMove(m, 3) && !lastMove(m, 7) && m.st.turns % 2 === 0) {
        setIntent(m, 3, "ATTACK", 10, 2);
      } else if (m.st.turns === 4 && !m.st.p2) {
        m.st.turns = 0;
        setIntent(m, 6, "DEBUFF");
      } else if (num <= 15 && !lastMove(m, 2) && m.st.forge < 2) {
        m.st.forge++;
        setIntent(m, 2, "DEFEND_BUFF");
      } else if (num <= 30 && !lastMove(m, 5)) {
        setIntent(m, 5, "BUFF");
      } else if (num <= 55 && !lastMove(m, 4)) {
        setIntent(m, 4, "ATTACK_DEBUFF", 12);
      } else {
        setIntent(m, 1, "ATTACK", 16);
      }
      break;
    // Act 3
    case "Darkling":
      if (m.st.halfDead) setIntent(m, 5, "BUFF");
      else if (f) {
        if (num < 50) setIntent(m, 2, "DEFEND");
        else setIntent(m, 3, "ATTACK", m.st.nip || 9);
      } else if (num < 40 && !lastMove(m, 1) && m.st.idx % 2 === 0) setIntent(m, 1, "ATTACK", 8, 2);
      else if (num < 70 && !lastMove(m, 2)) setIntent(m, 2, "DEFEND");
      else setIntent(m, 3, "ATTACK", m.st.nip || 9);
      break;
    case "OrbWalker":
      if (num < 40 && !lastTwoMoves(m, 2)) setIntent(m, 2, "ATTACK", 15);
      else if (!lastTwoMoves(m, 1)) setIntent(m, 1, "ATTACK_DEBUFF", 10);
      else setIntent(m, 2, "ATTACK", 15);
      break;
    case "Repulsor":
      if (num < 20 && !lastMove(m, 2)) setIntent(m, 2, "ATTACK", 11);
      else setIntent(m, 1, "DEBUFF");
      break;
    case "Exploder":
      if ((m.st.tc || 0) < 2) setIntent(m, 1, "ATTACK", 9);
      else setIntent(m, 2, "UNKNOWN");
      break;
    case "Spiker":
      if ((m.st.tc || 0) > 5 || (num < 50 && !lastMove(m, 1))) setIntent(m, 1, "ATTACK", 7);
      else setIntent(m, 2, "BUFF");
      break;
    case "SpireGrowth":
      if (num < 50 && !lastTwoMoves(m, 1)) setIntent(m, 1, "ATTACK", 16);
      else if (!bt.pw.Constricted && !lastMove(m, 2)) setIntent(m, 2, "STRONG_DEBUFF");
      else if (!lastTwoMoves(m, 3)) setIntent(m, 3, "ATTACK", 22);
      else setIntent(m, 1, "ATTACK", 16);
      break;
    case "Transient":
      setIntent(m, 1, "ATTACK", 30 + (m.st.cnt || 0) * 10);
      break;
    case "Maw":
      m.st.tc = (m.st.tc || 1) + 1;
      if (!m.st.roared) setIntent(m, 2, "STRONG_DEBUFF");
      else if (num < 50 && !lastMove(m, 5)) {
        const hits = Math.max(1, Math.floor(m.st.tc / 2));
        setIntent(m, 5, "ATTACK", 5, hits);
      } else if (lastMove(m, 3) || lastMove(m, 5)) setIntent(m, 4, "BUFF");
      else setIntent(m, 3, "ATTACK", 25);
      break;
    case "WrithingMass":
      if (f) {
        if (num < 33) setIntent(m, 1, "ATTACK", 7, 3);

        else setIntent(m, 3, "ATTACK_DEBUFF", 10);
      } else if (num < 10 && !lastMove(m, 0)) setIntent(m, 0, "ATTACK", 32);
      else if (num < 20 && !m.st.mega && !lastMove(m, 4)) setIntent(m, 4, "STRONG_DEBUFF");
      else if (num < 40 && !lastMove(m, 3)) setIntent(m, 3, "ATTACK_DEBUFF", 10);

      else setIntent(m, 2, "ATTACK_DEFEND", 15);

        if (m.st.cnt > -6) m.st.cnt--;

        if (num < 50 && !lastTwoMoves(m, 1)) setIntent(m, 1, "DEBUFF");

    case "Nemesis":

        setIntent(m, 3, "ATTACK", 45);

        setIntent(m, 2, "ATTACK", 6, 3);

      } else {

      }
      break;
    case "Reptomancer": {
      const daggers = bt.m.filter(x => x.id === "SnakeDagger" && x.hp > 0).length;
      if (f) setIntent(m, 2, "UNKNOWN");
      else if (num < 33 && !lastMove(m, 1)) setIntent(m, 1, "ATTACK_DEBUFF", 13, 2);
      else if (num < 66 && !lastTwoMoves(m, 2) && daggers < 3) setIntent(m, 2, "UNKNOWN");

      else setIntent(m, 1, "ATTACK_DEBUFF", 13, 2);

    }
    case "SnakeDagger":
      if (f) setIntent(m, 1, "ATTACK_DEBUFF", 9);
      else setIntent(m, 2, "ATTACK", 25);
      break;
    case "AwakenedOne":
      if (m.st.halfDead) {
        setIntent(m, 3, "UNKNOWN");

        else if (num < 25 && !lastMove(m, 2)) setIntent(m, 2, "ATTACK", 6, 4);
        else if (!lastTwoMoves(m, 1)) setIntent(m, 1, "ATTACK", 20);
        else setIntent(m, 2, "ATTACK", 6, 4);

        else if (num < 50 && !lastTwoMoves(m, 6)) setIntent(m, 6, "ATTACK_DEBUFF", 18);
        else setIntent(m, 8, "ATTACK", 10, 3);

    case "TimeEater":
      if (m.hp < Math.floor(m.mhp / 2) && !m.st.haste) {
        m.st.haste = true;
        setIntent(m, 5, "BUFF");
      } else if (num < 45 && !lastTwoMoves(m, 2)) setIntent(m, 2, "ATTACK", 7, 3);
      else if (num < 80 && !lastMove(m, 4)) setIntent(m, 4, "ATTACK_DEBUFF", 26);
      else if (!lastMove(m, 3)) setIntent(m, 3, "DEFEND_DEBUFF");
      else setIntent(m, 2, "ATTACK", 7, 3);
      break;
    case "Deca":
      if (m.st.atk) setIntent(m, 0, "ATTACK_DEBUFF", 10, 2);
      else setIntent(m, 2, "DEFEND");
      break;
    case "Donu":
      if (m.st.atk) setIntent(m, 0, "ATTACK", 10, 2);
      else setIntent(m, 2, "BUFF");
      break;
    case "BanditPointy": setIntent(m, 1, "ATTACK", 5, 2); break;
    case "BanditRomeo":
      if (f) setIntent(m, 2, "UNKNOWN");
      else if (!lastMove(m, 3)) setIntent(m, 3, "ATTACK_DEBUFF", 10);
      else setIntent(m, 1, "ATTACK", 15);
      break;
    case "BanditBear":
      if (f) setIntent(m, 2, "DEBUFF");
      else if (!lastMove(m, 3)) setIntent(m, 3, "ATTACK_DEFEND", 9);
      else setIntent(m, 1, "ATTACK", 18);
      break;
    // Act 4: Spire Shield, Spire Spear & Corrupt Heart
    case "SpireShield": {
      const cyc = (m.st.tc || 0) % 3;
      m.st.tc = (m.st.tc || 0) + 1;
      if (cyc === 0) {
        if (num < 50) setIntent(m, 2, "DEFEND");
        else setIntent(m, 1, "ATTACK_DEBUFF", 12);
      } else if (cyc === 1) {
        if (!lastMove(m, 1)) setIntent(m, 1, "ATTACK_DEBUFF", 12);
        else setIntent(m, 2, "DEFEND");
      } else {
        setIntent(m, 3, "ATTACK_DEFEND", 34);
      }
      break;
    }
    case "SpireSpear": {
      const cyc = (m.st.tc || 0) % 3;
      m.st.tc = (m.st.tc || 0) + 1;
      if (cyc === 0) {
        if (f || num < 50) setIntent(m, 1, "ATTACK_DEBUFF", 5, 2);
        else setIntent(m, 2, "BUFF");
      } else if (cyc === 1) {
        setIntent(m, 3, "ATTACK", 10, 3);
      } else {
        if (!lastMove(m, 2)) setIntent(m, 2, "BUFF");
        else setIntent(m, 1, "ATTACK_DEBUFF", 5, 2);
      }
      break;
    }
    case "CorruptHeart":
      if (f) {
        setIntent(m, 3, "STRONG_DEBUFF");
      } else {
        const cyc = (m.st.tc || 0) % 3;
        m.st.tc = (m.st.tc || 0) + 1;
        if (cyc === 0) {
          if (num < 50) setIntent(m, 1, "ATTACK", 2, 12);
          else setIntent(m, 2, "ATTACK", 40);
        } else if (cyc === 1) {
          if (!lastMove(m, 2)) setIntent(m, 2, "ATTACK", 40);
          else setIntent(m, 1, "ATTACK", 2, 12);
        } else {
          setIntent(m, 4, "BUFF");
        }
      }
      break;
    default:
      setIntent(m, 1, "ATTACK", 8);
  }
}


// ==================== 8. Combat Helpers & Power/Damage Logic ====================
function hasRelic(state, id) {
  return state.rel && state.rel.indexOf(id) !== -1;
}

function addLog(state, msg) {
  if (!state.lg) state.lg = [];
  state.lg.push(msg);
  if (state.lg.length > 3) state.lg.shift();
}

function syncRedSkull(state) {
  if (!state.bt || !hasRelic(state, "Red Skull")) return;
  const bt = state.bt;
  const low = state.hp > 0 && state.hp <= Math.floor(state.mhp / 2);
  if (low && !bt.rsOn) {
    bt.rsOn = true;
    bt.pw.Strength = (bt.pw.Strength || 0) + 3;
    if (bt.pw.Strength === 0) delete bt.pw.Strength;
  } else if (!low && bt.rsOn) {
    bt.rsOn = false;
    bt.pw.Strength = (bt.pw.Strength || 0) - 3;
    if (bt.pw.Strength === 0) delete bt.pw.Strength;
  }
}

function healPlayer(state, amt, inCombat) {
  if (amt <= 0 || hasRelic(state, "Mark of the Bloom")) return 0;
  let v = amt;
  if (inCombat && hasRelic(state, "Magic Flower")) v = Math.round(v * 1.5);
  const before = state.hp;
  state.hp = Math.min(state.mhp, state.hp + v);
