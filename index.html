function getOriginalMonsterOffset(st, bt, m, idx) {
  if (m && typeof m.ox === "number" && typeof m.oy === "number") {
    return [m.ox, m.oy];
  }
  const enc = (bt && bt.enc) || "";
  const list = (bt && bt.m) || [];
  const total = list.length;

  // 1. Dynamic Summon / Split Encounters from desktop-1.0.jar
  if (enc === "Large Slime" && total === 2) {
    // AcidSlime_L / SpikeSlime_L split into (-134, 0) and (134, 0)
    return idx === 0 ? [-134, 0] : [134, 0];
  }
  if (enc === "Exordium Wildlife" && total === 3) {
    if (idx === 0) return [-150, 20];
    return idx === 1 ? [36, 24] : [254, 16];
  }
  if (enc === "SlimeBoss") {
    if (m.id === "SlimeBoss") return [0, 28];
    if (m.id === "SpikeSlime_L") return [-385, 20];
    if (m.id === "AcidSlime_L") return [120, -8];
    if (m.id === "SpikeSlime_M") {
      const spkList = list.filter(x => x.id === "SpikeSlime_M");
      return spkList.indexOf(m) === 0 ? [-519, 24] : [-251, 16];
    }
    if (m.id === "AcidSlime_M") {
      const acdList = list.filter(x => x.id === "AcidSlime_M");
      return acdList.indexOf(m) === 0 ? [-14, -4] : [254, -12];
    }
  }
  if (enc === "Gremlin Leader") {
    if (m.id === "GremlinLeader") return [35, 0];
    // GremlinLeader.POSX = [-366, -170, -532], POSY = [-4, 6, 0]
    const slots = [[-366, -4], [-170, 6], [-532, 0]];
    const aliveMinions = list.filter(x => x.id !== "GremlinLeader" && x.hp > 0);
    const sIdx = Math.max(0, aliveMinions.indexOf(m)) % 3;
    const base = slots[sIdx];
    return [base[0] + (m.id === "GremlinWizard" ? -35 : 0), base[1]];
  }
  if (enc === "BronzeAutomaton") {
    if (m.id === "BronzeAutomaton") return [-50, 20];
    const autoIdx = list.findIndex(x => x.id === "BronzeAutomaton");
    // Left orb (-300, 200), Right orb (200, 130)
    return (autoIdx === -1 || idx < autoIdx) ? [-300, 200] : [200, 130];
  }
  if (enc === "TheCollector") {
    if (m.id === "TheCollector") return [60, 10];
    // TheCollector TorchHead slots: spawnX = -100 + i * -185 -> (-285, 10), (-470, 15)
    const aliveTorches = list.filter(x => x.id === "TorchHead" && x.hp > 0);
    const sIdx = Math.max(0, aliveTorches.indexOf(m));
    return sIdx === 0 ? [-285, 10] : [-470, 15];
  }
  if (enc === "Reptomancer") {
    if (m.id === "Reptomancer") return [-20, 10];
    // Reptomancer.POSX = [-220, 210, -250, 180], POSY = [115, 75, 225, 235]
    const daggerSlots = [[-220, 115], [210, 75], [-250, 225], [180, 235]];
    const aliveDaggers = list.filter(x => x.id === "SnakeDagger" && x.hp > 0);
    const sIdx = Math.max(0, aliveDaggers.indexOf(m)) % 4;
    return daggerSlots[sIdx];
  }

  // 2. Standard Encounter Table Lookup
  const table = STS_ENCOUNTER_OFFSETS[enc];
  if (table && table[idx]) {
    let [ox, oy] = table[idx];
    if (enc === "Gremlin Gang" && m && m.id === "GremlinWizard") {
      ox -= 35; // GremlinWizard.<init> subtracts 35 from x
    }
    return [ox, oy];
  }

  // 3. Fallback for custom/synthetic multi-monster test states
  if (total === 1) return [0, 0];
  const span = Math.min(640, (total - 1) * 210);
  const startX = -span * 0.62;
  const stepX = span / Math.max(1, total - 1);
  return [Math.round(startX + idx * stepX), (idx % 2 === 0 ? 10 : 25)];
}

function getMonsterStageCssVars(st, bt, m, idx) {
  const [ox, oy] = getOriginalMonsterOffset(st, bt, m, idx);
  const isPhone = typeof window !== "undefined" && window.innerWidth <= 620;
  // Monster drawX = 1920 * 0.75 + ox = 1440 + ox -> percentage of 1920
  let leftPct = ((1440 + ox) / 1920) * 100;
  if (isPhone) {
    // Compress slightly on narrow 360px screens so wide 4-5 enemy groups stay inside viewport
    leftPct = 66 + ((leftPct - 75) * 0.72);
    leftPct = Math.max(38, Math.min(89, leftPct));
  }
  const offYPct = (oy / 1080) * 100;
  const zIdx = Math.max(6, Math.min(38, Math.round(22 - oy * 0.08)));
  return {
    leftPct: leftPct.toFixed(2) + "%",
    offYPct: offYPct.toFixed(2) + "%",
    zIdx,
  };
}

function combatBgStyle(actSceneKey) {

  const SW = bgs.sheetW || 1000;
  const SH = bgs.sheetH || 3664;
  const sx = ((SW / p.w) * 100).toFixed(3) + "%";
  const sy = ((SH / p.h) * 100).toFixed(3) + "%";
  const px = p.w < SW ? ((p.x / (SW - p.w)) * 100).toFixed(3) + "%" : "0%";
  const py = p.h < SH ? ((p.y / (SH - p.h)) * 100).toFixed(3) + "%" : "0%";
  return "background-image:url(assets/events.webp);background-repeat:no-repeat;background-size:" + sx + " " + sy + ";background-position:" + px + " " + py + ";";
}

function formatPowerDesc(k, val, extraCtx) {
  const meta = POWERS_META[k] || { name: k, icon: "✨", desc: "" };
  const isDebuff = Boolean(meta.debuff || ((k === "Strength" || k === "Dexterity" || k === "Focus") && val < 0));
  let desc = meta.desc || "";
  if (k === "Strength" && val < 0) {
    desc = "攻击伤害减少 " + Math.abs(val) + " 点。";
  } else if (k === "Dexterity" && val < 0) {
    desc = "从卡牌获得的格挡减少 " + Math.abs(val) + " 点。";
  } else if (k === "Focus" && val < 0) {
    desc = "充能球的效果减少 " + Math.abs(val) + " 点。";
  } else if (k === "TheBomb") {
    desc = "在 " + val + " 回合后，对所有敌人造成 " + ((extraCtx && extraCtx.bombDmg) || 40) + " 点伤害。";
  } else if (k === "Stasis" && extraCtx && extraCtx.st && extraCtx.st.stasisCard) {
    desc = "死亡时，将【" + getCardDef(extraCtx.st.stasisCard).name + "】归还至你的手牌。";
  } else {
    desc = desc.replace(/!A!/g, String(Math.abs(val)));
  }
  return { name: meta.name || k, icon: meta.icon || "✨", desc, isDebuff };
}

function renderPowerChipsHtml(pwObj, extraCtx) {
  return Object.keys(pwObj || {}).map(k => {
    const val = pwObj[k];
    if (!val && k !== "Slow" && k !== "TimeWarp" && k !== "Invincible") return "";
    const info = formatPowerDesc(k, val, extraCtx);
    const escTip = (info.name + "：" + info.desc).replace(/"/g, "&quot;");
    return '<span class="pw-chip ' + (info.isDebuff ? "debuff" : "") + '" data-pw-key="' + k + '" data-pw-val="' + val + '" data-pw-name="' + info.name + '" data-pw-desc="' + info.desc.replace(/"/g, "&quot;") + '" data-pw-debuff="' + (info.isDebuff ? "1" : "0") + '" title="' + escTip + '">' +
      spIcon("powers", k, 20, info.icon) + '<span class="pw-num">' + val + '</span></span>';
  }).join("");
}

function spCardFramePos(def) {
  const frames = SPRITE_MANIFEST.cardFrames || {};
  let key = "attack_common";
  if (def.type === "ST" || def.type === "C") {
    key = "status_curse";
  } else if (
    def.color === "CL" ||
    (typeof COLORLESS_CARDS !== "undefined" && COLORLESS_CARDS.indexOf(def.id) !== -1) ||
    def.rarity === "SP"
  ) {
    key = def.rarity === "R" ? "colorless_rare" : "colorless_uncommon";
  } else {
    const tKey = def.type === "A" ? "attack" : (def.type === "P" ? "power" : "skill");
    const rKey = def.rarity === "R" ? "rare" : (def.rarity === "U" ? "uncommon" : "common");
    const colSuffix = (def.color === "G" || def.color === "B" || def.color === "P") ? ("_" + def.color) : "";
    key = tKey + "_" + rKey + colSuffix;
  }
  const idx = frames[key] !== undefined ? frames[key] : 0;
  const col = idx % 6;
  const fy = idx < 12 ? Math.floor(idx / 6) * 222 : 1620 + Math.floor((idx - 12) / 6) * 222;
  const SH = (SPRITE_MANIFEST.uiPanels && SPRITE_MANIFEST.uiPanels.sheetH) || 2900;
  const py = (fy / (SH - 222)) * 100;
  return ((col / 5) * 100).toFixed(2) + '% ' + py.toFixed(3) + '%';
}

let currentData = null;
let selectedTargetIdx = 0;
let activeCardIdx = null;   // Currently selected/aimed hand card index
let activePotionIdx = null; // Currently selected/aimed potion slot index
let hoveredEnemyIdx = null; // Enemy index currently under pointer
let mapOverlayOpen = false; // Toggleable map view from top bar
let dragState = null;       // { cIdx, def, startX, startY, moved }
let lastPointerPos = { x: 0, y: 0 };
let modalState = null;      // { title, cards, onPick }

function clearTargeting(shouldRender = true) {
  activeCardIdx = null;
  activePotionIdx = null;
  hoveredEnemyIdx = null;
  dragState = null;
  const svg = document.getElementById("sts-target-svg");
  if (svg) svg.innerHTML = "";
  if (shouldRender) renderApp();
}

function drawTargetingCurve(x1, y1, x2, y2, isLocked) {
  const svg = document.getElementById("sts-target-svg");
  if (!svg) return;
  const dx = x2 - x1;
  const dy = y2 - y1;
  const cx = (x1 + x2) * 0.5;
  const cy = Math.min(y1, y2) - Math.max(55, Math.min(150, Math.abs(dx) * 0.28 + Math.abs(dy) * 0.15));

  const mainCol = isLocked ? "#f5c451" : "#ef4444";
  const glowCol = isLocked ? "rgba(245,196,81,0.55)" : "rgba(239,68,68,0.45)";
  let html = '<path d="M ' + x1 + ' ' + y1 + ' Q ' + cx + ' ' + cy + ' ' + x2 + ' ' + y2 + '" fill="none" stroke="' + glowCol + '" stroke-width="10" stroke-linecap="round"/>';

  const N = 14;
  for (let i = 1; i < N; i++) {
    const t = i / N;
    const omt = 1 - t;
    const px = omt * omt * x1 + 2 * omt * t * cx + t * t * x2;
    const py = omt * omt * y1 + 2 * omt * t * cy + t * t * y2;
    const r = 3.2 + t * 2.6;
    html += '<circle cx="' + px.toFixed(1) + '" cy="' + py.toFixed(1) + '" r="' + r.toFixed(1) + '" fill="' + mainCol + '" stroke="#000" stroke-width="1.2"/>';
  }

  // Tangent at t=1 is (x2 - cx, y2 - cy)
  const ang = Math.atan2(y2 - cy, x2 - cx) * (180 / Math.PI);
  html +=
    '<g transform="translate(' + x2.toFixed(1) + ',' + y2.toFixed(1) + ') rotate(' + ang.toFixed(1) + ')">' +
      '<polygon points="6,0 -14,-10 -9,0 -14,10" fill="' + mainCol + '" stroke="#000" stroke-width="1.6"/>' +
      '<circle cx="0" cy="0" r="16" fill="none" stroke="' + mainCol + '" stroke-width="2" stroke-dasharray="4,3"/>' +
    '</g>';
  svg.innerHTML = html;
}

function updateLiveTargetingArrow(clientX, clientY) {
  const svg = document.getElementById("sts-target-svg");
  if (!svg) return;
  if (activeCardIdx === null && activePotionIdx === null) {
    svg.innerHTML = "";
    return;
  }

  let startEl = null;
  if (activeCardIdx !== null) {
    startEl = document.querySelector('.hand-tray .sts-card[data-hand-idx="' + activeCardIdx + '"]');
  } else if (activePotionIdx !== null) {
    startEl = document.querySelector('.potion-icon-btn[data-pot-idx="' + activePotionIdx + '"]');
  }
  if (!startEl) {
    svg.innerHTML = "";
    return;
  }

  const sRect = startEl.getBoundingClientRect();
  const x1 = sRect.left + sRect.width / 2;
  const y1 = activeCardIdx !== null ? (sRect.top + 14) : (sRect.bottom - 4);

  let x2 = clientX;
  let y2 = clientY;
  let locked = false;

  // Check if pointer is over a living enemy or snap to hoveredEnemyIdx
  const elUnder = (clientX > 0 && clientY > 0) ? document.elementFromPoint(clientX, clientY) : null;
  const enemyUnit = elUnder && elUnder.closest ? elUnder.closest('.sts-unit.enemy-unit:not(.dead)') : null;
  let hitIdx = enemyUnit ? Number(enemyUnit.getAttribute("data-enemy-idx")) : null;

  document.querySelectorAll('.sts-unit.enemy-unit').forEach(u => {
    const idx = Number(u.getAttribute("data-enemy-idx"));
    u.classList.toggle("target-locked", idx === hitIdx);
  });

  if (hitIdx !== null && !Number.isNaN(hitIdx)) {
    hoveredEnemyIdx = hitIdx;
    locked = true;
    const boxEl = enemyUnit.querySelector(".sprite-stage-box") || enemyUnit;
    const eRect = boxEl.getBoundingClientRect();
    x2 = eRect.left + eRect.width / 2;
    y2 = eRect.top + eRect.height * 0.52;
  } else if ( !(clientX > 0 && clientY > 0) ) {
    const defEnemy = document.querySelector('.sts-unit.enemy-unit[data-enemy-idx="' + selectedTargetIdx + '"]');
    if (defEnemy) {
      const boxEl = defEnemy.querySelector(".sprite-stage-box") || defEnemy;
      const eRect = boxEl.getBoundingClientRect();
      x2 = eRect.left + eRect.width / 2;
      y2 = eRect.top + eRect.height * 0.52;
      locked = true;
    }
  } else {
    hoveredEnemyIdx = null;
  }

  drawTargetingCurve(x1, y1, x2, y2, locked);
}

window.addEventListener("pointermove", (e) => {
  lastPointerPos = { x: e.clientX, y: e.clientY };
  if (dragState && !dragState.moved) {
    const dist = Math.hypot(e.clientX - dragState.startX, e.clientY - dragState.startY);
    if (dist > 10) {
      dragState.moved = true;
      if (activeCardIdx !== dragState.cIdx) {
        activeCardIdx = dragState.cIdx;
        activePotionIdx = null;
        renderApp();
      }
    }
  }
  if (activeCardIdx !== null || activePotionIdx !== null) {
    updateLiveTargetingArrow(e.clientX, e.clientY);
  }
  const tipEl = document.getElementById("sts-power-tip");
  if (tipEl) {
    const chip = e.target && e.target.closest ? e.target.closest(".pw-chip") : null;
    if (chip) {
      const k = chip.getAttribute("data-pw-key") || "";
      const name = chip.getAttribute("data-pw-name") || k;
      const val = chip.getAttribute("data-pw-val") || "";
      const desc = chip.getAttribute("data-pw-desc") || "";
      const isDeb = chip.getAttribute("data-pw-debuff") === "1";
      tipEl.className = "sts-power-tip" + (isDeb ? " debuff" : "");
      tipEl.innerHTML =
        '<div class="sts-power-tip-head">' +
          '<span style="display:inline-flex;align-items:center;gap:5px">' + spIcon("powers", k, 18, "✨") + name + ' (' + val + ')</span>' +
          '<span class="sts-power-tip-tag">' + (isDeb ? "负面状态" : "增益能力") + '</span>' +
        '</div>' +
        '<div>' + desc + '</div>';
      tipEl.style.display = "block";
      const rect = chip.getBoundingClientRect();
      const tx = Math.max(8, Math.min(window.innerWidth - 248, rect.left + rect.width / 2 - 110));
      const ty = rect.top > 90 ? (rect.top - tipEl.offsetHeight - 8) : (rect.bottom + 8);
      tipEl.style.left = tx + "px";
      tipEl.style.top = Math.max(8, ty) + "px";
    } else {
      tipEl.style.display = "none";
    }
  }
});

window.addEventListener("pointerup", (e) => {
  if (!dragState) return;
  const ds = dragState;
  dragState = null;
  if (!ds.moved) return; // Was a simple click; handled by click listener

  const elUnder = document.elementFromPoint(e.clientX, e.clientY);
  if (ds.def.target === "E") {
    const enemyUnit = elUnder && elUnder.closest ? elUnder.closest('.sts-unit.enemy-unit:not(.dead)') : null;
    if (enemyUnit) {
      const eIdx = Number(enemyUnit.getAttribute("data-enemy-idx"));
      selectedTargetIdx = eIdx;
      clearTargeting(false);
      sendAction({ type: "play_card", cardIdx: ds.cIdx, targetIdx: eIdx });
      return;
    }
  } else {
    const inArena = elUnder && elUnder.closest ? elUnder.closest('.arena-stage') : null;
    if (inArena || (ds.startY - e.clientY > 55)) {
      clearTargeting(false);
      sendAction({ type: "play_card", cardIdx: ds.cIdx, targetIdx: selectedTargetIdx });
      return;
    }
  }
});

let pendingActionsQueue = [];
let inFlightBatch = [];
let isFlushingBatch = false;
let needsServerFlush = false;
let charSelectConfirmed = false;
let selectedCharId = "IRONCLAD";
let legacyJudgeMode = false;

function persistSessionState() {
  try {
    sessionStorage.setItem("sts_hb_standalone", JSON.stringify({
      localPlayerState,
      localPending,
      currentData,
      pendingActionsQueue: inFlightBatch.concat(pendingActionsQueue),
      charSelectConfirmed,
      selectedCharId,
      legacyJudgeMode,
    }));
  } catch {}
}

function runLocalJudge(payload, skipRender = false) {
  const baseState = localPlayerState || currentData || createInitialState("sts-spire-seed-" + Date.now());
  const maxR = (currentData && currentData.mr) || 1000;
  const res = judge({
    input: typeof payload === "string" ? payload : JSON.stringify(payload),
    params: { maxReward: maxR, retainPercent: 50 },
    user: { id: 10001, username: "尖塔行者" },
    player: {
      pending: localPending,
      state: baseState,
    },
  });
  if (res && res.player && res.player.view && res.player.view.data) {
    localPlayerState = res.player.state;
    localPending = Math.max(0, localPending + (res.add || 0));
    currentData = res.player.view.data;
    persistSessionState();
    if (!skipRender) renderApp();
  }
}

function resetLocalRun(charId) {
  if (isFlushingBatch || inFlightBatch.length > 0 || pendingActionsQueue.length > 0) {
    flushPendingActions();
    return;
  }
  const ch = charId || selectedCharId || (currentData && currentData.ch) || "IRONCLAD";
  selectedCharId = ch;
  const maxR = (currentData && currentData.mr) || 1000;
  const fresh = createInitialState("sts-spire-seed-" + Date.now() + "-" + Math.floor(Math.random() * 100000), ch);
  localPlayerState = fresh;
  localPending = 0;
  inFlightBatch = [];
  pendingActionsQueue = [];
  needsServerFlush = false;
  charSelectConfirmed = false;
  currentData = Object.assign({}, fresh, { mr: maxR, pd: 0 });
  persistSessionState();
  renderApp();
}

const CODE_BY_CHAR = { IRONCLAD: "I", THE_SILENT: "S", DEFECT: "D", WATCHER: "W" };
function encodeCompactAction(a) {
  if (!a || typeof a !== "object") return "";
  const t = a.type;
  if (t === "end_turn") return "E";
  if (t === "play_card") {
    const ci = a.cardIdx ?? a.index ?? 0;
    const ti = a.targetIdx ?? 0;
    return ti ? ("P" + ci + "," + ti) : ("P" + ci);
  }
  if (t === "choose_node") return "M" + (a.x ?? a.col ?? 0) + "," + (a.y ?? a.row ?? 0);
  if (t === "neow_blessing") {
    const ch = a.char || selectedCharId || (localPlayerState && localPlayerState.ch) || "IRONCLAD";
    const chCode = CODE_BY_CHAR[ch] || ch || "I";
    return "N" + (a.choiceIdx ?? a.index ?? 0) + "," + (a.cardIdx ?? 0) + "," + chCode;
  }
  if (t === "select_char") return "C" + (CODE_BY_CHAR[a.char || a.charId || selectedCharId] || "I");
  if (t === "use_potion") return "U" + (a.potIdx ?? a.index ?? 0) + "," + (a.targetIdx ?? 0);
  if (t === "discard_potion") return "D" + (a.potIdx ?? a.index ?? 0);
  if (t === "event_choice") {
    const ci = a.choiceIdx ?? a.index ?? 0;
    const cdi = a.cardIdx ?? 0;
    return cdi ? ("V" + ci + "," + cdi) : ("V" + ci);
  }
  if (t === "claim_reward_gold") return "RG";
  if (t === "claim_reward_potion") return "RP";
  if (t === "claim_reward_relic") return "RR" + (a.index ?? 0);
  if (t === "claim_reward_key") return "RK" + (a.key || "b");
  if (t === "pick_reward_card") return "RC" + (a.index ?? a.cardIdx ?? 0);
  if (t === "skip_reward_card") return "RS";
  if (t === "proceed_from_reward") return "RN";
  if (t === "pick_boss_relic") return "BP" + (a.index ?? 0);
  if (t === "skip_boss_relic") return "BS";
  if (t === "shop_buy_card") return "SC" + (a.index ?? 0);
  if (t === "shop_buy_relic") return "SR" + (a.index ?? 0);
  if (t === "shop_buy_potion") return "SP" + (a.index ?? 0);
  if (t === "shop_purge") return "SX" + (a.cardIdx ?? a.index ?? 0);
  if (t === "leave_shop") return "SL";
  if (t === "rest_heal") return "HH";
  if (t === "rest_smith") return "HS" + (a.cardIdx ?? a.index ?? 0);
  if (t === "rest_lift") return "HL";
  if (t === "rest_dig") return "HD";
  if (t === "rest_toke") return "HT" + (a.cardIdx ?? a.index ?? 0);
  if (t === "rest_recall") return "HR";
  if (t === "cash_out" || t === "rest_retreat") return "HC";
  if (t === "leave_rest") return "HX";
  if (t === "open_treasure") return "TO";
  if (t === "leave_treasure") return "TL";
  return "";
}

function compactLegacyActionObj(a) {
  if (!a || typeof a !== "object") return null;
  const t = a.type;
  if (t === "neow_blessing") {
    const ch = a.char || selectedCharId || (localPlayerState && localPlayerState.ch) || "IRONCLAD";
    const o = { type: "neow_blessing", index: a.choiceIdx ?? a.index ?? 0, char: ch };
    if (a.cardIdx) o.cardIdx = a.cardIdx;
    return o;
  }
  if (t === "choose_node") return { type: "choose_node", x: a.x ?? a.col ?? 0, y: a.y ?? a.row ?? 0 };
  if (t === "play_card") {
    const o = { type: "play_card", index: a.cardIdx ?? a.index ?? 0 };
    if (a.targetIdx) o.targetIdx = a.targetIdx;
    return o;
  }
  if (t === "use_potion") {
    const o = { type: "use_potion", index: a.potIdx ?? a.index ?? 0 };
    if (a.targetIdx) o.targetIdx = a.targetIdx;
    return o;
  }
  if (t === "discard_potion") return { type: "discard_potion", index: a.potIdx ?? a.index ?? 0 };
  if (t === "event_choice") {
    const o = { type: "event_choice", index: a.choiceIdx ?? a.index ?? 0 };
    if (a.cardIdx) o.cardIdx = a.cardIdx;
    return o;
  }
  if (t === "pick_reward_card" || t === "claim_reward_relic" || t === "pick_boss_relic" || t === "shop_buy_card" || t === "shop_buy_relic" || t === "shop_buy_potion") {
    return { type: t, index: a.index ?? a.cardIdx ?? 0 };
  }
  if (t === "shop_purge" || t === "rest_smith" || t === "rest_toke") {
    return { type: t, cardIdx: a.cardIdx ?? a.index ?? 0 };
  }
  if (t === "claim_reward_key") return { type: t, key: a.key || "b" };
  return { type: t };
}

function getQueuedEncodedLength() {
  if (pendingActionsQueue.length === 0) return 0;
  if (legacyJudgeMode) {
    return JSON.stringify({ type: "batch", actions: pendingActionsQueue.map(compactLegacyActionObj).filter(Boolean) }).length;
  }
  return 1 + pendingActionsQueue.map(encodeCompactAction).filter(Boolean).join(";").length;
}

function shouldFlushToServer(prevPh, nextPh, actObj) {
  const t = actObj && actObj.type;
  // 1. Initial Neow blessing initializes server seed and character
  if (prevPh === "NEOW" && nextPh !== "NEOW") return true;
  // 2. Every time a floor's monster combat finishes (COMBAT -> REWARD / VICTORY / DEFEAT)
  if (prevPh === "COMBAT" && nextPh !== "COMBAT") return true;
  // 3. Leaving any room back to MAP or entering REST (keeps queue tiny before Campfire Retreat / next floor)
  if ((prevPh !== "MAP" && nextPh === "MAP") || (prevPh === "MAP" && nextPh === "REST")) return true;
  // 4. Run settlement (Victory, Defeat, or Campfire Retreat / Cash Out)
  if (nextPh === "VICTORY" || nextPh === "DEFEAT" || nextPh === "RETREAT" || t === "cash_out" || t === "rest_retreat") return true;
  // 5. Proactive mid-combat flush before queue approaches the 200-char SDK limit
  if (getQueuedEncodedLength() >= (legacyJudgeMode ? 115 : 145)) return true;
  return false;
}

function flushPendingActions() {
  if (!hbConnected || !window.hb || typeof window.hb.submit !== "function") return;
  if (isFlushingBatch || pendingActionsQueue.length === 0) return;
  if (flushRetryTimer) {
    clearTimeout(flushRetryTimer);
    flushRetryTimer = null;
  }

  const batchToSend = [];
  let str = "";

  if (!legacyJudgeMode) {
    // Special case: single Neow blessing or single Cash Out uses universal colon/command syntax
    // that works on BOTH legacy cff2292 judge.js and current judge.js!
    if (pendingActionsQueue[0] && pendingActionsQueue[0].type === "neow_blessing") {
      const a = pendingActionsQueue.shift();
      batchToSend.push(a);
      const ch = a.char || selectedCharId || (localPlayerState && localPlayerState.ch) || "IRONCLAD";
      str = "BLESS:" + (a.choiceIdx ?? a.index ?? 0) + ":" + ch;
    } else if (pendingActionsQueue.length === 1 && (pendingActionsQueue[0].type === "cash_out" || pendingActionsQueue[0].type === "rest_retreat")) {
      const a = pendingActionsQueue.shift();
      batchToSend.push(a);
      str = "CASH_OUT";
    } else {
      // Build a compact batch chunk strictly <= 185 characters (under the 200-char SDK limit)
      const tokens = [];
      let len = 1; // "~"
      while (pendingActionsQueue.length > 0) {
        const nextAct = pendingActionsQueue[0];
        const tok = encodeCompactAction(nextAct);
        if (!tok) {
          pendingActionsQueue.shift();
          continue;
        }
        const addLen = (tokens.length > 0 ? 1 : 0) + tok.length;
        if (tokens.length > 0 && len + addLen > 185) break;
        pendingActionsQueue.shift();
        batchToSend.push(nextAct);
        tokens.push(tok);
        len += addLen;
      }
      if (tokens.length > 0) str = "~" + tokens.join(";");
    }
  } else {
    // Legacy judge.js (pre-45feed7) compatible chunk strictly <= 195 characters
    const first = pendingActionsQueue[0];
    if (first && first.type === "neow_blessing") {
      const a = pendingActionsQueue.shift();
      batchToSend.push(a);
      const ch = a.char || selectedCharId || (localPlayerState && localPlayerState.ch) || "IRONCLAD";
      str = "BLESS:" + (a.choiceIdx ?? a.index ?? 0) + ":" + ch;
    } else {
      const objs = [];
      while (pendingActionsQueue.length > 0) {
        const nextAct = pendingActionsQueue[0];
        const compactObj = compactLegacyActionObj(nextAct);
        if (!compactObj) {
          pendingActionsQueue.shift();
          continue;
        }
        const candidate = objs.concat([compactObj]);
        const candidateStr = candidate.length === 1
          ? JSON.stringify(candidate[0])
          : JSON.stringify({ type: "batch", actions: candidate });
        if (objs.length > 0 && candidateStr.length > 195) break;
        pendingActionsQueue.shift();
        batchToSend.push(nextAct);
        objs.push(compactObj);
        str = candidateStr;
      }
    }
  }

  if (!str || batchToSend.length === 0) return;

  inFlightBatch = batchToSend;
  isFlushingBatch = true;
  if (pendingActionsQueue.length === 0) {
    needsServerFlush = false;
  } else {
    needsServerFlush = true;
  }
  persistSessionState();
  renderApp();

  window.hb.submit(str).then(async (res) => {
    isFlushingBatch = false;
    if (res && res.judged) {
      let srvData = latestServerViewData;
      try {
        const mv = await window.hb.myView();
        if (mv && mv.data) srvData = mv.data;
      } catch {}

      // Auto-detect pre-45feed7 judge.js if "~..." batch was treated as a no-op at Floor 0 NEOW
      if (!legacyJudgeMode && str.startsWith("~") && srvData && srvData.ph === "NEOW" && (srvData.fl || 0) === 0 &&
          inFlightBatch.some(a => a && (a.type === "neow_blessing" || a.type === "choose_node"))) {
        legacyJudgeMode = true;
        pendingActionsQueue = inFlightBatch.concat(pendingActionsQueue);
        inFlightBatch = [];
        needsServerFlush = true;
        persistSessionState();
        flushPendingActions();
        return;
      }

      inFlightBatch = [];
      if (srvData) {
        hadServerMyView = true;
        applyServerViewData(srvData, true);
      } else {
        persistSessionState();
      }
      if (pendingActionsQueue.length > 0 && (needsServerFlush || getQueuedEncodedLength() >= (legacyJudgeMode ? 115 : 145))) {
        flushPendingActions();
      } else {
        renderApp();
      }
      return;
    }

    // Submission was not judged (cooldown, busy, judge_failed, login, etc.) — NEVER drop inFlightBatch!
    pendingActionsQueue = inFlightBatch.concat(pendingActionsQueue);
    inFlightBatch = [];
    needsServerFlush = true;
    persistSessionState();

    if (res && res.reason === "login" && typeof window.hb.login === "function") {
      window.hb.login().catch(() => {});
    }
    if (res && (res.reason === "already_claimed" || res.reason === "ended")) {
      needsServerFlush = false;
      renderApp();
      return;
    }
    const waitMs = (res && res.reason === "cooldown" && res.seconds)
      ? ((res.seconds * 1000) + 250)
      : 1200;
    flushRetryTimer = setTimeout(() => {
      flushRetryTimer = null;
      flushPendingActions();
    }, waitMs);
    renderApp();
  }).catch(() => {
    isFlushingBatch = false;
    pendingActionsQueue = inFlightBatch.concat(pendingActionsQueue);
    inFlightBatch = [];
    needsServerFlush = true;
    persistSessionState();
    flushRetryTimer = setTimeout(() => {
      flushRetryTimer = null;
      flushPendingActions();
    }, 1500);
    renderApp();
  });
}

window.addEventListener("pagehide", () => {
  if (pendingActionsQueue.length > 0) flushPendingActions();
});

function spineExtraBgStyle(extraKey) {
  const ext = window.STS_SPINE_EXTRAS;
  const p = ext && ext[extraKey];
  if (!p) return "";
  const SW = 2048, SH = 1977;
  const sx = ((SW / p.w) * 100).toFixed(3) + "%";
  const sy = ((SH / p.h) * 100).toFixed(3) + "%";
  const px = ((p.x / (SW - p.w)) * 100).toFixed(3) + "%";
  const py = ((p.y / (SH - p.h)) * 100).toFixed(3) + "%";
  return "background-image:url(assets/spine.webp);background-repeat:no-repeat;background-size:" + sx + " " + sy + ";background-position:" + px + " " + py + ";";
}

// ==================== COMBAT VFX & ACTION DIFF CHOREOGRAPHER ====================
const CombatVfxEngine = (() => {
  const activeUnitAnims = {}; // unitKey -> { cls, until }

  function getLayer() {
    return document.getElementById("sts-vfx-layer");
  }

  function setUnitAnim(unitKey, cls, durMs = 420, delayMs = 0) {
    const run = () => {
      activeUnitAnims[unitKey] = { cls, until: performance.now() + durMs };
      applyActiveUnitClasses();
      setTimeout(() => {
        if (activeUnitAnims[unitKey] && performance.now() >= activeUnitAnims[unitKey].until - 10) {
          delete activeUnitAnims[unitKey];
          applyActiveUnitClasses();
        }
      }, durMs + 20);
    };
    if (delayMs > 0) setTimeout(run, delayMs);
    else run();
  }

  function applyActiveUnitClasses() {
    const now = performance.now();
    const heroBox = document.querySelector(".sts-unit.hero-unit .sprite-stage-box");
    if (heroBox) {
      heroBox.classList.remove("unit-lunge-right", "unit-lunge-left", "unit-hit-shake", "unit-block-pulse");
      const ha = activeUnitAnims.hero;
      if (ha && ha.until > now) heroBox.classList.add(ha.cls);
    }
    document.querySelectorAll(".sts-unit.enemy-unit").forEach(u => {
      const idx = u.getAttribute("data-enemy-idx");
      const box = u.querySelector(".sprite-stage-box");
      if (!box) return;
      box.classList.remove("unit-lunge-right", "unit-lunge-left", "unit-hit-shake", "unit-block-pulse");
      const ea = activeUnitAnims["enemy-" + idx];
      if (ea && ea.until > now) box.classList.add(ea.cls);
    });
  }

  function spawnSlash(cx, cy, rotDeg = -28, delayMs = 0) {
    setTimeout(() => {
      const layer = getLayer();
      if (!layer) return;
      const slash = document.createElement("div");
      slash.className = "vfx-slash";
      slash.setAttribute("style", spineExtraBgStyle("slash1"));
      slash.style.left = cx + "px";
      slash.style.top = cy + "px";
      slash.style.setProperty("--slash-rot", rotDeg + "deg");
      layer.appendChild(slash);

      const ring = document.createElement("div");
      ring.className = "vfx-hit-ring";
      ring.style.left = cx + "px";
      ring.style.top = cy + "px";
      layer.appendChild(ring);

      setTimeout(() => { slash.remove(); ring.remove(); }, 390);
    }, delayMs);
  }

  function spawnDamageNumber(cx, cy, amount, clsExtra = "", delayMs = 0) {
    setTimeout(() => {
      const layer = getLayer();
      if (!layer) return;
      const el = document.createElement("div");
      el.className = "vfx-dmg-num" + (clsExtra ? " " + clsExtra : "");
      el.textContent = "-" + amount;
      layer.appendChild(el);

      const vx = (Math.random() - 0.5) * 115;
      const vy0 = -165 - Math.random() * 55;
      const g = 460;
      const start = performance.now();
      const dur = 820;

      function step(now) {
        const dt = (now - start) * 0.001;
        const p = Math.min(1, (now - start) / dur);
        const x = cx + vx * dt;
        const y = cy + vy0 * dt + 0.5 * g * dt * dt;
        const sc = p < 0.16 ? (0.65 + (p / 0.16) * 0.55) : (1.2 - ((p - 0.16) / 0.84) * 0.25);
        const op = p > 0.72 ? Math.max(0, 1 - (p - 0.72) / 0.28) : 1;
        el.style.left = x.toFixed(1) + "px";
        el.style.top = y.toFixed(1) + "px";
        el.style.transform = "translate(-50%, -50%) scale(" + sc.toFixed(2) + ")";
        el.style.opacity = op.toFixed(2);
        if (p < 1) requestAnimationFrame(step);
        else el.remove();
      }
      requestAnimationFrame(step);
    }, delayMs);
  }

  function spawnFloatTag(cx, cy, htmlText, clsType = "buff-gain", delayMs = 0) {
    setTimeout(() => {
      const layer = getLayer();
      if (!layer) return;
      const el = document.createElement("div");
      el.className = "vfx-float-tag " + clsType;
      el.innerHTML = htmlText;
      el.style.left = cx.toFixed(1) + "px";
      el.style.top = cy.toFixed(1) + "px";
      layer.appendChild(el);
      setTimeout(() => el.remove(), 950);
    }, delayMs);
  }

  function spawnTurnBanner(mainTxt, subTxt) {
    const layer = getLayer();
    if (!layer) return;
    const el = document.createElement("div");
    el.className = "vfx-turn-banner";
    el.innerHTML =
      '<div class="vfx-turn-banner-main">' + mainTxt + '</div>' +
      (subTxt ? '<div class="vfx-turn-banner-sub">' + subTxt + '</div>' : '');
    layer.appendChild(el);
    setTimeout(() => el.remove(), 860);
  }

  function spawnScreenHit(delayMs = 0) {
    setTimeout(() => {
      const layer = getLayer();
      if (!layer) return;
      const el = document.createElement("div");
      el.className = "vfx-screen-hit";
      layer.appendChild(el);
      setTimeout(() => el.remove(), 440);
    }, delayMs);
  }

  function spawnFlyingCard(cardHtml, startRect, midX, midY, endX, endY, cardType) {
    const layer = getLayer();
    if (!layer || !startRect || !cardHtml) return;
    const wrap = document.createElement("div");
    wrap.innerHTML = cardHtml;
    const cardEl = wrap.firstElementChild;
    if (!cardEl) return;
    cardEl.style.position = "fixed";
    cardEl.style.margin = "0";
    cardEl.style.left = startRect.left + "px";
    cardEl.style.top = startRect.top + "px";
    cardEl.style.width = startRect.width + "px";
    cardEl.style.height = startRect.height + "px";
    cardEl.style.pointerEvents = "none";
    cardEl.style.transition = "none";
    cardEl.style.zIndex = "92";
    layer.appendChild(cardEl);

    const sx = startRect.left + startRect.width * 0.5;
    const sy = startRect.top + startRect.height * 0.5;
    const t0 = performance.now();
    const dur = 420;

    function step(now) {
      const p = Math.min(1, (now - t0) / dur);
      let x, y, sc, rot, op;
      if (p < 0.48) {
        const u = 1 - Math.pow(1 - p / 0.48, 2.2);
        x = sx + (midX - sx) * u;
        y = sy + (midY - sy) * u;
        sc = 1 + u * 0.14;
        rot = u * (cardType === "A" ? 8 : 0);
        op = 1;
      } else {
        const u = (p - 0.48) / 0.52;
        const ease = u * u;
        x = midX + (endX - midX) * ease;
        y = midY + (endY - midY) * ease;
        sc = 1.14 * (1 - ease * 0.78);
        rot = (cardType === "A" ? 8 : 0) + ease * 140;
        op = 1 - ease * 0.92;
      }
      cardEl.style.left = (x - startRect.width * 0.5).toFixed(1) + "px";
      cardEl.style.top = (y - startRect.height * 0.5).toFixed(1) + "px";
      cardEl.style.transform = "scale(" + sc.toFixed(2) + ") rotate(" + rot.toFixed(1) + "deg)";
      cardEl.style.opacity = op.toFixed(2);
      if (p < 1) requestAnimationFrame(step);
      else cardEl.remove();
    }
    requestAnimationFrame(step);
  }

  function spawnDeathGhost(rect, spriteKey, size, idx) {
    const layer = getLayer();
    if (!layer || !rect) return;
    const el = document.createElement("div");
    el.className = "vfx-death-ghost";
    el.style.left = rect.left + "px";
    el.style.top = rect.top + "px";
    el.style.width = rect.width + "px";
    el.style.height = rect.height + "px";
    el.innerHTML = spMonster(spriteKey, size, idx);
    layer.appendChild(el);
    if (STS_SpineEngine.isReady()) {
      STS_SpineEngine.renderAllCanvases(performance.now() * 0.001);
    }
    setTimeout(() => el.remove(), 580);
  }

  function capturePreAction(actObj) {
    if (!currentData) return null;
    const st = currentData;
    const bt = st.bt;
    const heroBox = document.querySelector(".sts-unit.hero-unit .sprite-stage-box");
    const heroRect = heroBox ? heroBox.getBoundingClientRect() : null;
    const enemyRects = {};
    document.querySelectorAll(".sts-unit.enemy-unit").forEach(u => {
      const idx = u.getAttribute("data-enemy-idx");
      const box = u.querySelector(".sprite-stage-box") || u;
      enemyRects[idx] = box.getBoundingClientRect();
    });

    let cardRect = null, cardHtml = null, cardDef = null;
    if (actObj && actObj.type === "play_card" && bt && bt.h && bt.h[actObj.cardIdx]) {
      const cStr = bt.h[actObj.cardIdx];
      cardDef = getCardDef(cStr);
      const cEl = document.querySelector('.hand-tray .sts-card[data-hand-idx="' + actObj.cardIdx + '"]');
      if (cEl) {
        cardRect = cEl.getBoundingClientRect();
        cardHtml = cEl.outerHTML;
      }
    }
    const disEl = document.getElementById("btn-discard-pile");
    const discardRect = disEl ? disEl.getBoundingClientRect() : null;

    return {
      ph: st.ph,
      hp: st.hp,
      mhp: st.mhp,
      b: bt ? (bt.b || 0) : 0,
      t: bt ? (bt.t || 1) : 1,
      st: bt ? (bt.st || "Neutral") : "Neutral",
      pw: bt && bt.pw ? Object.assign({}, bt.pw) : {},
      enemies: bt && bt.m ? bt.m.map((m, idx) => ({
        id: m.id,
        name: m.name,
        spriteKey: getMonsterStateSpriteKey(m),
        size: getMonsterVisualSpec(getMonsterStateSpriteKey(m), m.id, bt.m.length).size,
        hp: m.hp,
        mhp: m.mhp,
        b: m.b || 0,
        pw: Object.assign({}, m.pw || {}),
        intent: m.in || m.it || "",
        dmg: (m.dmg !== undefined ? m.dmg : m.idmg) || 0,
        idx,
      })) : [],
      heroRect,
      enemyRects,
      cardRect,
      cardHtml,
      cardDef,
      discardRect,
    };
  }

  function diffPowerFloaters(prevPw, nextPw, cx, cy, baseDelay = 60) {
    const allKeys = new Set([...Object.keys(prevPw || {}), ...Object.keys(nextPw || {})]);
    let seq = 0;
    for (const k of allKeys) {
      const pv = (prevPw && prevPw[k]) || 0;
      const nv = (nextPw && nextPw[k]) || 0;
      const delta = nv - pv;
      if (delta === 0) continue;
      // Skip automatic 1-turn duration tickdowns on end_turn
      if (delta === -1 && (k === "Vulnerable" || k === "Weak" || k === "Frail" || k === "Entangled" || k === "NoBlock")) continue;
      const info = formatPowerDesc(k, nv || pv, null);
      const sign = delta > 0 ? "+" : "";
      const cls = info.isDebuff ? "debuff-gain" : "buff-gain";
      spawnFloatTag(
        cx + (seq % 2 === 0 ? -12 : 14),
        cy - 18 - seq * 20,
        spIcon("powers", k, 18, info.icon) + "<span>" + info.name + " " + sign + delta + "</span>",
        cls,
        baseDelay + seq * 110
      );
      seq++;
    }
  }

  function playPostAction(snap, nextSt, actObj) {
    if (!snap || !nextSt) return;
    const t = actObj && actObj.type;

    // 1. Entering Combat Banner
    if (snap.ph !== "COMBAT" && nextSt.ph === "COMBAT") {
      spawnTurnBanner("⚔️ 遭遇战斗", "第 1 回合 · 玩家回合");
      return;
    }

    const nextBt = nextSt.bt;
    const heroRect = snap.heroRect || { left: window.innerWidth * 0.22, top: window.innerHeight * 0.45, width: 110, height: 110 };
    const hCx = heroRect.left + heroRect.width * 0.5;
    const hCy = heroRect.top + heroRect.height * 0.45;

    // 2. Card Flight Trail on play_card
    if (t === "play_card" && snap.cardRect && snap.cardHtml && snap.cardDef) {
      const def = snap.cardDef;
      const midX = window.innerWidth * (def.target === "E" ? 0.48 : 0.44);
      const midY = window.innerHeight * 0.46;
      const disRect = snap.discardRect || { left: window.innerWidth - 55, top: window.innerHeight - 55, width: 40, height: 40 };
      const endX = def.type === "P" ? hCx : (disRect.left + disRect.width * 0.5);
      const endY = def.type === "P" ? hCy : (disRect.top + disRect.height * 0.5);
      spawnFlyingCard(snap.cardHtml, snap.cardRect, midX, midY, endX, endY, def.type);

      if (def.type === "A") {
        setUnitAnim("hero", "unit-lunge-right", 390, 0);
      }
    }

    // 3. Enemy Damage, Block Loss, Hit Shake, Slash & Death Ghost
    if (snap.ph === "COMBAT") {
      snap.enemies.forEach((prevM, idx) => {
        const nextM = (nextBt && nextBt.m && nextBt.m[idx]) ? nextBt.m[idx] : { hp: 0, b: 0, pw: {} };
        const eRect = snap.enemyRects[idx] || { left: window.innerWidth * 0.72, top: window.innerHeight * 0.45, width: 110, height: 110 };
        const eCx = eRect.left + eRect.width * 0.5;
        const eCy = eRect.top + eRect.height * 0.45;

        const hpLoss = Math.max(0, prevM.hp - Math.max(0, nextM.hp));
        const blkLoss = (t === "play_card" || t === "use_potion") ? Math.max(0, prevM.b - nextM.b) : 0;
        const totalHit = hpLoss + blkLoss;

        if (totalHit > 0) {
          spawnSlash(eCx, eCy, -28 + (idx % 2) * 52, 40);
          setUnitAnim("enemy-" + idx, "unit-hit-shake", 430, 40);
          if (hpLoss > 0) {
            spawnDamageNumber(eCx, eCy - 10, hpLoss, hpLoss >= 18 ? "heavy-dmg" : "", 55);
          } else if (blkLoss > 0) {
            spawnDamageNumber(eCx, eCy - 10, blkLoss, "blocked-dmg", 55);
          }
        }

        // Enemy died! Spawn death ghost so it dissolves cleanly
        if (prevM.hp > 0 && nextM.hp <= 0 && !(nextM.st && nextM.st.halfDead)) {
          spawnDeathGhost(eRect, prevM.spriteKey, prevM.size, idx);
        }

        // Enemy block gain
        if (nextM.hp > 0 && nextM.b > prevM.b && t === "end_turn") {
          spawnFloatTag(eCx, eCy - 16, "🛡️ +" + (nextM.b - prevM.b), "block-gain", 180 + idx * 90);
          setUnitAnim("enemy-" + idx, "unit-block-pulse", 450, 180 + idx * 90);
        }

        // Enemy power changes
        if (nextM.hp > 0) {
          diffPowerFloaters(prevM.pw, nextM.pw, eCx, eCy, 95);
        }
      });

      // 4. Hero Block Gain, Heal, Damage Taken & Power Changes
      const nextB = nextBt ? (nextBt.b || 0) : 0;
      if (t !== "end_turn" && nextB > snap.b) {
        spawnFloatTag(hCx, hCy - 18, "🛡️ +" + (nextB - snap.b), "block-gain", 50);
        setUnitAnim("hero", "unit-block-pulse", 450, 40);
      }
      if (nextSt.hp > snap.hp) {
        spawnFloatTag(hCx, hCy - 26, "💚 +" + (nextSt.hp - snap.hp), "heal-gain", 60);
      }
      if (nextBt) {
        diffPowerFloaters(snap.pw, nextBt.pw, hCx, hCy, 80);
        const nextStance = nextBt.st || "Neutral";
        if (nextStance !== snap.st) {
          if (nextStance === "Wrath") spawnFloatTag(hCx, hCy - 36, "🔥 姿态：愤怒", "debuff-gain", 30);
          else if (nextStance === "Calm") spawnFloatTag(hCx, hCy - 36, "💧 姿态：平静", "block-gain", 30);
          else if (nextStance === "Divinity") spawnFloatTag(hCx, hCy - 36, "✨ 姿态：神格！", "buff-gain", 30);
          else if (nextStance === "Neutral" && snap.st !== "Neutral") spawnFloatTag(hCx, hCy - 36, "⚪ 退出姿态", "buff-gain", 30);
        }
      }

      // 5. End Turn Enemy Attacks & Turn Banner
      if (t === "end_turn") {
        let atkSeq = 0;
        snap.enemies.forEach((prevM, idx) => {
          if (prevM.hp <= 0) return;
          const it = String(prevM.intent || "");
          if (it.includes("ATK") || it.includes("ATTACK")) {
            setUnitAnim("enemy-" + idx, "unit-lunge-left", 420, 60 + atkSeq * 130);
            atkSeq++;
          }
        });

        const heroHpLoss = Math.max(0, snap.hp - Math.max(0, nextSt.hp));
        if (heroHpLoss > 0 || atkSeq > 0) {
          const hitDelay = 120;
          if (heroHpLoss > 0) {
            spawnSlash(hCx, hCy, 32, hitDelay);
            setUnitAnim("hero", "unit-hit-shake", 440, hitDelay);
            spawnScreenHit(hitDelay);
            spawnDamageNumber(hCx, hCy - 12, heroHpLoss, heroHpLoss >= 15 ? "heavy-dmg" : "", hitDelay + 20);
          } else if (atkSeq > 0) {
            spawnSlash(hCx, hCy, 32, hitDelay);
            setUnitAnim("hero", "unit-block-pulse", 440, hitDelay);
            spawnFloatTag(hCx, hCy - 18, "🛡️ 格挡", "block-gain", hitDelay + 20);
          }
        }

        if (nextSt.ph === "COMBAT" && nextBt) {
          setTimeout(() => {
            spawnTurnBanner("第 " + nextBt.t + " 回合", "玩家回合");
          }, atkSeq > 0 ? 280 : 60);
        }
      }
    }
  }

  return { capturePreAction, playPostAction, applyActiveUnitClasses };
})();

function sendAction(payload) {
  clearTargeting(false);
  mapOverlayOpen = false;
  const actObj = typeof payload === "string" ? JSON.parse(payload) : payload;
  if (!actObj || typeof actObj !== "object") return;
  let prevPh = (localPlayerState && localPlayerState.ph) || (currentData && currentData.ph) || "NEOW";

  if (actObj.type === "select_char") {
    selectedCharId = actObj.char || actObj.charId || "IRONCLAD";
    runLocalJudge(actObj);
    persistSessionState();
    renderApp();
    return;
  }

  if (actObj.type === "neow_blessing") {
    actObj.char = actObj.char || selectedCharId || (localPlayerState && localPlayerState.ch) || (currentData && currentData.ch) || "IRONCLAD";
    selectedCharId = actObj.char;
  }

  // If player clicked a reachable map node from the Map Overlay while still inside a room,
  // auto-prepend the room-leave action so both client and server transition to MAP first.
  if (actObj.type === "choose_node" && prevPh !== "MAP") {
    let leaveType = null;
    if (prevPh === "REWARD") leaveType = "proceed_from_reward";
    else if (prevPh === "SHOP") leaveType = "leave_shop";
    else if (prevPh === "REST") leaveType = "leave_rest";
    else if (prevPh === "TREASURE") leaveType = "leave_treasure";
    if (leaveType) {
      const leaveAct = { type: leaveType };
      runLocalJudge(leaveAct, true);
      if (window.hb && typeof window.hb.submit === "function") {
        pendingActionsQueue.push(leaveAct);
      }
      prevPh = (localPlayerState && localPlayerState.ph) || (currentData && currentData.ph) || "MAP";
    }
  }

  const vfxSnap = CombatVfxEngine.capturePreAction(actObj);

  // Always execute locally at 0ms for instant UI responsiveness
  runLocalJudge(actObj);
  const nextPh = (localPlayerState && localPlayerState.ph) || (currentData && currentData.ph) || prevPh;
  CombatVfxEngine.playPostAction(vfxSnap, currentData, actObj);

  if (window.hb && typeof window.hb.submit === "function") {
    pendingActionsQueue.push(actObj);
    const shouldFlush = shouldFlushToServer(prevPh, nextPh, actObj);
    if (shouldFlush) {
      needsServerFlush = true;
    }
    persistSessionState();
    if (shouldFlush || needsServerFlush) {
      flushPendingActions();
    } else {
      renderApp();
    }
  } else if (window.HB && typeof window.HB.send === "function") {
    window.HB.send(actObj);
  }
}

function formatCardDesc(def, nums) {
  let s = def.desc || "";
  const dCls = nums.dmg > def.dmg ? "num-boost" : (nums.dmg < def.dmg ? "num-nerf" : "");
  const bCls = nums.blk > def.blk ? "num-boost" : (nums.blk < def.blk ? "num-nerf" : "");
  s = s.replace(/!D!/g, '<span class="' + dCls + '">' + nums.dmg + '</span>');
  s = s.replace(/!B!/g, '<span class="' + bCls + '">' + nums.blk + '</span>');
  s = s.replace(/!M!/g, '<b>' + nums.mag + '</b>');
  s = s.replace(/\[(?:R|G|B|W|E)\]/g, "⚡");
  s = s.replace(/ NL /g, "<br/>");
  return s;
}

function getMonsterIntentInfo(st, bt, m) {
  if (hasRelic(st, "Runic Dome")) {
    return {
      cls: "deb",
      text: '<span class="intent-main-ico">' + spIcon("intents", "unknown", 36, "❓") + '</span>',
      tip: "符文圆顶：无法查看敌人意图"
    };
  }
  const it = m.in || m.it || "UNKNOWN";
  let dmg = (m.dmg !== undefined ? m.dmg : m.idmg) || 0;
  if (dmg > 0) {
    dmg = calcMonsterAttackDmg(st, bt, m, dmg);
  }
  const hitCnt = m.hits || m.ihit || 1;
  const hits = hitCnt > 1 ? ("x" + hitCnt) : "";
  const totalDmg = dmg * hitCnt;
  const atkTier = totalDmg < 5 ? 1 : (totalDmg < 10 ? 2 : (totalDmg < 15 ? 3 : (totalDmg < 20 ? 4 : (totalDmg < 25 ? 5 : (totalDmg < 30 ? 6 : 7)))));
  const atkIcon = '<span class="intent-main-ico">' + spIcon("intents", "attack_" + atkTier, 38, "⚔️") + '</span>';
  const dmgNumHtml = '<span class="intent-dmg-num">' + dmg + hits + '</span>';

  if (it === "ATTACK" || it === "ATK") {
    return { cls: "atk", text: atkIcon + dmgNumHtml, tip: "准备攻击，造成 " + dmg + hits + " 点伤害" };
  }
  if (it === "ATTACK_DEFEND" || it === "ATK_DEF") {
    return {
      cls: "atk",
      text: '<span class="intent-sub-ico">' + spIcon("intents", "defend", 28, "🛡️") + '</span>' + atkIcon + dmgNumHtml,
      tip: "准备攻击造成 " + dmg + hits + " 点伤害，并获得格挡"
    };
  }
  if (it === "ATTACK_BUFF" || it === "ATK_BUFF") {
    return {
      cls: "atk",
      text: '<span class="intent-sub-ico">' + spIcon("intents", "buff", 28, "💪") + '</span>' + atkIcon + dmgNumHtml,
      tip: "准备攻击造成 " + dmg + hits + " 点伤害，并强化自身"
    };
  }
  if (it === "ATTACK_DEBUFF" || it === "ATK_DEB") {
    return {
      cls: "atk",
      text: '<span class="intent-sub-ico">' + spIcon("intents", "debuff1", 28, "🌀") + '</span>' + atkIcon + dmgNumHtml,
      tip: "准备攻击造成 " + dmg + hits + " 点伤害，并施加负面效果"
    };
  }
  if (it === "DEFEND" || it === "DEF") {
    return { cls: "def", text: '<span class="intent-main-ico">' + spIcon("intents", "defend", 36, "🛡️") + '</span>', tip: "准备进行防御，获得格挡" };
  }
  if (it === "DEFEND_BUFF" || it === "DEF_BUFF") {
    return { cls: "def", text: '<span class="intent-main-ico">' + spIcon("intents", "defend_buff", 38, "🛡️") + '</span>', tip: "准备获得格挡并强化自身" };
  }
  if (it === "DEFEND_DEBUFF") {
    return {
      cls: "def",
      text: '<span class="intent-sub-ico">' + spIcon("intents", "debuff1", 26, "🌀") + '</span><span class="intent-main-ico">' + spIcon("intents", "defend", 34, "🛡️") + '</span>',
      tip: "准备防御并施加负面状态"
    };
  }
  if (it === "BUFF") {
    return { cls: "buf", text: '<span class="intent-main-ico">' + spIcon("intents", "buff", 36, "💪") + '</span>', tip: "准备使用强化效果" };
  }
  if (it === "DEBUFF" || it === "DEB") {
    return { cls: "deb", text: '<span class="intent-main-ico">' + spIcon("intents", "debuff1", 36, "🌀") + '</span>', tip: "准备对你施加负面状态" };
  }
  if (it === "STRONG_DEBUFF" || it === "STRONG_DEB") {
    return { cls: "deb", text: '<span class="intent-main-ico">' + spIcon("intents", "debuff2", 38, "🌀") + '</span>', tip: "准备对你施加极其强大的诅咒/负面效果" };
  }
  if (it === "SLEEP") {
    return { cls: "def", text: '<span class="intent-main-ico">' + spIcon("intents", "sleep", 36, "💤") + '</span>', tip: "正在沉睡中" };
  }
  if (it === "STUN") {
    return { cls: "def", text: '<span class="intent-main-ico">' + spIcon("intents", "stun", 36, "💫") + '</span>', tip: "已被眩晕，本回合无法行动" };
  }
  if (it === "ESCAPE" || it === "ESC") {
    return { cls: "deb", text: '<span class="intent-main-ico">' + spIcon("intents", "escape", 36, "🏃") + '</span>', tip: "准备逃跑" };
  }
  return { cls: "buf", text: '<span class="intent-main-ico">' + spIcon("intents", "magic", 36, "🔮") + '</span>', tip: "准备发动特殊行动" };
}

function renderCardElement(cardStr, st, bt, onClick, extraBadge) {
  const effIdx = (hoveredEnemyIdx !== null && bt && bt.m && bt.m[hoveredEnemyIdx] && bt.m[hoveredEnemyIdx].hp > 0)
    ? hoveredEnemyIdx
    : selectedTargetIdx;
  const targetM = (bt && bt.m && bt.m[effIdx] && bt.m[effIdx].hp > 0)
    ? bt.m[effIdx]
    : (bt && bt.m ? bt.m.find(x => x.hp > 0) : null);
  const nums = calcPlayerCardNumbers(st, bt, cardStr, targetM);
  const def = nums.def;
  const playable = bt ? canPlayCard(st, bt, cardStr) : true;

  const el = document.createElement("div");
  el.className = "sts-card type-" + def.type + " " + (playable ? "playable" : "unplayable");
  const showOrb = !(def.type === "ST" || def.type === "C") || nums.cost >= -1;
  const costTxt = nums.cost === -1 ? "X" : (nums.cost === -2 ? "" : nums.cost);
  const costMod = (def.cost >= 0 && nums.cost >= 0 && nums.cost < def.cost) ? " cost-modified" : "";
  const typeMap = { A: "攻击", S: "技能", P: "能力", ST: "状态", C: "诅咒" };

  el.innerHTML =
    '<div class="card-art" style="background-position:' + spCardPos(def.id) + '"></div>' +
    '<div class="card-frame-overlay" style="background-position:' + spCardFramePos(def) + '"></div>' +
    (showOrb && costTxt !== "" ? '<div class="card-cost' + costMod + '">' + costTxt + '</div>' : '') +
    '<div class="card-name ' + (def.up > 0 ? "upgraded" : "") + '">' + def.name + '</div>' +
    '<div class="card-type-pill">' + (typeMap[def.type] || "卡牌") + '</div>' +
    '<div class="card-desc"><div>' + formatCardDesc(def, nums) + '</div></div>' +
    (extraBadge ? '<div class="card-extra-badge">' + extraBadge + '</div>' : '');

  if (onClick) {
    el.addEventListener("click", (ev) => onClick(def, playable, ev));
  }
  return el;
}

function openCardPickerModal(title, cards, st, onPick) {
  modalState = { title, cards, st, onPick };
  renderApp();
}

function svgMapCircle(cx, cy, size, cls = "") {
  const half = size / 2;
  return '<foreignObject class="' + cls + '" x="' + (cx - half) + '" y="' + (cy - half) + '" width="' + size + '" height="' + size + '" style="pointer-events:none;overflow:visible">' +
    '<span style="display:block;width:' + size + 'px;height:' + size + 'px;' + uiPanelBgStyle("mapCircle") + '"></span>' +
  '</foreignObject>';
}

function svgBossMapIcon(bossId, cx, cy, w = 108, h = 84) {
  return '<foreignObject x="' + (cx - w / 2) + '" y="' + (cy - h / 2) + '" width="' + w + '" height="' + h + '" style="pointer-events:none;overflow:visible">' +
    '<span class="boss-map-icon" style="display:block;width:' + w + 'px;height:' + h + 'px;' + uiPanelBgStyle("boss_" + bossId) + '"></span>' +
  '</foreignObject>';
}

// ==================== MAP RENDERER (ORIGINAL PARCHMENT SCROLL + LEGEND) ====================
function renderMapStage(st) {
  const wrap = document.createElement("div");
  wrap.className = "map-wrapper";

  // Interactive Parchment Scroll
  const scroll = document.createElement("div");
  scroll.className = "map-scroll";

  const paper = document.createElement("div");
  paper.className = "sts-map-paper";
  paper.setAttribute("style", uiPanelBgStyle("mapScroll"));

  const svgBox = document.createElement("div");
  svgBox.className = "map-svg-container";

  const rows = generateActMap(st.s, st.a);
  const numRows = rows.length;
  const visitedSet = new Set((st.p || []).map(([px, py]) => px + "," + py));
  const nextRow = st.r + 1;
  const curNode = (st.r >= 0 && st.r < numRows && rows[st.r]) ? rows[st.r].find(n => n.x === st.c) : null;

  const isReachable = (x, y) => {
    if (y === 15) return st.r === numRows - 1;
    if (y !== nextRow) return false;
    if (st.r === -1) return y === 0;
    if (hasRelic(st, "WingedGreaves")) return true;
    return Boolean(curNode && curNode.e && curNode.e.indexOf(x) !== -1);
  };

  const W = 500, H = 740;
  const colX = x => 76 + x * 58;
  const rowY = y => y === 15 ? (st.a === 4 ? 140 : 62) : (st.a === 4 ? (560 - y * 135) : (696 - y * 39));

  let edgesSvg = "";
  for (let y = 0; y < numRows; y++) {
    for (const n of rows[y]) {
      const x1 = colX(n.x), y1 = rowY(y);
      if (y === numRows - 1) {
        const activeEdge = visitedSet.has(n.x + "," + y) && visitedSet.has("3,15");
        const canWalk = (st.r === numRows - 1 && st.c === n.x);
        edgesSvg += '<line x1="' + x1 + '" y1="' + (y1 - 14) + '" x2="' + colX(3) + '" y2="' + (rowY(15) + 42) + '" stroke="' + (activeEdge ? "#231c18" : (canWalk ? "#8b1e1e" : "rgba(74, 58, 42, 0.55)")) + '" stroke-width="' + (activeEdge || canWalk ? 2.8 : 2) + '" stroke-dasharray="' + (activeEdge ? "none" : "5,6") + '" stroke-linecap="round"/>';
      } else {
        for (const nx of n.e) {
          const x2 = colX(nx), y2 = rowY(y + 1);
          const activeEdge = visitedSet.has(n.x + "," + y) && visitedSet.has(nx + "," + (y + 1));
          const canWalk = (st.r === y && st.c === n.x && y + 1 === nextRow);
          edgesSvg += '<line x1="' + x1 + '" y1="' + (y1 - 12) + '" x2="' + x2 + '" y2="' + (y2 + 12) + '" stroke="' + (activeEdge ? "#231c18" : (canWalk ? "#8b1e1e" : "rgba(74, 58, 42, 0.62)")) + '" stroke-width="' + (activeEdge ? 3.2 : (canWalk ? 2.8 : 2.1)) + '" stroke-dasharray="' + (activeEdge ? "none" : "5,6") + '" stroke-linecap="round"/>';
        }
      }
    }
  }

  let nodesSvg = "";
  // Large Boss Ink Sketch at Top of Parchment (y=15)
  const bossId = ACT_INFO[st.a].bosses[st.s % 3];
  const bossReach = isReachable(3, 15);
  const bossVisited = visitedSet.has("3,15");
  const bossCls = "map-node boss-node " + (bossReach ? "reachable" : (bossVisited ? "visited" : "unvisited"));
  nodesSvg +=
    '<g class="' + bossCls + '" data-x="3" data-y="15" data-node-type="BOSS">' +
      '<circle cx="' + colX(3) + '" cy="' + rowY(15) + '" r="42" fill="transparent"/>' +
      svgBossMapIcon(bossId, colX(3), rowY(15), 114, 88) +
      (bossVisited ? svgMapCircle(colX(3), rowY(15), 108) : (bossReach ? svgMapCircle(colX(3), rowY(15), 108, "hover-circle") : '')) +
      '<text x="' + colX(3) + '" y="' + (rowY(15) + 52) + '" text-anchor="middle" fill="#261e18" font-size="12" font-weight="900">' + (MONSTER_META[bossId] || bossId) + '</text>' +
    '</g>';

  for (let y = 0; y < numRows; y++) {
    const floorNum = st.a === 4 ? (48 + y + 1) : ((st.a - 1) * 16 + y + 1);
    nodesSvg += '<text x="28" y="' + (rowY(y) + 4) + '" fill="rgba(68, 52, 38, 0.55)" font-size="10" font-weight="800">' + floorNum + 'F</text>';
    for (const n of rows[y]) {
      const cx = colX(n.x), cy = rowY(y);
      const reach = isReachable(n.x, y);
      const visited = visitedSet.has(n.x + "," + y);
      const isCur = (st.r === y && st.c === n.x);
      const isBurning = Boolean(n.be && !(st.keys && st.keys.g));
      const stateCls = reach ? "reachable" : (isCur ? "current" : (visited ? "visited" : "unvisited"));
      nodesSvg +=
        '<g class="map-node ' + stateCls + (isBurning ? " burning-elite" : "") + '" data-x="' + n.x + '" data-y="' + y + '" data-node-type="' + n.t + '">' +
          '<circle cx="' + cx + '" cy="' + cy + '" r="18" fill="transparent"/>' +
          (isBurning ? '<circle cx="' + cx + '" cy="' + cy + '" r="20" fill="rgba(16, 185, 129, 0.22)" stroke="#10b981" stroke-width="2" stroke-dasharray="3,2"/>' : '') +
          svgMapIcon(n.t, cx, cy, reach ? 32 : 29) +
          (isBurning ? '<text x="' + (cx + 12) + '" y="' + (cy - 9) + '" font-size="12" text-anchor="middle">🔥</text>' : '') +
          (visited || isCur ? svgMapCircle(cx, cy, 44) : '') +
          (reach ? svgMapCircle(cx, cy, 44, "hover-circle") : '') +
        '</g>';
    }
  }

  svgBox.innerHTML = '<svg viewBox="0 0 ' + W + ' ' + H + '" style="display:block;width:100%;height:auto">' + edgesSvg + nodesSvg + '</svg>';
  svgBox.querySelectorAll(".map-node").forEach(g => {
    const x = Number(g.getAttribute("data-x"));
    const y = Number(g.getAttribute("data-y"));
    if (isReachable(x, y)) {
      g.addEventListener("click", () => sendAction({ type: "choose_node", x, y }));
    }
  });

  paper.appendChild(svgBox);
  scroll.appendChild(paper);
  wrap.appendChild(scroll);

  // Right-side Authentic Parchment Legend Card (legend2.png)
  const legend = document.createElement("div");
  legend.className = "sts-legend-card";
  legend.setAttribute("style", uiPanelBgStyle("mapLegend"));
  const actInfo = ACT_INFO[st.a] || ACT_INFO[1];
  const legendRows = [
    { t: "?", label: "未知" },
    { t: "$", label: "商人" },
    { t: "T", label: "财宝" },
    { t: "R", label: "休息" },
    { t: "M", label: "敌人" },
    { t: "E", label: "精英" },
  ];
  legend.innerHTML =
    '<div class="sts-legend-title">图例</div>' +
    '<div class="sts-legend-sub">' + actInfo.name + '</div>' +
    legendRows.map(item =>
      '<div class="sts-legend-item" data-leg-type="' + item.t + '">' +
        spIcon("map", item.t, 24) +
        '<span>' + item.label + '</span>' +
      '</div>'
    ).join("") +
    '<div class="sts-legend-tip">点击闪烁红圈节点前进</div>';

  legend.querySelectorAll(".sts-legend-item").forEach(el => {
    const t = el.getAttribute("data-leg-type");
    el.addEventListener("pointerenter", () => {
      svgBox.querySelectorAll('.map-node[data-node-type="' + t + '"]').forEach(n => n.classList.add("legend-hi"));
    });
    el.addEventListener("pointerleave", () => {
      svgBox.querySelectorAll('.map-node.legend-hi').forEach(n => n.classList.remove("legend-hi"));
    });
  });
  wrap.appendChild(legend);

  const syncMapScroll = () => {
    const targetRow = Math.max(0, Math.min(15, nextRow));
    const ratio = 1 - (targetRow / 15);
    const maxScroll = Math.max(0, scroll.scrollHeight - scroll.clientHeight);
    scroll.scrollTop = Math.max(0, Math.min(maxScroll, maxScroll * ratio + 40));
  };
  requestAnimationFrame(syncMapScroll);
  setTimeout(syncMapScroll, 50);

  return wrap;
}

// ==================== COMBAT RENDERER ====================
function renderCombatStage(st) {
  const bt = st.bt;
  const layout = document.createElement("div");
  layout.className = "combat-layout";

  if (!bt.m[selectedTargetIdx] || bt.m[selectedTargetIdx].hp <= 0) {
    const firstAlive = bt.m.findIndex(m => m.hp > 0);
    selectedTargetIdx = firstAlive !== -1 ? firstAlive : 0;
  }

  // Full-stage Widescreen Scene Backdrop & Vignette
  const actSceneKey = st.a === 4 ? "TheEnding" : (st.a === 3 ? "TheBeyond" : (st.a === 2 ? "TheCity" : "Exordium"));
  const bgDecor = document.createElement("div");
  bgDecor.className = "arena-bg-decor";
  bgDecor.setAttribute("style", combatBgStyle(actSceneKey));
  layout.appendChild(bgDecor);

  const vignette = document.createElement("div");
  vignette.className = "arena-vignette";
  layout.appendChild(vignette);

  const selCardStr = (activeCardIdx !== null && bt.h && bt.h[activeCardIdx]) ? bt.h[activeCardIdx] : null;
  const selCardDef = selCardStr ? getCardDef(selCardStr) : null;
  const selPotId = (activePotionIdx !== null && st.pot && st.pot[activePotionIdx]) ? st.pot[activePotionIdx] : null;
  const selPotDef = selPotId ? POTIONS[selPotId] : null;
  const isTargetingEnemy = Boolean((selCardDef && selCardDef.target === "E") || (selPotDef && selPotDef.target === "E"));

  // 1. Arena Stage (Floor-Standing Hero + Monsters)
  const arena = document.createElement("div");
  arena.className = "arena-stage" + (selCardDef && selCardDef.target !== "E" ? " drop-ready" : "");

  if (selCardDef || selPotDef) {
    const banner = document.createElement("div");
    banner.className = "targeting-banner";
    const itemName = selCardDef ? selCardDef.name : selPotDef.name;
    banner.innerHTML =
      '<span>🎯 已选定【' + itemName + '】：请点击目标敌人释放（再次点击卡牌攻击当前锁定目标，右键取消）</span>' +
      '<button class="targeting-cancel-btn" id="btn-cancel-target">取消 ✖</button>';
    banner.querySelector("#btn-cancel-target").addEventListener("click", (ev) => {
      ev.stopPropagation();
      clearTargeting(true);
    });
    arena.appendChild(banner);
  }

  arena.addEventListener("click", (ev) => {
    if (ev.target === arena) {
      if (selCardDef && selCardDef.target !== "E") {
        const cIdx = activeCardIdx;
        clearTargeting(false);
        sendAction({ type: "play_card", cardIdx: cIdx, targetIdx: selectedTargetIdx });
      } else if (activeCardIdx !== null || activePotionIdx !== null) {
        clearTargeting(true);
      }
    }
  });

  // Hero Floor-standing Unit (Original STS: drawX = 1920 * 0.25 = 25%, drawY = floorY)
  const hm = getHeroMeta(st);
  const hero = document.createElement("div");
  hero.className = "sts-unit hero-unit";
  const heroPws = renderPowerChipsHtml(bt.pw, bt);
  const heroIntangible = ((bt.pw && bt.pw.Intangible) || 0) > 0;
  const heroSpec = getMonsterVisualSpec(hm.spine, hm.spine, 1);
  const heroFacingLeft = Boolean(bt.pw && bt.pw.Surrounded && bt.m && bt.m[1] && bt.m[1].pw && bt.m[1].pw.BackAttack);

  hero.innerHTML =
    '<div class="sprite-stage-box' + (heroIntangible ? ' is-intangible' : '') + '" style="width:' + heroSpec.size + 'px;height:' + heroSpec.size + 'px">' +
      renderHeroMechanicsHtml(st, bt) +
      '<div class="unit-shadow" style="width:' + heroSpec.shadowW + 'px"></div>' +
      (heroFacingLeft ? '<div style="transform:scaleX(-1);display:flex">' + spMonster(hm.spine, heroSpec.size) + '</div>' : spMonster(hm.spine, heroSpec.size)) +
    '</div>' +
    '<div class="sts-under-foot">' +
      '<div class="sts-hp-wrap" style="width:' + heroSpec.hpW + 'px">' +
        (bt.b > 0 ? '<div class="sts-block-badge">' + spIcon("hud", "block", 26, "🛡️") + '<span class="blk-num">' + bt.b + '</span></div>' : '') +
        '<div class="hp-bar-outer">' +
          '<div class="hp-bar-inner ' + (bt.b > 0 ? "block-on" : "") + '" style="width:' + Math.max(0, Math.min(100, (st.hp / st.mhp) * 100)) + '%"></div>' +
          '<div class="hp-bar-text">' + st.hp + '/' + st.mhp + '</div>' +
        '</div>' +
      '</div>' +
      '<div class="power-row">' + heroPws + '</div>' +
      '<div class="unit-name">' + hm.name + '</div>' +
    '</div>';
  arena.appendChild(hero);

  // Enemies Floor-Standing at Authentic Original STS Coordinates:
  // drawX = 1920 * 0.75 + offsetX, drawY = floorY + offsetY
  const totalEnemies = bt.m ? bt.m.length : 1;

  bt.m.forEach((m, idx) => {
    const unit = document.createElement("div");
    const isAlive = m.hp > 0;
    const isSel = isAlive && idx === selectedTargetIdx;
    unit.className = "sts-unit enemy-unit" +
      (isSel ? " selected" : "") +
      (isAlive && isTargetingEnemy ? " target-candidate" : "") +
      (isAlive && hoveredEnemyIdx === idx ? " target-locked" : "") +
      (!isAlive && !m.st.halfDead ? " dead" : "");
    unit.setAttribute("data-enemy-idx", String(idx));

    const posVars = getMonsterStageCssVars(st, bt, m, idx);
    unit.style.setProperty("--unit-x", posVars.leftPct);
    unit.style.setProperty("--unit-off-y", posVars.offYPct);
    unit.style.zIndex = String(posVars.zIdx);

    const intent = isAlive ? getMonsterIntentInfo(st, bt, m) : { cls: "def", text: m.st.halfDead ? "🌑 重生中" : "", tip: "" };
    const mPws = renderPowerChipsHtml(m.pw, m);
    const mSpriteKey = getMonsterStateSpriteKey(m);
    const mSpec = getMonsterVisualSpec(mSpriteKey, m.id, totalEnemies);
    const mIntangible = ((m.pw && m.pw.Intangible) || 0) > 0;
    const mHalfDead = Boolean(m.st && m.st.halfDead);
    const heartMask = m.id === "CorruptHeart"
      ? ";-webkit-mask-image:linear-gradient(180deg,transparent 0%,rgba(0,0,0,0.45) 8%,#000 18%);mask-image:linear-gradient(180deg,transparent 0%,rgba(0,0,0,0.45) 8%,#000 18%)"
      : "";

    unit.innerHTML =
      '<div class="sts-intent ' + intent.cls + '" title="' + (intent.tip || "") + '">' + intent.text + '</div>' +
      '<div class="sprite-stage-box' + (mSpec.fly ? ' is-flying' : '') + (mIntangible ? ' is-intangible' : '') + (mHalfDead ? ' is-half-dead' : '') + '" style="width:' + mSpec.size + 'px;height:' + mSpec.size + 'px' + heartMask + '">' +
        '<div class="unit-shadow" style="width:' + mSpec.shadowW + 'px"></div>' +
        spMonster(mSpriteKey, mSpec.size, idx + 1) +
        renderHexaghostOrbsHtml(m) +
        (isAlive ? renderReticleCorners() : '') +
      '</div>' +
      '<div class="sts-under-foot">' +
        '<div class="sts-hp-wrap" style="width:' + mSpec.hpW + 'px">' +
          (m.b > 0 ? '<div class="sts-block-badge">' + spIcon("hud", "block", 26, "🛡️") + '<span class="blk-num">' + m.b + '</span></div>' : '') +
          '<div class="hp-bar-outer">' +
            '<div class="hp-bar-inner ' + (m.b > 0 ? "block-on" : "") + '" style="width:' + Math.max(0, Math.min(100, (m.hp / m.mhp) * 100)) + '%"></div>' +
            '<div class="hp-bar-text">' + m.hp + '/' + m.mhp + '</div>' +
          '</div>' +
        '</div>' +
        '<div class="power-row">' + mPws + '</div>' +
        '<div class="unit-name">' + m.name + '</div>' +
      '</div>';

    if (isAlive) {
      unit.addEventListener("click", (ev) => {
        ev.stopPropagation();
        selectedTargetIdx = idx;
        if (activeCardIdx !== null && selCardDef) {
          const cIdx = activeCardIdx;
          clearTargeting(false);
          sendAction({ type: "play_card", cardIdx: cIdx, targetIdx: idx });
        } else if (activePotionIdx !== null && selPotDef) {
          const pIdx = activePotionIdx;
          clearTargeting(false);
          sendAction({ type: "use_potion", potIdx: pIdx, targetIdx: idx });
        } else {
          renderApp();
        }
      });
    }
    arena.appendChild(unit);
  });
  layout.appendChild(arena);

  // 2. Original STS Bottom Dock (Left: Energy Orb + Draw Pile | Center: Fanned Hand | Right: End Turn + Discard/Exhaust Piles)
  const dock = document.createElement("div");
  dock.className = "combat-bottom-dock";
  const countCircleHtml = spIcon("hud", "countCircle", 24, "");

  // Left Dock: Energy Orb + Draw Pile
  const leftDock = document.createElement("div");
  leftDock.className = "dock-side";
  leftDock.innerHTML =
    '<div class="sts-energy-orb ' + (bt.e <= 0 ? "empty-energy" : "") + '" title="当前能量 ' + bt.e + ' / ' + bt.me + '">' +
      spIcon("hud", hm.energyIcon, 68, "⚡") +
      '<div class="sts-energy-text">' + bt.e + '/' + bt.me + '</div>' +
    '</div>' +
    '<button class="sts-pile-btn" id="btn-draw-pile" title="点击查看抽牌堆（已打乱顺序）">' +
      spIcon("hud", "drawPile", 50, "📘") +
      '<span class="sts-pile-count">' + countCircleHtml + '<span class="cnt-txt">' + (bt.dr ? bt.dr.length : 0) + '</span></span>' +
    '</button>';
  leftDock.querySelector("#btn-draw-pile").addEventListener("click", () => {
    openCardPickerModal("📘 抽牌堆（共 " + (bt.dr ? bt.dr.length : 0) + " 张，顺序已打乱）", (bt.dr || []).slice().sort(), st, null);
  });
  dock.appendChild(leftDock);

  // Center Dock: Fanned Hand of Cards
  const tray = document.createElement("div");
  tray.className = "hand-tray";
  const handArr = bt.h || [];
  const totalCards = handArr.length;
  const midIdx = (totalCards - 1) / 2;

  handArr.forEach((cStr, cIdx) => {
    const offset = cIdx - midIdx;
    const rotDeg = totalCards > 1 ? (offset * Math.min(4.2, 22 / totalCards)) : 0;
    const dropY = Math.abs(offset) * Math.abs(offset) * 1.8;

    const cardEl = renderCardElement(cStr, st, bt, (def, playable, ev) => {
      if (ev) ev.stopPropagation();
      if (!playable) return;
      if (def.target === "E") {
        if (activeCardIdx === cIdx) {
          // Clicking the already-selected card again attacks the currently locked target
          clearTargeting(false);
          sendAction({ type: "play_card", cardIdx: cIdx, targetIdx: selectedTargetIdx });
        } else {
          activeCardIdx = cIdx;
          activePotionIdx = null;
          renderApp();
        }
      } else {
        clearTargeting(false);
        sendAction({ type: "play_card", cardIdx: cIdx, targetIdx: selectedTargetIdx });
      }
    });

    cardEl.setAttribute("data-hand-idx", String(cIdx));
    cardEl.style.setProperty("--fan-rot", rotDeg.toFixed(2) + "deg");
    cardEl.style.setProperty("--fan-y", dropY.toFixed(1) + "px");
    cardEl.style.zIndex = String(10 + cIdx);
    if (activeCardIdx === cIdx) {
      cardEl.classList.add("selected-card");
    }

    const def = getCardDef(cStr);
    const playable = canPlayCard(st, bt, cStr);
    if (playable) {
      cardEl.addEventListener("pointerdown", (e) => {
        if (e.button !== undefined && e.button !== 0) return;
        dragState = { cIdx, def, startX: e.clientX, startY: e.clientY, moved: false };
      });
    }

    tray.appendChild(cardEl);
  });
  dock.appendChild(tray);

  // Right Dock: End Turn Button + Exhaust Pile + Discard Pile
  const rightDock = document.createElement("div");
  rightDock.className = "dock-side";
  const endTurnStyle = uiPanelBgStyle(bt.e <= 0 ? "endTurnHover" : "endTurnBtn");
  rightDock.innerHTML =
    '<button class="end-turn-btn" id="btn-end-turn" title="当前第 ' + bt.t + ' 回合，点击结束回合" style="' + endTurnStyle + '">结束回合</button>' +
    '<div style="display:flex;align-items:flex-end;gap:8px">' +
      (bt.ex && bt.ex.length > 0
        ? '<button class="sts-pile-btn" id="btn-exhaust-pile" title="点击查看消耗堆" style="width:42px;height:42px">' +
            spIcon("powers", "DarkEmbrace", 36, "💀") +
            '<span class="sts-pile-count">' + countCircleHtml + '<span class="cnt-txt">' + bt.ex.length + '</span></span>' +
          '</button>'
        : '') +
      '<button class="sts-pile-btn" id="btn-discard-pile" title="点击查看弃牌堆">' +
        spIcon("hud", "discardPile", 50, "📕") +
        '<span class="sts-pile-count">' + countCircleHtml + '<span class="cnt-txt">' + (bt.di ? bt.di.length : 0) + '</span></span>' +
      '</button>' +
    '</div>';

  rightDock.querySelector("#btn-end-turn").addEventListener("click", () => sendAction({ type: "end_turn" }));
  rightDock.querySelector("#btn-discard-pile").addEventListener("click", () => {
    openCardPickerModal("📕 弃牌堆（共 " + (bt.di ? bt.di.length : 0) + " 张）", bt.di || [], st, null);
  });
  const exBtn = rightDock.querySelector("#btn-exhaust-pile");
  if (exBtn) {
    exBtn.addEventListener("click", () => {
      openCardPickerModal("💀 消耗堆（共 " + (bt.ex ? bt.ex.length : 0) + " 张）", bt.ex || [], st, null);
    });
  }
  dock.appendChild(rightDock);
  layout.appendChild(dock);

  if (activeCardIdx !== null || activePotionIdx !== null) {
    requestAnimationFrame(() => updateLiveTargetingArrow(lastPointerPos.x, lastPointerPos.y));
  } else {
    const svg = document.getElementById("sts-target-svg");
    if (svg) svg.innerHTML = "";
  }

  return layout;
}

// ==================== NON-COMBAT ROOM RENDERERS ====================
function formatStsEventOptionLabel(raw) {
  let s = raw.replace(/^【([^】]+)】\s*/, '<span class="sts-opt-bracket">[$1]</span>');
  s = s.replace(/(失去\s*\d+%?\s*最大?生命[值上限]*|被诅咒【[^】]+】|获得【[^】]+】诅咒|触发滚石失去\s*\d+%?\s*生命)/g, '<span class="sts-opt-neg">$1</span>');
  s = s.replace(/(恢复\s*\d+%?\s*最大生命值?|完全恢复所有生命值|最大生命[值上限]*\s*[+提升]+\s*\d+\s*点?|获得\s*\d+\s*金币|从牌组中移除\s*1\s*张牌|将牌组中\s*1\s*张牌变化为随机新牌|升级牌组中[^，。！]+|获得[^，。]*遗物[^，。]*|前\s*3\s*场战斗敌人只有\s*1\s*点生命)/g, '<span class="sts-opt-pos">$1</span>');
  return s;
}

function renderWavySpeechText(str) {
  return Array.from(str).map((ch, i) =>
    '<span class="sts-wave-ch" style="animation-delay:' + (i * 0.055).toFixed(3) + 's">' + ch + '</span>'
  ).join("");
}

function renderEventStage(st) {
  if (st.ph === "NEOW") {
    if (!charSelectConfirmed) {
      return renderCharSelectStage(st);
    }
    return renderNeowRoomStage(st);
  }
  const evId = (st.ev && st.ev.id) ? st.ev.id : "BigFish";
  const def = UI_EVENTS_DEF[evId] || UI_EVENTS_DEF.BigFish;

  const stageWrap = document.createElement("div");
  stageWrap.className = "sts-event-stage";
  appendStageSceneBackdrop(stageWrap, st);

  // Authentic STS Event Dialog Panel (images/ui/event/panel.png)
  const dialog = document.createElement("div");
  dialog.className = "sts-event-dialog";
  dialog.setAttribute("style", uiPanelBgStyle("eventPanel"));

  const formattedDesc = (def.desc || "").replace(/「([^」]+)」/g, '<span class="quote-hi">「$1」</span>');

  dialog.innerHTML =
    '<div class="sts-event-ribbon-title">' + def.title + '</div>' +
    '<div class="sts-event-body">' +
      '<div class="sts-event-portrait-wrap">' + spEventSquare(evId, 244) + '</div>' +
      '<div class="sts-event-right-col">' +
        '<div class="sts-event-narrative">' + formattedDesc + '</div>' +
        '<div class="sts-event-choices" id="ev-choices"></div>' +
      '</div>' +
    '</div>';

  const list = dialog.querySelector("#ev-choices");
  const btnBgStyle = uiPanelBgStyle("eventBtnEnabled");
  const disBgStyle = uiPanelBgStyle("eventBtnDisabled");
  def.opts.forEach((opt, idx) => {
    const locked = (evId === "TheCleric" && ((idx === 0 && st.g < 35) || (idx === 1 && st.g < 50)));
    const btn = document.createElement("button");
    btn.className = "sts-event-opt-btn";
    btn.setAttribute("style", (locked ? disBgStyle : btnBgStyle) + (locked ? "opacity:0.55;cursor:not-allowed;" : ""));
    btn.innerHTML = '<span>' + (locked ? '<span class="sts-opt-neg">[锁定·金币不足]</span> ' : '') + formatStsEventOptionLabel(opt.label) + '</span>';
    if (!locked) {
      btn.addEventListener("click", () => {
        const actType = st.ph === "NEOW" ? "neow_blessing" : "event_choice";
        if (opt.needCard) {
          openCardPickerModal("选择 1 张牌执行【" + opt.tag + "】", st.dk, st, (cardIdx) => {
            sendAction({ type: actType, choiceIdx: idx, cardIdx });
          });
        } else {
          sendAction({ type: actType, choiceIdx: idx, cardIdx: 0 });
        }
      });
    }
    list.appendChild(btn);
  });

  stageWrap.appendChild(dialog);
  return stageWrap;
}

function renderShopStage(st) {
  const sh = st.sh || { cards: [], relics: [], pots: [], purge: 75, purged: false };
  const stageWrap = document.createElement("div");
  stageWrap.className = "sts-shop-stage";
  appendStageSceneBackdrop(stageWrap, st);

  const rug = document.createElement("div");
  rug.className = "sts-shop-rug";
  rug.setAttribute("style", uiPanelBgStyle("shopRug"));

  // Top Row: 5 Class Cards
  const topRow = document.createElement("div");
  topRow.className = "sts-shop-top-row";
  const allCards = sh.cards || [];
  const saleTagBg = uiPanelBgStyle("shopSaleTag");

  function createShopCardSlot(item, idx) {
    const slot = document.createElement("div");
    slot.className = "sts-shop-slot" + (item.sold ? " sold-out" : "");
    const el = renderCardElement(item.c, st, null, () => {
      if (!item.sold && st.g >= item.p) sendAction({ type: "shop_buy_card", index: idx });
    });
    if (st.g < item.p) el.classList.add("unplayable");
    slot.appendChild(el);

    if (item.sale && !item.sold) {
      const tag = document.createElement("div");
      tag.className = "sts-shop-sale-tag";
      tag.setAttribute("style", saleTagBg);
      slot.appendChild(tag);
    }

    const price = document.createElement("div");
    price.className = "sts-shop-price" + (st.g < item.p ? " unaffordable" : "");
    price.innerHTML = spIcon("hud", "gold", 16, "💰") + '<span>' + (item.sold ? "售罄" : item.p) + '</span>';
    slot.appendChild(price);
    return slot;
  }

  allCards.slice(0, 5).forEach((item, idx) => {
    topRow.appendChild(createShopCardSlot(item, idx));

    });

  });
  midRack.appendChild(relicRow);

  const potRow = document.createElement("div");
