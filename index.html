  syncRedSkull(state);
  return state.hp - before;
}

function addGold(state, amt) {
  if (amt <= 0 || hasRelic(state, "Ectoplasm")) return;
  state.g += amt;
  if (hasRelic(state, "Bloody Idol")) healPlayer(state, 5, Boolean(state.bt));
}

function addCardToMasterDeck(state, cardStr) {
  const def = getCardDef(cardStr);
  if (def.type === "C") {
    if (hasRelic(state, "Omamori") && (state.rc.Omamori || 0) > 0) {
      state.rc.Omamori--;
      addLog(state, "【御守】抵消了诅咒：" + def.name);
      return;
    }
  }
  let finalStr = cardStr;
  if (def.up === 0) {
    if (def.type === "A" && hasRelic(state, "Molten Egg 2")) finalStr = def.id + "+";
    if (def.type === "S" && hasRelic(state, "Toxic Egg 2")) finalStr = def.id + "+";
    if (def.type === "P" && hasRelic(state, "Frozen Egg 2")) finalStr = def.id + "+";
  }
  state.dk.push(finalStr);
  if (hasRelic(state, "CeramicFish")) addGold(state, 9);
}

function getPlayerStr(state, bt) {
  return (bt && bt.pw && bt.pw.Strength) || 0;
}

function applyPlayerPower(state, bt, pId, amt) {
  if (!bt || !amt) return false;
  const meta = POWERS_META[pId] || {};
  const isDebuff = Boolean(meta.debuff || ((pId === "Strength" || pId === "Dexterity" || pId === "Focus") && amt < 0));
  if (isDebuff) {
    if (pId === "Weak" && hasRelic(state, "Ginger")) return false;
    if (pId === "Frail" && hasRelic(state, "Turnip")) return false;
    if ((bt.pw.Artifact || 0) > 0) {
      bt.pw.Artifact--;
      if (bt.pw.Artifact <= 0) delete bt.pw.Artifact;
      addLog(state, "【人工制品】免疫了 " + (meta.name || pId));
      return false;
    }
    if (bt.inMonsterPhase && ["Weak", "Vulnerable", "Frail", "NoBlock"].indexOf(pId) !== -1) {
      if (!bt.ja) bt.ja = {};
      bt.ja[pId] = 1;
    }
  }
  bt.pw[pId] = (bt.pw[pId] || 0) + amt;
  if (bt.pw[pId] === 0) delete bt.pw[pId];
  return true;
}

function applyMonsterPower(state, bt, m, pId, amt) {
  if (!m || (m.hp <= 0 && !m.st.halfDead) || !amt) return false;
  if (pId === "Poison" && amt > 0 && hasRelic(state, "Snecko Skull")) amt += 1;
  const meta = POWERS_META[pId] || {};
  const isDebuff = Boolean(meta.debuff || (pId === "Strength" && amt < 0));
  if (isDebuff) {
    if ((m.pw.Artifact || 0) > 0) {
      m.pw.Artifact--;
      if (m.pw.Artifact <= 0) delete m.pw.Artifact;
      addLog(state, m.name + " 的【人工制品】免疫了 " + (meta.name || pId));
      return false;
    }
    if ((bt.pw.Sadistic || 0) > 0) {
      damageMonster(state, bt, m, bt.pw.Sadistic, "THORNS", new Rng(state.rs || 1));
    }
  }
  m.pw[pId] = (m.pw[pId] || 0) + amt;
  if (m.pw[pId] === 0) delete m.pw[pId];
  if (pId === "Vulnerable" && amt > 0 && hasRelic(state, "Champion Belt")) {
    applyMonsterPower(state, bt, m, "Weak", 1);
  }
  return true;
}

function gainPlayerBlock(state, bt, amt, fromCard, rng) {
  if (amt <= 0) return;
  if (fromCard && (bt.pw.NoBlock || 0) > 0) return;
  bt.b += amt;
  if ((bt.pw.Juggernaut || 0) > 0) {
    const alive = bt.m.filter(x => x.hp > 0);
    if (alive.length > 0) {
      const t = rng ? rng.pick(alive) : alive[0];
      damageMonster(state, bt, t, bt.pw.Juggernaut, "THORNS", rng);
    }
  }
  if ((bt.pw.WaveOfTheHand || 0) > 0) {
    for (const m of bt.m) {
      if (m.hp > 0) applyMonsterPower(state, bt, m, "Weak", bt.pw.WaveOfTheHand);
    }
  }
}

function checkFatalProtection(state) {
  if (state.hp > 0) return false;
  // Check FairyPotion
  const fIdx = state.pot ? state.pot.indexOf("FairyPotion") : -1;
  if (fIdx !== -1 && !hasRelic(state, "Mark of the Bloom")) {
    state.pot[fIdx] = "";
    const pct = hasRelic(state, "SacredBark") ? 60 : 30;
    state.hp = Math.max(1, Math.floor(state.mhp * pct / 100));
    syncRedSkull(state);
    addLog(state, "【瓶中精灵】触发！免死并恢复至 " + state.hp + " 生命！");
    return true;
  }
  if (hasRelic(state, "Lizard Tail") && !state.rc.LizardUsed && !hasRelic(state, "Mark of the Bloom")) {
    state.rc.LizardUsed = 1;
    state.hp = Math.max(1, Math.floor(state.mhp / 2));
    syncRedSkull(state);
    addLog(state, "【蜥蜴尾巴】触发！免死并恢复至 " + state.hp + " 生命！");
    return true;
  }
  return false;
}

function losePlayerHp(state, bt, amt, fromCard, rng) {
  if (amt <= 0) return 0;
  let v = amt;
  if ((bt.pw.Intangible || 0) > 0) v = 1;
  if (hasRelic(state, "TungstenRod")) v = Math.max(0, v - 1);
  if (v <= 0) return 0;
  if ((bt.pw.Buffer || 0) > 0) {
    bt.pw.Buffer--;
    if (bt.pw.Buffer <= 0) delete bt.pw.Buffer;
    addLog(state, "【缓冲】抵消了生命值损伤！");
    return 0;
  }
  state.hp = Math.max(0, state.hp - v);
  bt.lh = (bt.lh || 0) + 1;
  bt.lostHpTurn = true;
  syncRedSkull(state);
  if (fromCard && (bt.pw.Rupture || 0) > 0) {
    applyPlayerPower(state, bt, "Strength", bt.pw.Rupture);
  }
  if (hasRelic(state, "Self Forming Clay")) {
    bt.pw.NextTurnBlock = (bt.pw.NextTurnBlock || 0) + 3;
  }
  if (bt.lh === 1 && hasRelic(state, "Centennial Puzzle")) {
    drawCards(state, bt, 3, rng);
  }
  if (state.hp <= 0) checkFatalProtection(state);
  return v;
}

function calcMonsterAttackDmg(state, bt, m, baseDmg) {
  let d = baseDmg + (m.pw.Strength || 0);
  if ((m.pw.Weak || 0) > 0) d = Math.floor(d * ((hasRelic(state, "Paper Krane") || hasRelic(state, "Paper Crane")) ? 0.60 : 0.75));
  if ((bt.pw.Vulnerable || 0) > 0) {
    const mult = hasRelic(state, "Odd Mushroom") ? 1.25 : 1.5;
    d = Math.floor(d * mult);
  }
  if ((m.pw.BackAttack || 0) > 0) d = Math.floor(d * 1.5);
  if (bt.st === "Wrath") d *= 2;
  if ((bt.pw.Intangible || 0) > 0 && d > 0) d = 1;
  return Math.max(0, d);
}

function monsterAttackPlayer(state, bt, m, baseDmg, hits, rng) {
  for (let i = 0; i < hits; i++) {
    if (state.hp <= 0) break;
    let dmg = calcMonsterAttackDmg(state, bt, m, baseDmg);
    if ((m.pw.Thievery || 0) > 0 && state.g > 0) {
      const stolen = Math.min(state.g, m.pw.Thievery);
      state.g -= stolen;
      m.st.stolen = (m.st.stolen || 0) + stolen;
    }
    const blocked = Math.min(bt.b, dmg);
    bt.b -= blocked;
    let unblocked = dmg - blocked;
    if (unblocked > 0 && unblocked <= 5 && hasRelic(state, "Torii")) unblocked = 1;
    if (unblocked > 0) {
      const lost = losePlayerHp(state, bt, unblocked, false, rng);
      if (lost > 0 && (bt.pw.PlatedArmor || 0) > 0) {
        bt.pw.PlatedArmor--;
        if (bt.pw.PlatedArmor <= 0) delete bt.pw.PlatedArmor;
      }
      if (lost > 0 && (bt.pw.StaticDischarge || 0) > 0) {
        for (let s = 0; s < bt.pw.StaticDischarge; s++) channelOrb(state, bt, "L", rng);
      }
      if (lost > 0 && (m.pw.PainfulStabs || 0) > 0) {
        bt.di.push("Wound");
      }
      if (lost > 0 && m.id === "ShelledParasite" && m.mv === 3) {
        m.hp = Math.min(m.mhp, m.hp + lost);
      }
    }
    // Thorns & Flame Barrier
    if ((bt.pw.FlameBarrier || 0) > 0 && m.hp > 0) {
      damageMonster(state, bt, m, bt.pw.FlameBarrier, "THORNS", rng);
    }
    if ((bt.pw.Thorns || 0) > 0 && m.hp > 0) {
      damageMonster(state, bt, m, bt.pw.Thorns, "THORNS", rng);
    }
  }
}

function calcPlayerCardNumbers(state, bt, cardStr, targetM) {
  const def = getCardDef(cardStr);
  if (!bt) return { def, cost: def.cost, dmg: def.dmg, blk: def.blk, mag: def.mag };
  let cost = def.cost;
  if (def.id === "Blood for Blood" && cost >= 0) {
    cost = Math.max(0, cost - (bt.lh || 0));
  }
  if (def.id === "Eviscerate" && cost >= 0) {
    cost = Math.max(0, cost - (bt.discTurn || 0));
  }
  if (def.id === "Masterful Stab" && cost >= 0 && (!def.mod || !def.mod.includes("c"))) {
    cost = cost + (bt.lh || 0);
  }
  if (def.id === "Force Field" && cost >= 0) {
    cost = Math.max(0, cost - (bt.poAll || 0));
  }
  if (def.type === "S" && (bt.pw.Corruption || 0) > 0 && cost >= 0) {
    cost = 0;
  }
  if (def.type === "A" && (bt.pw.FreeAttackPower || 0) > 0 && cost >= 0) {
    cost = 0;
  }
  let baseDmg = def.dmg;
  if (def.id === "Body Slam") baseDmg = bt.b || 0;
  if (def.id === "Mind Blast") baseDmg = bt.dr ? bt.dr.length : 0;
  if (def.id === "Blizzard") baseDmg = (bt.frCh || 0) * (def.mag || 2);
  if (def.id === "Brilliance") baseDmg += (bt.mtAll || 0);
  if (def.id === "Shiv" && (bt.pw.Accuracy || 0) > 0) baseDmg += bt.pw.Accuracy;
  if (def.id === "Gash" && (bt.clawBonus || 0) > 0) baseDmg += bt.clawBonus;
  if (def.id === "Perfected Strike") {
    let strikes = 0;
    const all = [].concat(bt.h || [], bt.dr || [], bt.di || []);
    for (const c of all) { if (getCardDef(c).isStrike) strikes++; }
    baseDmg += strikes * def.mag;
  }
  if (def.isStrike && hasRelic(state, "StrikeDummy")) baseDmg += 3;
  if (def.type === "A" && cost === 0 && hasRelic(state, "WristBlade")) baseDmg += 4;

  let dmg = baseDmg;
  if (def.type === "A") {
    const str = getPlayerStr(state, bt);
    const mult = def.id === "Heavy Blade" ? def.mag : 1;
    dmg += str * mult;
    if ((bt.pw.Vigor || 0) > 0) dmg += bt.pw.Vigor;
    if (!bt.firstAtkDone && hasRelic(state, "Akabeko")) dmg += 8;
    if (bt.st === "Wrath") dmg *= 2;
    if (bt.st === "Divinity") dmg *= 3;
    if ((bt.pw.DoubleDamage || 0) > 0) dmg *= 2;
    if ((bt.pw.Weak || 0) > 0) dmg = Math.floor(dmg * 0.75);
    if (hasRelic(state, "Pen Nib") && (state.rc.PenNib || 0) === 9) dmg *= 2;
    if (targetM) {
      if ((targetM.pw.Slow || 0) > 0) dmg = Math.floor(dmg * (1 + targetM.pw.Slow * 0.1));
      if ((targetM.pw.Vulnerable || 0) > 0) {
        const vMult = hasRelic(state, "Paper Frog") ? 1.75 : 1.5;
        dmg = Math.floor(dmg * vMult);
      }
      if ((targetM.pw.Flight || 0) > 0) dmg = Math.floor(dmg * 0.5);
      if ((targetM.pw.Intangible || 0) > 0 && dmg > 0) dmg = 1;
    }
    dmg = Math.max(0, dmg);
  }

  let blk = def.blk;
  if (def.id === "Stack") blk = (bt.di ? bt.di.length : 0) + (def.up ? 3 : 0);
  if (blk > 0 || def.id === "Stack") {
    blk += (bt.pw.Dexterity || 0);
    if ((bt.pw.Frail || 0) > 0) blk = Math.floor(blk * 0.75);
    if ((bt.pw.NoBlock || 0) > 0) blk = 0;
    blk = Math.max(0, blk);
  }
  return { def, cost, dmg, blk, mag: def.mag };
}

function damageMonster(state, bt, m, rawDmg, type, rng) {
  if (!m || m.hp <= 0) return 0;
  let dmg = rawDmg;
  if ((m.pw.Intangible || 0) > 0 && dmg > 0) dmg = 1;
  const blocked = type === "HP_LOSS" ? 0 : Math.min(m.b, dmg);
  m.b -= blocked;
  let unblocked = dmg - blocked;
  if (type === "NORMAL" && unblocked > 0 && unblocked <= 4 && hasRelic(state, "Boot")) unblocked = 5;
  if (type === "NORMAL" && (m.pw.BlockReturn || 0) > 0) {
    gainPlayerBlock(state, bt, m.pw.BlockReturn, false, rng);
  }
  if (type === "NORMAL" && unblocked > 0 && (bt.pw.Envenom || 0) > 0) {
    applyMonsterPower(state, bt, m, "Poison", bt.pw.Envenom);
  }

  if (unblocked > 0 && m.pw.Invincible !== undefined) {
    const cap = Math.max(0, m.pw.Invincible);
    if (unblocked > cap) unblocked = cap;
    m.pw.Invincible = Math.max(0, cap - unblocked);
  }

  if (unblocked > 0) {
    m.hp = Math.max(0, m.hp - unblocked);
    // Lagavulin wake up on HP loss
    if (m.id === "Lagavulin" && m.st.asleep) {
      m.st.asleep = false;
      delete m.pw.Metallicize;
      setIntent(m, 2, "STUN");
      addLog(state, "乐加维林被惊醒并陷入眩晕！");
    }
    // Guardian Mode Shift
    if (m.id === "TheGuardian" && m.st.open && (m.pw.ModeShift || 0) > 0) {
      m.pw.ModeShift = Math.max(0, m.pw.ModeShift - unblocked);
      if (m.pw.ModeShift === 0) {
        delete m.pw.ModeShift;
        m.st.open = false;
        m.b += 20;
        m.st.dmgThr = (m.st.dmgThr || 30) + 10;
        setIntent(m, 1, "BUFF");
        addLog(state, "守护者进入防御模式，获得 20 格挡！");
      }
    }
    // Plated Armor reduction
    if (type === "NORMAL" && (m.pw.PlatedArmor || 0) > 0 && m.hp > 0) {
      m.pw.PlatedArmor--;
      if (m.pw.PlatedArmor <= 0) {
        delete m.pw.PlatedArmor;
        if (m.id === "ShelledParasite") setIntent(m, 4, "STUN");
      }
    }
    // Transient Shifting
    if ((m.pw.Shifting || 0) > 0 && m.hp > 0) {
      if (applyMonsterPower(state, bt, m, "Strength", -unblocked)) {
        m.pw.Shackled = (m.pw.Shackled || 0) + unblocked;
      }
    }
    // Slime Split intent check
    if ((m.pw.Split || 0) > 0 && m.hp > 0 && m.hp <= Math.floor(m.mhp / 2) && m.mv !== 3) {
      setIntent(m, 3, "UNKNOWN");
      addLog(state, m.name + " 准备分裂！");
    }
    // Champ phase 2 check
    if (m.id === "Champ" && m.hp > 0 && m.hp < Math.floor(m.mhp / 2) && !m.st.p2) {
      // Will trigger on its next rollMove
    }
  }

  // Normal Attack reactive triggers on living monster
  if (type === "NORMAL" && m.hp > 0) {
    if (unblocked > 0) {
      if (m.id === "GremlinWarrior" && (m.pw.Anger || 0) > 0) {
        applyMonsterPower(state, bt, m, "Strength", m.pw.Anger);
      }
      if ((m.pw.CurlUp || 0) > 0) {
        m.b += m.pw.CurlUp;
        delete m.pw.CurlUp;
        m.st.curled = true;
      }
      if ((m.pw.Malleable || 0) > 0) {
        m.b += m.pw.Malleable;
        m.pw.Malleable++;
      }
      if ((m.pw.Flight || 0) > 0) {
        m.pw.Flight--;
        if (m.pw.Flight <= 0) {
          delete m.pw.Flight;
          m.st.air = false;
          setIntent(m, 4, "STUN");
          addLog(state, m.name + " 被击落眩晕！");
        }
      }
      if ((m.pw.Reactive || 0) > 0 && rng) {
        rollMonsterMove(m, bt, state, rng);
      }
    }
    if ((m.pw.Thorns || 0) > 0) {
      const th = m.pw.Thorns;
      const b = Math.min(bt.b, th);
      bt.b -= b;
      if (th - b > 0) losePlayerHp(state, bt, th - b, false, rng);
    }
  }

  // Handle monster reaching 0 HP
  if (m.hp <= 0) {
    onMonsterZeroHp(state, bt, m, rng);
  }
  return unblocked;
}

function onMonsterZeroHp(state, bt, m, rng) {
  // Awakened One Phase 1 -> Rebirth
  if (m.id === "AwakenedOne" && m.st.form1) {
    m.st.halfDead = true;
    m.st.form1 = false;
    m.st.rebornFirst = true;
    delete m.pw.Curiosity;
    delete m.pw.Unawakened;
    delete m.pw.Weak;
    delete m.pw.Vulnerable;
    delete m.pw.Shackled;
    if ((m.pw.Strength || 0) < 0) delete m.pw.Strength;
    setIntent(m, 3, "UNKNOWN");
    addLog(state, "【觉醒者】倒下……但它即将觉醒重生！");
    return;
  }
  // Darkling Regrow
  if (m.id === "Darkling") {
    const otherAlive = bt.m.some(x => x.id === "Darkling" && x !== m && x.hp > 0 && !x.st.halfDead);
    if (otherAlive) {
      m.st.halfDead = true;
      m.b = 0;
      m.pw = { Regrow: 1 };
      setIntent(m, 4, "UNKNOWN");
      addLog(state, "小黑化为一滩黑影，准备重生！");
      return;
    } else {
      // All darklings dead!
      for (const x of bt.m) {
        if (x.id === "Darkling") { x.hp = 0; x.st.halfDead = false; }
      }
    }
  }

  // Actual death
  m.b = 0;
  if ((m.pw.SporeCloud || 0) > 0) {
    applyPlayerPower(state, bt, "Vulnerable", m.pw.SporeCloud);
  }
  if ((m.pw.Poison || 0) > 0 && hasRelic(state, "The Specimen")) {
    const otherAlive = bt.m.filter(x => x !== m && x.hp > 0);
    if (otherAlive.length > 0) {
      const rt = rng ? rng.pick(otherAlive) : otherAlive[0];
      applyMonsterPower(state, bt, rt, "Poison", m.pw.Poison);
    }
  }
  if ((m.pw.CorpseExplosion || 0) > 0) {
    const ceDmg = m.mhp * m.pw.CorpseExplosion;
    addLog(state, "💥 " + m.name + " 尸体爆炸，对所有敌人造成 " + ceDmg + " 点伤害！");
    for (const x of bt.m.slice()) {
      if (x !== m && x.hp > 0) damageMonster(state, bt, x, ceDmg, "THORNS", rng);
    }
  }
  if (m.st.stolen) {
    state.g += m.st.stolen;
    addLog(state, "夺回了被盗走的 " + m.st.stolen + " 金币！");
    m.st.stolen = 0;
  }
  if (m.st.stasisCard) {
    addTempCardToHand(state, bt, m.st.stasisCard, 1);
    addLog(state, "取回了被凝滞的【" + getCardDef(m.st.stasisCard).name + "】！");
    delete m.st.stasisCard;
    delete m.pw.Stasis;
  }
  if ((bt.pw.Surrounded || 0) > 0 && bt.m.filter(x => x.hp > 0).length < 2) {
    delete bt.pw.Surrounded;
    for (const x of bt.m) delete x.pw.BackAttack;
  }
  if (hasRelic(state, "Gremlin Horn")) {
    bt.e += 1;
    drawCards(state, bt, 1, rng);
  }
  // If a Boss/Leader dies, kill its Minions
  if (m.id === "GremlinLeader" || m.id === "BronzeAutomaton" || m.id === "TheCollector" || m.id === "Reptomancer") {
    for (const x of bt.m) {
      if (x !== m && x.hp > 0 && x.pw.Minion) {
        if (x.st && x.st.stasisCard) {
          addTempCardToHand(state, bt, x.st.stasisCard, 1);
          delete x.st.stasisCard;
        }
        x.hp = 0;
        x.b = 0;
      }
    }
  }
}

function isCombatWon(bt) {
  return bt.m.every(m => m.hp <= 0 && !m.st.halfDead);
}

// ==================== 9. Card Draw, Exhaust, Orbs, Stances & Hand Management ====================
function makeTempCard(bt, cardStr) {
  const def = getCardDef(cardStr);
  if (bt && (bt.pw.MasterReality || 0) > 0 && def.up === 0 && def.type !== "ST" && def.type !== "C") {
    return def.id + "+" + (def.mod ? "|" + def.mod : "");
  }
  return cardStr;
}

function addTempCardToHand(state, bt, cardStr, count = 1) {
  for (let i = 0; i < count; i++) {
    const c = makeTempCard(bt, cardStr);
    if (bt.h.length < 10) bt.h.push(c);
    else bt.di.push(c);
  }
}

function modifyCardCostInCombat(cardStr, newCost) {
  const def = getCardDef(cardStr);
  if (def.cost < 0) return cardStr;
  const base = def.id + (def.up > 1 ? "+" + def.up : (def.up ? "+" : ""));
  const numPart = def.extra ? String(def.extra) : "";
  return base + "|" + numPart + "c" + Math.max(0, newCost);
}

function pickDiscardIndex(bt) {
  if (!bt.h || bt.h.length === 0) return -1;
  let idx = bt.h.findIndex(c => { const id = getCardDef(c).id; return id === "Reflex" || id === "Tactician"; });
  if (idx !== -1) return idx;
  idx = bt.h.findIndex(c => { const d = getCardDef(c); return d.type === "C" || d.type === "ST"; });
  if (idx !== -1) return idx;
  idx = bt.h.findIndex(c => { const id = getCardDef(c).id; return id.startsWith("Defend_") || id.startsWith("Strike_"); });
  if (idx !== -1) return idx;
  return bt.h.length - 1;
}

function discardHandCardAt(state, bt, hIdx, rng) {
  if (!bt.h || hIdx < 0 || hIdx >= bt.h.length) return null;
  const c = bt.h.splice(hIdx, 1)[0];
  const def = getCardDef(c);
  const clean = def.id + (def.up > 1 ? "+" + def.up : (def.up ? "+" : "")) + (def.extra ? "|" + def.extra : "");
  bt.di.push(clean);
  bt.discTurn = (bt.discTurn || 0) + 1;
  if (!bt.kiteUsed && hasRelic(state, "Hovering Kite")) {
    bt.kiteUsed = true;
    bt.e += 1;
  }
  if (hasRelic(state, "Tough Bandages")) {
    gainPlayerBlock(state, bt, 3, false, rng);
  }
  if (hasRelic(state, "Tingsha")) {
    const alive = bt.m.filter(x => x.hp > 0);
    if (alive.length > 0) damageMonster(state, bt, rng.pick(alive), 3, "THORNS", rng);
  }
  if (def.id === "Reflex") {
    drawCards(state, bt, def.mag || 2, rng);
  } else if (def.id === "Tactician") {
    bt.e += (def.mag || 1);
  }
  return c;
}

function discardSmartFromHand(state, bt, count, rng) {
  for (let i = 0; i < count; i++) {
    if (!bt.h || bt.h.length === 0) break;
    const idx = pickDiscardIndex(bt);
    discardHandCardAt(state, bt, idx, rng);
  }
}

function dealOrbDamageToMonster(state, bt, m, baseDmg, rng) {
  if (!m || m.hp <= 0) return;
  let d = baseDmg;
  if ((m.pw.LockOn || 0) > 0) d = Math.floor(d * 1.5);
  damageMonster(state, bt, m, d, "THORNS", rng);
}

function triggerSingleOrbPassive(state, bt, orb, rng) {
  if (!orb) return;
  const focus = bt.pw.Focus || 0;
  if (orb.t === "L") {
    const dmg = Math.max(0, 3 + focus);
    if ((bt.pw.Electrodynamics || 0) > 0) {
      for (const m of bt.m.slice()) if (m.hp > 0) dealOrbDamageToMonster(state, bt, m, dmg, rng);
    } else {
      const alive = bt.m.filter(x => x.hp > 0);
      if (alive.length > 0) {
        const locked = alive.filter(x => (x.pw.LockOn || 0) > 0);
        const t = locked.length > 0 ? rng.pick(locked) : rng.pick(alive);
        dealOrbDamageToMonster(state, bt, t, dmg, rng);
      }
    }
  } else if (orb.t === "F") {
    const blk = Math.max(0, 2 + focus);
    if (blk > 0) gainPlayerBlock(state, bt, blk, false, rng);
  } else if (orb.t === "D") {
    orb.v = (orb.v || 6) + Math.max(0, 6 + focus);
  } else if (orb.t === "P") {
    bt.e += 1;
  }
}

function evokeFirstOrb(state, bt, times, rng) {
  if (!bt.orbs || bt.orbs.length === 0) return null;
  const orb = bt.orbs.shift();
  const focus = bt.pw.Focus || 0;
  const n = Math.max(0, times === undefined ? 1 : times);
  for (let i = 0; i < n; i++) {
    if (orb.t === "L") {
      const dmg = Math.max(0, 8 + focus);
      if ((bt.pw.Electrodynamics || 0) > 0) {
        for (const m of bt.m.slice()) if (m.hp > 0) dealOrbDamageToMonster(state, bt, m, dmg, rng);
      } else {
        const alive = bt.m.filter(x => x.hp > 0);
        if (alive.length > 0) {
          const locked = alive.filter(x => (x.pw.LockOn || 0) > 0);
          const t = locked.length > 0 ? rng.pick(locked) : rng.pick(alive);
          dealOrbDamageToMonster(state, bt, t, dmg, rng);
        }
      }
    } else if (orb.t === "F") {
      const blk = Math.max(0, 5 + focus);
      if (blk > 0) gainPlayerBlock(state, bt, blk, false, rng);
    } else if (orb.t === "D") {
      const alive = bt.m.filter(x => x.hp > 0);
      if (alive.length > 0) {
        let low = alive[0];
        for (const m of alive) if (m.hp < low.hp) low = m;
        dealOrbDamageToMonster(state, bt, low, orb.v || 6, rng);
      }
    } else if (orb.t === "P") {
      bt.e += 2;
    }
  }
  return orb;
}

function channelOrb(state, bt, orbType, rng) {
  if (!bt.orbs) bt.orbs = [];
  if (bt.maxOrbs === undefined) bt.maxOrbs = state.ch === "DEFECT" ? 3 : 1;
  if (bt.maxOrbs <= 0) return;
  while (bt.orbs.length >= bt.maxOrbs) {
    evokeFirstOrb(state, bt, 1, rng);
  }
  bt.orbs.push({ t: orbType, v: orbType === "D" ? 6 : 0 });
  bt.chAll = (bt.chAll || 0) + 1;
  if (orbType === "L") bt.ltCh = (bt.ltCh || 0) + 1;
  if (orbType === "F") bt.frCh = (bt.frCh || 0) + 1;
  if (orbType === "D") bt.dkCh = (bt.dkCh || 0) + 1;
}

function changeStance(state, bt, newStance, rng) {
  const cur = bt.st || "Neutral";
  if (cur === newStance) return;
  bt.st = newStance;
  if (cur === "Calm") {
    bt.e += 2 + (hasRelic(state, "VioletLotus") ? 1 : 0);
  }
  if (newStance === "Wrath" && (bt.pw.Rushdown || 0) > 0) {
    drawCards(state, bt, bt.pw.Rushdown, rng);
  } else if (newStance === "Divinity") {
    bt.e += 3;
  }
  if ((bt.pw.MentalFortress || 0) > 0) {
    gainPlayerBlock(state, bt, bt.pw.MentalFortress, false, rng);
  }
  for (let i = bt.di.length - 1; i >= 0; i--) {
    if (getCardDef(bt.di[i]).id === "FlurryOfBlows" && bt.h.length < 10) {
      bt.h.push(bt.di.splice(i, 1)[0]);
    }
  }
}

function gainMantra(state, bt, amt, rng) {
  if (amt <= 0) return;
  bt.mtAll = (bt.mtAll || 0) + amt;
  bt.pw.Mantra = (bt.pw.Mantra || 0) + amt;
  while ((bt.pw.Mantra || 0) >= 10) {
    bt.pw.Mantra -= 10;
    if (bt.pw.Mantra <= 0) delete bt.pw.Mantra;
    changeStance(state, bt, "Divinity", rng);
  }
}

function scryCards(state, bt, count, rng) {
  const n = count + (hasRelic(state, "GoldenEye") ? 2 : 0);
  if (n <= 0) return;
  if ((bt.pw.Nirvana || 0) > 0) {
    gainPlayerBlock(state, bt, bt.pw.Nirvana, false, rng);
  }
  const inspectCnt = Math.min(n, bt.dr.length);
  for (let i = 0; i < inspectCnt; i++) {
    const idx = bt.dr.length - 1 - i;
    if (idx < 0 || idx >= bt.dr.length) break;
    const d = getCardDef(bt.dr[idx]);
    if (d.type === "ST" || d.type === "C" || d.id === "Reflex" || d.id === "Tactician") {
      bt.di.push(bt.dr.splice(idx, 1)[0]);
    }
  }
  for (let i = bt.di.length - 1; i >= 0; i--) {
    if (getCardDef(bt.di[i]).id === "Weave" && bt.h.length < 10) {
      bt.h.push(bt.di.splice(i, 1)[0]);
    }
  }
}

function drawCards(state, bt, count, rng) {
  if ((bt.pw.NoDraw || 0) > 0) return;
  let shuffled = false;
  for (let i = 0; i < count; i++) {
    if (bt.h.length >= 10) break;
    if (bt.dr.length === 0) {
      if (bt.di.length === 0) break;
      bt.dr = rng.shuffle(bt.di);
      bt.di = [];
      shuffled = true;
      if (hasRelic(state, "Sundial")) {
        state.rc.Sundial = ((state.rc.Sundial || 0) + 1) % 3;
        if (state.rc.Sundial === 0) bt.e += 2;
      }
    }
    let c = bt.dr.pop();
    const def = getCardDef(c);
    if ((bt.pw.Confusion || 0) > 0 && def.cost >= 0) {
      const nc = rng.int(0, 3);
      c = modifyCardCostInCombat(c, nc);
    }
    bt.h.push(c);
    // On-draw triggers
    if (def.id === "Void") bt.e = Math.max(0, bt.e - 1);
    if (def.id === "Endless Agony" && bt.h.length < 10) bt.h.push(c);
    if (def.id === "DeusExMachina") {
      bt.h.pop();
      triggerExhaustCard(state, bt, c, rng);
      addTempCardToHand(state, bt, "Miracle", def.mag || 2);
    }
    if (def.type === "ST" && (bt.pw.Evolve || 0) > 0) {
      drawCards(state, bt, bt.pw.Evolve, rng);
    }
    if ((def.type === "ST" || def.type === "C") && (bt.pw.FireBreathing || 0) > 0) {
      for (const m of bt.m) {
        if (m.hp > 0) damageMonster(state, bt, m, bt.pw.FireBreathing, "THORNS", rng);
      }
    }
  }
  if (shuffled && hasRelic(state, "Melange")) {
    scryCards(state, bt, 3, rng);
  }
}

function triggerExhaustCard(state, bt, cardStr, rng) {
  const def = getCardDef(cardStr);
  bt.ex.push(cardStr);
  if (def.id === "Sentinel") {
    bt.e += def.mag;
  }
  if ((bt.pw.FeelNoPain || 0) > 0) {
    gainPlayerBlock(state, bt, bt.pw.FeelNoPain, false, rng);
  }
  if ((bt.pw.DarkEmbrace || 0) > 0) {
    drawCards(state, bt, bt.pw.DarkEmbrace, rng);
  }
  if (hasRelic(state, "Charon's Ashes")) {
    for (const m of bt.m) {
      if (m.hp > 0) damageMonster(state, bt, m, 3, "THORNS", rng);
    }
  }
  if (hasRelic(state, "Dead Branch") && bt.h.length < 10) {
    const pool = getCharCardPool(state);
    bt.h.push(makeTempCard(bt, rng.pick(pool)));
  }
}

// ==================== 10. Monster Turn Execution ====================
function executeMonsterTurn(m, mIdx, bt, state, rng) {
  if (m.hp <= 0 && !m.st.halfDead) return;
  if (m.hp > 0 && (m.pw.Poison || 0) > 0) {
    const psn = m.pw.Poison;
    m.pw.Poison--;
    if (m.pw.Poison <= 0) delete m.pw.Poison;
    damageMonster(state, bt, m, psn, "HP_LOSS", rng);
    if (m.hp <= 0 || isCombatWon(bt)) return;
  }
  const mv = m.mv;
  switch (m.id) {
    case "Cultist":
      if (mv === 3) { m.pw.Ritual = (m.pw.Ritual || 0) + 3; m.st.justRitual = true; }
      else monsterAttackPlayer(state, bt, m, 6, 1, rng);
      break;
    case "JawWorm":
      if (mv === 1) monsterAttackPlayer(state, bt, m, 11, 1, rng);
      else if (mv === 2) { m.b += 6; applyMonsterPower(state, bt, m, "Strength", 3); }
      else { monsterAttackPlayer(state, bt, m, 7, 1, rng); m.b += 5; }
      break;
    case "FuzzyLouseNormal":
      if (mv === 4) applyMonsterPower(state, bt, m, "Strength", 3);
      else monsterAttackPlayer(state, bt, m, m.st.biteDmg || 6, 1, rng);
      break;
    case "FuzzyLouseDefensive":
      if (mv === 4) applyPlayerPower(state, bt, "Weak", 2);
      else monsterAttackPlayer(state, bt, m, m.st.biteDmg || 6, 1, rng);
      break;
    case "AcidSlime_S":
      if (mv === 1) monsterAttackPlayer(state, bt, m, 3, 1, rng);
      else applyPlayerPower(state, bt, "Weak", 1);
      break;
    case "AcidSlime_M":
      if (mv === 1) { monsterAttackPlayer(state, bt, m, 7, 1, rng); bt.di.push("Slimed"); }
      else if (mv === 2) monsterAttackPlayer(state, bt, m, 10, 1, rng);
      else applyPlayerPower(state, bt, "Weak", 1);
      break;
    case "AcidSlime_L":
      if (mv === 3) {
        const curHp = m.hp;
        const s1 = makeMonster("AcidSlime_M", rng, state, { hp: curHp });
        const s2 = makeMonster("AcidSlime_M", rng, state, { hp: curHp });
        rollMonsterMove(s1, bt, state, rng);
        rollMonsterMove(s2, bt, state, rng);
        bt.m.splice(mIdx, 1, s1, s2);
        addLog(state, "酸液史莱姆(大)分裂成了 2 只中型史莱姆！");
        return;
      } else if (mv === 1) { monsterAttackPlayer(state, bt, m, 11, 1, rng); bt.di.push("Slimed", "Slimed"); }
      else if (mv === 2) monsterAttackPlayer(state, bt, m, 16, 1, rng);
      else applyPlayerPower(state, bt, "Weak", 2);
      break;
    case "SpikeSlime_S":
      monsterAttackPlayer(state, bt, m, 5, 1, rng);
      break;
    case "SpikeSlime_M":
      if (mv === 1) { monsterAttackPlayer(state, bt, m, 8, 1, rng); bt.di.push("Slimed"); }
      else applyPlayerPower(state, bt, "Frail", 1);
      break;
    case "SpikeSlime_L":
      if (mv === 3) {
        const curHp = m.hp;
        const s1 = makeMonster("SpikeSlime_M", rng, state, { hp: curHp });
        const s2 = makeMonster("SpikeSlime_M", rng, state, { hp: curHp });
        rollMonsterMove(s1, bt, state, rng);
        rollMonsterMove(s2, bt, state, rng);
        bt.m.splice(mIdx, 1, s1, s2);
        addLog(state, "尖刺史莱姆(大)分裂成了 2 只中型史莱姆！");
        return;
      } else if (mv === 1) { monsterAttackPlayer(state, bt, m, 16, 1, rng); bt.di.push("Slimed", "Slimed"); }
      else applyPlayerPower(state, bt, "Frail", 2);
      break;
    case "SlaverBlue":
      if (mv === 1) monsterAttackPlayer(state, bt, m, 12, 1, rng);
      else { monsterAttackPlayer(state, bt, m, 7, 1, rng); applyPlayerPower(state, bt, "Weak", 1); }
      break;
    case "SlaverRed":
      if (mv === 1) monsterAttackPlayer(state, bt, m, 13, 1, rng);
      else if (mv === 2) { m.st.usedNet = true; applyPlayerPower(state, bt, "Entangled", 1); }
      else { monsterAttackPlayer(state, bt, m, 8, 1, rng); applyPlayerPower(state, bt, "Vulnerable", 1); }
      break;
    case "Looter":
    case "Mugger":
      m.st.sc = (m.st.sc || 0) + 1;
      if (mv === 1) monsterAttackPlayer(state, bt, m, 10, 1, rng);
      else if (mv === 4) monsterAttackPlayer(state, bt, m, 12, 1, rng);
      else if (mv === 2) m.b += (m.id === "Mugger" ? 11 : 6);
      else { m.hp = 0; m.b = 0; m.st.stolen = 0; addLog(state, m.name + " 带着抢走的金币逃跑了！"); }
      break;
    case "FungiBeast":
      if (mv === 1) monsterAttackPlayer(state, bt, m, 6, 1, rng);
      else applyMonsterPower(state, bt, m, "Strength", 3);
      break;
    case "GremlinWarrior": monsterAttackPlayer(state, bt, m, 4, 1, rng); break;
    case "GremlinThief": monsterAttackPlayer(state, bt, m, 9, 1, rng); break;
    case "GremlinFat": monsterAttackPlayer(state, bt, m, 4, 1, rng); applyPlayerPower(state, bt, "Weak", 1); break;
    case "GremlinTsundere":
      if (mv === 1) {
        const allies = bt.m.filter(x => x.hp > 0);
        const t = rng.pick(allies) || m;
        t.b += 7;
      } else monsterAttackPlayer(state, bt, m, 6, 1, rng);
      break;
    case "GremlinWizard":
      if (mv === 1) monsterAttackPlayer(state, bt, m, 25, 1, rng);
      break;
    case "GremlinNob":
      if (mv === 3) m.pw.Anger = (m.pw.Anger || 0) + 2;
      else if (mv === 2) { monsterAttackPlayer(state, bt, m, 6, 1, rng); applyPlayerPower(state, bt, "Vulnerable", 2); }
      else monsterAttackPlayer(state, bt, m, 14, 1, rng);
      break;
    case "Lagavulin":
      if (mv === 4) {
        m.st.idle = (m.st.idle || 0) + 1;
        if (m.st.idle >= 3) {
          m.st.asleep = false;
          delete m.pw.Metallicize;
          addLog(state, "乐加维林苏醒了！");
        }
      } else if (mv === 2) {
        // Stunned turn recovery
      } else if (mv === 1) {
        applyPlayerPower(state, bt, "Dexterity", -1);
        applyPlayerPower(state, bt, "Strength", -1);
        m.st.debuff = 0;
      } else {
        monsterAttackPlayer(state, bt, m, 18, 1, rng);
        m.st.debuff = (m.st.debuff || 0) + 1;
      }
      break;
    case "Sentry":
      if (mv === 3) bt.di.push("Dazed", "Dazed");
      else monsterAttackPlayer(state, bt, m, 9, 1, rng);
      break;
    case "TheGuardian":
      if (mv === 6) m.b += 9;
      else if (mv === 2) monsterAttackPlayer(state, bt, m, 32, 1, rng);
      else if (mv === 7) { applyPlayerPower(state, bt, "Weak", 2); applyPlayerPower(state, bt, "Vulnerable", 2); }
      else if (mv === 5) monsterAttackPlayer(state, bt, m, 5, 4, rng);
      else if (mv === 1) m.pw.SharpHide = 3;
      else if (mv === 3) monsterAttackPlayer(state, bt, m, 9, 1, rng);
      else if (mv === 4) {
        monsterAttackPlayer(state, bt, m, 8, 2, rng);
        delete m.pw.SharpHide;
        m.st.open = true;
        m.pw.ModeShift = m.st.dmgThr || 40;
      }
      break;
    case "Hexaghost":
      if (mv === 5) {
        m.st.activated = true;
      } else if (mv === 1) {
        const d = m.dmg || (Math.floor(state.hp / 12) + 1);
        monsterAttackPlayer(state, bt, m, d, 6, rng);
        m.st.orb = 0;
      } else if (mv === 4) {
        monsterAttackPlayer(state, bt, m, 6, 1, rng);
        bt.di.push(m.st.burnUp ? "Burn+" : "Burn");
        m.st.orb++;
      } else if (mv === 2) {
        monsterAttackPlayer(state, bt, m, 5, 2, rng);
        m.st.orb++;
      } else if (mv === 3) {
        m.b += 12;
        applyMonsterPower(state, bt, m, "Strength", 2);
        m.st.orb++;
      } else if (mv === 6) {
        monsterAttackPlayer(state, bt, m, 2, 6, rng);
        m.st.burnUp = true;
        bt.h = bt.h.map(c => c === "Burn" ? "Burn+" : c);
        bt.dr = bt.dr.map(c => c === "Burn" ? "Burn+" : c);
        bt.di = bt.di.map(c => c === "Burn" ? "Burn+" : c);
        m.st.orb = 0;
      }
      break;
    case "SlimeBoss":
      if (mv === 3) {
        const curHp = m.hp;
        const s1 = makeMonster("SpikeSlime_L", rng, state);
        const s2 = makeMonster("AcidSlime_L", rng, state);
        s1.hp = s1.mhp = curHp;
        s2.hp = s2.mhp = curHp;
        rollMonsterMove(s1, bt, state, rng);
        rollMonsterMove(s2, bt, state, rng);
        bt.m.splice(mIdx, 1, s1, s2);
        addLog(state, "史莱姆老大分裂成了尖刺史莱姆(大)与酸液史莱姆(大)！");
        return;
      } else if (mv === 4) bt.di.push("Slimed", "Slimed", "Slimed");
      else if (mv === 1) monsterAttackPlayer(state, bt, m, 35, 1, rng);
      break;
    // Act 2
    case "SphericGuardian":
      if (mv === 2) m.b += 25;
      else if (mv === 4) { monsterAttackPlayer(state, bt, m, 10, 1, rng); applyPlayerPower(state, bt, "Frail", 5); }
      else if (mv === 3) { m.b += 15; monsterAttackPlayer(state, bt, m, 10, 1, rng); }
      else monsterAttackPlayer(state, bt, m, 10, 2, rng);
      break;
    case "Chosen":
      if (mv === 5) monsterAttackPlayer(state, bt, m, 5, 2, rng);
      else if (mv === 4) applyPlayerPower(state, bt, "Hex", 1);
      else if (mv === 3) { monsterAttackPlayer(state, bt, m, 10, 1, rng); applyPlayerPower(state, bt, "Vulnerable", 2); }
      else if (mv === 2) { applyPlayerPower(state, bt, "Weak", 3); applyMonsterPower(state, bt, m, "Strength", 3); }
      else monsterAttackPlayer(state, bt, m, 18, 1, rng);
      break;
    case "ShelledParasite":
      if (mv === 1) { monsterAttackPlayer(state, bt, m, 18, 1, rng); applyPlayerPower(state, bt, "Frail", 2); }
      else if (mv === 2) monsterAttackPlayer(state, bt, m, 6, 2, rng);
      else if (mv === 3) monsterAttackPlayer(state, bt, m, 10, 1, rng);
      break;
    case "Byrd":
      if (mv === 1) monsterAttackPlayer(state, bt, m, 1, 5, rng);
      else if (mv === 3) monsterAttackPlayer(state, bt, m, 12, 1, rng);
      else if (mv === 6) applyMonsterPower(state, bt, m, "Strength", 1);
      else if (mv === 5) monsterAttackPlayer(state, bt, m, 3, 1, rng);
      break;
    case "SnakePlant":
      if (mv === 1) monsterAttackPlayer(state, bt, m, 7, 3, rng);
      else { applyPlayerPower(state, bt, "Frail", 2); applyPlayerPower(state, bt, "Weak", 2); }
      break;
    case "Snecko":
      if (mv === 1) applyPlayerPower(state, bt, "Confusion", 1);
      else if (mv === 2) monsterAttackPlayer(state, bt, m, 15, 1, rng);
      else { monsterAttackPlayer(state, bt, m, 8, 1, rng); applyPlayerPower(state, bt, "Vulnerable", 2); }
      break;
    case "Centurion":
      if (mv === 1) monsterAttackPlayer(state, bt, m, 12, 1, rng);
      else if (mv === 2) {
        const others = bt.m.filter(x => x !== m && x.hp > 0);
        const t = rng.pick(others) || m;
        t.b += 15;
      } else monsterAttackPlayer(state, bt, m, 6, 3, rng);
      break;
    case "Healer":
      if (mv === 1) { monsterAttackPlayer(state, bt, m, 8, 1, rng); applyPlayerPower(state, bt, "Frail", 2); }
      else if (mv === 2) {
        for (const a of bt.m) { if (a.hp > 0) a.hp = Math.min(a.mhp, a.hp + 16); }
      } else {
        for (const a of bt.m) { if (a.hp > 0) applyMonsterPower(state, bt, a, "Strength", 2); }
      }
      break;
    case "GremlinLeader":
      if (mv === 2) {
        const gPool = ["GremlinWarrior", "GremlinThief", "GremlinFat", "GremlinTsundere", "GremlinWizard"];
        let aliveMinions = bt.m.filter(x => x !== m && x.hp > 0).length;
        for (let i = 0; i < 2 && aliveMinions < 3; i++) {
          const gm = makeMonster(rng.pick(gPool), rng, state, { minion: true });
          rollMonsterMove(gm, bt, state, rng);
          bt.m.unshift(gm);
          aliveMinions++;
        }
      } else if (mv === 3) {
        for (const a of bt.m) {
          if (a.hp > 0) {
            applyMonsterPower(state, bt, a, "Strength", 3);
            if (a !== m) a.b += 6;
          }
        }
      } else monsterAttackPlayer(state, bt, m, 6, 3, rng);
      break;
    case "Taskmaster":
      monsterAttackPlayer(state, bt, m, 7, 1, rng);
      bt.di.push("Wound");
      break;
    case "BookOfStabbing":
      if (mv === 1) monsterAttackPlayer(state, bt, m, 6, m.hits || 2, rng);
      else monsterAttackPlayer(state, bt, m, 21, 1, rng);
      break;
    case "BronzeAutomaton":
      m.st.turns = (m.st.turns || 0) + 1;
      if (mv === 4) {
        const o1 = makeMonster("BronzeOrb", rng, state);
        const o2 = makeMonster("BronzeOrb", rng, state);
        rollMonsterMove(o1, bt, state, rng);
        rollMonsterMove(o2, bt, state, rng);
        bt.m.unshift(o1);
        bt.m.push(o2);
      } else if (mv === 1) monsterAttackPlayer(state, bt, m, 7, 2, rng);
      else if (mv === 5) { m.b += 9; applyMonsterPower(state, bt, m, "Strength", 3); }
      else if (mv === 2) monsterAttackPlayer(state, bt, m, 45, 1, rng);
      break;
    case "BronzeOrb":
      if (mv === 3) {
        m.st.stasis = true;
        const src = bt.dr.length > 0 ? bt.dr : bt.di;
        if (src.length > 0) {
          let bestIdx = src.length - 1;
          const rOrder = { R: 3, U: 2, C: 1, B: 0 };
          let bestScore = -1;
          for (let i = 0; i < src.length; i++) {
            const sc = rOrder[getCardDef(src[i]).rarity] ?? 0;
            if (sc >= bestScore) { bestScore = sc; bestIdx = i; }
          }
          m.st.stasisCard = src.splice(bestIdx, 1)[0];
          m.pw.Stasis = 1;
          addLog(state, "铜球使用【凝滞】夺走了你的【" + getCardDef(m.st.stasisCard).name + "】！");
        }
      } else if (mv === 1) monsterAttackPlayer(state, bt, m, 8, 1, rng);
      else {
        const boss = bt.m.find(x => x.id === "BronzeAutomaton" && x.hp > 0) || m;
        boss.b += 12;
      }
      break;
    case "TheCollector":
      m.st.turns = (m.st.turns || 0) + 1;
      if (mv === 1 || mv === 5) {
        while (bt.m.filter(x => x.id === "TorchHead" && x.hp > 0).length < 2) {
          const th = makeMonster("TorchHead", rng, state);
          rollMonsterMove(th, bt, state, rng);
          bt.m.unshift(th);
        }
      } else if (mv === 2) monsterAttackPlayer(state, bt, m, 18, 1, rng);
      else if (mv === 3) {
        m.b += 15;
        for (const a of bt.m) { if (a.hp > 0) applyMonsterPower(state, bt, a, "Strength", 3); }
      } else if (mv === 4) {
        m.st.ult = true;
        applyPlayerPower(state, bt, "Weak", 3);
        applyPlayerPower(state, bt, "Vulnerable", 3);
        applyPlayerPower(state, bt, "Frail", 3);
      }
      break;
    case "TorchHead": monsterAttackPlayer(state, bt, m, 7, 1, rng); break;
    case "Champ":
      if (mv === 1) monsterAttackPlayer(state, bt, m, 16, 1, rng);
      else if (mv === 2) { m.b += 15; m.pw.Metallicize = (m.pw.Metallicize || 0) + 5; }
      else if (mv === 3) monsterAttackPlayer(state, bt, m, 10, 2, rng);
      else if (mv === 4) { monsterAttackPlayer(state, bt, m, 12, 1, rng); applyPlayerPower(state, bt, "Frail", 2); applyPlayerPower(state, bt, "Vulnerable", 2); }
      else if (mv === 5) applyMonsterPower(state, bt, m, "Strength", 2);
      else if (mv === 6) { applyPlayerPower(state, bt, "Weak", 2); applyPlayerPower(state, bt, "Vulnerable", 2); }
      else if (mv === 7) {
        delete m.pw.Weak;
        delete m.pw.Vulnerable;
        delete m.pw.Shackled;
        if ((m.pw.Strength || 0) < 0) delete m.pw.Strength;
        applyMonsterPower(state, bt, m, "Strength", 6);
        addLog(state, "第一勇士暴怒！移除所有负面状态并获得 6 点力量！");
      }
      break;
    // Act 3
    case "Darkling":
      if (mv === 5) {
        m.st.halfDead = false;
        m.hp = Math.floor(m.mhp / 2);
        m.pw.Regrow = 1;
        addLog(state, "小黑重生了！");
      } else if (mv === 1) monsterAttackPlayer(state, bt, m, 8, 2, rng);
      else if (mv === 2) m.b += 12;
      else if (mv === 3) monsterAttackPlayer(state, bt, m, m.st.nip || 9, 1, rng);
      break;
    case "OrbWalker":
      if (mv === 1) { monsterAttackPlayer(state, bt, m, 10, 1, rng); bt.di.push("Burn"); }
      else monsterAttackPlayer(state, bt, m, 15, 1, rng);
      break;
    case "Repulsor":
      if (mv === 1) bt.dr.push("Dazed", "Dazed");
      else monsterAttackPlayer(state, bt, m, 11, 1, rng);
      break;
    case "Exploder":
      m.st.tc = (m.st.tc || 0) + 1;
      if (mv === 1) {
        monsterAttackPlayer(state, bt, m, 9, 1, rng);
        if ((m.pw.Explosive || 0) > 1) m.pw.Explosive--;
      } else {
        const dmg = 30;
        const b = Math.min(bt.b, dmg);
        bt.b -= b;
        if (dmg - b > 0) losePlayerHp(state, bt, dmg - b, false, rng);
        m.hp = 0; m.b = 0;
        addLog(state, "爆炸机自爆造成 30 点伤害！");
      }
      break;
    case "Spiker":
      if (mv === 1) monsterAttackPlayer(state, bt, m, 7, 1, rng);
      else { m.st.tc = (m.st.tc || 0) + 1; m.pw.Thorns = (m.pw.Thorns || 0) + 2; }
      break;
    case "SpireGrowth":
      if (mv === 1) monsterAttackPlayer(state, bt, m, 16, 1, rng);
      else if (mv === 2) applyPlayerPower(state, bt, "Constricted", 10);
      else monsterAttackPlayer(state, bt, m, 22, 1, rng);
      break;
    case "Transient":
      monsterAttackPlayer(state, bt, m, 30 + (m.st.cnt || 0) * 10, 1, rng);
      m.st.cnt = (m.st.cnt || 0) + 1;
      break;
    case "Maw":
      if (mv === 2) { m.st.roared = true; applyPlayerPower(state, bt, "Weak", 3); applyPlayerPower(state, bt, "Frail", 3); }
      else if (mv === 3) monsterAttackPlayer(state, bt, m, 25, 1, rng);
      else if (mv === 4) applyMonsterPower(state, bt, m, "Strength", 3);
      else monsterAttackPlayer(state, bt, m, 5, m.hits || 2, rng);
      break;
    case "WrithingMass":
      if (mv === 0) monsterAttackPlayer(state, bt, m, 32, 1, rng);
      else if (mv === 1) monsterAttackPlayer(state, bt, m, 7, 3, rng);
      else if (mv === 2) { monsterAttackPlayer(state, bt, m, 15, 1, rng); m.b += 15; }
      else if (mv === 3) { monsterAttackPlayer(state, bt, m, 10, 1, rng); applyPlayerPower(state, bt, "Weak", 2); applyPlayerPower(state, bt, "Vulnerable", 2); }
      else if (mv === 4) { m.st.mega = true; addCardToMasterDeck(state, "Parasite"); addLog(state, "扭曲团块将一张【寄生】诅咒塞入了你的永久牌组！"); }
      break;
    case "GiantHead":
      if (mv === 1) applyPlayerPower(state, bt, "Weak", 1);
      else if (mv === 3) monsterAttackPlayer(state, bt, m, 13, 1, rng);
      else monsterAttackPlayer(state, bt, m, m.dmg || 30, 1, rng);
      break;
    case "Nemesis":
      if (mv === 2) monsterAttackPlayer(state, bt, m, 6, 3, rng);
      else if (mv === 3) monsterAttackPlayer(state, bt, m, 45, 1, rng);
      else bt.di.push("Burn", "Burn", "Burn");
      break;
    case "Reptomancer":
      if (mv === 1) { monsterAttackPlayer(state, bt, m, 13, 2, rng); applyPlayerPower(state, bt, "Weak", 1); }
      else if (mv === 2) {
        if (bt.m.filter(x => x.id === "SnakeDagger" && x.hp > 0).length < 4) {
          const dg = makeMonster("SnakeDagger", rng, state, { minion: true });
          rollMonsterMove(dg, bt, state, rng);
          bt.m.unshift(dg);
        }
      } else monsterAttackPlayer(state, bt, m, 30, 1, rng);
      break;
    case "SnakeDagger":
      if (mv === 1) { monsterAttackPlayer(state, bt, m, 9, 1, rng); bt.di.push("Wound"); }
      else { monsterAttackPlayer(state, bt, m, 25, 1, rng); m.hp = 0; m.b = 0; }
      break;
    case "AwakenedOne":
      if (mv === 3) {
        m.st.halfDead = false;
        m.st.p2 = true;
        m.hp = m.mhp = 300;
        addLog(state, "【觉醒者】重生进入第二形态（300 HP）！");
      } else if (mv === 1) monsterAttackPlayer(state, bt, m, 20, 1, rng);
      else if (mv === 2) monsterAttackPlayer(state, bt, m, 6, 4, rng);
      else if (mv === 5) monsterAttackPlayer(state, bt, m, 40, 1, rng);
      else if (mv === 6) { monsterAttackPlayer(state, bt, m, 18, 1, rng); bt.dr.push("Void"); }
      else if (mv === 8) monsterAttackPlayer(state, bt, m, 10, 3, rng);
      break;
    case "TimeEater":
      if (mv === 2) monsterAttackPlayer(state, bt, m, 7, 3, rng);
      else if (mv === 3) { m.b += 20; applyPlayerPower(state, bt, "Vulnerable", 1); applyPlayerPower(state, bt, "Weak", 1); }
      else if (mv === 4) { monsterAttackPlayer(state, bt, m, 26, 1, rng); applyPlayerPower(state, bt, "DrawReduction", 1); }
      else if (mv === 5) {
        delete m.pw.Weak;
        delete m.pw.Vulnerable;
        delete m.pw.Shackled;
        if ((m.pw.Strength || 0) < 0) delete m.pw.Strength;
        m.hp = Math.max(m.hp, Math.floor(m.mhp / 2));
        addLog(state, "时间吞噬者恢复至半血并清除负面状态！");
      }
      break;
    case "Deca":
      if (mv === 0) { monsterAttackPlayer(state, bt, m, 10, 2, rng); bt.di.push("Dazed", "Dazed"); m.st.atk = false; }
      else {
        for (const a of bt.m) { if (a.hp > 0) a.b += 16; }
        m.st.atk = true;
      }
      break;
    case "Donu":
      if (mv === 0) { monsterAttackPlayer(state, bt, m, 10, 2, rng); m.st.atk = false; }
      else {
        for (const a of bt.m) { if (a.hp > 0) applyMonsterPower(state, bt, a, "Strength", 3); }
        m.st.atk = true;
      }
      break;
    case "BanditPointy": monsterAttackPlayer(state, bt, m, 5, 2, rng); break;
    case "BanditRomeo":
      if (mv === 3) { monsterAttackPlayer(state, bt, m, 10, 1, rng); applyPlayerPower(state, bt, "Weak", 2); }
      else if (mv === 1) monsterAttackPlayer(state, bt, m, 15, 1, rng);
      break;
    case "BanditBear":
      if (mv === 2) applyPlayerPower(state, bt, "Dexterity", -2);
      else if (mv === 3) { monsterAttackPlayer(state, bt, m, 9, 1, rng); m.b += 9; }
      else monsterAttackPlayer(state, bt, m, 18, 1, rng);
      break;
    // Act 4: Spire Shield, Spire Spear & Corrupt Heart
    case "SpireShield":
      if (mv === 1) {
        monsterAttackPlayer(state, bt, m, 12, 1, rng);
        if ((bt.maxOrbs || 0) > 0 && rng.bool(0.5)) applyPlayerPower(state, bt, "Focus", -1);
        else applyPlayerPower(state, bt, "Strength", -1);
      } else if (mv === 2) {
        for (const a of bt.m) { if (a.hp > 0) a.b += 30; }
      } else {
        monsterAttackPlayer(state, bt, m, 34, 1, rng);
        m.b += 34;
      }
      break;
    case "SpireSpear":
      if (mv === 1) {
        monsterAttackPlayer(state, bt, m, 5, 2, rng);
        bt.di.push("Burn", "Burn");
      } else if (mv === 2) {
        for (const a of bt.m) { if (a.hp > 0) applyMonsterPower(state, bt, a, "Strength", 2); }
      } else {
        monsterAttackPlayer(state, bt, m, 10, 3, rng);
      }
      break;
    case "CorruptHeart":
      if (mv === 3) {
        applyPlayerPower(state, bt, "Vulnerable", 2);
        applyPlayerPower(state, bt, "Weak", 2);
        applyPlayerPower(state, bt, "Frail", 2);
        for (const sc of ["Dazed", "Slimed", "Wound", "Burn", "Void"]) {
          const ins = bt.dr.length > 0 ? rng.int(0, bt.dr.length) : 0;
          bt.dr.splice(ins, 0, sc);
        }
        addLog(state, "💔 腐化之心施放【衰败】！施加易伤/虚弱/脆弱并将 5 张状态牌洗入抽牌堆！");
      } else if (mv === 1) {
        monsterAttackPlayer(state, bt, m, 2, 12, rng);
      } else if (mv === 2) {
        monsterAttackPlayer(state, bt, m, 40, 1, rng);
      } else if (mv === 4) {
        if ((m.pw.Strength || 0) < 0) delete m.pw.Strength;
        applyMonsterPower(state, bt, m, "Strength", 2);
        m.st.buffs = (m.st.buffs || 0) + 1;
        if (m.st.buffs === 1) m.pw.Artifact = (m.pw.Artifact || 0) + 2;
        else if (m.st.buffs === 2) m.pw.BeatOfDeath = (m.pw.BeatOfDeath || 0) + 1;
        else if (m.st.buffs === 3) m.pw.PainfulStabs = (m.pw.PainfulStabs || 0) + 1;
        else if (m.st.buffs === 4) applyMonsterPower(state, bt, m, "Strength", 10);
        else applyMonsterPower(state, bt, m, "Strength", 50);
        addLog(state, "💔 腐化之心强化了自身！");
      }
      break;
    default:
      monsterAttackPlayer(state, bt, m, m.dmg || 8, m.hits || 1, rng);
  }
}


// ==================== 11. Start Combat & Card / Potion / Turn Logic ====================
function getMaxEnergy(state) {
  let e = 3;
  const bossEnergyRelics = ["Cursed Key", "Sozu", "Fusion Hammer", "Coffee Dripper", "Philosopher's Stone", "Velvet Choker", "Mark of Pain", "Busted Crown", "Ectoplasm"];
  for (const r of bossEnergyRelics) {
    if (hasRelic(state, r)) e++;
  }
  return e;
}

function upgradeCardInCombat(c) {
  const cd = getCardDef(c);
  if (cd.type === "ST" || cd.type === "C") return c;
  const pipeIdx = String(c).indexOf("|");
  const suffix = pipeIdx !== -1 ? String(c).slice(pipeIdx) : "";
  if (cd.id === "Searing Blow") {
    return "Searing Blow+" + ((cd.up || 0) + 1) + suffix;
  }
  if (cd.up > 0) return c;
  return cd.id + "+" + suffix;
}

function startCombat(state, encId, roomType, rng) {
  state.ph = "COMBAT";
  state.rt = roomType;
  const monsters = spawnEncounter(encId, rng, state);

  // Burning Elite (Emerald Key guardian) buff
  if (roomType === "E" && state.be) {
    const buffIdx = ((state.s || 0) + (state.a || 1)) % 4;
    for (const m of monsters) {
      if (buffIdx === 0) m.pw.Strength = (m.pw.Strength || 0) + 2;
      else if (buffIdx === 1) { m.mhp = Math.floor(m.mhp * 1.25); m.hp = m.mhp; }
      else if (buffIdx === 2) m.pw.Metallicize = (m.pw.Metallicize || 0) + 4;
      else m.pw.RegenerateMonster = (m.pw.RegenerateMonster || 0) + 3;
    }
  }
  // Preserved Insect (Elites -25% HP)
  if (roomType === "E" && hasRelic(state, "PreservedInsect")) {
    for (const m of monsters) {
      m.hp = Math.max(1, Math.floor(m.mhp * 0.75));
    }
  }
  // Neow's Lament (first 3 combats enemies have 1 current HP, preserving mhp)
  let neowTriggered = false;
  if ((hasRelic(state, "NeowsBlessing") || hasRelic(state, "NeowsLament")) && state.rc && (state.rc.Neow || 0) > 0) {
    state.rc.Neow--;
    neowTriggered = true;
    for (const m of monsters) { m.hp = 1; }
  }
  // Philosopher's Stone (+1 Str to all enemies)
  if (hasRelic(state, "Philosopher's Stone")) {
    for (const m of monsters) m.pw.Strength = (m.pw.Strength || 0) + 1;
  }

  const maxE = getMaxEnergy(state);
  const bt = {
    enc: encId,
    t: 1,
    e: maxE,
    me: maxE,
    b: 0,
    pw: {},
    h: [],
    dr: [],
    di: [],
    ex: [],
    m: monsters,
    orbs: [],
    maxOrbs: state.ch === "DEFECT" ? 3 : 0,
    st: "Neutral",
    ct: 0,
    at: 0,
    sk: 0,
    po: 0,
    lh: 0
  };
  state.bt = bt;

  // Build draw pile (Innate cards on top)
  const deckCopy = rng.shuffle(state.dk.slice());
  const normal = [], innate = [];
  for (const c of deckCopy) {
    if (getCardDef(c).innate) innate.push(c);
    else normal.push(c);
  }
  if (hasRelic(state, "Mark of Pain")) {
    normal.push("Wound", "Wound");
  }
  bt.dr = rng.shuffle(normal).concat(innate);

  // Start-of-combat relics
  if (hasRelic(state, "Blood Vial")) healPlayer(state, 2, true);
  if (roomType === "B" && hasRelic(state, "Pantograph")) healPlayer(state, 25, true);
  if (hasRelic(state, "Anchor")) bt.b += 10;
  if (hasRelic(state, "Thread and Needle")) bt.pw.PlatedArmor = 4;
  if (hasRelic(state, "Bronze Scales")) bt.pw.Thorns = 3;
  if (hasRelic(state, "Vajra")) bt.pw.Strength = (bt.pw.Strength || 0) + 1;
  if (hasRelic(state, "Girya") && state.rc && state.rc.Girya) bt.pw.Strength = (bt.pw.Strength || 0) + state.rc.Girya;
  syncRedSkull(state);
  if (hasRelic(state, "Oddly Smooth Stone")) bt.pw.Dexterity = (bt.pw.Dexterity || 0) + 1;
  if (hasRelic(state, "DataDisk")) bt.pw.Focus = (bt.pw.Focus || 0) + 1;
  if (hasRelic(state, "Runic Capacitor")) bt.maxOrbs = (bt.maxOrbs || 0) + 3;
  if (hasRelic(state, "ClockworkSouvenir")) bt.pw.Artifact = (bt.pw.Artifact || 0) + 1;
  if (hasRelic(state, "FossilizedHelix")) bt.pw.Buffer = (bt.pw.Buffer || 0) + 1;
  if (roomType === "E" && hasRelic(state, "Sling")) bt.pw.Strength = (bt.pw.Strength || 0) + 2;
  if (hasRelic(state, "Du-Vu Doll")) {
    const curses = state.dk.filter(c => getCardDef(c).type === "C").length;
    if (curses > 0) bt.pw.Strength = (bt.pw.Strength || 0) + curses;
  }
  if (hasRelic(state, "MutagenicStrength")) {
    bt.pw.Strength = (bt.pw.Strength || 0) + 3;
    bt.pw.LoseStrength = (bt.pw.LoseStrength || 0) + 3;
  }
  if (hasRelic(state, "Bag of Marbles")) {
    for (const m of monsters) applyMonsterPower(state, bt, m, "Vulnerable", 1);
  }
  if (hasRelic(state, "Red Mask")) {
    for (const m of monsters) applyMonsterPower(state, bt, m, "Weak", 1);
  }
  if (hasRelic(state, "TwistedFunnel")) {
    for (const m of monsters) applyMonsterPower(state, bt, m, "Poison", 4);
  }
  if (hasRelic(state, "Cracked Core")) channelOrb(state, bt, "L", rng);
  if (hasRelic(state, "Symbiotic Virus")) channelOrb(state, bt, "D", rng);
  if (hasRelic(state, "Nuclear Battery")) channelOrb(state, bt, "P", rng);
  if (hasRelic(state, "TeardropLocket")) bt.st = "Calm";
  if (hasRelic(state, "Damaru")) gainMantra(state, bt, 1, rng);
  if (hasRelic(state, "Lantern")) bt.e += 1;
  if (hasRelic(state, "Happy Flower")) {
    state.rc.Flower = ((state.rc.Flower || 0) + 1) % 3;
    if (state.rc.Flower === 0) bt.e += 1;
  }
  if (hasRelic(state, "Incense Burner")) {
    state.rc.Burner = ((state.rc.Burner || 0) + 1) % 6;
    if (state.rc.Burner === 0) applyPlayerPower(state, bt, "Intangible", 1);
  }
  if (hasRelic(state, "Ancient Tea Set") && state.rc.TeaSet) {
    bt.e += 2;
    state.rc.TeaSet = 0;
  }
  if ((roomType === "E" || roomType === "B") && hasRelic(state, "SlaversCollar")) {
    bt.e += 1;
  }
  if (hasRelic(state, "Snecko Eye")) {
    bt.pw.Confusion = 1;
  }
  if (encId === "Shield and Spear") {
    bt.pw.Surrounded = 1;
    if (bt.m[0]) bt.m[0].pw.BackAttack = 1;
  }
  if (hasRelic(state, "Mercury Hourglass")) {
    for (const m of monsters) damageMonster(state, bt, m, 3, "THORNS", rng);
    if (isCombatWon(bt)) { onCombatVictory(state, rng); return; }
  }

  // Roll initial moves for all monsters
  for (const m of bt.m) {
    rollMonsterMove(m, bt, state, rng);
  }

  // Draw initial hand
  let drawCnt = 5;
  if (hasRelic(state, "Bag of Preparation")) drawCnt += 2;
  if (hasRelic(state, "Ring of the Snake")) drawCnt += 2;
  if (hasRelic(state, "Ring of the Serpent")) drawCnt += 1;
  if (hasRelic(state, "Snecko Eye")) drawCnt += 2;
  drawCards(state, bt, drawCnt, rng);
  if (hasRelic(state, "Ninja Scroll")) addTempCardToHand(state, bt, "Shiv", 3);
  if (hasRelic(state, "PureWater")) addTempCardToHand(state, bt, "Miracle", 1);
  if (hasRelic(state, "HolyWater")) addTempCardToHand(state, bt, "Miracle", 3);
  const mNames = bt.m.map(x => x.name).join("、");
  if (neowTriggered) {
    addLog(state, "遭遇战斗：" + mNames + "（⚡涅奥的悲恸生效：敌人当前生命降为 1，剩余 " + state.rc.Neow + " 场战斗）");
  } else {
    addLog(state, "遭遇战斗：" + mNames);
  }
}

function canPlayCard(state, bt, cardStr) {
  if (!bt) return false;
  const { def, cost } = calcPlayerCardNumbers(state, bt, cardStr, null);
  if (hasRelic(state, "Velvet Choker") && (bt.ct || 0) >= 6) return false;
  if (bt.h.some(c => getCardDef(c).id === "Normality") && (bt.ct || 0) >= 3) return false;
  if (def.type === "A" && (bt.pw.Entangled || 0) > 0) return false;
  if (def.id === "Clash" && bt.h.some(c => getCardDef(c).type !== "A")) return false;
  if (def.id === "Grand Finale" && bt.dr.length > 0) return false;
  if (def.id === "SignatureMove" && bt.h.some(c => c !== cardStr && getCardDef(c).type === "A")) return false;
  if (def.type === "ST") {
    if (def.id === "Slimed") return bt.e >= 1;
    return hasRelic(state, "Medical Kit");
  }
  if (def.type === "C") {
    return hasRelic(state, "Blue Candle");
  }
  if (cost === -1) return true; // X-cost can be played at 0+ energy
  return cost >= 0 && bt.e >= cost;
}

function executeSingleCardEffect(state, bt, cardStr, targetIdx, xEnergy, rng) {
  const aliveTargets = bt.m.filter(x => x.hp > 0);
  if (!aliveTargets.length) return;
  let t = (targetIdx !== undefined && bt.m[targetIdx] && bt.m[targetIdx].hp > 0) ? bt.m[targetIdx] : aliveTargets[0];
  const { def, dmg, blk, mag } = calcPlayerCardNumbers(state, bt, cardStr, t);

  if (def.target === "E" && t && (bt.pw.Surrounded || 0) > 0 && aliveTargets.length >= 2) {
    for (const m of bt.m) {
      if (m === t || m.hp <= 0) delete m.pw.BackAttack;
      else m.pw.BackAttack = 1;
    }
  }

  if (def.type === "A") {
    bt.firstAtkDone = true;
    delete bt.pw.Vigor;
    if ((bt.pw.FreeAttackPower || 0) > 0) {
      bt.pw.FreeAttackPower--;
      if (bt.pw.FreeAttackPower <= 0) delete bt.pw.FreeAttackPower;
    }
    if (hasRelic(state, "Yang") || hasRelic(state, "Duality")) {
      applyPlayerPower(state, bt, "Dexterity", 1);
      applyPlayerPower(state, bt, "LoseDexterity", 1);
    }
    if (hasRelic(state, "Pen Nib")) {
      state.rc.PenNib = ((state.rc.PenNib || 0) + 1) % 10;
    }
    if (hasRelic(state, "Nunchaku")) {
      state.rc.Nunchaku = (state.rc.Nunchaku || 0) + 1;
      if (state.rc.Nunchaku >= 10) { state.rc.Nunchaku = 0; bt.e += 1; }
    }
    if ((bt.pw.Rage || 0) > 0) {
      gainPlayerBlock(state, bt, bt.pw.Rage, false, rng);
    }
    // Guardian Sharp Hide
    for (const m of bt.m) {
      if (m.hp > 0 && (m.pw.SharpHide || 0) > 0) {
        const sh = m.pw.SharpHide;
        const b = Math.min(bt.b, sh);
        bt.b -= b;
        if (sh - b > 0) losePlayerHp(state, bt, sh - b, false, rng);
      }
    }
  } else if (def.type === "S") {
    // Gremlin Nob Anger (Enrage)
    for (const m of bt.m) {
      if (m.hp > 0 && m.id !== "GremlinWarrior" && (m.pw.Anger || 0) > 0) {
        applyMonsterPower(state, bt, m, "Strength", m.pw.Anger);
      }
    }
  } else if (def.type === "P") {
    bt.poAll = (bt.poAll || 0) + 1;
    if ((bt.pw.Heatsinks || 0) > 0) drawCards(state, bt, bt.pw.Heatsinks, rng);
    if ((bt.pw.Storm || 0) > 0) {
      for (let s = 0; s < bt.pw.Storm; s++) channelOrb(state, bt, "L", rng);
    }
    if (hasRelic(state, "Bird Faced Urn")) healPlayer(state, 2, true);
    if (hasRelic(state, "Mummified Hand") && bt.h.length > 0) {
      const candidates = [];
      for (let i = 0; i < bt.h.length; i++) {
        if (calcPlayerCardNumbers(state, bt, bt.h[i], null).cost > 0) candidates.push(i);
      }
      if (candidates.length > 0) {
        const pickIdx = rng.pick(candidates);
        bt.h[pickIdx] = modifyCardCostInCombat(bt.h[pickIdx], 0);
      }
    }
    // Awakened One Curiosity
    for (const m of bt.m) {
      if (m.hp > 0 && (m.pw.Curiosity || 0) > 0) {
        applyMonsterPower(state, bt, m, "Strength", m.pw.Curiosity);
      }
    }
  }
  if ((bt.pw.AfterImage || 0) > 0) {
    gainPlayerBlock(state, bt, bt.pw.AfterImage, false, rng);
  }
  if ((bt.pw.AThousandCuts || 0) > 0) {
    for (const m of bt.m.slice()) {
      if (m.hp > 0) damageMonster(state, bt, m, bt.pw.AThousandCuts, "THORNS", rng);
    }
  }
  for (const m of bt.m.slice()) {
    if (m.hp > 0 && (m.pw.Choke || 0) > 0) {
      damageMonster(state, bt, m, m.pw.Choke, "HP_LOSS", rng);
    }
  }
  // Chosen Hex: shuffle 1 Dazed into draw pile whenever a non-Attack card is played
  if (def.type !== "A" && (bt.pw.Hex || 0) > 0) {
    const insIdx = bt.dr.length > 0 ? rng.int(0, bt.dr.length) : 0;
    bt.dr.splice(insIdx, 0, "Dazed");
  }

  // Block gain
  if (blk > 0 && def.id !== "Second Wind" && def.id !== "Auto Shields" && def.id !== "Reinforced Body" && def.id !== "Escape Plan") {
    gainPlayerBlock(state, bt, blk, true, rng);
  }

  // Execute card-specific logic
  switch (def.id) {
    case "Strike_R":
    case "Carnage":
    case "Clash":
    case "Bludgeon":
    case "Blood for Blood":
    case "Body Slam":
    case "Heavy Blade":
    case "Perfected Strike":
    case "Searing Blow":
    case "Mind Blast":
    case "Swift Strike":
      damageMonster(state, bt, t, dmg, "NORMAL", rng);
      break;
    case "Bash":
      damageMonster(state, bt, t, dmg, "NORMAL", rng);
      applyMonsterPower(state, bt, t, "Vulnerable", mag);
      break;
    case "Anger":
      damageMonster(state, bt, t, dmg, "NORMAL", rng);
      bt.di.push(def.up ? "Anger+" : "Anger");
      break;
    case "Cleave":
    case "Dramatic Entrance":
      for (const m of bt.m.slice()) {
        if (m.hp > 0) {
          const d = calcPlayerCardNumbers(state, bt, cardStr, m).dmg;
          damageMonster(state, bt, m, d, "NORMAL", rng);
        }
      }
      break;
    case "Clothesline":
      damageMonster(state, bt, t, dmg, "NORMAL", rng);
      applyMonsterPower(state, bt, t, "Weak", mag);
      break;
    case "Headbutt":
      damageMonster(state, bt, t, dmg, "NORMAL", rng);
      if (bt.di.length > 0) bt.dr.push(bt.di.pop());
      break;
    case "Iron Wave":
      damageMonster(state, bt, t, dmg, "NORMAL", rng);
      break;
    case "Pommel Strike":
    case "Flash of Steel":
      damageMonster(state, bt, t, dmg, "NORMAL", rng);
      drawCards(state, bt, mag, rng);
      break;
    case "Sword Boomerang":
      for (let i = 0; i < mag; i++) {
        const alive = bt.m.filter(x => x.hp > 0);
        if (!alive.length) break;
        const rm = rng.pick(alive);
        const d = calcPlayerCardNumbers(state, bt, cardStr, rm).dmg;
        damageMonster(state, bt, rm, d, "NORMAL", rng);
      }
      break;
    case "Thunderclap":
      for (const m of bt.m.slice()) {
        if (m.hp > 0) {
          const d = calcPlayerCardNumbers(state, bt, cardStr, m).dmg;
          damageMonster(state, bt, m, d, "NORMAL", rng);
          applyMonsterPower(state, bt, m, "Vulnerable", 1);
        }
      }
      break;
    case "Twin Strike":
      damageMonster(state, bt, t, dmg, "NORMAL", rng);
      if (t.hp > 0) damageMonster(state, bt, t, dmg, "NORMAL", rng);
      break;
    case "Wild Strike":
      damageMonster(state, bt, t, dmg, "NORMAL", rng);
      bt.dr.splice(rng.int(0, bt.dr.length), 0, "Wound");
      break;
    case "Armaments":
      if (def.up) {
        bt.h = bt.h.map(c => upgradeCardInCombat(c));
      } else {
        for (let i = 0; i < bt.h.length; i++) {
          const cd = getCardDef(bt.h[i]);
          if (cd.type !== "ST" && cd.type !== "C" && (cd.up === 0 || cd.id === "Searing Blow")) {
            bt.h[i] = upgradeCardInCombat(bt.h[i]);
            break;
          }
        }
      }
      break;
    case "Flex":
      applyPlayerPower(state, bt, "Strength", mag);
      applyPlayerPower(state, bt, "LoseStrength", mag);
      break;
    case "Havoc":
      if (bt.dr.length > 0) {
        const top = bt.dr.pop();
        executeSingleCardEffect(state, bt, top, targetIdx, 0, rng);
        triggerExhaustCard(state, bt, top, rng);
      }
      break;
    case "Shrug It Off":
    case "Finesse":
      drawCards(state, bt, 1, rng);
      break;
    case "True Grit":
      if (bt.h.length > 0) {
        let exIdx = def.up ? bt.h.findIndex(c => ["ST", "C"].indexOf(getCardDef(c).type) !== -1) : -1;
        if (exIdx === -1) exIdx = def.up ? bt.h.length - 1 : rng.int(0, bt.h.length - 1);
        const exC = bt.h.splice(exIdx, 1)[0];
        triggerExhaustCard(state, bt, exC, rng);
      }
      break;
    case "Warcry":
    case "Thinking Ahead":
      drawCards(state, bt, mag, rng);
      if (bt.h.length > 0) bt.dr.push(bt.h.pop());
      break;
    case "Dropkick": {
      const hadVuln = (t.pw.Vulnerable || 0) > 0;
      damageMonster(state, bt, t, dmg, "NORMAL", rng);
      if (hadVuln) { bt.e += 1; drawCards(state, bt, 1, rng); }
      break;
    }
    case "Hemokinesis":
      losePlayerHp(state, bt, mag, true, rng);
      damageMonster(state, bt, t, dmg, "NORMAL", rng);
      break;
    case "Pummel":
      for (let i = 0; i < mag; i++) {
        if (t.hp <= 0) break;
        damageMonster(state, bt, t, dmg, "NORMAL", rng);
      }
      break;
    case "Rampage":
      damageMonster(state, bt, t, dmg, "NORMAL", rng);
      break;
    case "Reckless Charge":
      damageMonster(state, bt, t, dmg, "NORMAL", rng);
      bt.dr.splice(rng.int(0, bt.dr.length), 0, "Dazed");
      break;
    case "Sever Soul":
      for (let i = bt.h.length - 1; i >= 0; i--) {
        if (getCardDef(bt.h[i]).type !== "A") {
          const exC = bt.h.splice(i, 1)[0];
          triggerExhaustCard(state, bt, exC, rng);
        }
      }
      damageMonster(state, bt, t, dmg, "NORMAL", rng);
      break;
    case "Uppercut":
      damageMonster(state, bt, t, dmg, "NORMAL", rng);
      applyMonsterPower(state, bt, t, "Weak", mag);
      applyMonsterPower(state, bt, t, "Vulnerable", mag);
      break;
    case "Whirlwind": {
      const times = xEnergy + (hasRelic(state, "Chemical X") ? 2 : 0);
      for (let i = 0; i < times; i++) {
        for (const m of bt.m.slice()) {
          if (m.hp > 0) {
            const d = calcPlayerCardNumbers(state, bt, cardStr, m).dmg;
            damageMonster(state, bt, m, d, "NORMAL", rng);
          }
        }
      }
      break;
    }
    case "Battle Trance":
      drawCards(state, bt, mag, rng);
      applyPlayerPower(state, bt, "NoDraw", 1);
      break;
    case "Bloodletting":
      losePlayerHp(state, bt, 3, true, rng);
      bt.e += mag;
      break;
    case "Burning Pact":
      if (bt.h.length > 0) {
        let exIdx = bt.h.findIndex(c => ["ST", "C"].indexOf(getCardDef(c).type) !== -1);
        if (exIdx === -1) exIdx = bt.h.length - 1;
        const exC = bt.h.splice(exIdx, 1)[0];
        triggerExhaustCard(state, bt, exC, rng);
      }
      drawCards(state, bt, mag, rng);
      break;
    case "Disarm":
      applyMonsterPower(state, bt, t, "Strength", -mag);
      break;
    case "Dual Wield": {
      const cand = bt.h.find(c => ["A", "P"].indexOf(getCardDef(c).type) !== -1);
      if (cand) {
        for (let i = 0; i < mag && bt.h.length < 10; i++) bt.h.push(cand);
      }
      break;
    }
    case "Entrench":
      if (bt.b > 0) gainPlayerBlock(state, bt, bt.b, true, rng);
      break;
    case "Flame Barrier":
      applyPlayerPower(state, bt, "FlameBarrier", mag);
      break;
    case "Infernal Blade": {
      const atkPool = Object.keys(RAW_CARDS).filter(k => RAW_CARDS[k][1] === "A" && ["C", "U", "R"].indexOf(RAW_CARDS[k][2]) !== -1);
      if (bt.h.length < 10) bt.h.push(rng.pick(atkPool) + "|c0");
      break;
    }
    case "Intimidate":
      for (const m of bt.m) { if (m.hp > 0) applyMonsterPower(state, bt, m, "Weak", mag); }
      break;
    case "Power Through":
      if (bt.h.length < 10) bt.h.push("Wound");
      if (bt.h.length < 10) bt.h.push("Wound");
      break;
    case "Rage":
      applyPlayerPower(state, bt, "Rage", mag);
      break;
    case "Second Wind": {
      let nonAtk = 0;
      for (let i = bt.h.length - 1; i >= 0; i--) {
        if (getCardDef(bt.h[i]).type !== "A") {
          const exC = bt.h.splice(i, 1)[0];
          triggerExhaustCard(state, bt, exC, rng);
          nonAtk++;
        }
      }
      if (nonAtk > 0) gainPlayerBlock(state, bt, nonAtk * blk, true, rng);
      break;
    }
    case "Seeing Red":
      bt.e += 2;
      break;
    case "Shockwave":
      for (const m of bt.m) {
        if (m.hp > 0) {
          applyMonsterPower(state, bt, m, "Weak", mag);
          applyMonsterPower(state, bt, m, "Vulnerable", mag);
        }
      }
      break;
    case "Spot Weakness":
      if (t && String(t.in).indexOf("ATTACK") !== -1) {
        applyPlayerPower(state, bt, "Strength", mag);
      }
      break;
    case "Combust": applyPlayerPower(state, bt, "Combust", mag); break;
    case "Dark Embrace": applyPlayerPower(state, bt, "DarkEmbrace", mag); break;
    case "Evolve": applyPlayerPower(state, bt, "Evolve", mag); break;
    case "Feel No Pain": applyPlayerPower(state, bt, "FeelNoPain", mag); break;
    case "Fire Breathing": applyPlayerPower(state, bt, "FireBreathing", mag); break;
    case "Inflame": applyPlayerPower(state, bt, "Strength", mag); break;
    case "Metallicize": applyPlayerPower(state, bt, "Metallicize", mag); break;
    case "Rupture": applyPlayerPower(state, bt, "Rupture", mag); break;
    case "Feed": {
      const wasAlive = t.hp > 0;
      damageMonster(state, bt, t, dmg, "NORMAL", rng);
      if (wasAlive && t.hp <= 0 && !t.st.halfDead && !t.pw.Minion) {
        state.mhp += mag;
        state.hp = Math.min(state.mhp, state.hp + mag);
        addLog(state, "【狂宴】斩杀！最大生命值 +" + mag + "！");
      }
      break;
    }
    case "Fiend Fire": {
      const toEx = bt.h.splice(0, bt.h.length);
      const cnt = toEx.length;
      for (const exC of toEx) {
        triggerExhaustCard(state, bt, exC, rng);
      }
      for (let i = 0; i < cnt; i++) {
        if (t.hp <= 0) break;
        damageMonster(state, bt, t, dmg, "NORMAL", rng);
      }
      break;
    }
    case "Immolate":
      for (const m of bt.m.slice()) {
        if (m.hp > 0) {
          const d = calcPlayerCardNumbers(state, bt, cardStr, m).dmg;
          damageMonster(state, bt, m, d, "NORMAL", rng);
        }
      }
      bt.di.push("Burn");
      break;
    case "Reaper": {
      let totalUnblocked = 0;
      for (const m of bt.m.slice()) {
        if (m.hp > 0) {
          const d = calcPlayerCardNumbers(state, bt, cardStr, m).dmg;
          totalUnblocked += damageMonster(state, bt, m, d, "NORMAL", rng);
        }
      }
      if (totalUnblocked > 0) healPlayer(state, totalUnblocked, true);
      break;
    }
    case "Double Tap": applyPlayerPower(state, bt, "DoubleTap", mag); break;
    case "Exhume":
      if (bt.ex.length > 0 && bt.h.length < 10) {
        const idx = bt.ex.findIndex(c => getCardDef(c).id !== "Exhume");
        if (idx !== -1) bt.h.push(bt.ex.splice(idx, 1)[0]);
      }
      break;
    case "Limit Break":
      if ((bt.pw.Strength || 0) > 0) applyPlayerPower(state, bt, "Strength", bt.pw.Strength);
      break;
    case "Offering":
      losePlayerHp(state, bt, 6, true, rng);
      bt.e += 2;
      drawCards(state, bt, mag, rng);
      break;
    case "Barricade": applyPlayerPower(state, bt, "Barricade", 1); break;
    case "Berserk":
      applyPlayerPower(state, bt, "Vulnerable", mag);
      applyPlayerPower(state, bt, "Berserk", 1);
      break;
    case "Brutality": applyPlayerPower(state, bt, "Brutality", 1); break;
    case "Corruption": applyPlayerPower(state, bt, "Corruption", 1); break;
    case "Demon Form": applyPlayerPower(state, bt, "DemonForm", mag); break;
    case "Juggernaut": applyPlayerPower(state, bt, "Juggernaut", mag); break;
    // Colorless
    case "Apotheosis":
      bt.h = bt.h.map(c => upgradeCardInCombat(c));
      bt.dr = bt.dr.map(c => upgradeCardInCombat(c));
      bt.di = bt.di.map(c => upgradeCardInCombat(c));
      break;
    case "Bandage Up": healPlayer(state, mag, true); break;
    case "Blind":
      if (def.up) { for (const m of bt.m) if (m.hp > 0) applyMonsterPower(state, bt, m, "Weak", mag); }
      else applyMonsterPower(state, bt, t, "Weak", mag);
      break;
    case "Dark Shackles":
      if (applyMonsterPower(state, bt, t, "Strength", -mag)) {
        t.pw.Shackled = (t.pw.Shackled || 0) + mag;
      }
      break;
    case "Deep Breath":
      if (bt.di.length > 0) {
        bt.dr = rng.shuffle(bt.dr.concat(bt.di));
        bt.di = [];
        if (hasRelic(state, "Sundial")) {
          state.rc.Sundial = ((state.rc.Sundial || 0) + 1) % 3;
          if (state.rc.Sundial === 0) bt.e += 2;
        }
      }
      drawCards(state, bt, mag, rng);
      break;
    case "Discovery": {
      const pool = Object.keys(RAW_CARDS).filter(k => ["C", "U", "R"].indexOf(RAW_CARDS[k][2]) !== -1);
      if (bt.h.length < 10) bt.h.push(rng.pick(pool) + "|c0");
      break;
    }
    case "HandOfGreed": {
      const wasAlive = t.hp > 0;
      damageMonster(state, bt, t, dmg, "NORMAL", rng);
      if (wasAlive && t.hp <= 0 && !t.st.halfDead && !t.pw.Minion) addGold(state, mag);
      break;
    }
    case "Impatience":
      if (!bt.h.some(c => getCardDef(c).type === "A")) drawCards(state, bt, mag, rng);
      break;
    case "J.A.X.":
      losePlayerHp(state, bt, 3, true, rng);
      applyPlayerPower(state, bt, "Strength", mag);
      break;
    case "Madness": {
      const cand = [];
      for (let i = 0; i < bt.h.length; i++) if (calcPlayerCardNumbers(state, bt, bt.h[i], null).cost > 0) cand.push(i);
      if (cand.length > 0) {
        const idx = rng.pick(cand);
        const cd = getCardDef(bt.h[idx]);
        bt.h[idx] = cd.id + (cd.up ? "+" : "") + "|c0";
      }
      break;
    }
    case "Master of Strategy": drawCards(state, bt, mag, rng); break;
    case "Mayhem": applyPlayerPower(state, bt, "Mayhem", 1); break;
    case "Panacea": applyPlayerPower(state, bt, "Artifact", mag); break;
    case "Panache": applyPlayerPower(state, bt, "Panache", mag); break;
    case "PanicButton": applyPlayerPower(state, bt, "NoBlock", mag); break;
    case "Purity":
      for (let i = 0; i < mag && bt.h.length > 0; i++) {
        let idx = bt.h.findIndex(c => ["ST", "C"].indexOf(getCardDef(c).type) !== -1);
        if (idx === -1) break;
        triggerExhaustCard(state, bt, bt.h.splice(idx, 1)[0], rng);
      }
      break;
    case "Sadistic Nature": applyPlayerPower(state, bt, "Sadistic", mag); break;
    case "Secret Technique": {
      const idx = bt.dr.findIndex(c => getCardDef(c).type === "S");
      if (idx !== -1 && bt.h.length < 10) bt.h.push(bt.dr.splice(idx, 1)[0]);
      break;
    }
    case "Secret Weapon": {
      const idx = bt.dr.findIndex(c => getCardDef(c).type === "A");
      if (idx !== -1 && bt.h.length < 10) bt.h.push(bt.dr.splice(idx, 1)[0]);
      break;
    }
    case "The Bomb":
      bt.pw.TheBomb = 3;
      bt.bombDmg = (bt.bombDmg || 0) + mag;
      break;
    case "Trip":
      if (def.up) { for (const m of bt.m) if (m.hp > 0) applyMonsterPower(state, bt, m, "Vulnerable", mag); }
      else applyMonsterPower(state, bt, t, "Vulnerable", mag);
      break;
    case "Violence":
      for (let i = 0; i < mag && bt.h.length < 10; i++) {
        const idx = bt.dr.findIndex(c => getCardDef(c).type === "A");
        if (idx === -1) break;
        bt.h.push(bt.dr.splice(idx, 1)[0]);
      }
      break;
    case "Bite":
      damageMonster(state, bt, t, dmg, "NORMAL", rng);
      healPlayer(state, mag, true);
      break;
    case "Ghostly":
      applyPlayerPower(state, bt, "Intangible", 1);
      break;
    case "RitualDagger": {
      const wasAlive = t.hp > 0;
      damageMonster(state, bt, t, dmg, "NORMAL", rng);
      if (wasAlive && t.hp <= 0 && !t.st.halfDead && !t.pw.Minion) {
        const dkIdx = state.dk.findIndex(c => getCardDef(c).id === "RitualDagger");
        if (dkIdx !== -1) {
          const cd = getCardDef(state.dk[dkIdx]);
          state.dk[dkIdx] = "RitualDagger" + (cd.up ? "+" : "") + "|" + (cd.dmg + cd.mag);
        }
      }
      break;
    }
    // ==================== SILENT (GREEN) ====================
    case "Strike_G":
    case "Slice":
    case "Backstab":
    case "Endless Agony":
    case "Masterful Stab":
    case "Glass Knife":
    case "SignatureMove":
    case "SandsOfTime":
    case "WindmillStrike":
    case "Brilliance":
    case "FlurryOfBlows":
    case "Weave":
    case "Shiv":
    case "Smite":
    case "ThroughViolence":
    case "Strike_B":
    case "Strike_P":
      damageMonster(state, bt, t, dmg, "NORMAL", rng);
      break;
    case "Neutralize":
    case "Sucker Punch":
      damageMonster(state, bt, t, dmg, "NORMAL", rng);
      applyMonsterPower(state, bt, t, "Weak", mag);
      break;
    case "Survivor":
      discardSmartFromHand(state, bt, 1, rng);
      break;
    case "Acrobatics":
      drawCards(state, bt, mag, rng);
      discardSmartFromHand(state, bt, 1, rng);
      break;
    case "Accuracy": applyPlayerPower(state, bt, "Accuracy", mag); break;
    case "Adrenaline":
      bt.e += mag;
      drawCards(state, bt, 2, rng);
      break;
    case "After Image": applyPlayerPower(state, bt, "AfterImage", 1); break;
    case "Venomology":
    case "Alchemize": {
      const emptySlot = state.pot ? state.pot.indexOf("") : -1;
      if (emptySlot !== -1 && !hasRelic(state, "Sozu")) {
        state.pot[emptySlot] = rollPotion(state, rng);
      }
      break;
    }
    case "All Out Attack":
      for (const m of bt.m.slice()) {
        if (m.hp > 0) {
          const d = calcPlayerCardNumbers(state, bt, cardStr, m).dmg;
          damageMonster(state, bt, m, d, "NORMAL", rng);
        }
      }
      if (bt.h.length > 0) discardHandCardAt(state, bt, rng.int(0, bt.h.length - 1), rng);
      break;
    case "A Thousand Cuts": applyPlayerPower(state, bt, "AThousandCuts", mag); break;
    case "Backflip": drawCards(state, bt, 2, rng); break;
    case "Bane":
      damageMonster(state, bt, t, dmg, "NORMAL", rng);
      if (t.hp > 0 && (t.pw.Poison || 0) > 0) damageMonster(state, bt, t, dmg, "NORMAL", rng);
      break;
    case "Blade Dance":
    case "Cloak And Dagger":
      addTempCardToHand(state, bt, "Shiv", mag);
      break;
    case "Blur": applyPlayerPower(state, bt, "Blur", 1); break;
    case "Bouncing Flask":
      for (let i = 0; i < mag; i++) {
        const alive = bt.m.filter(x => x.hp > 0);
        if (!alive.length) break;
        applyMonsterPower(state, bt, rng.pick(alive), "Poison", 3);
      }
      break;
    case "Bullet Time":
      applyPlayerPower(state, bt, "NoDraw", 1);
      bt.h = bt.h.map(c => modifyCardCostInCombat(c, 0));
      break;
    case "Burst": applyPlayerPower(state, bt, "Burst", mag); break;
    case "Calculated Gamble": {
      const cnt = bt.h.length;
      while (bt.h.length > 0) discardHandCardAt(state, bt, 0, rng);
      if (cnt > 0) drawCards(state, bt, cnt, rng);
      break;
    }
    case "Caltrops": applyPlayerPower(state, bt, "Thorns", mag); break;
    case "Catalyst":
      if ((t.pw.Poison || 0) > 0) {
        applyMonsterPower(state, bt, t, "Poison", t.pw.Poison * (mag - 1));
      }
      break;
    case "Choke":
      damageMonster(state, bt, t, dmg, "NORMAL", rng);
      applyMonsterPower(state, bt, t, "Choke", mag);
      break;
    case "Concentrate":
      discardSmartFromHand(state, bt, mag, rng);
